<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BoardMate Online · 포켓몬 미니마</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<style>
:root{font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;color:#e8f0fe;background:#0f1923}
*{box-sizing:border-box}
body{margin:0}
.bar{
  position:sticky;top:0;z-index:20;
  background:#141922;border-bottom:1px solid #1e2d3d;
  padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px
}
.bar a{color:#e8f0fe;text-decoration:none;font-weight:900;font-size:.88rem}
.bar-title{font-weight:900;font-size:.95rem;color:#f6c90e}
.bar-sync{font-size:.75rem;color:#8a9bb8;white-space:nowrap}
.wrap{width:min(1500px,100%);margin:auto;padding:10px}
.players{display:flex;gap:7px;overflow-x:auto;margin-bottom:8px;padding-bottom:4px}
.player{
  min-width:140px;flex-shrink:0;
  background:#182230;border:1px solid #2d4158;border-radius:12px;padding:9px 11px
}
.player.active{outline:2px solid #f6c90e;outline-offset:1px}
.player b,.player small{display:block}
.player b{font-size:.85rem;font-weight:900}
.player small{color:#8a9bb8;margin-top:3px;font-size:.72rem}
.frame{
  width:100%;height:calc(100vh - 128px);min-height:600px;
  border:0;border-radius:14px;background:#0f1923;
  box-shadow:0 8px 28px rgba(0,0,0,.4);display:block
}
.note{font-size:.72rem;color:#8a9bb8;padding:5px 2px;margin-top:6px;line-height:1.5}
#end{margin-top:10px}
/* 오류 화면 */
.fatal{
  display:flex;align-items:center;justify-content:center;
  min-height:80vh;flex-direction:column;gap:12px;text-align:center;padding:24px
}
.fatal h2{font-size:1.2rem;color:#fc8181}
.fatal p{color:#8a9bb8;font-size:.85rem;max-width:400px;line-height:1.6}
.fatal a{color:#f6c90e;font-weight:700}
</style>
</head>
<body>

<header class="bar">
  <span>
    <a href="./index.html#/">← 홈</a>
    &nbsp;·&nbsp;
    <a href="./index.html#/multi">다인플</a>
  </span>
  <span class="bar-title">🎮 포켓몬 미니마 온라인</span>
  <span class="bar-sync" id="sync">연결 중…</span>
</header>

<main class="wrap">
  <div id="players" class="players"></div>
  <div class="note">
    포켓몬 미니마 (아크 미니마 × 포켓몬 리테마) · 2인 온라인 대전 · 행동할 때마다 자동 저장됩니다.
  </div>
  <iframe id="gameFrame" class="frame" title="포켓몬 미니마"></iframe>
  <div id="end"></div>
</main>

<script type="module">
import {
  configured, roomId, getMe, loadRoom, loadState, saveState,
  startStatePoll, submitMatch, ratingBadges, esc, showFatal, endPanel
} from './multi-common.js';

if (!configured() || !roomId) {
  showFatal('Supabase 설정 또는 room 주소가 없습니다.');
}

// ── 상태 ──────────────────────────────────────────────────────────
let me, room, members, badges = {}, mySeat = -1;
let revision = 0, state = null, frame = null;
let saving = false, pending = null, submitted = false;

const sync  = document.getElementById('sync');
const playersEl = document.getElementById('players');
const endEl = document.getElementById('end');

// ── 플레이어 목록 렌더 ────────────────────────────────────────────
function drawPlayers() {
  if (!members) return;
  const current = Number(state?.currentSeat ?? state?.currentPlayer ?? -1);
  playersEl.innerHTML = members.map((m, i) => {
    const tier  = badges[m.user_id]?.text || '🥉';
    const isMe  = i === mySeat;
    const isActive = i === current && state?.phase === 'playing';
    const status = state?.phase === 'end'
      ? '게임 종료'
      : isActive ? '현재 차례' : '대기 중';
    return `<div class="player ${isActive ? 'active' : ''}">
      <b>${esc(tier)} ${esc(m.nickname)}${isMe ? ' · 나' : ''}</b>
      <small>${esc(status)}</small>
    </div>`;
  }).join('');
}

// ── 게임 상태 → iframe 전달 ───────────────────────────────────────
function sendState() {
  if (frame?.contentWindow && state?.payload) {
    frame.contentWindow.postMessage({ type: 'game_state', state: state.payload }, '*');
  }
}

// ── iframe → 저장 큐 ─────────────────────────────────────────────
function parsePayload(x) {
  if (!x) return null;
  try { return typeof x === 'string' ? JSON.parse(x) : x; }
  catch { return null; }
}

function canCommitFromThisSeat(nextParsed) {
  const prev = parsePayload(state?.payload);
  if (!prev) return room?.host_id === me?.user_id; // 최초 상태는 방장만 생성
  if (prev.phase === 'end') return false;
  if (prev.phase === 'draft') return Number(prev.draftCurrentPlayer ?? 0) === mySeat;
  return Number(prev.currentPlayer ?? 0) === mySeat;
}

function queuePayload(rawPayload) {
  const parsed = parsePayload(rawPayload);
  if (!parsed?.players || parsed.players.length !== 2) return;
  if (!canCommitFromThisSeat(parsed)) {
    sync.textContent = '상대 차례 · 읽기 전용';
    sendState();
    return;
  }

  pending = {
    kind: 'pokemon-minima-v1-boardmate',
    payload: typeof rawPayload === 'string' ? rawPayload : JSON.stringify(rawPayload),
    currentSeat: Number(parsed.currentPlayer ?? 0),
    currentPlayer: Number(parsed.currentPlayer ?? 0),
    phase:  String(parsed.phase || 'playing'),
    round:  Number(parsed.round || 1),
  };
  flush();
}

async function flush() {
  if (saving || !pending) return;
  saving = true;
  const next = pending;
  pending = null;
  try {
    revision = await saveState(revision, next);
    state = next;
    sync.textContent = '자동 저장됨';
    drawPlayers();
    if (state.phase === 'end') showEnd();
  } catch (e) {
    console.warn('[pokemon-minima] save conflict:', e);
    sync.textContent = '동기화 재시도 중…';
    try {
      const row = await loadState();
      revision = Number(row.revision);
      state    = row.state;
      sendState();
      drawPlayers();
    } catch {}
  } finally {
    saving = false;
    if (pending) flush();
  }
}

// ── 결과 제출 ─────────────────────────────────────────────────────
async function submitResult(finalOrder) {
  if (submitted || !Array.isArray(finalOrder)) return;
  // finalOrder: 플레이어 인덱스 배열 (0번부터, 1등부터)
  const order = finalOrder
    .map(idx => members[Number(idx)]?.user_id)
    .filter(Boolean);
  if (order.length !== members.length) return;
  submitted = true;
  try {
    await submitMatch(order);
    sync.textContent = '결과 반영 완료 ✓';
  } catch (e) {
    if (!String(e.message).includes('already')) submitted = false;
    console.warn('[pokemon-minima] submitMatch:', e);
  }
}

// ── 종료 패널 ─────────────────────────────────────────────────────
function showEnd() {
  if (!state || state.phase !== 'end') return;
  if (!endEl.innerHTML) {
    endEl.innerHTML = endPanel(
      '포켓몬 미니마 종료',
      '최종 점수를 확인한 뒤 홈이나 다인플 목록으로 돌아갈 수 있습니다.'
    );
  }
}

// ── iframe 메시지 수신 ────────────────────────────────────────────
window.addEventListener('message', e => {
  if (e.source !== frame?.contentWindow) return;

  // 게임 준비 완료 → 현재 상태 전달
  if (e.data?.type === 'pokemon_minima_ready') {
    sendState();
    return;
  }
  // 상태 업데이트
  if (e.data?.type === 'game_state') {
    queuePayload(e.data.state);
    return;
  }
  // 게임 종료 결과
  if (e.data?.type === 'game_result') {
    submitResult(e.data.order);
    return;
  }
});

// ── 메인 초기화 ───────────────────────────────────────────────────
(async () => {
  try {
    me = await getMe();
    if (!me) return showFatal('로그인이 필요합니다.');

    ({ room, members } = await loadRoom());

    if (room.game !== 'pocketnova') {
      return showFatal('포켓몬 미니마 방이 아닙니다. 다인플 목록에서 포켓몬 미니마 방을 선택해 주세요.');
    }

    mySeat = members.findIndex(m => m.user_id === me.user_id);
    if (mySeat < 0) return showFatal('이 방의 참가자가 아닙니다.');

    badges = await ratingBadges('pocketnova', members.map(m => m.user_id));

    // 저장된 상태 로드
    const row = await loadState();
    revision = Number(row.revision ?? 0);
    state    = row.state ?? null;

    // 이전 버전 상태 호환 체크
    if (state && state.kind && state.kind !== 'pokemon-minima-v1-boardmate') {
      return showFatal(
        '이 방에는 이전 포크노바 게임 상태가 남아 있습니다. ' +
        '새 방을 만들어 포켓몬 미니마를 시작해 주세요.'
      );
    }

    drawPlayers();

    // iframe 로드
    frame = document.getElementById('gameFrame');
    const names   = encodeURIComponent(JSON.stringify(members.map(m => m.nickname)));
    const isHost  = room.host_id === me.user_id ? '1' : '0';
    frame.src = `./pokemon-minima.html?online=1&seat=${mySeat}&host=${isHost}&names=${names}`;
    frame.addEventListener('load', sendState);

    showEnd();

    // 10초 폴링 폴백
    startStatePoll(async row => {
      if (Number(row.revision) <= Number(revision)) return;
      revision = Number(row.revision);
      if (row.state) {
        state = row.state;
        drawPlayers();
        sendState();
        showEnd();
      }
    }, { interval: 2000 });

    sync.textContent = '연결됨';

  } catch (e) {
    showFatal(e.message || String(e));
  }
})();
</script>
</body>
</html>
