<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<base href="../">
<title>RUNNING</title>
<link rel="stylesheet" href="css/image-layer.css">
<style>
:root{--text:#eef;--money:#fdc}body{background:#202938;color:#fff;font-family:system-ui;margin:20px}.zoo-card,.action-card{position:relative;display:inline-flex;vertical-align:top;flex-direction:column;width:110px;min-height:140px;margin:6px;padding:6px;background:#334;border-radius:8px}.map-wrap{max-width:700px;background:#293548;padding:12px}.hex-grid{display:block;width:300px;height:100px;background:#16202d}.card-name,.action-name{font-size:12px}.action-side{position:absolute;right:3px;top:3px}.slot-strength{font-weight:bold}#results{white-space:pre-wrap;font-family:monospace;background:#111;padding:10px;margin-top:20px}
</style>
</head>
<body>
<h1>v11.7 image-layer smoke</h1>
<div id="fixtures">
  <div class="zoo-card kind-animal animal-known"><div class="card-name">윈디</div></div>
  <div class="zoo-card kind-animal animal-ocr"><div class="card-name">로토무</div></div>
  <div class="zoo-card kind-sponsor sponsor-manual"><div class="card-name">콘</div></div>
  <div class="zoo-card kind-legendary project-manual"><div class="card-name">가이오가</div></div>
  <div class="zoo-card kind-finalscoring final-map"><div class="card-name">지도</div></div>
  <div class="zoo-card kind-finalscoring final-dowsing"><div class="card-name">다우징 머신</div></div>
  <div class="zoo-card kind-finalscoring final-dex"><div class="card-name">포케 도감</div></div>
  <div class="zoo-card kind-finalscoring final-unverified"><div class="card-name">낚싯대</div></div>
  <div class="action-card"><div class="action-side">I</div><div class="slot-strength">3</div><div class="action-name">건설</div></div>
  <div class="panel map-wrap"><h3>🗺️ 사파리존 — 바위 암벽</h3><svg class="hex-grid map-theme-ice"></svg></div>
</div>
<div id="results">waiting…</div>
<script src="assets/data.js"></script>
<script src="assets/animal-ocr-index.js"></script>
<script src="assets/v3-card-names.js"></script>
<script src="assets/core-fix-status.js"></script>
<script src="assets/source-card-audit.js"></script>
<script src="assets/builtin-image-mappings.js"></script>
<script type="module">
import { initImageLayer } from './js/image-layer.js';
try {
  localStorage.removeItem('boardmate:pocketnova:image-mapping:v1');
  localStorage.removeItem('boardmate:pocketnova:image-mapping:v2');
  localStorage.removeItem('boardmate:pocketnova:image-layer:enabled');
} catch {}
initImageLayer();
setTimeout(() => {
  const api = window.__PORKNOVA_IMAGE_LAYER__;
  const checks = {
    version: api?.version === '11.7',
    selfTest: api?.selfTest()?.ok === true,
    animalStructuredAutoImage: document.querySelector('.animal-known .porknova-card-art')?.getAttribute('src') === 'assets/animals/animal_p01_01.webp',
    animalOcrAutoImage: document.querySelector('.animal-ocr .porknova-card-art')?.getAttribute('src') === 'assets/animals/animal_p07_05.webp',
    sponsorConservative: !document.querySelector('.sponsor-manual .porknova-card-art') && !!document.querySelector('.sponsor-manual .porknova-image-link'),
    projectConservative: !document.querySelector('.project-manual .porknova-card-art') && !!document.querySelector('.project-manual .porknova-image-link'),
    finalMapBuiltin: document.querySelector('.final-map .porknova-card-art')?.getAttribute('src') === 'assets/finals/final_p06_02.webp',
    finalDowsingCoreGate: api?.diagnostics()?.coreFixStatus?.applied === true
      ? document.querySelector('.final-dowsing .porknova-card-art')?.getAttribute('src') === 'assets/finals/final_p06_03.webp'
      : !document.querySelector('.final-dowsing .porknova-card-art'),
    finalDexBuiltin: document.querySelector('.final-dex .porknova-card-art')?.getAttribute('src') === 'assets/finals/final_p06_05.webp',
    finalUnverifiedNotAuto: !document.querySelector('.final-unverified .porknova-card-art'),
    actionImage: !!document.querySelector('.action-card .porknova-action-art'),
    actionZoom: !!document.querySelector('.action-card .porknova-image-zoom'),
    mapF13: document.querySelector('.porknova-map-reference-image')?.getAttribute('src') === 'assets/maps/map_01.webp',
    toolbar: !!document.querySelector('#porknova-image-toolbar'),
    resolveSourceBuiltin: api?.resolve('finals','지도')?.source === 'builtin',
    resolveSourceOcr: api?.resolve('animals','로토무')?.source === 'ocr',
  };

  // Regression: a user can suppress/re-enable an automatic mapping without
  // modifying game state or the built-in manifest.
  api.disableAutoMapping('finals','지도');
  checks.disableAuto = api.resolve('finals','지도') === null;
  api.enableAutoMapping('finals','지도');
  checks.reenableAuto = api.resolve('finals','지도')?.src === 'assets/finals/final_p06_02.webp';

  api.openLibrary();
  setTimeout(() => {
    checks.libraryAnimals = document.querySelectorAll('.porknova-library-item').length === 234;
    checks.diagnostics = api.diagnostics().builtinMappings.finals === 3 && api.diagnostics().animalOcrRows === 234 && api.diagnostics().sourceAuditFinals?.mismatch === 3;
    const pass = Object.values(checks).every(Boolean);
    document.getElementById('results').textContent = JSON.stringify(checks, null, 2) + `\nPASS=${pass}`;
    document.title = pass ? 'PASS' : 'FAIL';
    document.documentElement.dataset.smoke = pass ? 'pass' : 'fail';
  }, 350);
}, 650);
</script>
</body>
</html>
