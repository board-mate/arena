<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>한밤의 늑대인간 · BoardMate 온라인</title><link rel="stylesheet" href="./social/social-deduction.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script></head>
<body><main class="sd-shell" id="app">불러오는 중…</main>
<script type="module">
import {boot,getView,act,startPolling,fatal,esc,roleKo,openRoles,seatName,roomId,rpc,token,finalizeSeatWinners,socialEndScreen,mountSocialCancelControl} from './social/social-common.js?v=27';
const GAME='onenightwerewolf',app=document.querySelector('#app');let ctx,view,busy=false,stop=null;
const MAX={doppelganger:1,werewolf:2,minion:1,mason:2,seer:1,robber:1,troublemaker:1,drunk:1,insomniac:1,villager:3,tanner:1,hunter:1};
const ORDER=['doppelganger','werewolf','minion','mason','seer','robber','troublemaker','drunk','insomniac','villager','tanner','hunter'];
const roleDesc={doppelganger:'다른 플레이어의 카드를 보고 그 역할을 복제합니다.',werewolf:'다른 늑대인간을 확인합니다. 혼자 깨어난 늑대인간은 중앙 카드 1장을 볼 수 있습니다.',minion:'늑대인간을 확인합니다. 늑대인간은 하수인을 알지 못합니다.',mason:'다른 프리메이슨을 확인합니다.',seer:'다른 플레이어 카드 1장 또는 중앙 카드 2장을 봅니다.',robber:'다른 플레이어와 카드를 바꾼 뒤 새 카드를 봅니다.',troublemaker:'다른 두 플레이어의 카드를 보지 않고 서로 바꿀 수 있습니다.',drunk:'자기 카드와 중앙 카드 1장을 바꾸되 새 카드를 보지 않습니다.',insomniac:'밤 마지막에 자기 앞의 현재 카드를 봅니다.',villager:'야간 행동이 없습니다.',tanner:'자신이 죽으면 승리합니다.',hunter:'사냥꾼이 죽으면 자신이 투표한 플레이어도 죽습니다.'};
function top(){return `<div class="sd-topbar"><div class="sd-title">🌕 한밤의 늑대인간<small>확장 없음 · ${esc(ctx.room.title||'BoardMate')} · ${ctx.members.length}인</small></div><div class="sd-actions"><button class="sd-btn" id="rolesBtn">🎭 이번 판 역할</button><a class="sd-btn ghost" href="./index.html#/room/${encodeURIComponent(roomId)}">← 방으로</a></div></div>`;}
function defaultCounts(n){const c={doppelganger:0,werewolf:2,minion:0,mason:0,seer:1,robber:1,troublemaker:1,drunk:0,insomniac:0,villager:1,tanner:0,hunter:0};const add=['villager','villager','minion','drunk','insomniac','tanner','hunter','doppelganger'];let total=Object.values(c).reduce((a,b)=>a+b,0),idx=0;while(total<n+3&&idx<add.length){const r=add[idx++];if(c[r]<MAX[r]){c[r]++;total++;}}return c;}
function participants(st){return `<div class="sd-player-list">${ctx.members.map(m=>{const s=Number(m.seat),dead=(st.dead||[]).map(Number).includes(s),winner=(st.winners||[]).map(Number).includes(s);return `<div class="sd-player ${dead?'dead':''} ${winner?'active':''}"><span class="sd-seat">${s+1}</span><b>${esc(m.nickname)}</b>${dead?'<span class="sd-pill">사망</span>':''}${winner?'<span class="sd-pill">🏆 승리</span>':''}</div>`}).join('')}</div>`;}
function intel(v){const rows=v.me?.intel||[];if(!rows.length)return '<div class="sd-notice sd-muted">아직 확인한 비공개 정보가 없습니다.</div>';return `<div class="sd-notice"><b>내가 밤에 확인한 정보</b>${rows.map(x=>{if(x.type==='도플갱어 복제')return `<div>• ${esc(seatName(ctx.members,x.seat))}의 카드를 보고 <b>${esc(roleKo(x.role))}</b>을 복제</div>`;if(x.type==='예언자 확인')return `<div>• 예언자: ${(x.cards||[]).map(c=>c.seat!=null?`${esc(seatName(ctx.members,c.seat))}=${esc(roleKo(c.role))}`:`중앙 ${Number(c.center)+1}=${esc(roleKo(c.role))}`).join(' / ')}</div>`;if(x.type==='강도 교환 후 새 카드')return `<div>• 강도: ${esc(seatName(ctx.members,x.seat))}와 교환 후 <b>${esc(roleKo(x.role))}</b></div>`;if(x.type==='단독 늑대인간 중앙 확인')return `<div>• 단독 늑대인간: 중앙 ${Number(x.center)+1}은 <b>${esc(roleKo(x.role))}</b></div>`;if(x.type==='불면증환자 최종 카드 확인')return `<div>• 불면증환자 확인: <b>${esc(roleKo(x.role))}</b></div>`;return `<div>• ${esc(x.type||'정보')}</div>`}).join('')}</div>`;}
function myCard(v){const r=v.me?.initial_role;return `<div class="sd-role-card"><div class="sd-muted">처음 받은 역할</div><div class="sd-role-name">${esc(roleKo(r))}</div><p>${esc(roleDesc[r]||'')}</p></div>${known(v)}${intel(v)}`;}
function known(v){const a=v.me?.night_action,k=v.me?.known_seats||a?.known_seats||[];if(!k.length)return '';let label='함께 확인한 플레이어';if(v.me.initial_role==='minion'||v.me?.copied_role==='minion'||a?.copied_role==='minion')label='내가 확인한 늑대인간';if(v.me.initial_role==='mason'||v.me?.copied_role==='mason'||a?.copied_role==='mason')label='내가 확인한 프리메이슨';if(v.me.initial_role==='werewolf'||v.me?.copied_role==='werewolf'||a?.copied_role==='werewolf')label='함께 깨어난 늑대인간';return `<div class="sd-notice"><b>${esc(label)}</b>${k.map(s=>`<div>• ${esc(seatName(ctx.members,s))}</div>`).join('')}</div>`;}
function roleSelect(id,filter=()=>true){return `<select class="sd-select" id="${id}"><option value="">선택</option>${ctx.members.filter(m=>filter(Number(m.seat))).map(m=>`<option value="${m.seat}">${Number(m.seat)+1}. ${esc(m.nickname)}</option>`).join('')}</select>`;}
function centerSelect(id){return `<select class="sd-select" id="${id}"><option value="">중앙 카드 선택</option><option value="0">중앙 1</option><option value="1">중앙 2</option><option value="2">중앙 3</option></select>`;}
function nightControl(v){const st=v.state,m=v.me,a=m.night_action||{kind:'ready'};if(m.night_submitted)return `<div class="sd-notice">이 단계 확인 완료 · 전체 ${Number(st.night_progress||0)}/${ctx.members.length}</div>`;
 const generic=`<button class="sd-btn primary" id="nightReady">이 야간 단계 확인 완료</button>`;
 if(!a.actor||a.kind==='ready')return `<div class="sd-control"><p>현재 호출: <b>${esc(roleKo(st.night_step))}</b>. 자신의 역할에 해당하는 정보를 확인한 뒤 완료를 누르세요.</p>${generic}</div>`;
 if(a.kind==='doppel_choose')return `<div class="sd-control"><b>도플갱어: 다른 플레이어의 카드를 1장 봅니다.</b>${roleSelect('target1',s=>s!==ctx.mySeat)}<button class="sd-btn primary" id="doppelBtn">카드 보고 복제</button></div>`;
 if(a.kind==='seer')return `<div class="sd-control"><b>예언자: 하나를 선택하세요.</b><div class="sd-notice">다른 플레이어 1장 보기</div>${roleSelect('target1',s=>s!==ctx.mySeat)}<button class="sd-btn" id="seerPlayer">플레이어 카드 보기</button><div class="sd-notice">또는 중앙 카드 2장 보기</div><div class="sd-actions">${centerSelect('center1')}${centerSelect('center2')}</div><button class="sd-btn primary" id="seerCenter">중앙 2장 보기</button></div>`;
 if(a.kind==='robber')return `<div class="sd-control"><b>강도: 다른 플레이어와 교환하면 새 카드를 확인합니다.</b>${roleSelect('target1',s=>s!==ctx.mySeat)}<div class="sd-actions"><button class="sd-btn primary" id="robBtn">교환</button><button class="sd-btn ghost" id="skipBtn">교환하지 않음</button></div></div>`;
 if(a.kind==='troublemaker')return `<div class="sd-control"><b>말썽쟁이: 다른 두 플레이어의 카드를 서로 바꿀 수 있습니다.</b>${roleSelect('target1',s=>s!==ctx.mySeat)}${roleSelect('target2',s=>s!==ctx.mySeat)}<div class="sd-actions"><button class="sd-btn primary" id="troubleBtn">두 카드 교환</button><button class="sd-btn ghost" id="skipBtn">교환하지 않음</button></div></div>`;
 if(a.kind==='drunk')return `<div class="sd-control"><b>주정뱅이: 중앙 카드 1장과 반드시 교환합니다. 새 카드는 볼 수 없습니다.</b>${centerSelect('center1')}<button class="sd-btn primary" id="drunkBtn">중앙 카드와 교환</button></div>`;
 if(a.kind==='wolf_lone')return `<div class="sd-control"><b>혼자 깨어난 늑대인간: 중앙 카드 1장을 볼 수 있습니다.</b>${centerSelect('center1')}<div class="sd-actions"><button class="sd-btn primary" id="wolfPeek">중앙 카드 보기</button><button class="sd-btn ghost" id="skipBtn">보지 않음</button></div></div>`;
 if(a.kind==='insomniac')return `<div class="sd-control"><div class="sd-notice"><b>현재 내 앞의 카드:</b> ${esc(roleKo(a.seen_role))}</div>${generic}</div>`;
 return generic;}
function dayControl(v){const st=v.state;if(v.me.day_voted)return `<div class="sd-notice">투표 완료 · ${Number(st.vote_count||0)}/${ctx.members.length}. 모든 투표가 끝나면 동시에 공개됩니다.</div>`;return `<div class="sd-control"><h3>낮 토론 / 최종 투표</h3><p>대화로 늑대인간을 찾은 뒤 다른 플레이어 한 명에게 비밀 투표하세요.</p>${roleSelect('voteTarget',s=>s!==ctx.mySeat)}<button class="sd-btn primary" id="voteBtn">최종 투표</button></div>`;}
function result(v){const st=v.state,wins=(st.winners||[]).map(Number),dead=(st.dead||[]).map(Number),myWin=wins.includes(ctx.mySeat);const reasons=[st.result?.village_win?'마을 팀 승리 조건 충족':'',st.result?.werewolf_win?'늑대인간 팀 승리 조건 충족':'',st.result?.tanner_dead?'무두장이가 죽어 무두장이 승리':''].filter(Boolean);const body=`<h3 style="margin:0 0 8px">최종 역할 / 생존 결과</h3><div class="sd-player-list">${(st.reveal||[]).map(x=>{const won=wins.includes(Number(x.seat));return `<div class="sd-player ${dead.includes(Number(x.seat))?'dead':''} ${won?'winner':'loser'}"><span class="sd-seat">${Number(x.seat)+1}</span><b>${esc(seatName(ctx.members,x.seat))}${Number(x.seat)===ctx.mySeat?' · 나':''}</b><span class="sd-pill">${esc(roleKo(x.role))}</span>${x.physical_role!==x.role?`<span class="sd-muted">(카드 ${esc(roleKo(x.physical_role))})</span>`:''}<span class="sd-pill">${won?'🏆 승리':'패배'}</span></div>`}).join('')}</div><h3 style="margin:14px 0 8px">중앙 3장</h3><div class="sd-pills">${(st.center_reveal||[]).map((r,i)=>`<span class="sd-role-pill">중앙 ${i+1}: ${esc(roleKo(r))}</span>`).join('')}</div>`;return socialEndScreen({win:myWin,title:'한밤의 늑대인간 종료',reason:reasons.join(' · ')||'최종 투표 결과가 확정되었습니다.',summary:`사망 ${dead.length}명 · 승리 ${wins.length}명`,body});}
async function doAct(a){if(busy)return;busy=true;try{await act(a);draw(await getView());}catch(e){alert(e.message||e);}finally{busy=false;}}
function bind(v){document.querySelector('#rolesBtn')?.addEventListener('click',()=>openRoles(v.state?.role_counts||{},'한밤의 늑대인간 이번 판 역할'));
 document.querySelector('#nightReady')?.addEventListener('click',()=>doAct({type:'night_submit',mode:'ready'}));document.querySelector('#doppelBtn')?.addEventListener('click',()=>sendSeat('target1',{type:'night_submit',mode:'choose'},'seat'));document.querySelector('#seerPlayer')?.addEventListener('click',()=>sendSeat('target1',{type:'night_submit',mode:'player'},'seat'));document.querySelector('#seerCenter')?.addEventListener('click',()=>{const ea=document.querySelector('#center1'),eb=document.querySelector('#center2');if(!ea?.value||!eb?.value)return alert('서로 다른 중앙 카드 2장을 선택하세요.');const a=Number(ea.value),b=Number(eb.value);if(Number.isInteger(a)&&Number.isInteger(b)&&a!==b)doAct({type:'night_submit',mode:'center',center1:a,center2:b});else alert('서로 다른 중앙 카드 2장을 선택하세요.');});document.querySelector('#robBtn')?.addEventListener('click',()=>sendSeat('target1',{type:'night_submit',mode:'swap'},'seat'));document.querySelector('#troubleBtn')?.addEventListener('click',()=>{const ea=document.querySelector('#target1'),eb=document.querySelector('#target2');if(!ea?.value||!eb?.value)return alert('서로 다른 플레이어 2명을 선택하세요.');const a=Number(ea.value),b=Number(eb.value);if(Number.isInteger(a)&&Number.isInteger(b)&&a!==b)doAct({type:'night_submit',mode:'swap',seat1:a,seat2:b});else alert('서로 다른 플레이어 2명을 선택하세요.');});document.querySelector('#drunkBtn')?.addEventListener('click',()=>sendSeat('center1',{type:'night_submit',mode:'swap'},'center'));document.querySelector('#wolfPeek')?.addEventListener('click',()=>sendSeat('center1',{type:'night_submit',mode:'peek'},'center'));document.querySelector('#skipBtn')?.addEventListener('click',()=>doAct({type:'night_submit',mode:'skip'}));document.querySelector('#voteBtn')?.addEventListener('click',()=>sendSeat('voteTarget',{type:'day_vote'},'seat'));}
function sendSeat(id,base,key){const el=document.querySelector('#'+id);if(!el?.value)return alert(key==='center'?'중앙 카드를 선택하세요.':'플레이어를 선택하세요.');const v=Number(el.value);if(Number.isInteger(v))doAct({...base,[key]:v});}
function setup(){const need=ctx.members.length+3,counts=defaultCounts(ctx.members.length);app.innerHTML=top()+`<div class="sd-grid"><section class="sd-card sd-main"><h2>역할 카드 선택</h2><p>정확히 <b>${need}장</b>을 선택합니다. 플레이어에게 1장씩 나누고 남은 3장은 중앙에 놓입니다. 아래 12종만 지원합니다.</p>${ctx.isHost?`<div class="sd-counter-grid" id="roleCounters">${ORDER.map(r=>`<div class="sd-counter" data-role="${r}"><span>${esc(roleKo(r))}<br><small class="sd-muted">${r==='mason'?'항상 2장 세트':`최대 ${MAX[r]}`}</small></span><div class="sd-counter-controls"><button class="sd-btn" data-minus="${r}">−</button><b data-count="${r}">${counts[r]}</b><button class="sd-btn" data-plus="${r}">＋</button></div></div>`).join('')}</div><div class="sd-notice" id="countStatus"></div><button class="sd-btn primary" id="initBtn">역할 섞고 밤 시작</button>`:'<div class="sd-notice">방장이 이번 판 역할 구성을 선택하고 있습니다.</div>'}</section><aside class="sd-card sd-side"><h3>참가자</h3>${participants({})}</aside></div>`;document.querySelector('#rolesBtn')?.addEventListener('click',()=>openRoles(counts,'선택 중인 역할'));if(!ctx.isHost)return;const refresh=()=>{const total=ORDER.reduce((s,r)=>s+counts[r],0);document.querySelector('#countStatus').textContent=`선택 ${total}/${need}장 · 중앙 카드는 항상 3장`;document.querySelector('#initBtn').disabled=total!==need;ORDER.forEach(r=>document.querySelector(`[data-count="${r}"]`).textContent=counts[r]);};document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{const r=b.dataset.plus;if(r==='mason'){counts[r]=2;}else if(counts[r]<MAX[r])counts[r]++;refresh();});document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{const r=b.dataset.minus;if(r==='mason'){counts[r]=0;}else if(counts[r]>0)counts[r]--;refresh();});document.querySelector('#initBtn').onclick=async()=>{try{await rpc('boardmate_social_init',{p_token:token(),p_room_id:roomId,p_options:{role_counts:counts}});draw(await getView());}catch(e){alert(e.message||e);}};refresh();}
async function draw(v){view=v;if(!v?.initialized)return setup();const st=v.state;if((st.phase==='over'||st.over)&&ctx.isHost){app.innerHTML=top()+`<section class="sd-card sd-main"><h2>🌅 게임 종료</h2><div class="sd-notice"><b>결과를 BoardMate에 저장하고 방을 종료하는 중입니다…</b><br><span class="sd-muted">완료되면 나가기 버튼이 표시됩니다.</span></div></section>`;await finalizeSeatWinners(ctx,(st.winners||[]).map(Number));}app.innerHTML=top()+`<div class="sd-grid"><section class="sd-card sd-main"><h2>${st.phase==='night'?`🌙 밤 · ${esc(roleKo(st.night_step))}`:st.phase==='day'?'☀️ 낮 토론 / 투표':'🌅 게임 종료'}</h2>${st.phase==='night'?`<div class="sd-progress"><i style="width:${Math.round(Number(st.night_progress||0)/ctx.members.length*100)}%"></i></div><p class="sd-muted">모든 플레이어가 각 야간 호출마다 확인 버튼을 누릅니다. 그래서 누가 실제 역할인지 진행 속도로 알 수 없습니다.</p>${nightControl(v)}`:st.phase==='day'?dayControl(v):result(v)}</section><aside class="sd-card sd-side"><h3>내 비공개 정보</h3>${myCard(v)}</aside><section class="sd-card sd-main"><h3>참가자</h3>${participants(st)}</section><aside class="sd-card sd-side"><h3>공개 기록</h3><div class="sd-history">${(st.history||[]).slice().reverse().map(h=>`<div class="sd-history-item">${esc(h.text||'')}</div>`).join('')||'<div class="sd-muted">아직 기록이 없습니다.</div>'}</div></aside></div>`;bind(v);}
try{ctx=await boot(GAME);if(ctx.members.length<3||ctx.members.length>10)fatal('한밤의 늑대인간은 3~10인입니다.');mountSocialCancelControl();draw(await getView());stop=startPolling(v=>draw(v),{interval:900});window.addEventListener('beforeunload',()=>stop?.());}catch(e){console.error(e);fatal(e.message||'한밤의 늑대인간을 열 수 없습니다.');}
</script></body></html>
