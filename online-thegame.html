<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BoardMate Online · 더 게임</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><style>
:root{font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;color:#f8fafc;background:#1e1f29}*{box-sizing:border-box}body{margin:0;background:#1e1f29;color:#fff}button{font:inherit;cursor:pointer}.bar{position:sticky;top:0;background:#11131b;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;z-index:10}.bar a{color:#fff;text-decoration:none;font-weight:900}.wrap{width:min(980px,calc(100% - 20px));margin:18px auto}.card{background:#282a36;border:1px solid #3a3d50;border-radius:18px;padding:16px;margin-bottom:12px}.players{display:flex;gap:8px;overflow:auto}.player{min-width:130px;background:#343746;border-radius:11px;padding:9px}.player.active{outline:3px solid #f1c40f}.player small{display:block;color:#aeb4c5;margin-top:3px}.piles{display:grid;grid-template-columns:repeat(2,150px);gap:14px;justify-content:center;margin:22px 0}.pile{height:160px;border:2px dashed #596077;border-radius:14px;background:#2b2d3c;color:#fff;display:grid;place-items:center}.pile.legal{border-color:#f1c40f;box-shadow:0 0 16px #f1c403}.pile b{font-size:44px}.hand{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.num{width:62px;height:90px;border:2px solid #5b6178;border-radius:9px;background:#383a59;color:white;font-size:23px;font-weight:950}.num.sel{transform:translateY(-9px);border-color:#f1c40f}.actions{display:flex;gap:8px;justify-content:center;margin-top:14px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:950}.primary{background:#e74c3c;color:white}.ghost{background:#4b5167;color:white}.status{text-align:center;font-weight:900}.note{font-size:12px;color:#c8cedc;line-height:1.55}.logs{max-height:170px;overflow:auto;background:#171821;border-radius:10px;padding:9px;font-size:11px;color:#d4d8e2}.result{background:#203c2e;border:1px solid #3f7a5d;border-radius:12px;padding:14px;text-align:center}.lose{background:#4a2026;border-color:#8c3c49}@media(max-width:520px){.piles{grid-template-columns:repeat(2,1fr)}.pile{height:125px}.num{width:52px;height:76px}}
</style></head><body><header class="bar"><span style="display:flex;gap:6px"><a href="./index.html#/">← 홈</a><a href="./index.html#/multi">다인플</a></span><b id="title">🃏 더 게임</b><span id="sync">연결 중…</span></header><main class="wrap"><div id="app">불러오는 중…</div></main><script type="module">
import {configured,roomId,getMe,loadRoom,loadState,saveState,startStatePoll,submitCoopMatch,ratingBadges,esc,showFatal,endPanel} from './multi-common.js';
if(!configured()||!roomId)showFatal('Supabase 설정 또는 room 주소가 없습니다.');
let me,room,members,badges={},mySeat=-1,state=null,revision=0,selected=null,saving=false,submitted=false;const clone=x=>JSON.parse(JSON.stringify(x));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function limit(n){return n===2?7:6}
function initialState(){const deck=shuffle(Array.from({length:98},(_,i)=>i+2)),hands=members.map(()=>[]),handSize=limit(members.length);for(let r=0;r<handSize;r++)for(let i=0;i<members.length;i++)if(deck.length)hands[i].push(deck.pop());hands.forEach(h=>h.sort((a,b)=>a-b));return{kind:'thegame-v5',playerCount:members.length,current:0,deck,piles:[1,1,100,100],hands,played:0,turnNo:1,over:false,win:false,reason:'',logs:[`게임 시작 · ${members[0].nickname} 선`]}}
function legal(v,p){const cur=state.piles[p];return p<2?(v>cur||v===cur-10):(v<cur||v===cur+10)}
function legalWith(s,v,p){const cur=s.piles[p];return p<2?(v>cur||v===cur-10):(v<cur||v===cur+10)}
function minNeed(s){return s.deck.length?2:1}
function hasEnoughMoves(s,seat){const need=minNeed(s),hand=s.hands[seat];if(hand.length<need)return hand.length>0?false:true;let count=0;for(const v of hand)if([0,1,2,3].some(p=>legalWith(s,v,p)))count++;return count>=Math.min(need,hand.length)}
async function mutate(fn){if(saving||!state)return;saving=true;const next=clone(state);try{fn(next);const nr=await saveState(revision,next);revision=nr;state=next;selected=null;render();document.querySelector('#sync').textContent='자동 저장됨';if(next.over)maybeSubmit()}catch(e){document.querySelector('#sync').textContent='재동기화 중';const row=await loadState();revision=row.revision;state=row.state;render()}finally{saving=false}}
function play(p){if(state.over||state.current!==mySeat||selected==null)return;const hand=state.hands[mySeat],v=hand[selected];if(!legal(v,p))return;mutate(s=>{const vv=s.hands[mySeat][selected];s.hands[mySeat].splice(selected,1);s.piles[p]=vv;s.played++;s.logs.unshift(`${members[mySeat].nickname}: ${vv} → ${p<2?'오름':'내림'} 더미`);if(s.deck.length===0&&s.hands.every(h=>h.length===0)){s.over=true;s.win=true;s.reason='모든 숫자 카드를 내려놓았습니다.';}})}
function endTurn(){if(state.over||state.current!==mySeat)return;const need=minNeed(state),hand=state.hands[mySeat];if(state.played<Math.min(need,Math.max(1,hand.length)))return;mutate(s=>{const hs=limit(s.playerCount);while(s.hands[mySeat].length<hs&&s.deck.length)s.hands[mySeat].push(s.deck.pop());s.hands[mySeat].sort((a,b)=>a-b);s.played=0;let n=(s.current+1)%s.playerCount;s.current=n;s.turnNo++;if(s.deck.length===0&&s.hands.every(h=>h.length===0)){s.over=true;s.win=true;s.reason='모든 숫자 카드를 내려놓았습니다.';return;}if(!hasEnoughMoves(s,n)){s.over=true;s.win=false;s.reason=`${members[n].nickname}님이 필요한 장수만큼 카드를 낼 수 없습니다.`;}})}
async function maybeSubmit(){if(submitted||room.host_id!==me.user_id||!state?.over)return;submitted=true;try{await submitCoopMatch(state.win);document.querySelector('#sync').textContent='결과 반영 완료'}catch(e){if(!String(e.message).includes('already'))submitted=false}}
function render(){if(!state)return;document.querySelector('#title').textContent=`🃏 ${room.title}`;const app=document.querySelector('#app'),myTurn=state.current===mySeat&&!state.over,need=minNeed(state),left=state.deck.length+state.hands.reduce((a,h)=>a+h.length,0);app.innerHTML=`<section class="card"><div class="players">${members.map((m,i)=>`<div class="player ${i===state.current&&!state.over?'active':''}"><b>${esc(badges[m.user_id]?.text||'🥉')} ${esc(m.nickname)}${i===mySeat?' · 나':''}</b><small>손패 ${state.hands[i].length}장</small></div>`).join('')}</div><p class="status">턴 ${state.turnNo} · ${state.over?'게임 종료':`${esc(members[state.current].nickname)} 차례 · 최소 ${need}장`} · 남은 카드 ${left}장</p><div class="piles">${state.piles.map((v,i)=>`<button class="pile ${myTurn&&selected!=null&&legal(state.hands[mySeat][selected],i)?'legal':''}" data-pile="${i}" ${!myTurn?'disabled':''}><span>${i<2?'오름차순 ▲':'내림차순 ▼'}</span><b>${v}</b></button>`).join('')}</div>${!state.over?`<h3 style="text-align:center">내 손패</h3><div class="hand">${state.hands[mySeat].map((v,i)=>`<button class="num ${selected===i?'sel':''}" data-card="${i}" ${!myTurn?'disabled':''}>${v}</button>`).join('')}</div><div class="actions"><button class="btn primary" id="endTurn" ${!myTurn||state.played<Math.min(need,Math.max(1,state.hands[mySeat].length))?'disabled':''}>턴 종료 · 현재 ${state.played}장</button></div>`:`<div class="result ${state.win?'':'lose'}"><h2>${state.win?'🎉 공동 승리':'💀 공동 패배'}</h2><p>${esc(state.reason)}</p></div>`}<p class="note">오름차순 더미에는 더 큰 숫자, 내림차순 더미에는 더 작은 숫자를 놓습니다. 예외로 정확히 10 차이면 반대 방향으로 되돌릴 수 있습니다. 덱에 카드가 남아 있는 동안 한 차례에 최소 2장, 덱이 비면 최소 1장을 내려놓아야 합니다.</p><div class="logs">${state.logs.slice(0,50).map(x=>`<div>${esc(x)}</div>`).join('')}</div></section>`;if(state.over)app.insertAdjacentHTML('beforeend',endPanel('게임이 끝났습니다.','결과가 저장되었습니다. 홈이나 다인플 목록으로 이동할 수 있습니다.'));app.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{if(myTurn){selected=Number(b.dataset.card);render()}});app.querySelectorAll('[data-pile]').forEach(b=>b.onclick=()=>play(Number(b.dataset.pile)));app.querySelector('#endTurn')?.addEventListener('click',endTurn);if(state.over)maybeSubmit()}
(async()=>{try{me=await getMe();if(!me)return showFatal('로그인이 필요합니다.');({room,members}=await loadRoom());if(room.game!=='thegame')return showFatal('더 게임 방이 아닙니다.');mySeat=members.findIndex(m=>m.user_id===me.user_id);if(mySeat<0)return showFatal('이 방의 참가자가 아닙니다.');badges=await ratingBadges('thegame',members.map(m=>m.user_id));const row=await loadState();revision=row.revision;state=row.state;if(!state&&room.host_id===me.user_id){state=initialState();revision=await saveState(0,state)}render();startStatePoll(async row=>{revision=row.revision;if(row.state){state=row.state;render()}},{interval:room.play_mode==='turn'?4000:1000})}catch(e){showFatal(e.message)}})();
</script></body></html>
