function routeSelectableForTask(r){const task=currentTask(state);if(state.pendingChoice?.seat===mySeat&&state.pendingChoice.type==='advisoryRoute')return state.routes[r.id].owner===mySeat;if(state.phase==='eventChoice'&&state.current===mySeat){const t=state.eventQueue[0];if(['sellOrDraw','maybeSellRoute'].includes(t?.type))return state.routes[r.id].owner===mySeat;if(t?.type==='routeOrClipper')return !!routeClaimPlan(state,mySeat,r.id,null)}if(state.phase==='panam'&&state.subphase==='offer'&&state.current===mySeat)return state.routes[r.id].owner===mySeat;if(state.phase==='resolution'&&currentTask(state)?.kind==='D'&&currentTask(state).seat===mySeat)return !!routeClaimPlan(state,mySeat,r.id,state.players[mySeat].routeModifier);return false}
function citySelectable(city){if(state.pendingChoice?.seat===mySeat&&state.pendingChoice.type==='regionalAirport')return state.airports[city.id]==null;if(state.phase==='eventChoice'&&state.current===mySeat&&state.eventQueue[0]?.type==='maybePlaceAirport')return state.airports[city.id]==null;const t=currentTask(state);return state.phase==='resolution'&&t?.kind==='A'&&t.seat===mySeat&&state.airports[city.id]==null}
function mapSvg(){
  const routeLines=ROUTES.map(r=>{const a=CITY[r.a],b=CITY[r.b],owner=state.routes[r.id].owner;let cls='route ';if(owner==='panam')cls+='panowned';else if(typeof owner==='number')cls+=`owned${owner}`;else if(routeSelectableForTask(r))cls+='selectable';else if(r.path)cls+=r.path==='south'?'pan-south':r.path==='europe'?'pan-europe':'pan-asia';else cls+='open';const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;return `<g><line data-route="${r.id}" class="${cls}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/><text class="route-label" x="${mx}" y="${my-4}" text-anchor="middle">${r.d}</text></g>`}).join('');
  const cities=CITIES.map(c=>{const owner=state.airports[c.id],sel=citySelectable(c);return `<g class="city ${sel?'selectable':''}" data-city="${c.id}"><circle cx="${c.x}" cy="${c.y}" r="8"/>${typeof owner==='number'?`<circle class="airport-ring" cx="${c.x}" cy="${c.y}" r="13" stroke="${playerColor(owner)}"/>`:''}<text x="${c.x}" y="${c.y-13}" text-anchor="middle">${esc(c.name)}</text></g>`}).join('');
  return `<svg class="map" viewBox="0 0 1060 540" role="img" aria-label="팬 암 BoardMate 세계 항로 지도"><defs><linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a4773"/><stop offset="1" stop-color="#0d628f"/></linearGradient></defs><rect width="1060" height="540" fill="url(#ocean)"/><path d="M70 150 Q170 105 300 150 T430 220 Q350 300 210 350 Q90 320 70 150Z" fill="#d9d0ad" opacity=".32"/><path d="M440 120 Q590 80 710 150 Q780 210 725 330 Q650 350 540 300 Q480 245 440 120Z" fill="#d9d0ad" opacity=".28"/><path d="M720 160 Q890 120 1000 210 Q1030 315 950 420 Q840 390 760 330 Q710 260 720 160Z" fill="#d9d0ad" opacity=".28"/><path d="M360 330 Q470 325 560 420 Q520 520 440 520 Q360 450 360 330Z" fill="#d9d0ad" opacity=".25"/><g opacity=".14" stroke="#fff"><path d="M0 90H1060M0 180H1060M0 270H1060M0 360H1060M0 450H1060"/><path d="M150 0V540M300 0V540M450 0V540M600 0V540M750 0V540M900 0V540"/></g>${routeLines}${cities}<text x="530" y="28" text-anchor="middle" fill="#d9efff" font-size="18" font-weight="900" letter-spacing="5">PAN AMERICAN WORLD AIRWAYS · BoardMate</text></svg>`
}
function eventHtml(){const e=EVENT[state.currentEvent];return `<div class="event-card"><div class="r">ROUND ${state.round} · EVENT</div><h3>${esc(e.title)}</h3><div class="subtle">${esc(e.text)}</div><div class="event-meta"><span class="m">📈 ${esc(stockChangeText(e.stock))}</span><span class="m">🎲 기본 ${e.rolls}회</span><span class="m">💵 현재 주가 $${state.stockPrice}</span></div>${e.knownMeta?'':'<div class="approx">※ 이벤트 효과는 한글화 카드 자료 기준. 주가/주사위 메타는 카드 앞면 수치 자료가 없어 ALPHA 임시값입니다.</div>'}</div>`}
function playerHtml(p,i){const turn=state.current===i&&!state.over;return `<div class="player ${turn?'active':''} ${i===mySeat?'me':''}" style="border-top:5px solid ${playerColor(i)}"><div class="name">${esc(badges[p.id]?.text||'🥉')} ${esc(p.name)}${i===mySeat?' · 나':''}${i===state.first?' · ✈ 선':''}</div><small>${turn?'현재 처리 차례':'대기'} · 목적지 ${p.destinations.length} · 지시 ${p.directives.length}</small><div class="chips"><span class="chip cash">💵 ${money(p.money)}</span><span class="chip stock">📈 ${p.stock}주${p.directives.filter(x=>x==='secret').length?` +비밀${p.directives.filter(x=>x==='secret').length}`:''}</span><span class="chip income">수입 ${p.income}</span><span class="chip">🛫 항로 ${routeOwnerCount(state,i)}</span><span class="chip">🏢 공항 ${airportCount(state,i)}</span></div></div>`}
function phaseTitle(){if(state.over)return'게임 종료';if(state.phase==='eventChoice')return'이벤트 / 지시 카드 선택';if(state.phase==='engineer')return state.subphase==='priority'?'기술자 페이즈 · 우선 탑승':'기술자 페이즈 · 배치';if(state.phase==='resolution')return'해결 페이즈';if(state.phase==='panam')return'팬 암 페이즈 · 확장';if(state.phase==='stock')return'팬 암 페이즈 · 주식';return state.phase}
function statusHtml(){let msg='';const t=currentTask(state);if(state.over)msg='7라운드가 끝났습니다.';else if(state.phase==='eventChoice')msg=`${seatName(state.current)}의 이벤트/지시 선택을 기다리는 중입니다.`;else if(state.phase==='engineer')msg=`${seatName(state.current)} · ${state.subphase==='priority'?'E 지시에서 우선 탑승한 기술자를 A~D에 재배치':'남은 기술자 '+state.remaining[state.current]+'명'}`;else if(state.phase==='resolution'&&t)msg=`${seatName(t.seat)} · ${t.kind}${t.kind==='A'?' 공항':t.kind==='B'?' 목적지':t.kind==='C'?' 비행기':t.kind==='D'?' 항로':' 지시'} 액션 해결`;else if(state.phase==='panam'&&state.subphase==='offer')msg=`${seatName(state.current)} · 팬 암 주사위 제안: 항로 1개를 팔거나 넘기세요.`;else if(state.phase==='stock')msg=`${seatName(state.current)} · 주가 $${state.stockPrice} · 원하는 만큼 주식 구매`;return `<div class="status-box"><b><span class="badge phase">${esc(phaseTitle())}</span> ${state.current!=null?`${esc(seatName(state.current))} 차례`:''}</b><p>${esc(msg)}</p></div>`}
function bidTrackHtml(area,key,label,current,disabled=false){const cur=current?`${seatName(current.seat)} · $${current.bid}`:'비어 있음';return `<div class="occupant"><b>${esc(label)}</b> · ${esc(cur)}</div><div class="bid-track">${bidValues(area,key).map(v=>`<button class="bid ${current&&v>current.bid?'hot':''}" data-bid-area="${area}" data-bid-key="${key??''}" data-bid="${v}" ${(disabled||state.current!==mySeat||(current&&v<=current.bid))?'disabled':''}>$${v}</button>`).join('')}</div>`}
function engineerPanel(){if(state.phase!=='engineer')return'';const prio=state.subphase==='priority';const market=state.market;return `<div class="panel"><h3>👷 기술자 배치 ${prio?'<span class="badge">우선 탑승 · A~D만</span>':''}</h3><div class="action-grid"><div class="action-area"><h4>A · 공항</h4><div class="hint">해결 시 원하는 도시에 공항 배치 · 수입 +1</div>${bidTrackHtml('A',null,'공항',state.placements.A)}</div><div class="action-area"><h4>B · 목적지</h4><div class="hint">시장 카드 4장 각각 독립 입찰</div>${market.map((c,i)=>bidTrackHtml('B',i,c?CITY[c.city].name:`빈 칸 ${i+1}`,state.placements.B[i],!c)).join('')}</div><div class="action-area"><h4>C · 비행기</h4><div class="hint">비행거리 1~4 · 크루저 R3, 제트 R6부터</div>${PLANE_ORDER.map(t=>bidTrackHtml('C',t,`${PLANE[t].name} R${PLANE[t].range}`,state.placements.C[t],!planeUnlocked(state,t))).join('')}</div><div class="action-area"><h4>D · 항로</h4><div class="hint">해결 시 비행기+착륙권한으로 항로 개척</div><div class="worksite">${state.placements.D.map(seat=>`<span class="pawn p${seat}">${seat+1}</span>`).join('')||'<span class="subtle">비어 있음</span>'}</div><button class="btn primary" data-work="D" ${state.current===mySeat?'':'disabled'}>항로에 배치</button></div><div class="action-area"><h4>E · 지시</h4><div class="hint">지시 카드 1장 + 다음 라운드 우선 탑승</div><div class="worksite">${state.placements.E.map(seat=>`<span class="pawn p${seat}">${seat+1}</span>`).join('')||'<span class="subtle">비어 있음</span>'}</div><button class="btn primary" data-work="E" ${(state.current===mySeat&&!prio)?'':'disabled'}>지시에 배치</button></div></div>${!prio&&state.current===mySeat?'<div class="buttons"><button class="btn ghost" id="passEngineer">기술자 1명 패스</button></div>':''}</div>`}
function myDestinationsHtml(){const p=state.players[mySeat];return `<div class="panel"><h3>🧳 내 목적지 카드 <span class="badge">${p.destinations.length}장</span></h3><div class="market">${p.destinations.length?p.destinations.map(c=>`<div class="dest-card region-${CITY[c.city].region}"><b>${esc(CITY[c.city].name)}</b><small>${esc(REGIONS[CITY[c.city].region].name)} · 착륙 권한</small>${c.bonus?`<div class="bonus">획득 시 보너스 ${money(c.bonus)}</div>`:''}</div>`).join(''):'<div class="subtle">목적지 카드가 없습니다.</div>'}</div></div>`}
function marketHtml(){return `<div class="panel"><h3>🗺️ 공개 목적지 시장</h3><div class="market">${state.market.map((c,i)=>c?`<div class="dest-card region-${CITY[c.city].region}"><b>${i+1}. ${esc(CITY[c.city].name)}</b><small>${esc(REGIONS[CITY[c.city].region].name)}</small><div class="bonus">보너스 ${money(c.bonus||0)}</div></div>`:`<div class="dest-card"><b>${i+1}. 빈 칸</b></div>`).join('')}</div></div>`}
function fleetHtml(){const p=state.players[mySeat];return `<div class="panel"><h3>🛩️ 내 항공사</h3><div class="market">${PLANE_ORDER.map(t=>`<div class="dest-card"><b>${PLANE[t].name} · 비행거리 ${PLANE[t].range}</b><small>편대 ${p.fleet[t]}대 · 격납고 ${p.reserve[t]}대 ${planeUnlocked(state,t)?'':'· 🔒 잠김'}</small></div>`).join('')}</div><div class="rule-note" style="margin-top:8px">착륙 권한: 해당 도시에 내 공항 / 해당 도시 목적지 카드 보유 / 같은 지역 카드 1장 버림 / 다른 같은 지역 카드 2장 버림. BoardMate는 가능한 조합 중 버리는 카드 수가 가장 적은 조합을 자동 선택합니다.</div></div>`}
function directiveHandHtml(){const p=state.players[mySeat];return `<div class="panel"><h3>📜 내 지시 카드 <span class="badge">${p.directives.length}장</span></h3><div class="directive-hand">${p.directives.length?p.directives.map((id,i)=>{const d=DIRECTIVES[id],play=directivePlayable(state,mySeat,id);return `<div class="directive ${play?'playable':''} ${id==='secret'?'secret':''}"><div class="head">${esc(d.name)}</div><p>${esc(d.text)}</p><small>${esc(d.timing)}</small>${play?`<button class="btn gold tiny" data-directive="${i}" style="margin-top:6px">사용</button>`:''}</div>`}).join(''):'<div class="subtle">지시 카드가 없습니다.</div>'}</div>${p.peek?`<div class="rule-note" style="margin-top:8px"><b>🔮 예지</b> · 다음 라운드 이벤트: ${esc(EVENT[p.peek]?.title||'없음')} — ${esc(EVENT[p.peek]?.text||'')}</div>`:''}</div>`}
function resolutionControls(){const t=currentTask(state);if(state.phase!=='resolution'||!t)return'';const mine=t.seat===mySeat;let body='';if(t.kind==='A')body=`<p>입찰 $${t.bid}. 지도에서 공항이 없는 도시를 클릭하세요.</p>`;if(t.kind==='B'){const c=state.market[t.slot];body=`<p>${c?`${CITY[c.city].name} · 보너스 ${money(c.bonus||0)}`:'빈 목적지 칸'} · 입찰 $${t.bid}</p>${mine?'<button class="btn primary" id="resolveB">목적지 획득</button>':''}`};if(t.kind==='C')body=`<p>${PLANE[t.plane].name} · 비행거리 ${PLANE[t.plane].range} · 입찰 $${t.bid}</p>${mine?'<button class="btn primary" id="resolveC">비행기 획득</button>':''}`;if(t.kind==='D'){const modifier=state.players[t.seat].routeModifier;body=`<p>지도에서 개척 가능한 항로를 클릭하세요.${modifier?` · 지시 효과: ${modifier==='short'?'거리 1 자유 개척':'공항 인접 자유 개척'}`:''}</p>${mine?'<button class="btn ghost" id="skipD">항로 액션 포기</button>':''}`};if(t.kind==='E')body=`<p>지시 카드 1장을 뽑고 이 기술자는 다음 라운드 우선 탑승합니다.</p>${mine?'<button class="btn primary" id="resolveE">지시 카드 뽑기</button>':''}`;return `<div class="panel"><h3>✅ 해결 페이즈 · ${t.kind}</h3>${body}</div>`}
function eventChoiceControls(){if(state.phase!=='eventChoice')return'';const t=state.eventQueue[0],mine=t?.seat===mySeat;if(!t)return'';let body='';const own=myOwnedRoutes();const planeBtns=PLANE_ORDER.filter(x=>state.players[mySeat].fleet[x]>0).map(x=>`<button class="btn" data-ev-plane="${x}">${PLANE[x].name}</button>`).join('');
  if(t.type==='eventDirectiveWindow'||t.type==='panamDirectiveWindow')body=`<p>${t.type==='panamDirectiveWindow'?'팬 암 확장 전':'이벤트 처리 중'} 사용할 수 있는 지시 카드가 있으면 아래 카드 영역에서 사용하세요.</p>${mine?'<button class="btn primary" id="eventContinue">계속</button>':''}`;
  else if(t.type==='sellOrDraw')body=`<p>항로 1개를 팬 암에 팔거나 목적지 카드 1장을 뽑습니다.</p>${mine?`<button class="btn primary" data-event="draw">목적지 1장</button>${own.map(r=>`<button class="btn" data-event="sell" data-route-id="${r.id}">${routeName(r.id)} 매각</button>`).join('')}`:''}`;
  else if(t.type==='upgradeOrDraw')body=`<p>트리모터/클리퍼 업그레이드 또는 목적지 1장.</p>${mine?'<button class="btn" data-event="upgrade">업그레이드</button><button class="btn primary" data-event="draw">목적지 1장</button>':''}`;
  else if(t.type==='maybeSellPlane')body=`<p>비행기 1대를 $5에 팔 수 있습니다.</p>${mine?`${planeBtns}<button class="btn ghost" data-event="skip">넘기기</button>`:''}`;
  else if(t.type==='upgradeOrTrimotor')body=`<p>트리모터/클리퍼 업그레이드 또는 트리모터 1대 획득.</p>${mine?'<button class="btn" data-event="upgrade">업그레이드</button><button class="btn primary" data-event="trimotor">트리모터 1대</button>':''}`;
  else if(t.type==='maybeSellRoute')body=`<p>항로 1개를 팬 암에 팔 수 있습니다.</p>${mine?`${own.map(r=>`<button class="btn" data-event="sell" data-route-id="${r.id}">${routeName(r.id)} 매각</button>`).join('')}<button class="btn ghost" data-event="skip">넘기기</button>`:''}`;
  else if(t.type==='routeOrClipper')body=`<p>정상 규칙으로 항로 1개를 개척하거나 클리퍼 1대를 얻습니다.</p>${mine?'<button class="btn primary" data-event="clipper">클리퍼 1대</button><div class="subtle" style="margin-top:6px">항로를 고르려면 지도에서 초록색 항로를 클릭하세요.</div>':''}`;
  else if(t.type==='maybeUpgrade')body=`<p>비행기 1대를 업그레이드할 수 있습니다.</p>${mine?'<button class="btn" data-event="upgrade">업그레이드</button><button class="btn ghost" data-event="skip">넘기기</button>':''}`;
  else if(t.type==='maybePlaceAirport')body=`<p>공항을 무료로 배치할 수 있습니다. 지도에서 초록색 도시를 클릭하거나 넘기세요.</p>${mine?'<button class="btn ghost" data-event="skip">넘기기</button>':''}`;
  else if(t.type==='sellAll')body=`<p>팬 암 확장 전에 현재 보유한 모든 항로를 팬 암에게 팔 수 있습니다.</p>${mine?'<button class="btn red" data-event="yes">모두 매각</button><button class="btn ghost" data-event="skip">유지</button>':''}`;
  return `<div class="panel"><h3>🎴 이벤트 선택 · ${esc(seatName(t.seat))}</h3>${body}</div>`
}
function panamControls(){if(state.phase==='panam'&&state.subphase==='offer'){const mine=state.current===mySeat,own=myOwnedRoutes();return `<div class="panel"><h3>🌐 PAN AM 제안</h3><p class="subtle">주사위에 PAN AM이 나왔습니다. 각 플레이어는 항로 1개를 자유롭게 매각할 수 있습니다.</p>${mine?`<div class="buttons">${own.map(r=>`<button class="btn" data-pan-sell="${r.id}">${routeName(r.id)} · +${money(ROUTE_BONUS[r.d])}</button>`).join('')}<button class="btn ghost" id="panSkip">판매 안 함</button></div>`:''}</div>`}if(state.phase==='stock'){const p=state.players[mySeat],mine=state.current===mySeat,max=Math.min(Math.floor(p.money/state.stockPrice),state.stockSupply);return `<div class="panel"><h3>📈 주식 구매 · 현재 $${state.stockPrice}</h3><p class="subtle">선 플레이어부터 원하는 만큼 팬 암 주식을 구매합니다. 공급 ${state.stockSupply}주.</p>${mine?`<div class="buttons"><input id="stockQty" type="number" min="0" max="${max}" value="${Math.min(max,1)}" style="width:90px;border:1px solid #cbd5e1;border-radius:8px;padding:7px"><button class="btn primary" id="buyStock">구매 후 완료</button><button class="btn ghost" id="skipStock">0장 · 넘기기</button></div><div class="subtle">최대 ${max}장 구매 가능 · 보유 현금 ${money(p.money)}</div>`:''}</div>`}return''}
function pendingChoiceModal(){const c=state.pendingChoice;if(!c||c.seat!==mySeat)return'';let body='';if(c.type==='lucky')body=`<h3>행운권 · 목적지 1장 선택</h3><div class="choice-grid">${c.cards.map((x,i)=>`<button class="btn citypick" data-pending-index="${i}">${CITY[x.city].name} · 보너스 ${money(x.bonus||0)}</button>`).join('')}</div>`;if(c.type==='opportunity')body=`<h3>새로운 기회 · 새 시장 보너스 1개 선택</h3><div class="choice-grid">${state.market.map((x,i)=>`<button class="btn citypick" data-pending-index="${i}">${CITY[x.city].name} · ${money(x.bonus||0)}</button>`).join('')}</div>`;if(c.type==='sellPlane4')body=`<h3>비행기 판매 · $4</h3><div class="choice-grid">${PLANE_ORDER.filter(t=>state.players[mySeat].fleet[t]>0).map(t=>`<button class="btn" data-pending-plane="${t}">${PLANE[t].name} · 편대 ${state.players[mySeat].fleet[t]}대</button>`).join('')}</div>`;if(c.type==='upgradePlane')body=`<h3>업그레이드</h3><div class="choice-grid">${PLANE_ORDER.slice(0,-1).filter(t=>{const n=PLANE_ORDER[PLANE_ORDER.indexOf(t)+1];return state.players[mySeat].fleet[t]>0&&state.players[mySeat].reserve[n]>0&&planeUnlocked(state,n)}).map(t=>`<button class="btn" data-pending-plane="${t}">${PLANE[t].name} → ${PLANE[PLANE_ORDER[PLANE_ORDER.indexOf(t)+1]].name}</button>`).join('')||'<div class="subtle">업그레이드 가능한 비행기가 없습니다.</div>'}</div>`;if(c.type==='regionalAirport')body=`<h3>지역 공항 · $2</h3><p class="subtle">지도에서 공항이 없는 도시를 클릭하세요.</p>`;if(c.type==='advisoryRoute')body=`<h3>팬 암 자문위원회</h3><div class="choice-grid">${myOwnedRoutes().map(r=>`<button class="btn" data-pending-route="${r.id}">${routeName(r.id)} · +${money(ROUTE_BONUS[r.d])}</button>`).join('')||'<div class="subtle">판매할 항로가 없습니다.</div>'}</div>`;return `<div class="modal"><div class="modal-card">${body}</div></div>`}
function finalHtml(){if(!state.over)return'';const myPlace=state.finalOrder.indexOf(mySeat)+1;return `<div class="panel final"><h2>🏆 최종 결과</h2>${state.finalOrder.map((seat,n)=>{const p=state.players[seat];return `<div style="display:flex;justify-content:space-between;border-bottom:1px solid #e5d49e;padding:7px 0"><b>${n+1}위 · ${esc(p.name)}${seat===mySeat?' · 나':''}</b><span>${finalStockOf(p)}주 · ${money(p.money)}</span></div>`}).join('')}</div>${endPanel('팬 암 최종 결과','7라운드 종료 · 팬 암 주식 수 → 남은 돈 순으로 순위를 확정합니다.')}`}
function render(){if(!state){app.innerHTML='<div class="subtle">방장이 게임 상태를 초기화할 때까지 기다리는 중입니다.</div>';return}roomBack.href=`./index.html#/room/${encodeURIComponent(roomId)}`;app.className='';app.innerHTML=`<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap"><div><h2 style="margin:0">✈️ ${esc(room.title||'팬 암')}</h2><div class="source-note">2–4인 · 7라운드 · 기술자 배치/입찰 · 항로 개척 · 팬 암 확장 · 주식 경쟁 · <b>ALPHA</b></div></div><div><span class="badge alpha">ALPHA</span> <span class="badge">Round ${state.round}/7</span></div></div><div class="players" style="margin-top:9px">${state.players.map(playerHtml).join('')}</div></div>${statusHtml()}<div class="layout" style="margin-top:10px"><section class="stack"><div class="board-shell">${mapSvg()}<div class="legend"><span class="s"><i></i>남아메리카 확장</span><span class="e"><i></i>유럽 확장</span><span class="a"><i></i>아시아-태평양 확장</span><span class="p"><i></i>PAN AM 소유</span></div></div>${engineerPanel()}${resolutionControls()}${eventChoiceControls()}${panamControls()}${directiveHandHtml()}${myDestinationsHtml()}${finalHtml()}</section><aside class="stack">${eventHtml()}${marketHtml()}${fleetHtml()}<div class="panel"><h3>📊 빠른 참조</h3><div class="rule-note"><b>항로 매각 보너스</b><br>거리 1 = $5 · 거리 2 = $9 · 거리 3 = $12 · 거리 4 = $14<br><b>라운드 순서</b><br>1 이벤트 → 2 기술자 → 3 해결 A→E → 4 팬 암(확장→수입→주식)<br><b>기술 해금</b><br>라운드 3 크루저 · 라운드 6 제트<br><b>입찰칸</b><br>공항 $3/$5/$7/$9 · 목적지 $0/$2/$4/$6 · 트리모터 $0/$2/$4/$6 · 클리퍼 $2/$4/$6/$8</div></div><div class="panel"><h3>📝 게임 로그</h3><div class="log">${state.logs.map(x=>`<div>${esc(x)}</div>`).join('')}</div></div><div class="panel source-note"><b>구현 기준</b><br>업로드된 「PA_Instructions_KR.pdf」와 「이벤트,지시 카드 한글화」의 규칙/문구를 우선 반영했습니다. 원본 보드·카드 이미지는 복제하지 않고 BoardMate용 추상 지도/UI로 재구성했습니다. 이벤트 카드의 개별 주가/주사위 수치와 목적지 카드별 보너스는 제공 자료에 전체 앞면 수치가 없어 ALPHA 임시값입니다. 크루저·제트 입찰칸도 셋업 이미지에서 타일에 가려져 단계형 임시값을 사용합니다.</div></aside></div>${pendingChoiceModal()}`;bind()}
function bind(){
  document.querySelector('#cancelBtn').onclick=()=>openCancelVotePanel();
  document.querySelectorAll('[data-bid-area]').forEach(b=>b.onclick=()=>mutate(s=>placeBidEngineer(s,mySeat,b.dataset.bidArea,b.dataset.bidKey===''?null:(b.dataset.bidArea==='B'?Number(b.dataset.bidKey):b.dataset.bidKey),Number(b.dataset.bid))));
  document.querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>mutate(s=>placeWorksite(s,mySeat,b.dataset.work)));
  document.querySelector('#passEngineer')?.addEventListener('click',()=>mutate(s=>passEngineer(s,mySeat)));
  document.querySelector('#resolveB')?.addEventListener('click',()=>mutate(s=>resolveDestination(s,mySeat)));
  document.querySelector('#resolveC')?.addEventListener('click',()=>mutate(s=>resolvePlane(s,mySeat)));
  document.querySelector('#skipD')?.addEventListener('click',()=>mutate(s=>skipRouteTask(s,mySeat)));
  document.querySelector('#resolveE')?.addEventListener('click',()=>mutate(s=>resolveDirectiveTask(s,mySeat)));
  document.querySelectorAll('[data-directive]').forEach(b=>b.onclick=()=>mutate(s=>playDirective(s,mySeat,Number(b.dataset.directive))));
  document.querySelector('#eventContinue')?.addEventListener('click',()=>mutate(s=>eventChoiceAction(s,mySeat,'continue')));
  document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{const action=b.dataset.event,p={};if(b.dataset.routeId)p.route=b.dataset.routeId;if(action==='sell'&&!p.route)return;mutate(s=>eventChoiceAction(s,mySeat,action,p))});
  document.querySelectorAll('[data-ev-plane]').forEach(b=>b.onclick=()=>mutate(s=>eventChoiceAction(s,mySeat,'sell',{type:b.dataset.evPlane})));
  document.querySelectorAll('[data-route]').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.route;if(!routeSelectableForTask(ROUTE[id]))return;if(state.pendingChoice?.seat===mySeat&&state.pendingChoice.type==='advisoryRoute')return mutate(s=>resolvePendingChoice(s,mySeat,{route:id}));if(state.phase==='eventChoice'&&state.current===mySeat){const t=state.eventQueue[0];if(['sellOrDraw','maybeSellRoute'].includes(t?.type))return mutate(s=>eventChoiceAction(s,mySeat,'sell',{route:id}));if(t?.type==='routeOrClipper')return mutate(s=>eventChoiceAction(s,mySeat,'route',{route:id}))}if(state.phase==='panam'&&state.subphase==='offer'&&state.current===mySeat)return mutate(s=>panamOfferChoice(s,mySeat,id));const t=currentTask(state);if(state.phase==='resolution'&&t?.kind==='D'&&t.seat===mySeat)return mutate(s=>claimRoute(s,mySeat,id,{modifier:s.players[mySeat].routeModifier}))}));
  document.querySelectorAll('[data-city]').forEach(el=>el.addEventListener('click',()=>{const city=el.dataset.city;if(!citySelectable(CITY[city]))return;if(state.pendingChoice?.seat===mySeat&&state.pendingChoice.type==='regionalAirport')return mutate(s=>resolvePendingChoice(s,mySeat,{city}));if(state.phase==='eventChoice'&&state.current===mySeat&&state.eventQueue[0]?.type==='maybePlaceAirport')return mutate(s=>eventChoiceAction(s,mySeat,'airport',{city}));const t=currentTask(state);if(t?.kind==='A'&&t.seat===mySeat)return mutate(s=>resolveAirport(s,mySeat,city))}));
  document.querySelectorAll('[data-pan-sell]').forEach(b=>b.onclick=()=>mutate(s=>panamOfferChoice(s,mySeat,b.dataset.panSell)));
  document.querySelector('#panSkip')?.addEventListener('click',()=>mutate(s=>panamOfferChoice(s,mySeat,null)));
  document.querySelector('#buyStock')?.addEventListener('click',()=>{const q=Number(document.querySelector('#stockQty')?.value||0);mutate(s=>buyStockAndPass(s,mySeat,q))});
  document.querySelector('#skipStock')?.addEventListener('click',()=>mutate(s=>buyStockAndPass(s,mySeat,0)));
  document.querySelectorAll('[data-pending-index]').forEach(b=>b.onclick=()=>mutate(s=>resolvePendingChoice(s,mySeat,{index:Number(b.dataset.pendingIndex)})));
  document.querySelectorAll('[data-pending-plane]').forEach(b=>b.onclick=()=>mutate(s=>resolvePendingChoice(s,mySeat,{type:b.dataset.pendingPlane})));
  document.querySelectorAll('[data-pending-route]').forEach(b=>b.onclick=()=>mutate(s=>resolvePendingChoice(s,mySeat,{route:b.dataset.pendingRoute})));
}
async function onRow(row){if(!row)return;revision=Number(row.revision||0);if(row.state){state=row.state;render();if(state.over)void maybeSubmit()}}
async function boot(){
  if(!configured()||!roomId)showFatal('BoardMate 다인플 방에서 팬 암을 열어주세요.');me=await getMe();if(!me)showFatal('로그인이 필요합니다.');({room,members}=await loadRoom());if(room.game!==GAME)showFatal('팬 암 방이 아닙니다.');members=members.slice().sort((a,b)=>a.seat-b.seat);const mm=members.find(m=>m.user_id===me.user_id);if(!mm)showFatal('이 방의 참가자가 아닙니다.');if(members.length<2||members.length>4)showFatal('팬 암은 2~4인 게임입니다.');mySeat=Number(mm.seat);badges=await ratingBadges(GAME,members.map(m=>m.user_id)).catch(()=>({}));const row=await loadState();revision=Number(row?.revision||0);state=row?.state||null;if(!state&&room.host_id===me.user_id){state=initialState();revision=Number(await saveState(revision,state))}render();stopPoll=startStatePoll(onRow,{interval:7000});setInterval(()=>void touchPresence(true),15000)
}
boot().catch(e=>{console.error(e);showFatal(e.message||'팬 암을 열 수 없습니다.')});window.addEventListener('beforeunload',()=>stopPoll?.());
</script>
