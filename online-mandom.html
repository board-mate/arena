<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BoardMate Online · 맨덤의 던전</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<style>
/* ── 토큰 ─────────────────────────────────────────────── */
:root {
  --bg:       #0d0a12;
  --bg2:      #17111f;
  --bg3:      #221830;
  --border:   #3a2a52;
  --accent:   #c94040;
  --gold:     #e8c84a;
  --muted:    #8878a8;
  --text:     #ede8f5;
  --text2:    #b8aed4;
  --green:    #4ecb71;
  --radius:   12px;
  font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif;
  color: var(--text);
  background: var(--bg);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); }
button { font: inherit; cursor: pointer; border: none; border-radius: 8px; }

/* ── 상단 바 ──────────────────────────────────────────── */
.bar {
  position: sticky; top: 0; z-index: 30;
  background: #09060f;
  padding: 10px 16px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--border);
}
.bar a { color: var(--text); text-decoration: none; font-weight: 700; font-size: 13px; }
#bar-title { font-weight: 900; font-size: 15px; color: var(--gold); letter-spacing: .02em; }
#sync { font-size: 11px; color: var(--muted); }

/* ── 레이아웃 ─────────────────────────────────────────── */
.wrap { width: min(960px, calc(100% - 24px)); margin: 16px auto; }
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}

/* ── 버튼 ─────────────────────────────────────────────── */
.btn { padding: 10px 18px; font-weight: 800; font-size: 13px; }
.btn-primary  { background: var(--accent); color: #fff; }
.btn-gold     { background: var(--gold); color: #1a1200; }
.btn-ghost    { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
.btn-danger   { background: #6e1c1c; color: #fbb; border: 1px solid #9b2c2c; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn:hover:not(:disabled) { filter: brightness(1.12); }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* ── 세팅 화면 ────────────────────────────────────────── */
.setup { text-align: center; padding: 24px; }
.setup h2 { font-size: 22px; color: var(--gold); margin-bottom: 8px; }
.setup p { color: var(--text2); font-size: 13px; line-height: 1.7; margin-bottom: 16px; }

/* ── 플레이어 패널 ────────────────────────────────────── */
.players-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 10px;
}
.player-panel {
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  background: var(--bg3);
  transition: border-color .2s;
}
.player-panel.is-challenger { border-color: var(--gold); box-shadow: 0 0 18px #e8c84a28; }
.player-panel.is-me { border-color: #5c4ea0; }
.player-panel.eliminated { opacity: .45; }
.player-panel h3 { font-size: 14px; margin-bottom: 6px; }
.status-badge {
  display: inline-block;
  font-size: 10px; font-weight: 900;
  padding: 2px 7px; border-radius: 999px;
  margin-top: 4px;
}
.badge-fresh    { background: #1c3a2a; color: #5ddb8e; }
.badge-used     { background: #3a2004; color: #f0a34a; }
.badge-dead     { background: #3a0a0a; color: #e07070; }
.badge-winner   { background: #1a1500; color: var(--gold); }
.badge-passed   { background: #222; color: var(--muted); }
.badge-dungeon  { background: #2e0b1a; color: var(--accent); }

/* ── 아이템 타일 ──────────────────────────────────────── */
.items-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.item-tile {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px;
  background: var(--bg3);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 10px 10px 8px;
  min-width: 72px;
  font-size: 22px;
  cursor: pointer;
  transition: border-color .15s, transform .15s;
  position: relative;
}
.item-tile:hover:not(.removed):not(.used-tile) { border-color: var(--gold); transform: translateY(-3px); }
.item-tile.removed { opacity: .25; cursor: default; pointer-events: none; }
.item-tile.used-tile { opacity: .35; cursor: default; }
.item-tile small { font-size: 10px; color: var(--text2); font-weight: 700; text-align: center; line-height: 1.3; }

/* ── 던전 카드 더미 ───────────────────────────────────── */
.dungeon-area {
  display: flex; align-items: center; gap: 16px;
  flex-wrap: wrap;
}
.dungeon-pile {
  position: relative;
  width: 80px; height: 110px;
}
.dungeon-card-back {
  position: absolute;
  width: 80px; height: 110px;
  border-radius: 8px;
  background: linear-gradient(135deg, #2a1040, #1a0820);
  border: 2px solid var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  color: var(--accent);
  box-shadow: 0 4px 16px #c9404033;
}
.dungeon-card-back.stacked { top: -4px; left: 4px; z-index: 0; opacity: .5; }
.dungeon-card-back.main { z-index: 1; }

.draw-deck-area {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.deck-pile {
  position: relative; width: 72px; height: 100px;
}
.deck-back {
  position: absolute;
  width: 72px; height: 100px; border-radius: 8px;
  background: linear-gradient(135deg, #1a0838, #0d0620);
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; color: var(--muted);
}
.deck-back.stk { top: -3px; left: 3px; z-index: 0; opacity: .4; }

/* ── 몬스터 카드 (공개) ───────────────────────────────── */
.monster-card {
  border-radius: 10px;
  padding: 12px 10px;
  min-width: 90px;
  text-align: center;
  background: var(--bg3);
  border: 1.5px solid var(--border);
}
.monster-card .m-power { font-size: 22px; font-weight: 900; color: var(--accent); }
.monster-card .m-name  { font-size: 11px; color: var(--text2); margin: 4px 0 6px; font-weight: 700; }
.monster-card .m-icons { font-size: 14px; display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.monster-card.blocked  { border-color: var(--green); background: #0a2018; }
.monster-card.hit      { border-color: var(--accent); background: #200a0a; }
.monster-card.named    { border-color: var(--gold); background: #1a1500; }

/* ── 행동 선택 (내 턴) ───────────────────────────────── */
.my-turn-box {
  background: #1a0a2e;
  border: 2px solid #5c4ea0;
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}
.my-turn-box h3 { color: var(--gold); margin-bottom: 10px; font-size: 15px; }

/* ── 로그 ─────────────────────────────────────────────── */
.log-box {
  max-height: 150px; overflow-y: auto;
  background: #07050e;
  border-radius: 10px; padding: 10px;
  font-size: 11px; color: var(--text2);
  line-height: 1.7;
}
.log-box div::before { content: '▸ '; color: var(--muted); }

/* ── HP 바 ────────────────────────────────────────────── */
.hp-bar-wrap { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
.hp-bar-bg { flex: 1; height: 10px; background: #2a1838; border-radius: 5px; overflow: hidden; }
.hp-bar-fill { height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--green), #2a9a4a); transition: width .4s; }
.hp-bar-fill.low { background: linear-gradient(90deg, #e05050, #a02020); }
.hp-label { font-size: 13px; font-weight: 900; color: var(--text); min-width: 54px; }

/* ── 결과 패널 ───────────────────────────────────────── */
.result-panel {
  text-align: center; padding: 24px;
  border-radius: var(--radius);
  background: var(--bg2);
  border: 2px solid var(--border);
  margin-bottom: 12px;
}
.result-panel.win  { border-color: var(--gold); background: #120f02; }
.result-panel.lose { border-color: var(--accent); background: #120202; }
.result-panel h2 { font-size: 26px; margin-bottom: 8px; }
.result-panel p  { color: var(--text2); font-size: 13px; }

/* ── 알림 배너 ───────────────────────────────────────── */
.turn-order{display:grid;gap:7px;margin:12px auto;max-width:520px}.turn-order-row{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:8px 10px;text-align:left}.turn-order-row .ord{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#201500;font-weight:950}.turn-order-row .nm{flex:1;font-weight:850}.private-card{margin-top:12px;padding:14px;border:2px solid var(--gold);border-radius:14px;background:#171006;text-align:center}.private-card .monster-power{font-size:34px;font-weight:950;color:var(--accent)}.private-card .private-badge{font-size:11px;color:#ffd879;font-weight:900}.monster-list-card{margin-top:8px;border:2px solid #4b3a60;border-radius:10px;padding:7px 9px;font-size:11px;background:#120d19}.monster-list-card.warning{border-color:#d74b4b;background:#240b0b;color:#ffb5b5}.monster-list-card.dead{border-color:#6f1c1c;background:#090606;color:#a66;text-decoration:line-through}.own-secret{margin-top:8px;font-size:11px;color:#c9bdd8;line-height:1.55}

.notice {
  background: #2a1838; border: 1px solid #5c4ea0;
  border-radius: 8px; padding: 10px 14px;
  font-size: 12px; color: var(--text2);
  line-height: 1.6; margin: 8px 0;
}

/* ── 보검 모달 ───────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; background: #00000099;
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
}
.modal-box {
  background: var(--bg2); border: 2px solid var(--border);
  border-radius: var(--radius); padding: 24px; max-width: 380px; width: 90%;
}
.modal-box h3 { color: var(--gold); margin-bottom: 12px; }
.modal-box .monster-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.modal-box .monster-btns button {
  padding: 8px 12px; font-size: 12px; font-weight: 700;
  background: var(--bg3); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
}
.modal-box .monster-btns button:hover { border-color: var(--gold); color: var(--gold); }

/* ── 반응형 ───────────────────────────────────────────── */
@media(max-width:560px) {
  .players-grid { grid-template-columns: 1fr; }
  .item-tile { min-width: 60px; font-size: 18px; }
}
</style>
</head>
<body>

<header class="bar">
  <span style="display:flex;gap:8px">
    <a href="./index.html#/">← 홈</a>
    <a href="./index.html#/multi">다인플</a>
  </span>
  <span id="bar-title">⚔️ 맨덤의 던전</span>
  <span id="sync">연결 중…</span>
</header>

<main class="wrap">
  <div id="app">불러오는 중…</div>
</main>

<!-- 보검 선언 모달 -->
<div id="sword-modal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <h3>⚔️ 용사의 검 — 몬스터 선언</h3>
    <p style="font-size:12px;color:var(--text2);margin-bottom:14px">던전에 입장하기 전, 무찌를 몬스터 한 종류를 선언하세요. 해당 몬스터가 던전에 있으면 피해를 받지 않습니다.</p>
    <div class="monster-btns" id="sword-monster-list"></div>
    <div style="text-align:center;margin-top:14px">
      <button class="btn btn-ghost" id="sword-cancel-btn" style="font-size:12px">취소</button>
    </div>
  </div>
</div>

<script type="module">
import {
  configured, roomId, getMe, loadRoom, loadState, saveState,
  startStatePoll, esc, showFatal, endPanel
} from './multi-common.js';

if (!configured() || !roomId) showFatal('Supabase 설정 또는 room 주소가 없습니다.');

// ── 상수 ──────────────────────────────────────────────────
const MONSTERS = [
  { id:'goblin1',  name:'고블린 ①', power:1,  icons:['torch'] },
  { id:'goblin2',  name:'고블린 ②', power:1,  icons:['torch'] },
  { id:'skeleton1',name:'스켈레톤 ①', power:2, icons:['torch','grail'] },
  { id:'skeleton2',name:'스켈레톤 ②', power:2, icons:['torch','grail'] },
  { id:'ork1',     name:'오크 ①',   power:3,  icons:['torch'] },
  { id:'ork2',     name:'오크 ②',   power:3,  icons:['torch'] },
  { id:'vampire1', name:'뱀파이어 ①',power:4, icons:['grail'] },
  { id:'vampire2', name:'뱀파이어 ②',power:4, icons:['grail'] },
  { id:'golem1',   name:'골렘 ①',   power:5,  icons:[] },
  { id:'golem2',   name:'골렘 ②',   power:5,  icons:[] },
  { id:'lich',     name:'리치',      power:6,  icons:['grail'] },
  { id:'demon',    name:'데몬',      power:7,  icons:[] },
  { id:'dragon',   name:'드래곤',    power:9,  icons:['lance'] },
];

// 아이템 정의
const ITEMS = [
  { id:'torch',  emoji:'🔦', name:'횃불',     desc:'공격력 3 미만 몬스터 무력화 (고블린·스켈레톤·오크)' },
  { id:'grail',  emoji:'🏆', name:'성배',     desc:'짝수 번호 언데드 무력화 (스켈레톤·뱀파이어·리치)' },
  { id:'lance',  emoji:'🗡️', name:'창',       desc:'드래곤 무력화' },
  { id:'sword',  emoji:'⚔️', name:'용사의 검',desc:'입장 전 몬스터 1종 선언 → 무력화' },
  { id:'shield', emoji:'🛡️', name:'방패',     desc:'HP +3' },
  { id:'armor',  emoji:'🥻', name:'갑옷',     desc:'HP +5' },
];

const ICON_MAP = { torch:'🔦', grail:'🏆', lance:'🗡️' };
const BASE_HP = 3;

// ── 유틸 ──────────────────────────────────────────────────
const clone   = x => JSON.parse(JSON.stringify(x));
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}; return a; };
const esc2    = s => String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

function itemBlocks(monster, equippedItems) {
  // torch: power < 3 → 고블린(1), 스켈레톤(2) — 실제 룰: torch = 공격력 2 이하
  // 룰북 v1.1: torch = power < 3 (1,2 해당)
  if (equippedItems.includes('torch') && monster.power < 3) return true;
  if (equippedItems.includes('grail') && monster.icons.includes('grail')) return true;
  if (equippedItems.includes('lance') && monster.icons.includes('lance')) return true;
  return false;
}

function calcHP(equippedItems) {
  let hp = BASE_HP;
  if (equippedItems.includes('shield')) hp += 3;
  if (equippedItems.includes('armor'))  hp += 5;
  return hp;
}

// ── 초기 상태 ─────────────────────────────────────────────
function setupState() {
  return { kind: 'mandom-v2', setup: true, over: false, turnOrder: members.map((_,i)=>i), pendingDraws:{} };
}

function createGame() {
  const deck = shuffle(MONSTERS.map(m => m.id));
  return {
    kind: 'mandom-v2',
    setup: false,
    over: false,
    winner: null,
    // 전역 상태
    equippedItems: ITEMS.map(i => i.id),  // 현재 라운드 장착 아이템
    dungeon: [],       // 던전에 쌓인 몬스터 id 배열
    drawDeck: deck,    // 뽑을 덱
    withheld: {},      // { seat: [ {card, item} ] } — 제거된 카드+아이템
    pendingDraws: {},   // seat -> 이번 턴에 본 몬스터. 화면에는 해당 플레이어에게만 표시
    turnOrder: [],      // 플레이어들이 합의한 라운드 순서(seat 배열)
    // 플레이어 상태
    players: [],       // 세팅 후 채움
    currentTurn: 0,    // 현재 행동할 seat
    passed: [],        // 패스한 seat 목록
    challenger: null,  // 던전에 입장한 seat
    phase: 'betting',  // 'betting' | 'challenge' | 'resolve' | 'roundend'
    namedMonster: null,// 보검 선언 몬스터 id
    // 라운드 내 공개 목록 (challenge 단계)
    revealedCards: [], // { id, blocked, namedHit, damage }
    heroHP: BASE_HP,   // 현재 HP
    maxHP: BASE_HP,
    // 점수: { seat: { wins, lives } }  lives: 0=fresh, 1=용사의죽음한번, 2=탈락
    scores: {},
    // 라운드
    round: 1,
    logs: ['게임 시작! 첫 라운드가 시작됩니다.'],
  };
}

// ── 전역 변수 ──────────────────────────────────────────────
let me, room, members, mySeat = -1;
let state = null, revision = 0, saving = false;
let pendingSwordResolve = null;

// ── 상태 저장/갱신 ─────────────────────────────────────────
async function mutate(fn) {
  if (saving || !state) return;
  saving = true;
  const next = clone(state);
  try {
    fn(next);
    const nr = await saveState(revision, next);
    revision = nr;
    state = next;
    render();
    syncLabel('저장됨');
  } catch(e) {
    syncLabel('재동기화 중…');
    const row = await loadState();
    revision = row.revision; state = row.state;
    render();
  } finally { saving = false; }
}

function syncLabel(t) { document.querySelector('#sync').textContent = t; }

// ── 게임 시작 전 순서 정하기 ───────────────────────────────
function moveSetupOrder(seat,delta){
  if(room.host_id!==me.user_id||!state?.setup)return;
  mutate(s=>{
    const order=Array.isArray(s.turnOrder)&&s.turnOrder.length? [...s.turnOrder] : members.map((_,i)=>i);
    const idx=order.indexOf(Number(seat)),ni=idx+Number(delta);
    if(idx<0||ni<0||ni>=order.length)return;
    [order[idx],order[ni]]=[order[ni],order[idx]];s.turnOrder=order;
  });
}

// ── 게임 시작 (방장만) ────────────────────────────────────
function startGame() {
  if (room.host_id !== me.user_id || !state.setup) return;
  mutate(s => {
    const agreedOrder=(Array.isArray(s.turnOrder)&&s.turnOrder.length===members.length)?[...s.turnOrder]:members.map((_,i)=>i);
    Object.keys(s).forEach(k => delete s[k]);
    Object.assign(s, createGame());
    s.turnOrder=agreedOrder;
    // 플레이어 초기화
    s.players = members.map((m, i) => ({
      user_id: m.user_id,
      seat: i,
      wins: 0,
      lives: 0,   // 0=fresh, 1=한번사망, 2=탈락
    }));
    s.scores = Object.fromEntries(members.map((m,i) => [i, {wins:0, lives:0}]));
    s.currentTurn = s.turnOrder[0] ?? 0;
    s.passed = [];
  });
}

// ── 라운드 리셋 ───────────────────────────────────────────
function resetRound(s) {
  const previousChallenger=s.challenger;
  s.equippedItems = ITEMS.map(i => i.id);
  s.dungeon = [];
  s.drawDeck = shuffle(MONSTERS.map(m => m.id));
  s.withheld = {};
  s.pendingDraws = {};
  s.passed = [];
  s.challenger = null;
  s.phase = 'betting';
  s.namedMonster = null;
  s.revealedCards = [];
  s.heroHP = BASE_HP;
  s.maxHP = BASE_HP;
  s.round++;
  const aliveSet=new Set(s.players.filter(p => p.lives < 2).map(p => p.seat));
  const order=(Array.isArray(s.turnOrder)&&s.turnOrder.length?s.turnOrder:s.players.map(p=>p.seat)).filter(x=>aliveSet.has(x));
  if (!order.length) return;
  const prevIdx=order.indexOf(previousChallenger);
  s.currentTurn=order[(prevIdx>=0?prevIdx+1:0)%order.length];
  s.logs.unshift(`── ${s.round}라운드 시작 · 순서 ${order.map(x=>members[x]?.nickname||x+1).join(' → ')}`);
}

// ── 승리/탈락 체크 ────────────────────────────────────────
function checkEnd(s) {
  const alive = s.players.filter(p => p.lives < 2);
  if (alive.length === 1) {
    s.over = true; s.winner = alive[0].seat;
    s.phase = 'roundend';
    s.logs.unshift(`🏆 ${members[alive[0].seat].nickname} 최후 생존자 승리!`);
    return true;
  }
  const winners = alive.filter(p => p.wins >= 2);
  if (winners.length > 0) {
    const w = winners[0];
    s.over = true; s.winner = w.seat;
    s.phase = 'roundend';
    s.logs.unshift(`🏆 ${members[w.seat].nickname} 던전 2회 정복 승리!`);
    return true;
  }
  return false;
}

// ── 플레이어 행동: 카드 뽑기 → 던전에 넣기 ───────────────
function actionDrawMonster(){
  mutate(s=>{
    if(s.phase!=='betting'||s.currentTurn!==mySeat||s.pendingDraws?.[mySeat]||!s.drawDeck.length)return;
    s.pendingDraws=s.pendingDraws||{};
    s.pendingDraws[mySeat]=s.drawDeck.shift();
    s.logs.unshift(`${members[mySeat].nickname} → 몬스터 카드 1장을 뽑아 확인`);
  });
}

// 본 카드를 던전에 놓는다.
function actionPlaceToDungeon() {
  mutate(s => {
    if (s.phase !== 'betting' || s.currentTurn !== mySeat) return;
    const card=s.pendingDraws?.[mySeat]; if(!card)return;
    s.dungeon.push(card); delete s.pendingDraws[mySeat];
    s.logs.unshift(`${members[mySeat].nickname} → 확인한 몬스터를 던전에 추가 (${s.dungeon.length}장)`);
    advanceTurn(s);
  });
}

// 본 카드를 자기 앞에 두고 장비 토큰 하나를 함께 가져온다.
function actionRemoveItem(itemId) {
  mutate(s => {
    if (s.phase !== 'betting' || s.currentTurn !== mySeat) return;
    const card=s.pendingDraws?.[mySeat]; if(!card)return;
    if (!s.equippedItems.includes(itemId)) return;
    s.equippedItems = s.equippedItems.filter(x => x !== itemId);
    if (!s.withheld[mySeat]) s.withheld[mySeat] = [];
    s.withheld[mySeat].push({ card, item: itemId }); delete s.pendingDraws[mySeat];
    const item = ITEMS.find(x => x.id === itemId);
    s.logs.unshift(`${members[mySeat].nickname} → 몬스터 1장과 [${item.name}]을 자기 앞에 가져감`);
    advanceTurn(s);
  });
}

// ── 패스 ─────────────────────────────────────────────────
function actionPass() {
  mutate(s => {
    if (s.phase !== 'betting' || s.currentTurn !== mySeat || s.pendingDraws?.[mySeat]) return;
    if (!s.passed.includes(mySeat)) s.passed.push(mySeat);
    s.logs.unshift(`${members[mySeat].nickname} → 패스`);
    advanceTurn(s);
  });
}

// ── 턴 진행 로직 ──────────────────────────────────────────
function advanceTurn(s) {
  const aliveSet=new Set(s.players.filter(p => p.lives < 2).map(p => p.seat));
  const order=(Array.isArray(s.turnOrder)&&s.turnOrder.length?s.turnOrder:s.players.map(p=>p.seat)).filter(x=>aliveSet.has(x));
  const remaining = order.filter(x => !s.passed.includes(x));

  // 다른 플레이어가 모두 패스하여 한 명만 남으면 그 플레이어가 용사다.
  if (remaining.length === 1) { enterDungeon(s, remaining[0]); return; }
  if (remaining.length === 0) return;

  let idx = order.indexOf(s.currentTurn), attempts = 0;
  do { idx = (idx + 1) % order.length; attempts++; }
  while (s.passed.includes(order[idx]) && attempts <= order.length);
  s.currentTurn = order[idx];
}

// ── 던전 입장 ─────────────────────────────────────────────
function enterDungeon(s, seat) {
  s.challenger = seat;
  s.phase = 'challenge';
  s.maxHP = calcHP(s.equippedItems);
  s.heroHP = s.maxHP;
  s.logs.unshift(`⚔️ ${members[seat].nickname} 던전에 입장! HP: ${s.maxHP}`);
  // 보검이 장착돼 있으면 선언 단계 필요 → 클라이언트에서 처리
  // phase를 'sword' 로 설정해 선언을 기다림
  if (s.equippedItems.includes('sword')) {
    s.phase = 'sword';
    s.logs.unshift('용사의 검 → 몬스터를 선언하세요!');
  }
}

// ── 보검 선언 ─────────────────────────────────────────────
function actionNameMonster(monsterId) {
  mutate(s => {
    if (s.phase !== 'sword' || s.challenger !== mySeat) return;
    s.namedMonster = monsterId;
    const m = MONSTERS.find(x => x.id === monsterId);
    s.phase = 'challenge';
    s.logs.unshift(`용사의 검: "${m.name}" 선언`);
  });
}

// ── 던전 카드 한 장 공개 ──────────────────────────────────
function revealNextCard() {
  mutate(s => {
    if (s.phase !== 'challenge' || s.challenger !== mySeat) return;
    if (s.dungeon.length === 0) {
      // 모두 공개 → 생존 성공
      dungeonSuccess(s);
      return;
    }
    const cardId = s.dungeon.shift();
    const monster = MONSTERS.find(x => x.id === cardId);
    const blocked = itemBlocks(monster, s.equippedItems);
    const namedHit = s.namedMonster === cardId;
    let damage = 0;
    if (!blocked && !namedHit) {
      damage = monster.power;
      s.heroHP -= damage;
    }
    s.revealedCards.push({ id: cardId, blocked, namedHit, damage });
    const statusText = blocked ? '🛡️ 막힘' : namedHit ? '⚔️ 검으로 처치' : `💢 -${damage}HP`;
    s.logs.unshift(`공개: ${monster.name} (${monster.power}) → ${statusText}`);

    if (s.heroHP <= 0) {
      dungeonFail(s);
    } else if (s.dungeon.length === 0) {
      dungeonSuccess(s);
    }
  });
}

function dungeonSuccess(s) {
  const seat = s.challenger;
  s.players[seat].wins++;
  s.phase = 'roundend';
  s.logs.unshift(`✅ ${members[seat].nickname} 던전 정복 성공! (${s.players[seat].wins}/2)`);
  if (!checkEnd(s)) resetRound(s);
}

function dungeonFail(s) {
  const seat = s.challenger;
  s.players[seat].lives++;
  s.phase = 'roundend';
  s.logs.unshift(`💀 ${members[seat].nickname} 던전에서 사망… (사망 ${s.players[seat].lives}/2)`);
  if (s.players[seat].lives >= 2) {
    s.logs.unshift(`☠️ ${members[seat].nickname} 탈락!`);
  }
  if (!checkEnd(s)) resetRound(s);
}

  html += `<section class="card">
    <div style="font-weight:900;font-size:13px;margin-bottom:10px;color:var(--text2)">🏰 던전 현황</div>

    </div>

  }
  html += `</div></section>`;

  /* ── 결과 패널 ── */
  if (state.over && state.winner !== null) {
    const isWinner = state.winner === mySeat;
    html += `<div class="result-panel ${isWinner ? 'win' : 'lose'}">
      <h2>${isWinner ? '🏆 승리!' : '💀 패배'}</h2>

  html += `<details style="margin-top:12px">
    <summary style="font-size:12px;color:var(--muted);cursor:pointer">📖 몬스터 목록 보기</summary>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">`;
  MONSTERS.forEach(m => {
    html += `<div class="monster-card" style="min-width:80px">
      <div class="m-power">${m.power}</div>
      <div class="m-name">${m.name}</div>
      <div class="m-icons">${m.icons.map(i => ICON_MAP[i]).join(' ') || '–'}</div>
    </div>`;
  });
  html += `</div></details></section>`;

  app.innerHTML = html;

  /* ── 이벤트 바인딩 ── */
  document.querySelector('#start-btn')?.addEventListener('click', startGame);
  document.querySelector('#action-draw')?.addEventListener('click', actionDrawMonster);
  document.querySelector('#action-dungeon')?.addEventListener('click', actionPlaceToDungeon);
  document.querySelector('#action-pass')?.addEventListener('click', actionPass);
  document.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => actionRemoveItem(btn.dataset.remove));
  });
  document.querySelectorAll('[data-sword]').forEach(btn => {
    btn.addEventListener('click', () => actionNameMonster(btn.dataset.sword));
  });
  document.querySelector('#reveal-next-btn')?.addEventListener('click', revealNextCard);
}

// ── 앱 부트 ───────────────────────────────────────────────
(async () => {
  try {
    me = await getMe();
    if (!me) return showFatal('로그인이 필요합니다.');
    ({ room, members } = await loadRoom());
    if (room.game !== 'mandom') return showFatal('맨덤의 던전 방이 아닙니다. (game ≠ mandom)');
    mySeat = members.findIndex(m => m.user_id === me.user_id);
    if (mySeat < 0) return showFatal('이 방의 참가자가 아닙니다.');

    const row = await loadState();
    revision = row.revision;
    state = row.state;
    if(state){state.turnOrder=Array.isArray(state.turnOrder)&&state.turnOrder.length?state.turnOrder:members.map((_,i)=>i);state.pendingDraws=state.pendingDraws||{};}

    if (!state && room.host_id === me.user_id) {
      state = setupState();
      revision = await saveState(0, state);
    }
    render();

    startStatePoll(async row => {
      revision = row.revision;
      if (row.state) { state = row.state; render(); }
    }, { interval: 8000 });

  } catch(e) { showFatal(e.message); }
})();
</script>
</body>
</html>
