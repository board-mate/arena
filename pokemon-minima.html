<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>포켓몬 미니마 ⚡</title>
<style>
/* ─── 토큰 시스템 ─── */
:root {
  --red:#e53e3e; --blue:#3182ce; --yellow:#d69e2e; --green:#38a169;
  --purple:#805ad5; --teal:#319795; --orange:#dd6b20; --pink:#d53f8c;
  --bg:#0f1923; --surface:#182230; --card:#1e2d3d; --border:#2d4158;
  --text:#e8f0fe; --muted:#8a9bb8; --accent:#f6c90e;
  --starter:#f6e05e; --shadow:0 4px 20px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--text)}
button{cursor:pointer;font-family:inherit}
button:disabled{opacity:.4;cursor:not-allowed}

/* ─── 레이아웃 ─── */
#root{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-size:1.2rem;font-weight:900;letter-spacing:-.03em;color:var(--accent)}
.brand span{color:var(--text);font-weight:400;font-size:.85rem;margin-left:6px}
.round-badge{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:4px 12px;font-size:.8rem;font-weight:700;color:var(--muted)}
.top-btns{display:flex;gap:6px}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;padding:7px 14px;font-weight:700;font-size:.82rem;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){background:var(--border)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#000}
.btn.primary:hover:not(:disabled){opacity:.88}
.btn.danger{background:rgba(229,62,62,.15);border-color:var(--red);color:#fc8181}
.btn.small{padding:4px 9px;font-size:.75rem}

/* ─── 메인 레이아웃 ─── */
.game-area{display:grid;grid-template-columns:210px minmax(0,1fr) 210px;gap:12px;padding:12px;flex:1;min-height:0}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.panel-title{font-size:.72rem;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}

/* ─── 포켓몬 카드 ─── */
.poke-card{background:var(--card);border:2px solid var(--border);border-radius:11px;padding:9px;position:relative;cursor:pointer;transition:border-color .12s,transform .08s}
.poke-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.poke-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(246,201,14,.3)}
.poke-card.starter{border-color:var(--starter)}
.poke-card.spent{opacity:.6}
.poke-card.conserved{border-color:var(--green);background:rgba(56,161,105,.08)}
.poke-card.exhausted{opacity:.5;outline:2px dashed var(--muted)}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:4px;margin-bottom:5px}
.card-name{font-weight:900;font-size:.9rem;line-height:1.1}
.card-name small{display:block;font-size:.65rem;font-weight:400;color:var(--muted);font-style:italic}
.card-stats{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.stat-pill{display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.07);border-radius:5px;padding:2px 6px;font-size:.72rem;font-weight:700}
.appeal-num{font-size:1rem;font-weight:900;color:var(--accent)}
.cons-num{font-size:.85rem;font-weight:900;color:var(--green)}
.size-badge{background:rgba(99,102,241,.2);color:#a5b4fc;border-radius:4px;padding:1px 5px;font-size:.68rem;font-weight:800}
.icon-row{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:4px}
.icon{width:20px;height:20px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:900}
.card-ability{font-size:.7rem;color:var(--muted);line-height:1.35;border-top:1px solid var(--border);padding-top:4px;margin-top:2px}
.sponsor-section{background:rgba(49,130,206,.1);border:1px solid rgba(49,130,206,.3);border-radius:6px;padding:5px 7px;margin-top:4px}
.sponsor-label{font-size:.62rem;font-weight:800;color:#63b3ed;margin-bottom:2px}
.sponsor-text{font-size:.68rem;color:#90cdf4;line-height:1.3}
.cons-section{background:rgba(56,161,105,.1);border:1px solid rgba(56,161,105,.3);border-radius:6px;padding:5px 7px;margin-top:4px}
.cons-label{font-size:.62rem;font-weight:800;color:#68d391;margin-bottom:2px}
.cons-text{font-size:.68rem;color:#9ae6b4;line-height:1.3}
.card-state-badge{position:absolute;top:5px;right:5px;font-size:.58rem;font-weight:900;padding:1px 5px;border-radius:3px}
.state-ready{background:rgba(56,161,105,.2);color:#68d391}
.state-spent{background:rgba(100,116,139,.2);color:#94a3b8}
.state-conserved{background:rgba(56,161,105,.3);color:#68d391}

/* ─── 동물원 그리드 ─── */
.zoo-wrap{display:flex;flex-direction:column;gap:10px}
.zoo-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,80px);gap:6px}
.zoo-cell{background:var(--card);border:1.5px dashed var(--border);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--muted);position:relative;transition:border-color .12s}
.zoo-cell.occupied{border-style:solid;border-color:var(--border)}
.zoo-cell.enclosure{border-color:rgba(99,102,241,.5)}
.zoo-cell.has-pokemon{border-color:var(--accent);background:rgba(246,201,14,.05)}
.zoo-cell.valid-target{border-color:var(--green);background:rgba(56,161,105,.08);cursor:pointer;animation:pulse-green 1.2s infinite}
.zoo-cell.invalid-target{opacity:.3}
@keyframes pulse-green{0%,100%{border-color:rgba(56,161,105,.5)}50%{border-color:#68d391}}
.cell-content{text-align:center;padding:4px}
.cell-poke{font-size:.75rem;font-weight:800;color:var(--text);line-height:1.2}
.cell-poke small{display:block;font-size:.6rem;color:var(--muted);font-weight:400}
.cell-size{position:absolute;bottom:3px;right:4px;font-size:.6rem;font-weight:900;color:#6b7280}
.cell-icons{display:flex;gap:2px;position:absolute;top:3px;left:4px}
.enc-num{font-size:1.2rem;font-weight:900;color:rgba(99,102,241,.4)}

/* ─── 행동 카드 ─── */
.action-card{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:10px;margin-bottom:8px}
.action-card-title{font-size:.75rem;font-weight:900;color:var(--muted);margin-bottom:8px;letter-spacing:.05em}
.action-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px}
.action-slot{border-radius:7px;padding:6px 4px;text-align:center;cursor:pointer;border:1.5px solid var(--border);transition:all .12s;position:relative}
.action-slot:hover{border-color:var(--accent)}
.action-slot.active-slot{border-color:var(--accent);background:rgba(246,201,14,.1)}
.slot-num{font-size:1rem;font-weight:900;color:var(--accent);display:block}
.slot-label{font-size:.58rem;font-weight:700;color:var(--muted);display:block}
.slot-icon{font-size:1.1rem;display:block;margin-bottom:2px}
.strength-display{text-align:center;margin-bottom:8px}
.strength-num{font-size:2rem;font-weight:900;color:var(--accent);line-height:1}
.strength-label{font-size:.7rem;color:var(--muted)}
.pass-indicator{background:rgba(128,90,213,.15);border:1px solid rgba(128,90,213,.4);border-radius:7px;padding:5px 8px;font-size:.72rem;color:#b794f4;text-align:center}
.token-count{display:flex;align-items:center;gap:4px;font-size:.8rem;font-weight:700}
.x-token{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;background:var(--purple);border-radius:4px;font-size:.65rem;font-weight:900;color:#fff}

/* ─── 점수 패널 ─── */
.score-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)}
.score-row:last-child{border-bottom:none}
.score-label{font-size:.75rem;color:var(--muted)}
.score-val{font-size:.95rem;font-weight:900}

/* ─── 덱/버린패 ─── */
.deck-area{display:flex;gap:8px;align-items:stretch}
.deck-pile{flex:1;background:var(--card);border:1.5px solid var(--border);border-radius:9px;padding:8px;text-align:center;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:border-color .12s}
.deck-pile:hover{border-color:var(--accent)}
.deck-pile.valid{border-color:var(--green)}
.deck-count{font-size:1.2rem;font-weight:900;color:var(--accent)}
.deck-label{font-size:.65rem;color:var(--muted)}
.display-cards{display:flex;gap:5px;flex-wrap:wrap}
.display-mini{background:var(--card);border:1.5px solid var(--border);border-radius:7px;padding:5px 7px;font-size:.72rem;cursor:pointer;transition:border-color .12s;max-width:110px}
.display-mini:hover{border-color:var(--accent)}
.display-mini.valid{border-color:var(--green)}
.display-mini strong{display:block;font-size:.75rem}

/* ─── 손패 ─── */
.hand-area{display:grid;grid-template-columns:repeat(3,minmax(190px,1fr));gap:10px;align-items:start}
.hand-card{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:9px;font-size:.75rem;cursor:pointer;transition:all .12s;min-width:180px;max-width:280px;position:relative}
.hand-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.hand-card.selected{border-color:var(--accent);background:rgba(246,201,14,.08)}
.hand-card.playable{border-color:var(--green)}
.hand-card.not-playable{opacity:.45}
.hand-count{font-size:.72rem;color:var(--muted);font-weight:700}
.card-art-full{width:100%;aspect-ratio:441/626;object-fit:contain;border-radius:7px;margin:4px 0 7px;background:#0b1320}
.draft-art{width:100%;aspect-ratio:441/626;object-fit:contain;border-radius:8px;background:#0b1320;margin-bottom:6px}
.hand-art{width:100%;aspect-ratio:441/626;max-height:none;object-fit:contain;object-position:center;border-radius:8px;margin-bottom:7px;background:#0b1320}
.display-art{width:44px;height:62px;object-fit:cover;object-position:top;border-radius:5px;float:left;margin-right:6px}
.zoo-art{width:44px;height:62px;object-fit:cover;object-position:top;border-radius:5px;margin:0 auto 3px;display:block}


.hand-card-detail{display:grid;gap:5px;margin-top:6px}
.hand-effect{font-size:.69rem;line-height:1.4;color:#d6deea;background:#121c28;border:1px solid #2d4158;border-radius:7px;padding:6px 7px}
.hand-effect b{color:#fff}
.hand-sponsor{font-size:.68rem;line-height:1.4;color:#a9d8ff;background:rgba(49,130,206,.11);border:1px solid rgba(49,130,206,.35);border-radius:7px;padding:6px 7px}
.hand-conservation{font-size:.68rem;line-height:1.4;color:#a7f3c6;background:rgba(56,161,105,.11);border:1px solid rgba(56,161,105,.35);border-radius:7px;padding:6px 7px}
.card-zoom-btn{width:100%;margin:2px 0 4px;border:1px solid #425a75;background:#152438;color:#dbeafe;border-radius:7px;padding:5px 7px;font-size:.68rem;font-weight:900;cursor:pointer}
.card-preview-backdrop{position:fixed;inset:0;z-index:9999;background:rgba(3,7,12,.88);display:flex;align-items:center;justify-content:center;padding:18px}
.card-preview{width:min(980px,96vw);max-height:94vh;overflow:auto;background:#101923;border:1px solid #45617f;border-radius:18px;padding:16px;display:grid;grid-template-columns:minmax(300px,500px) minmax(260px,1fr);gap:16px;box-shadow:0 30px 90px #000}
.card-preview img{width:100%;max-height:86vh;object-fit:contain;border-radius:12px;background:#07101a}
.card-preview-info{display:flex;flex-direction:column;gap:10px}
.card-preview-info h2{margin:0;color:var(--accent);font-size:1.45rem}
.card-preview-close{align-self:flex-end}
@media(max-width:760px){.hand-area{grid-template-columns:repeat(2,minmax(145px,1fr))}.hand-card{min-width:0;max-width:none}.card-preview{grid-template-columns:1fr}.card-preview img{max-height:60vh}}

/* ─── 메시지/액션 선택 ─── */
.action-bar{background:var(--surface);border-top:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phase-msg{font-size:.82rem;font-weight:700;flex:1;color:var(--text)}
.phase-hint{font-size:.72rem;color:var(--muted)}
.action-btns{display:flex;gap:6px;flex-wrap:wrap}

/* ─── 설정 화면 ─── */
.setup-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.setup-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;max-width:480px;width:100%}
.setup-title{font-size:2rem;font-weight:900;text-align:center;margin-bottom:4px;color:var(--accent);letter-spacing:-.04em}
.setup-sub{font-size:.82rem;text-align:center;color:var(--muted);margin-bottom:24px}
.setup-field{margin-bottom:16px}
.setup-label{font-size:.75rem;font-weight:800;color:var(--muted);margin-bottom:6px;display:block}
.setup-input{width:100%;padding:10px 12px;background:var(--card);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem}
.setup-input:focus{outline:2px solid var(--accent);border-color:transparent}
.setup-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.setup-option{border:1.5px solid var(--border);background:var(--card);border-radius:9px;padding:12px;text-align:center;cursor:pointer;transition:all .12s}
.setup-option:hover,.setup-option.active{border-color:var(--accent);background:rgba(246,201,14,.08)}
.setup-option strong{display:block;font-size:.9rem;font-weight:900}
.setup-option small{font-size:.72rem;color:var(--muted)}
.setup-start{width:100%;margin-top:20px;padding:14px;font-size:1rem;font-weight:900;background:var(--accent);border:none;border-radius:10px;color:#000;cursor:pointer;transition:opacity .12s}
.setup-start:hover{opacity:.88}

/* ─── 로그 ─── */
.log-area{background:var(--card);border-radius:8px;padding:8px;max-height:120px;overflow-y:auto;font-size:.68rem;line-height:1.6;color:var(--muted)}
.log-area .entry{padding:1px 0}
.log-area .entry.ok{color:#68d391}.log-area .entry.warn{color:#f6c90e}.log-area .entry.act{color:#90cdf4}

/* ─── 종료 ─── */
.end-screen{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:100}
.end-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;max-width:440px;width:90%;text-align:center}
.end-title{font-size:1.8rem;font-weight:900;margin-bottom:8px;color:var(--accent)}
.score-table{width:100%;border-collapse:collapse;margin:16px 0;font-size:.82rem}
.score-table th{color:var(--muted);font-size:.7rem;padding:5px;border-bottom:1px solid var(--border)}
.score-table td{padding:8px 5px;border-bottom:1px solid rgba(45,65,88,.5)}
.score-table .total{font-weight:900;font-size:.95rem}
.winner-row{background:rgba(246,201,14,.08)}

/* ─── 툴팁 ─── */
.tooltip{position:relative}
.tooltip-body{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#0a1218;border:1px solid var(--border);border-radius:8px;padding:8px 10px;width:200px;font-size:.72rem;line-height:1.5;z-index:50;color:var(--text)}
.tooltip:hover .tooltip-body{display:block}

/* ─── ARMIN ─── */
.armin-area{background:rgba(128,90,213,.07);border:1px solid rgba(128,90,213,.3);border-radius:10px;padding:10px}
.armin-title{font-size:.7rem;font-weight:800;color:#b794f4;margin-bottom:6px}

/* ─── 모바일 ─── */
@media(max-width:900px){
  .game-area{grid-template-columns:1fr;grid-template-rows:auto}
  .zoo-grid{grid-template-rows:repeat(3,70px)}
  .hand-area{grid-template-columns:repeat(3,minmax(170px,1fr));overflow-x:auto;padding-bottom:5px}
}
@media(max-width:620px){.hand-area{grid-template-columns:repeat(2,minmax(145px,1fr));overflow:visible}.hand-card{max-width:none}.draft-art{max-height:none}}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ══════════════════════════════════════════════════════════════════
// 데이터: 포켓몬 미니마 카드 16장 (아크 미니마 리테마)
// ══════════════════════════════════════════════════════════════════
const TYPES = {
  flight:      {ko:'비행',      color:'#63b3ed', emoji:'🪽'},
  checker:     {ko:'체커',      color:'#90cdf4', emoji:'◩'},
  leaf:        {ko:'풀',        color:'#48bb78', emoji:'🌿'},
  orangeBadge: {ko:'호연지방',  color:'#ed8936', emoji:'▣'},
  pokeball:    {ko:'관동지방',  color:'#ecc94b', emoji:'◉'},
  fire:        {ko:'불꽃',      color:'#ed8936', emoji:'🔥'},
  device:      {ko:'기기',      color:'#4a5568', emoji:'▤'},
  water:       {ko:'물',        color:'#4299e1', emoji:'💧'},
  rock:        {ko:'바위',      color:'#a0aec0', emoji:'⛰'},
};
const REGION_ICONS = ['checker','orangeBadge','pokeball'];
const PRIMARY_ICONS = ['flight','leaf','fire','device'];

// 포켓몬 미니마 PDF 5쪽의 16장 카드 데이터를 그대로 옮긴 핵심 수치.
// size=우리 크기 요구, cost=입주 비용, discardValue=손에서 버릴 때 돈,
// moneyValue=준비된 동물원 카드를 소비할 때 돈, conVal=보존 저장값, appeal=최종 매력.
const CARDS = [
  {id:'c01',name:'워글',latin:'Braviary',starter:false,size:3,cost:20,discardValue:8,moneyValue:14,conVal:8,appeal:7,xIcon:true,coffee:false,
    icons:['flight','checker'],req:[],terrainReq:'rock',terrainProvides:null,
    ability:'자기 동물원에 있는 준비된 포켓몬마다 2점 획득.',abilityKind:'scoreReady2',
    sponsor:{strength:3,name:'과학 실험실',text:'자기 동물원에 있는 카드 1장의 후원자 행동을 수행.'},
    conservation:{type:'icon',icon:'orangeBadge',num:3,points:12}},
  {id:'c02',name:'나무킹',latin:'Sceptile',starter:false,size:5,cost:18,discardValue:7,moneyValue:20,conVal:6,appeal:4,xIcon:false,coffee:false,
    icons:['leaf','orangeBadge','orangeBadge'],req:['orangeBadge'],terrainReq:null,terrainProvides:null,
    ability:'자기 동물원의 호연지방 아이콘당 2점, 상대 동물원의 호연지방 아이콘당 1점 획득(최대 12점).',abilityKind:'scoreOrangeBoth',
    sponsor:{strength:4,name:'다양성 연구원',text:'우리 하나를 포켓몬 카드처럼 손에 들고, 그 우리 크기 이하 포켓몬 하나를 준비 또는 보존.'},
    conservation:{type:'diverseRegions',num:3,points:11}},
  {id:'c03',name:'피죤투',latin:'Pidgeot',starter:false,size:5,cost:20,discardValue:7,moneyValue:14,conVal:8,appeal:6,xIcon:true,coffee:false,
    icons:['flight','pokeball'],req:[],terrainReq:'water',terrainProvides:null,
    ability:'카드 1장을 뽑는다. 게임 종료 시 자기 동물원의 관동지방 아이콘당 2점.',abilityKind:'draw1ScorePokeball2',
    sponsor:{strength:3,name:'엔지니어',text:'우리 하나를 배치 가능한 다른 칸으로 이동. 자기 행동 카드를 원하는 행동 쪽으로 회전.'},
    conservation:{type:'terrain',terrain:'rock',num:3,points:12}},
  {id:'c04',name:'번치코',latin:'Blaziken',starter:false,size:5,cost:22,discardValue:9,moneyValue:16,conVal:10,appeal:9,xIcon:true,coffee:false,

// 게임 상태
// ══════════════════════════════════════════════════════════════════
let G = null; // 전체 게임 상태

function cardById(id){ return CARDS.find(c=>c.id===id); }
function cardArtPath(id){ return `./pokemon-minima-assets/cards/${id}.webp`; }

function shuffleArr(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function newGame(opts={}){
  const {p1name='트레이너1', p2name='트레이너2', mode='2p', difficulty='normal'} = opts;
  const starters = shuffleArr(STARTER_IDS);
  const nonStarters = shuffleArr(CARDS.filter(c=>!c.starter).map(c=>c.id));

  // 드래프트 준비: 각 플레이어에게 시작카드2 + 일반카드2 = 4장 배분
  const p1Draft = [starters[0], starters[1], nonStarters[0], nonStarters[1]];
  const p2Draft = [starters[2], starters[3], nonStarters[2], nonStarters[3]];
  const remainDeck = shuffleArr([
    starters[4], starters[5],
    ...nonStarters.slice(4)
  ]);

  const makePlayer = (name, draftCards, seat) => ({
    name, seat,
    hand: [],           // 현재 손패 (드래프트 완료 후 3장)
    zoo: Array(9).fill(null), // 3x3 grid, 각 칸: null | {type:'enclosure'|'pokemon', cardId?, size?, state?}
    money: 0,
    xTokens: 0,
    appealScore: 0,
    conservationScore: 0,
    draftPool: draftCards, // 드래프트 풀
    draftKept: [],         // 드래프트에서 고른 카드
    // 행동카드: 왼쪽 위치의 행동은 강도1. 아래/오른쪽/위는 각각 2/3/4.
    // 시작 배치는 카드1 / 건설2 / 포켓몬3 / 후원보존4.
    leftAction: 'cards',
    isPurpleSide: false,
    tempBoost: 0,
    exhaustedCards: [], // 직렬화 가능한 배열
    exhaustDir: null,          // 소진 방향 (left|right)
    arminFacing: 'sponsor',   // 솔로 봇 전용: 현재 위를 향한 행동
    arminPurple: false,
    arminPurpleSponsorVisits: 0,
  });

  return {
    phase: 'draft',  // draft | playing | break | end
    round: 1,        // 1~4
    turn: 0,
    currentPlayer: 0,
    mode,
    difficulty,
    players: [
      makePlayer(p1name, p1Draft, 0),
      makePlayer(mode==='solo' ? 'ARMIN' : p2name, p2Draft, 1),
    ],
    deck: remainDeck,
    discard: [],     // 버린 카드 더미 (두 개, 인덱스 0,1)
    discardPiles: [[], []],
    log: [],
    pendingAction: null, // 현재 진행 중인 행동
    draftRound: 0,
    draftPass: [],
  };
}

// ─── 강도 계산 ───
const ACTION_ORDER = ['cards','build','animal','sponsor']; // 왼쪽→아래→오른쪽→위
function getStrength(player, actionType){
  const left = ACTION_ORDER.includes(player.leftAction) ? player.leftAction : 'cards';
  const action = ACTION_ORDER.includes(actionType) ? actionType : left;
  const base = ((ACTION_ORDER.indexOf(action) - ACTION_ORDER.indexOf(left) + 4) % 4) + 1;
  return base + Number(player.tempBoost||0);
}
function baseStrength(player, actionType){
  const boost=Number(player.tempBoost||0); player.tempBoost=0;
  const v=getStrength(player,actionType); player.tempBoost=boost; return v;
}

// 행동 수행 후, 방금 사용한 행동이 왼쪽(강도1)에 오도록 회전한다. 면은 유지된다.
function rotateActionCard(player, actionType){
  if(ACTION_ORDER.includes(actionType)) player.leftAction=actionType;
  player.tempBoost=0;
}

// 패스: 행동 없이 반시계로 0~2칸 회전하고 보라색(X) 면으로 뒤집는다.
function passAction(player, steps){
  let idx=ACTION_ORDER.indexOf(ACTION_ORDER.includes(player.leftAction)?player.leftAction:'cards');
  idx=(idx-Number(steps||0)+4)%4;
  player.leftAction=ACTION_ORDER[idx];
  player.isPurpleSide=true;
  player.tempBoost=0;
}

// ─── 점수 계산 ───
function zooPokemonCells(player){
  return player.zoo.map((cell,idx)=>({cell,idx,card:cell?.type==='pokemon'?cardById(cell.cardId):null})).filter(x=>x.card);
}
function zooIconCount(player, iconId){
  return zooPokemonCells(player).reduce((n,x)=>n+x.card.icons.filter(i=>i===iconId).length,0);
}
function terrainProviderCount(player, terrain){
  return zooPokemonCells(player).filter(x=>x.card.terrainProvides===terrain).length;
}
function conservationRequirementText(c){
  if(!c)return '';
  if(c.type==='icon') return `${TYPES[c.icon]?.ko||c.icon} 아이콘 ${c.num}개`;
  if(c.type==='terrain') return `${TYPES[c.terrain]?.ko||c.terrain} 제공 포켓몬 ${c.num}마리`;
  if(c.type==='diverseRegions') return `서로 다른 지방 아이콘 ${c.num}종`;
  if(c.type==='diversePrimary') return `서로 다른 포켓몬 타입 아이콘 ${c.num}종`;
  if(c.type==='small') return `크기 ${c.maxSize} 이하 포켓몬 ${c.num}마리`;
  if(c.type==='large') return `크기 ${c.minSize} 이상 포켓몬 ${c.num}마리`;
  return `요구 ${c.num}`;
}
function conservationConditionMet(player,c){
  if(!c)return false;
  if(c.type==='icon') return zooIconCount(player,c.icon)>=c.num;
  if(c.type==='terrain') return terrainProviderCount(player,c.terrain)>=c.num;
  if(c.type==='diverseRegions'){
    const got=new Set(); zooPokemonCells(player).forEach(x=>x.card.icons.forEach(i=>{if(REGION_ICONS.includes(i))got.add(i);}));
    return got.size>=c.num;
  }
  if(c.type==='diversePrimary'){
    const got=new Set(); zooPokemonCells(player).forEach(x=>x.card.icons.forEach(i=>{if(PRIMARY_ICONS.includes(i))got.add(i);}));
    return got.size>=c.num;
  }
  if(c.type==='small') return zooPokemonCells(player).filter(x=>x.card.size<=c.maxSize).length>=c.num;
  if(c.type==='large') return zooPokemonCells(player).filter(x=>x.card.size>=c.minSize).length>=c.num;
  return false;
}

function calcScores(player){
  let appeal=0,conservation=0,scoring=0,emptyEnc=0;
  const pIdx=G?.players?.indexOf(player) ?? -1;
  const opponent=pIdx>=0?G.players[1-pIdx]:null;
  player.zoo.forEach((cell,idx)=>{
    if(!cell)return;
    if(cell.type==='enclosure')emptyEnc++;
    if(cell.type!=='pokemon')return;
    const card=cardById(cell.cardId); if(!card)return;
    appeal+=card.appeal;
    if(cell.state==='conserved')conservation+=card.conVal;
    switch(card.abilityKind){
      case 'scoreReady2': scoring+=zooPokemonCells(player).filter(x=>x.cell.state==='ready').length*2; break;
      case 'scoreOrangeBoth': scoring+=Math.min(12,zooIconCount(player,'orangeBadge')*2+(opponent?zooIconCount(opponent,'orangeBadge'):0)); break;
      case 'draw1ScorePokeball2': scoring+=zooIconCount(player,'pokeball')*2; break;
      case 'scoreAdjacentEmpty4': scoring+=adjacentCells(idx).filter(i=>player.zoo[i]?.type==='enclosure').length*4; break;
      case 'scoreCheckerBoth': scoring+=Math.min(8,zooIconCount(player,'checker')*2+(opponent?zooIconCount(opponent,'checker'):0)); break;
      case 'scoreAdjacentFlight3': scoring+=adjacentCells(idx).reduce((n,i)=>{const c=player.zoo[i];if(c?.type!=='pokemon')return n;const cc=cardById(c.cardId);return n+(cc?.icons.filter(x=>x==='flight').length||0)*3;},0); break;
      case 'scoreLeaf2': scoring+=zooIconCount(player,'leaf')*2; break;
      case 'scoreFire2': scoring+=zooIconCount(player,'fire')*2; break;
    }
  });
  return {appeal,conservation,emptyPenalty:emptyEnc*2,scoring,total:appeal+conservation+scoring-emptyEnc*2};
}

// ─── 인접 셀 ───
function adjacentCells(idx){
  const row = Math.floor(idx/3), col = idx%3, adj=[];
  if(row>0) adj.push(idx-3);
  if(row<2) adj.push(idx+3);
  if(col>0) adj.push(idx-1);
  if(col<2) adj.push(idx+1);
  return adj;
}

// 첫 배치 가능 칸: 왼쪽 하단(인덱스 6) 또는 인접
function validBuildPositions(zoo){
  const occupied = zoo.map((c,i)=>c?i:-1).filter(i=>i>=0);
  if(occupied.length===0) return [6]; // 첫 우리는 반드시 6번(좌측 하단)
  const valid = new Set();
  occupied.forEach(idx=>{
    adjacentCells(idx).forEach(a=>{
      if(!zoo[a]) valid.add(a);
    });
  });
  return [...valid];
}

// ─── 돈 생성 ───
function generateMoney(player, amount){
  player.money += amount;
}

function spendMoney(player, amount){
  if(player.money < amount) return false;
  player.money -= amount;
  return true;
}

// 카드 버리기 → 카드의 버리기 수입값
function discardForMoney(G, playerIdx, cardId){
  const p = G.players[playerIdx];
  const hIdx = p.hand.indexOf(cardId);
  if(hIdx<0) return;
  const card = cardById(cardId);
  p.hand.splice(hIdx,1);
  // 버린 카드 더미에 추가
  if(G.discardPiles[0].length===0) G.discardPiles[0].push(cardId);
  else if(G.discardPiles[1].length===0) G.discardPiles[1].push(cardId);
  else {
    const pileIdx = Math.random()<0.5?0:1;
    G.discardPiles[pileIdx].push(cardId);
  }
  generateMoney(p, card.discardValue);
  addLog(G, `${p.name}: ${card.name} 버려서 ${card.discardValue}원 획득`, 'act');
}

// 동물원 카드 소비(ready→spent) → 수입 = 해당값
function spendZooCard(G, playerIdx, cellIdx){
  const p = G.players[playerIdx];
  const cell = p.zoo[cellIdx];
  if(!cell||cell.type!=='pokemon'||cell.state!=='ready') return;
  const card = cardById(cell.cardId);
  cell.state = 'spent';
  generateMoney(p, card.moneyValue);
  addLog(G, `${p.name}: ${card.name} 소비해 ${card.moneyValue}원 획득`, 'act');
}

function addLog(G, msg, cls='info'){
  G.log.unshift({msg, cls, t:Date.now()});
  if(G.log.length>50) G.log.pop();
}

// ══════════════════════════════════════════════════════════════════
// ARMIN 봇 로직
// ══════════════════════════════════════════════════════════════════
function arminInterest(cardId, round, botZoo){
  const card = cardById(cardId);
  if(!card) return -99;
  const botCounts={};
  botZoo.forEach(cell=>{
    if(cell?.type==='pokemon'){
      const c=cardById(cell.cardId);
      (c?.icons||[]).forEach(ic=>botCounts[ic]=(botCounts[ic]||0)+1);
    }
  });
  const candCounts={}; (card.icons||[]).forEach(ic=>candCounts[ic]=(candCounts[ic]||0)+1);
  const I=Object.entries(candCounts).reduce((n,[ic,cnt])=>n+Math.min(cnt,botCounts[ic]||0),0);
  return I - Math.abs(Number(round||1)-Number(card.size||0));
}

function arminDisplayTops(G){
  return [0,1].map(pileIdx=>({pileIdx,id:G.discardPiles[pileIdx]?.slice(-1)[0]})).filter(x=>x.id);
}
function arminPutTopDeckOnDisplay(G){
  const id=takeTopCard(1); if(!id)return;
  if(!G.discardPiles[0].length){G.discardPiles[0].push(id);return;}
  if(!G.discardPiles[1].length){G.discardPiles[1].push(id);return;}
  const bot=G.players[1];
  const tops=arminDisplayTops(G).sort((a,b)=>{
    const ia=arminInterest(a.id,G.round,bot.zoo), ib=arminInterest(b.id,G.round,bot.zoo);
    if(ia!==ib)return ia-ib;
    const aa=cardById(a.id)?.appeal||0, ab=cardById(b.id)?.appeal||0;
    return aa-ab || a.pileIdx-b.pileIdx;
  });
  G.discardPiles[tops[0].pileIdx].push(id); // 낮은 관심도의 공개 카드 위를 덮는다.
}
function arminCriticalReached(G, justFlipped){
  const bot=G.players[1], action=bot.arminFacing, purple=!!bot.arminPurple;
  if(!purple)return false;
  const d=String(G.difficulty||'normal').toLowerCase();
  if(d==='veryhard')return action==='sponsor' && justFlipped;
  if(d==='hard')return action==='animal';
  if(d==='normal')return action==='build';
  if(d==='easy')return action==='cards';
  // casual: 보라 Sponsorvation으로 돌아온 두 번째 방문(뒤집힌 그 턴은 제외)
  return action==='sponsor' && !justFlipped && Number(bot.arminPurpleSponsorVisits||0)>=2;
}
function arminTakeBestDisplay(G){
  const bot=G.players[1], tops=arminDisplayTops(G);
  if(!tops.length)return false;
  tops.sort((a,b)=>{
    const ia=arminInterest(a.id,G.round,bot.zoo), ib=arminInterest(b.id,G.round,bot.zoo);
    if(ia!==ib)return ib-ia;
    const aa=cardById(a.id)?.appeal||0, ab=cardById(b.id)?.appeal||0;
    return ab-aa || a.pileIdx-b.pileIdx;
  });
  const pick=tops[0]; G.discardPiles[pick.pileIdx].pop();
  const free=bot.zoo.findIndex(c=>!c);
  if(free>=0){bot.zoo[free]={type:'pokemon',cardId:pick.id,state:'ready',enclosureSize:cardById(pick.id)?.size||1};}
  else { bot.zoo.push({type:'pokemon',cardId:pick.id,state:'ready',enclosureSize:cardById(pick.id)?.size||1}); }
  addLog(G,`ARMIN: ${cardById(pick.id)?.name} 획득 (관심도 ${arminInterest(pick.id,G.round,bot.zoo)})`,'ok');
  bot.arminFacing='sponsor'; bot.arminPurple=false; bot.arminPurpleSponsorVisits=0;
  bot.leftAction='cards'; // 화면상 시작 배치(후원=강도4)로 복귀
  return true;
}
function arminTakeTurn(G){
  const bot=G.players[1];
  const seq=['sponsor','cards','build','animal'];
  let idx=seq.indexOf(bot.arminFacing); if(idx<0)idx=0;
  idx=(idx+1)%4;
  let justFlipped=false;
  bot.arminFacing=seq[idx];
  if(bot.arminFacing==='sponsor'){
    if(!bot.arminPurple){bot.arminPurple=true;justFlipped=true;bot.arminPurpleSponsorVisits=1;}
    else bot.arminPurpleSponsorVisits=Number(bot.arminPurpleSponsorVisits||1)+1;
  }
  // 봇 카드의 시각적 방향도 대략 동기화한다.
  bot.leftAction=bot.arminFacing;
  bot.isPurpleSide=bot.arminPurple;
  addLog(G,`ARMIN: ${actionLabel(bot.arminFacing)}${bot.arminPurple?' (보라)':' (파랑)'}`,'info');

  // 가로 행동(카드/포켓몬)에서는 덱 맨 위 1장을 공개열에 버린다.
  if(bot.arminFacing==='cards'||bot.arminFacing==='animal')arminPutTopDeckOnDisplay(G);

  if(arminCriticalReached(G,justFlipped)){
    arminTakeBestDisplay(G);
  }
}

function bestConservationSubset(player, points){
  const eligible=zooPokemonCells(player).filter(x=>x.cell.state!=='conserved');
  let best=[],bestSum=0;
  const n=eligible.length;
  for(let mask=1;mask<(1<<Math.min(n,20));mask++){
    let sum=0,arr=[];
    for(let i=0;i<n;i++)if(mask&(1<<i)){sum+=eligible[i].card.conVal;arr.push(eligible[i]);}
    if(sum<=points && (sum>bestSum || (sum===bestSum&&arr.length>best.length))){bestSum=sum;best=arr;}
  }
  return best;
}
function prepareArminEndScoring(G){
  const bot=G.players[1];
  // 봇 동물원에 있는 각 보존 프로젝트를 한 번씩, 조건을 만족할 때 최대한 효율적으로 사용한다.
  const projectIds=zooPokemonCells(bot).map(x=>x.card.id);
  projectIds.forEach(id=>{
    const card=cardById(id); if(!card||!conservationConditionMet(bot,card.conservation))return;
    const pick=bestConservationSubset(bot,card.conservation.points);
    pick.forEach(x=>x.cell.state='conserved');
  });
}
function calcArminScores(bot){
  let appeal=0,conservation=0;
  zooPokemonCells(bot).forEach(x=>{appeal+=x.card.appeal;if(x.cell.state==='conserved')conservation+=x.card.conVal;});
  return {appeal,conservation,emptyPenalty:0,scoring:0,total:appeal+conservation};
}

function processBreak(G, triggerPlayer=G.currentPlayer){
  addLog(G,`=== 휴식: 라운드 ${G.round} 덱 소진 ===`,'warn');
  G.players.forEach(p=>{
    p.zoo.forEach(cell=>{
      if(cell?.type==='pokemon'){
        const card=cardById(cell.cardId);
        if(card?.coffee && cell.state==='spent')cell.state='ready';
      }
    });
    p.exhaustedCards=[];
  });
  const allDiscard=[...G.discardPiles[0],...G.discardPiles[1]];
  G.discardPiles=[[],[]];
  G.deck=shuffleArr([...G.deck,...allDiscard]);
  if(G.round<4){
    G.round++;
    addLog(G,`=== 라운드 ${G.round} 시작 ===`,'ok');
  }else{
    // 첫 플레이어(0)가 4R 덱을 소진하면 두 번째 플레이어가 마지막 한 턴,
    // 두 번째 플레이어가 소진했다면 그 현재 턴이 마지막이다.
    G.endAfterPlayer=1;
    addLog(G,'4라운드 덱 소진 — 2번 플레이어의 차례 종료 후 최종 점수 계산','warn');
  }
}

function takeTopCard(triggerPlayer=G.currentPlayer){
  if(!G.deck.length)return null;
  const id=G.deck.shift();
  if(G.deck.length===0)processBreak(G,triggerPlayer);
  return id;
}

function enforceHandLimit(player){
  while(player.hand.length>3){
    const menu=player.hand.map((id,i)=>`${i+1}:${cardById(id)?.name}`).join('  ');
    let raw=prompt(`턴 종료 시 손패는 최대 3장입니다. 덱 맨 아래로 반납할 카드 번호를 고르세요.\n${menu}`,String(player.hand.length));
    let i=Number(raw)-1; if(!(i>=0&&i<player.hand.length))i=player.hand.length-1;
    const id=player.hand.splice(i,1)[0]; G.deck.push(id);
    addLog(G,`${player.name}: ${cardById(id)?.name} 반납 (덱 맨 아래)`,'info');
  }
}

// ─── ARMIN 솔로 준비 ───
function setupArminSoloStart(){
  const human=G.players[0],bot=G.players[1];
  const starters=shuffleArr(STARTER_IDS);
  const others=shuffleArr(CARDS.filter(c=>!c.starter).map(c=>c.id));
  const starterChoices=starters.slice(0,2), otherChoices=others.slice(0,3);
  const sRaw=prompt('ARMIN 솔로 준비: 시작 포켓몬 1장을 고르세요.\n'+starterChoices.map((id,i)=>`${i+1}:${cardById(id)?.name}`).join('  '),'1');
  const sPick=Math.max(0,Math.min(1,(Number(sRaw)||1)-1));
  const keptStarter=starterChoices[sPick], botStarter=starterChoices[1-sPick];
  const oRaw=prompt('일반 포켓몬 3장 중 손에 둘 2장을 쉼표로 고르세요.\n'+otherChoices.map((id,i)=>`${i+1}:${cardById(id)?.name}`).join('  '),'1,2');
  let picks=[...new Set(String(oRaw||'1,2').split(',').map(x=>Number(x.trim())-1).filter(i=>i>=0&&i<3))];
  if(picks.length!==2)picks=[0,1];
  const keptOthers=picks.map(i=>otherChoices[i]), returned=otherChoices.find((_,i)=>!picks.includes(i));
  human.hand=[keptStarter,...keptOthers]; human.draftPool=[];human.draftKept=[];
  bot.hand=[];bot.draftPool=[];bot.draftKept=[];bot.zoo=Array(9).fill(null);
  bot.zoo[0]={type:'pokemon',cardId:botStarter,state:'ready',enclosureSize:cardById(botStarter)?.size||1};
  bot.arminFacing='sponsor';bot.arminPurple=false;bot.arminPurpleSponsorVisits=0;bot.leftAction='cards';bot.isPurpleSide=false;
  const used=new Set([keptStarter,botStarter,...keptOthers]);
  G.deck=shuffleArr(CARDS.map(c=>c.id).filter(id=>!used.has(id)));
  // 선택하지 않은 일반 카드 1장은 위 필터에 의해 덱으로 되돌아간다.
  G.discardPiles=[[],[]];G.phase='playing';G.round=1;G.turn=0;G.currentPlayer=0;
  addLog(G,`ARMIN 솔로 시작 — ${human.name} 손 3장, ARMIN 시작 포켓몬 ${cardById(botStarter)?.name}`,'ok');
}

function startDraft(){
  G.phase='draft';
  G.draftStage=0;            // 0: 4장 중 1장, 1: 받은 3장 중 1장, 2: 받은 2장 중 1장

            <div class="hand-sponsor" style="margin-top:5px"><b>🤝 ${card?.sponsor?.name||'후원/협회'}</b><br>${String(card?.sponsor?.text||'').slice(0,80)}</div>
            <div class="hand-conservation" style="margin-top:5px"><b>🛡 보존</b><br>${conservationRequirementText(card?.conservation)} → ${card?.conservation?.points||0}</div>

function attachDraftEvents(){
  document.querySelectorAll('[data-card-preview]').forEach(el=>{el.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();openCardPreview(el.dataset.cardPreview);});});
  if (IS_ONLINE_PARAM && Number(G?.draftCurrentPlayer ?? -1) !== ONLINE_SEAT) return;
  document.querySelectorAll('[data-draft-pick]').forEach(btn=>{
    btn.addEventListener('click',()=>draftPick(btn.dataset.draftPick));
  });
}

function draftPick(cardId){
  const pIdx=Number(G.draftCurrentPlayer||0);
  const p=G.players[pIdx];
  const pool=p.draftPool||[];
  const at=pool.indexOf(cardId);
  if(at<0 || (p.draftKept||[]).length>=3) return;

  p.draftKept.push(cardId);
  p.draftPool.splice(at,1);
  addLog(G, `${p.name}: 드래프트 카드 1장 확보`, 'info');

  if(pIdx===0){
    G.draftCurrentPlayer=1;
  }else if(Number(G.draftStage||0)<2){
    // 두 플레이어가 같은 단계에서 1장씩 고른 뒤 남은 카드를 서로 교환한다.
    const p0=[...G.players[0].draftPool];
    const p1=[...G.players[1].draftPool];
    G.players[0].draftPool=p1;
    G.players[1].draftPool=p0;
    G.draftStage=Number(G.draftStage||0)+1;
    G.draftCurrentPlayer=0;
  }else{
    // 마지막 단계의 미선택 카드 1장씩을 덱으로 되돌린다.
    const unchosen=[...G.players[0].draftPool,...G.players[1].draftPool];
    G.players[0].draftPool=[];
    G.players[1].draftPool=[];
    G.deck=shuffleArr([...G.deck,...unchosen]);
    finalizeDraft();
  }

  if (typeof emitOnlineState === 'function') setTimeout(emitOnlineState, 0);
  render();
}

function finalizeDraft(){
  G.players.forEach(p=>{
    p.hand=[...(p.draftKept||[])];
    p.money=0;
  });
  G.phase='playing';
  G.round=1;
  G.turn=0;
  G.currentPlayer=0;
  addLog(G, '=== 라운드 1 시작 ===', 'ok');
  if (typeof emitOnlineState === 'function') setTimeout(emitOnlineState, 0);
}

function startAction(actionType){
  const cp=G.currentPlayer;
  const player=G.players[cp];
  const strength=getStrength(player, actionType);

  if(actionType==='animal'&&strength<2){
    addLog(G,'포켓몬 행동은 강도 2 이상 필요합니다.','warn');
    render();return;
  }
  uiState.pendingAction=actionType;
  uiState.selectedHandCard=null;
  if(actionType==='animal'){uiState.animalRemaining=strength>=4?2:1;uiState.animalPlayed=0;}
  addLog(G,`${player.name}: ${actionLabel(actionType)} 행동 시작 (강도 ${strength})`,'act');
  render();
}

function confirmAction(){
  const cp=G.currentPlayer;
  const player=G.players[cp];
  const strength=getStrength(player, uiState.pendingAction);

  if(uiState.pendingAction==='cards'){
    doDrawCards();return;
  }
  if(uiState.pendingAction==='build'){
    if(uiState.selectedZooCells.length===0){addLog(G,'건설할 칸을 선택하세요.','warn');render();return;}
    doBuild(uiState.selectedZooCells[0]);
    return;
  }
  if(uiState.pendingAction==='animal'){
    if(!uiState.selectedHandCard){addLog(G,'배치할 포켓몬을 선택하세요.','warn');render();return;}
    if(uiState.selectedZooCells.length===0){addLog(G,'배치할 우리를 선택하세요.','warn');render();return;}
    doPlayAnimal(uiState.selectedHandCard, uiState.selectedZooCells[0]);
    return;
  }
  if(uiState.pendingAction==='sponsor'){
    if(!uiState.selectedHandCard){addLog(G,'손의 카드를 선택해 후원/보존하거나, 동물원 카드를 클릭해 그 보존 프로젝트를 사용하세요.','warn');render();return;}
    doSponsor(uiState.selectedHandCard);
    return;
  }
  endTurn();
}

function cancelAction(){
  if(uiState.pendingAction==='animal' && Number(uiState.animalPlayed||0)>0){
    const p=G.players[G.currentPlayer]; rotateActionCard(p,'animal');
    uiState.pendingAction=null;uiState.selectedHandCard=null;uiState.selectedZooCells=[];
    nextTurn(); return;
  }
  uiState.pendingAction=null;
  uiState.selectedHandCard=null;
  uiState.selectedZooCells=[];
  render();
}

function handleCellClick(cellIdx, playerIdx){
  const player=G.players[playerIdx];
  const cell=player.zoo[cellIdx];

  if(uiState.pendingAction==='build'){
    const valid=validBuildPositions(player.zoo);
    if(!valid.includes(cellIdx)){addLog(G,'인접한 빈 칸에만 건설할 수 있습니다.','warn');return;}
    uiState.selectedZooCells=[cellIdx];
    doBuild(cellIdx);
    return;
  }
  if(uiState.pendingAction==='animal'){
    if(!uiState.selectedHandCard){addLog(G,'먼저 손패에서 포켓몬을 선택하세요.','warn');return;}
    if(cell?.type!=='enclosure'){addLog(G,'빈 우리(enclosure)에만 배치할 수 있습니다.','warn');return;}
    doPlayAnimal(uiState.selectedHandCard, cellIdx);
    return;
  }
  if(uiState.pendingAction==='sponsor' && cell?.type==='pokemon'){
    doConservationFromZoo(cellIdx); return;
  }
  // 동물원 카드 선택 (돈 마련용)
  if(cell?.type==='pokemon'&&cell.state==='ready'){
    addLog(G,`${cardById(cell.cardId)?.name} 소비 → 돈 획득`,'act');
    spendZooCard(G, playerIdx, cellIdx);
    render();
  }
}

function doBuild(cellIdx){
  const cp=G.currentPlayer,player=G.players[cp];
  const strength=getStrength(player,'build');
  let raw=prompt(`건설할 우리 크기를 고르세요. 최대 ${strength}, 크기당 2원`,String(Math.min(3,strength)));
  if(raw===null)return;
  const size=Math.max(1,Math.min(strength,Number(raw)||1));
  const cost=size*2;
  if(player.money<cost){addLog(G,`돈 부족! 필요 ${cost}원 / 보유 ${player.money}원`,'warn');render();return;}
  const valid=validBuildPositions(player.zoo);
  if(!valid.includes(cellIdx)){addLog(G,'인접한 빈 칸에만 건설할 수 있습니다.','warn');render();return;}
  if(!G.deck.length){addLog(G,'덱에 우리로 사용할 카드가 없습니다.','warn');render();return;}
  player.money-=cost;
  const encCard=takeTopCard(cp);
  player.zoo[cellIdx]={type:'enclosure',size,cardId:encCard};
  rotateActionCard(player,'build');
  addLog(G,`${player.name}: 크기 ${size} 우리 건설 (-${cost}원)`,'ok');
  uiState.pendingAction=null;uiState.selectedZooCells=[];
  nextTurn();
}

function hasRequiredIcons(player,card){
  const counts={}; zooPokemonCells(player).forEach(x=>x.card.icons.forEach(i=>counts[i]=(counts[i]||0)+1));
  const need={}; (card.req||[]).forEach(i=>need[i]=(need[i]||0)+1);
  return Object.entries(need).every(([i,n])=>(counts[i]||0)>=n);
}
function hasTerrainAdjacent(player,cellIdx,terrain){
  if(!terrain)return true;
  return adjacentCells(cellIdx).some(i=>{const c=player.zoo[i];if(c?.type!=='pokemon')return false;return cardById(c.cardId)?.terrainProvides===terrain;});
}
function returnOneChoice(player,label='반납할 카드'){
  if(!player.hand.length)return null;
  const menu=player.hand.map((id,i)=>`${i+1}:${cardById(id)?.name}`).join('  ');
  let raw=prompt(`${label}\n${menu}`,'1'); if(raw===null)return null;
  let i=Number(raw)-1;if(!(i>=0&&i<player.hand.length))i=0;
  const id=player.hand.splice(i,1)[0];G.deck.push(id);return id;
}
function drawOneToHand(player,triggerPlayer){
  const id=takeTopCard(triggerPlayer);if(id)player.hand.push(id);return id;
}
function resolveAnimalAbility(playerIdx,cellIdx,depth=0){
  if(depth>1)return;
  const player=G.players[playerIdx],cell=player.zoo[cellIdx];if(cell?.type!=='pokemon')return;
  const card=cardById(cell.cardId);if(!card)return;
  switch(card.abilityKind){
    case 'xOrDraw':
      if(confirm(`${card.name}: 확인 = X 보너스 1개, 취소 = 카드 1장 뽑기`))player.xTokens++;
      else drawOneToHand(player,playerIdx);
      break;
    case 'draw2Keep1': {
      const drawn=[takeTopCard(playerIdx),takeTopCard(playerIdx)].filter(Boolean);
      if(!drawn.length)break;
      let keep=0;if(drawn.length>1){const raw=prompt(`가질 카드 선택: 1:${cardById(drawn[0])?.name}  2:${cardById(drawn[1])?.name}`,'1');keep=raw==='2'?1:0;}
      player.hand.push(drawn[keep]);drawn.forEach((id,i)=>{if(i!==keep)G.deck.push(id);});break;
    }
    case 'return1Draw1':
      if(player.hand.length&&confirm(`${card.name}: 손 카드 1장을 반납하고 1장을 뽑을까요?`)){returnOneChoice(player,'반납할 카드');drawOneToHand(player,playerIdx);} break;
    case 'readyAdjacent': {
      const opts=adjacentCells(cellIdx).filter(i=>player.zoo[i]?.type==='pokemon'&&player.zoo[i].state==='spent');
      if(opts.length){const raw=prompt('준비할 인접 포켓몬: '+opts.map((i,k)=>`${k+1}:${cardById(player.zoo[i].cardId)?.name}`).join('  '),'1');const at=opts[(Number(raw)||1)-1];if(at!=null)player.zoo[at].state='ready';} break;
    }
    case 'activateAdjacent': {
      const opts=adjacentCells(cellIdx).filter(i=>player.zoo[i]?.type==='pokemon');
      if(opts.length&&confirm(`${card.name}: 인접 포켓몬 능력을 활성화할까요?`)){const raw=prompt(opts.map((i,k)=>`${k+1}:${cardById(player.zoo[i].cardId)?.name}`).join('  '),'1');const at=opts[(Number(raw)||1)-1];if(at!=null)resolveAnimalAbility(playerIdx,at,depth+1);} break;
    }
    case 'extraTurn': player.extraTurn=true; break;
  }
}

function doPlayAnimal(cardId,cellIdx){
  const cp=G.currentPlayer,player=G.players[cp],card=cardById(cardId);
  const strength=getStrength(player,'animal');
  if(!card){addLog(G,'카드를 찾을 수 없습니다.','warn');return;}
  if(strength<2){addLog(G,'포켓몬 행동 강도 1에서는 포켓몬을 플레이할 수 없습니다.','warn');render();return;}
  const cell=player.zoo[cellIdx];
  if(!cell||cell.type!=='enclosure'){addLog(G,'빈 우리에만 배치 가능합니다.','warn');render();return;}
  if(cell.size<card.size){addLog(G,`우리 크기 부족: 필요 ${card.size}, 현재 ${cell.size}`,'warn');render();return;}
  if(!hasRequiredIcons(player,card)){addLog(G,'필요 아이콘 조건을 만족하지 못했습니다.','warn');render();return;}
  if(!hasTerrainAdjacent(player,cellIdx,card.terrainReq)){addLog(G,`${TYPES[card.terrainReq]?.ko||card.terrainReq} 요건: 해당 지형을 제공하는 인접 포켓몬이 필요합니다.`,'warn');render();return;}
  if(player.money<card.cost){addLog(G,`돈 부족! 필요 ${card.cost}원 / 보유 ${player.money}원`,'warn');render();return;}
  player.money-=card.cost;
  const h=player.hand.indexOf(cardId);if(h>=0)player.hand.splice(h,1);
  if(cell.cardId)G.deck.push(cell.cardId);
  player.zoo[cellIdx]={type:'pokemon',cardId,state:'ready',enclosureSize:cell.size};
  addLog(G,`${player.name}: ${card.name} 배치 (매력 ${card.appeal})`,'ok');
  resolveAnimalAbility(cp,cellIdx);
  uiState.animalPlayed=Number(uiState.animalPlayed||0)+1;
  uiState.animalRemaining=Math.max(0,Number(uiState.animalRemaining||1)-1);
  uiState.selectedHandCard=null;uiState.selectedZooCells=[];
  if(uiState.animalRemaining>0 && player.hand.length && player.zoo.some(c=>c?.type==='enclosure') && confirm('강도 4: 두 번째 포켓몬도 플레이할까요?')){
    emitOnlineState();render();return;
  }
  rotateActionCard(player,'animal');uiState.pendingAction=null;
  nextTurn();
}

function applyCardActionReturn(player,strength){
  if(strength===1||strength===3){const id=returnOneChoice(player,'카드 행동: 손에서 1장을 덱 맨 아래로 반납하세요.');if(id)addLog(G,`${cardById(id)?.name} 반납`,'info');}
}
function doDrawCards(){
  const cp=G.currentPlayer,player=G.players[cp],strength=getStrength(player,'cards');
  const drawCount=strength>=3?2:1;
  const drawn=[];
  for(let i=0;i<drawCount;i++){const id=takeTopCard(cp);if(id){player.hand.push(id);drawn.push(id);}}
  addLog(G,`${player.name}: 카드 ${drawn.length}장 뽑음`,'ok');
  applyCardActionReturn(player,strength);
  rotateActionCard(player,'cards');uiState.pendingAction=null;
  nextTurn();
}
function doSnapCard(cardId,pileIdx){
  const cp=G.currentPlayer,player=G.players[cp],strength=getStrength(player,'cards');
  const top=G.discardPiles[pileIdx]?.slice(-1)[0];if(top!==cardId)return;
  if((player.exhaustedCards||[]).includes(cardId)){addLog(G,'이번 라운드에 보존 행동으로 사용한 카드는 스냅으로 되가져올 수 없습니다.','warn');render();return;}
  G.discardPiles[pileIdx].pop();player.hand.push(cardId);
  addLog(G,`${player.name}: ${cardById(cardId)?.name} 스냅`,'ok');
  applyCardActionReturn(player,strength);
  rotateActionCard(player,'cards');uiState.pendingAction=null;
  nextTurn();
}

function choosePokemonCells(player, filterFn, promptText, maxCount=1){
  const opts=zooPokemonCells(player).filter(filterFn);
  if(!opts.length)return [];
  const raw=prompt(`${promptText}\n`+opts.map((x,i)=>`${i+1}:${x.card.name}(${x.cell.state})`).join('  '), maxCount===1?'1':'1');
  if(raw===null)return [];
  const picks=[...new Set(String(raw).split(',').map(x=>Number(x.trim())-1).filter(i=>i>=0&&i<opts.length))].slice(0,maxCount);
  return picks.map(i=>opts[i]);
}
function conserveWithPoints(player, points, forcedCellIdx=null){
  let remaining=Number(points||0), conserved=[];
  if(forcedCellIdx!=null){
    const cell=player.zoo[forcedCellIdx], c=cell?.type==='pokemon'?cardById(cell.cardId):null;
    if(!c||cell.state==='conserved'||c.conVal>remaining)return {ok:false,remaining,conserved};
    cell.state='conserved';remaining-=c.conVal;conserved.push(c.id);
  }
  while(remaining>0){
    const opts=zooPokemonCells(player).filter(x=>x.cell.state!=='conserved'&&x.card.conVal<=remaining);
    if(!opts.length||!confirm(`보존 포인트 ${remaining}점 남음. 다른 포켓몬을 보존할까요?`))break;
    const raw=prompt(opts.map((x,i)=>`${i+1}:${x.card.name}(${x.card.conVal})`).join('  '),'1');
    if(raw===null)break;const pick=opts[(Number(raw)||1)-1];if(!pick)continue;
    pick.cell.state='conserved';remaining-=pick.card.conVal;conserved.push(pick.card.id);
  }
  return {ok:true,remaining,conserved};
}
function markConservationDiscard(player,cardId){
  const pile=chooseDiscardPile();G.discardPiles[pile].push(cardId);
  if(!player.exhaustedCards.includes(cardId))player.exhaustedCards.push(cardId);
}
function performConservationFromHand(cardId){
  const cp=G.currentPlayer,player=G.players[cp],card=cardById(cardId);
  if(!card||getStrength(player,'sponsor')<4)return false;
  if(!conservationConditionMet(player,card.conservation)){
    addLog(G,`보존 조건 불충족: ${conservationRequirementText(card.conservation)}`,'warn');return false;
  }
  const at=player.hand.indexOf(cardId);if(at<0)return false;
  const result=conserveWithPoints(player,card.conservation.points);
  player.hand.splice(at,1);markConservationDiscard(player,cardId);
  addLog(G,`${player.name}: ${card.name} 보존 프로젝트 ${card.conservation.points}점 사용 · ${result.conserved.length}마리 보존`,'ok');
  return true;
}
function performConservationFromZoo(cellIdx,{nested=false}={}){
  const cp=G.currentPlayer,player=G.players[cp],cell=player.zoo[cellIdx];
  if(!cell||cell.type!=='pokemon')return false;
  const card=cardById(cell.cardId);if(!card||getStrength(player,'sponsor')<4)return false;
  if(!conservationConditionMet(player,card.conservation)){
    addLog(G,`보존 조건 불충족: ${conservationRequirementText(card.conservation)}`,'warn');return false;
  }
  let keep=false;
  if(cell.state!=='conserved' && player.money>=card.cost){
    keep=confirm(`${card.name}의 보존 프로젝트(${card.conservation.points}) 사용.\n확인: ${card.cost}원을 내고 이 포켓몬을 먼저 보존한 뒤 동물원에 유지\n취소: 포켓몬 카드를 버리고 프로젝트 사용`);
    if(keep && card.conVal>card.conservation.points){addLog(G,'이 카드의 보존값이 프로젝트 제공점보다 커서 유지 방식으로 사용할 수 없습니다. 버림 방식으로 처리합니다.','warn');keep=false;}
  }
  let result;
  if(keep){
    player.money-=card.cost;
    result=conserveWithPoints(player,card.conservation.points,cellIdx);
    if(!result.ok){player.money+=card.cost;return false;}
  }else{
    const old={...cell};player.zoo[cellIdx]={type:'enclosure',size:old.enclosureSize||card.size,cardId:null};
    markConservationDiscard(player,card.id);
    result=conserveWithPoints(player,card.conservation.points);
  }
  addLog(G,`${player.name}: ${card.name} 동물원 보존 프로젝트 사용 · ${result.conserved.length}마리 보존`,'ok');
  return true;
}
function doConservationFromZoo(cellIdx){
  const player=G.players[G.currentPlayer];
  if(getStrength(player,'sponsor')<4){addLog(G,'동물원 카드의 보존 행동은 후원/보존 강도 4 이상에서만 가능합니다.','warn');render();return;}
  if(performConservationFromZoo(cellIdx)){
    rotateActionCard(player,'sponsor');uiState.pendingAction=null;uiState.selectedHandCard=null;nextTurn();
  }else render();
}
function specialPlayAnimal(playerIdx,{sizeReduction=0,ignoreTerrain=false}={}){
  const player=G.players[playerIdx];
  if(!player.hand.length)return false;
  const menu=player.hand.map((id,i)=>`${i+1}:${cardById(id)?.name}`).join('  ');
  const raw=prompt(`플레이할 포켓몬을 고르세요.\n${menu}`,'1');if(raw===null)return false;
  const cardId=player.hand[(Number(raw)||1)-1],card=cardById(cardId);if(!card)return false;
  const opts=player.zoo.map((cell,idx)=>({cell,idx})).filter(x=>x.cell?.type==='enclosure'&&x.cell.size>=Math.max(1,card.size-sizeReduction));
  if(!opts.length){addLog(G,'조건에 맞는 빈 우리가 없습니다.','warn');return false;}
  const cr=prompt(opts.map((x,i)=>`${i+1}:칸${x.idx+1}(크기${x.cell.size})`).join('  '),'1');if(cr===null)return false;
  const target=opts[(Number(cr)||1)-1];if(!target)return false;
  if(!hasRequiredIcons(player,card)){addLog(G,'필요 아이콘 조건 불충족','warn');return false;}
  if(!ignoreTerrain&&!hasTerrainAdjacent(player,target.idx,card.terrainReq)){addLog(G,'물/바위 인접 요건 불충족','warn');return false;}
  if(player.money<card.cost){addLog(G,`돈 부족: ${card.cost}원 필요`,'warn');return false;}
  player.money-=card.cost;player.hand.splice(player.hand.indexOf(cardId),1);
  const enc=target.cell; if(enc.cardId)G.deck.push(enc.cardId);
  player.zoo[target.idx]={type:'pokemon',cardId,state:'ready',enclosureSize:enc.size};
  resolveAnimalAbility(playerIdx,target.idx);addLog(G,`${card.name} 특수 후원 효과로 배치`,'ok');return true;
}
function performSponsorEffect(playerIdx,card,depth=0){

  }else if(name==='엔지니어'){
    const encs=player.zoo.map((c,i)=>({c,i})).filter(x=>x.c?.type==='enclosure');
    if(encs.length){const raw=prompt(encs.map((x,i)=>`${i+1}:칸${x.i+1}`).join('  '),'1');const e=encs[(Number(raw)||1)-1];if(e){const saved=e.c;player.zoo[e.i]=null;const valid=validBuildPositions(player.zoo);const tr=prompt('이동할 칸: '+valid.map(i=>i+1).join(', '),String((valid[0]??e.i)+1));const ti=Number(tr)-1;if(valid.includes(ti))player.zoo[ti]=saved;else player.zoo[e.i]=saved;}}
    const a=prompt('다음에 원하는 행동 방향: cards / build / animal / sponsor','cards');if(ACTION_ORDER.includes(a))return {leftOverride:a};
  }else if(name==='고고학자'){

    if(raw){const sizes=raw.split(',').map(x=>Math.max(1,Number(x)||0)).filter(Boolean).slice(0,2);if(sizes.reduce((a,b)=>a+b,0)<=5){for(const size of sizes){if(player.money<size*2)break;const valid=validBuildPositions(player.zoo);if(!valid.length||!G.deck.length)break;const pos=Number(prompt('건설 칸 번호: '+valid.map(i=>i+1).join(', '),String(valid[0]+1)))-1;if(!valid.includes(pos))break;player.money-=size*2;player.zoo[pos]={type:'enclosure',size,cardId:takeTopCard(playerIdx)};}}}
  }else if(name==='과학 도서관'){
    const other=player.hand.filter(id=>id!==card.id);if(other.length){const rr=prompt(other.map((id,i)=>`${i+1}:${cardById(id)?.name}`).join('  '),'1');const id=other[(Number(rr)||1)-1];const at=player.hand.indexOf(id);if(at>=0){player.hand.splice(at,1);G.discardPiles[chooseDiscardPile()].push(id);}}
    [0,1].forEach(pi=>{const id=G.discardPiles[pi].pop();if(id)player.hand.push(id);});
  }else if(name==='소형 포켓몬 프로그램'){
    const spend=choosePokemonCells(player,x=>x.card.size>=4&&x.cell.state==='ready','소비할 대형 포켓몬',1)[0];if(spend){spend.cell.state='spent';const opts=choosePokemonCells(player,x=>x.card.size<=3&&x.cell.state!=='conserved','준비/보존할 소형 포켓몬(최대2, 쉼표)',2);opts.forEach(x=>{if(x.cell.state==='spent'&&confirm(`${x.card.name}: 확인=준비, 취소=보존`))x.cell.state='ready';else x.cell.state='conserved';});player.xTokens++;}
  }else if(name==='연방 정부 보조금'){
    const opts=player.zoo.map((c,i)=>({c,i})).filter(x=>x.c?.type==='enclosure'||x.c?.type==='pokemon');if(opts.length){const rr=prompt(opts.map((x,i)=>`${i+1}:칸${x.i+1}`).join('  '),'1');const x=opts[(Number(rr)||1)-1];if(x){if(x.c.type==='enclosure')x.c.size+=2;else x.c.enclosureSize=(x.c.enclosureSize||cardById(x.c.cardId)?.size||1)+2;drawOneToHand(player,playerIdx);}}
  }else if(name==='대형 포켓몬 프로그램'){
    const spend=choosePokemonCells(player,x=>x.card.size<=3&&x.cell.state==='ready','소비할 소형 포켓몬',1)[0];if(spend){spend.cell.state='spent';const opts=zooPokemonCells(player).filter(x=>x.card.size>=4&&x.cell.state!=='conserved');opts.forEach(x=>{if(confirm(`${x.card.name}을 준비/보존할까요?`)){if(x.cell.state==='spent'&&confirm('확인=준비, 취소=보존'))x.cell.state='ready';else x.cell.state='conserved';}});player.xTokens++;}
  }else if(name==='현장 조사'){
    specialPlayAnimal(playerIdx,{sizeReduction:2});
  }else if(name==='번식 프로그램'){
    const opts=zooPokemonCells(player);if(opts.length){const rr=prompt('보존 프로젝트를 사용할 포켓몬: '+opts.map((x,i)=>`${i+1}:${x.card.name}`).join('  '),'1');const x=opts[(Number(rr)||1)-1];if(x)performConservationFromZoo(x.idx,{nested:true});}
  }else if(name==='탐험가'){
    specialPlayAnimal(playerIdx,{ignoreTerrain:true});
  }
  return {};
}
function doSponsor(cardId){
  const cp=G.currentPlayer,player=G.players[cp],strength=getStrength(player,'sponsor'),card=cardById(cardId);
  if(!card||!player.hand.includes(cardId))return;
  const canSponsor=strength>=card.sponsor.strength,canConserve=strength>=4;
  if(!canSponsor&&!canConserve){addLog(G,'현재 강도로 이 카드의 후원/보존 행동을 할 수 없습니다.','warn');render();return;}
  let mode='sponsor';
  if(canSponsor&&canConserve){const raw=prompt(`1=후원(${card.sponsor.name}) / 2=보존(${conservationRequirementText(card.conservation)} → ${card.conservation.points})`,'1');if(raw===null)return;mode=raw==='2'?'conservation':'sponsor';}
  else if(canConserve&&!canSponsor)mode='conservation';
  let ok=false,override=null;
  if(mode==='conservation')ok=performConservationFromHand(cardId);
  else{
    const result=performSponsorEffect(cp,card)||{};override=result.leftOverride;
    const at=player.hand.indexOf(cardId);if(at>=0){player.hand.splice(at,1);G.discardPiles[chooseDiscardPile()].push(cardId);} 
    addLog(G,`${player.name}: ${card.name} 후원 — ${card.sponsor.name}`,'ok');ok=true;
  }
  if(!ok){render();return;}
  rotateActionCard(player,'sponsor');if(override&&ACTION_ORDER.includes(override))player.leftAction=override;
  uiState.pendingAction=null;uiState.selectedHandCard=null;uiState.selectedZooCells=[];nextTurn();
}

function doPass(){
  const cp=G.currentPlayer;
  const player=G.players[cp];
  let raw=prompt('패스: 행동 카드를 반시계 방향으로 몇 칸 돌릴까요? (0, 1, 2)', '1');
  if(raw===null)return;
  let steps=Math.max(0,Math.min(2,Number(raw)||0));
  passAction(player,steps);
  addLog(G,`${player.name}: 패스 → 반시계 ${steps}칸, 보라(X) 면으로 전환`,'info');
  uiState.pendingAction=null;
  nextTurn();
}

function chooseDiscardPile(){
  if(G.discardPiles[0].length===0)return 0;
  if(G.discardPiles[1].length===0)return 1;
  const raw=prompt('버릴 더미를 선택하세요: 1 또는 2','1');
  return raw==='2'?1:0;
}
function doDiscardCards(){
  const cp=G.currentPlayer;
  const player=G.players[cp];
  if(player.hand.length===0){addLog(G,'버릴 카드가 없습니다.','warn');render();return;}
  const menu=player.hand.map((id,i)=>`${i+1}:${cardById(id)?.name}`).join('  ');
  const raw=prompt(`버릴 카드 번호를 쉼표로 입력하세요. 이 행동에서는 원하는 수만큼 버릴 수 있습니다.\n${menu}`,'1');
  if(raw===null)return;
  const picks=[...new Set(raw.split(',').map(x=>Number(x.trim())-1).filter(i=>i>=0&&i<player.hand.length))].sort((a,b)=>b-a);
  if(!picks.length){addLog(G,'카드를 선택하지 않았습니다.','warn');render();return;}
  picks.forEach(i=>{
    const id=player.hand.splice(i,1)[0];
    const pile=chooseDiscardPile(); G.discardPiles[pile].push(id);
    addLog(G,`${player.name}: ${cardById(id)?.name} 버림`,'info');
  });
  addLog(G,'카드 버리기 행동 — 행동 카드는 회전하지 않음','warn');
  nextTurn();
}

function showEarnMoneyUI(){
  const cp=G.currentPlayer;
  const player=G.players[cp];
  const sources=[];
  player.hand.forEach((id,i)=>sources.push({kind:'hand',i,id,label:`손 ${cardById(id)?.name} → ${cardById(id)?.discardValue}원`}));
  player.zoo.forEach((cell,i)=>{if(cell?.type==='pokemon'&&cell.state==='ready'){const c=cardById(cell.cardId);sources.push({kind:'zoo',i,id:cell.cardId,label:`동물원 ${c?.name} 소비 → ${c?.moneyValue}원`});}});
  if(!sources.length){addLog(G,'돈을 만들 수 있는 준비 카드가 없습니다.','warn');render();return;}
  const raw=prompt('돈을 만들 카드 번호를 선택하세요.\n'+sources.map((x,i)=>`${i+1}:${x.label}`).join('\n'),'1');
  if(raw===null)return; const src=sources[Number(raw)-1]; if(!src)return;
  if(src.kind==='hand') discardForMoney(G,cp,src.id); else spendZooCard(G,cp,src.i);
  emitOnlineState(); render();
}

function useXToken(){
  const cp=G.currentPlayer;
  const player=G.players[cp];
  if(player.isPurpleSide){
    player.isPurpleSide=false; player.tempBoost=(player.tempBoost||0)+1;
    addLog(G,`${player.name}: 행동카드를 보라 면에서 파란 면으로 뒤집어 강도 +1`,'act');
  }else if(player.xTokens>0){
    player.xTokens--; player.tempBoost=(player.tempBoost||0)+1;
    addLog(G,`${player.name}: X 보너스 1개 사용 → 강도 +1`,'act');
  }else return;
  emitOnlineState(); render();
}

function nextTurnCore(){
  const cp=G.currentPlayer;
  enforceHandLimit(G.players[cp]);

  if(G.endAfterPlayer===cp){
    G.phase='end';
    addLog(G,'=== 게임 종료! 최종 점수 계산 ===','ok');
    render();
    return;
  }

  if(G.players[cp].extraTurn){
    G.players[cp].extraTurn=false;
    G.turn++;
    addLog(G,`${G.players[cp].name}: 추가 행동 1회`,'ok');
    render();
    return;
  }

  G.currentPlayer=1-cp;
  G.turn++;

  if(G.mode==='solo'&&G.currentPlayer===1){
    arminTakeTurn(G);
    G.currentPlayer=0;
    G.turn++;
  }
  render();
}

// ─── 종료 화면 ───
function renderEnd(){
  if(G.mode==='solo')prepareArminEndScoring(G);
  const s0=calcScores(G.players[0]);
  const s1=G.mode==='solo'?calcArminScores(G.players[1]):calcScores(G.players[1]);
  const winner=s0.total>s1.total?0:s1.total>s0.total?1:-1;

  const rows=[G.players[0],G.players[1]].map((p,i)=>{
    const s=(G.mode==='solo'&&i===1)?calcArminScores(p):calcScores(p);
    const isWin=i===winner;
    return `<tr class="${isWin?'winner-row':''}">
      <td>${isWin?'🏆 ':''}${p.name}</td>
      <td>${s.appeal}</td>
      <td>${s.conservation}</td>
      <td>-${s.emptyPenalty}</td>
      <td class="total" style="color:var(--accent)">${s.total}</td>
    </tr>`;
  }).join('');

  return `<div class="end-screen">
    <div class="end-card">
      <div class="end-title">${winner===-1?'무승부!':G.players[winner].name+' 승리! 🎉'}</div>
      <div style="color:var(--muted);font-size:.82rem;margin-bottom:12px">4라운드 종료 · 최종 점수</div>
      <table class="score-table">
        <thead><tr><th>이름</th><th>매력</th><th>보존</th><th>빈우리</th><th>합계</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div style="font-size:.72rem;color:var(--muted);margin-bottom:16px;line-height:1.6">
        매력 점수 + 보존 점수 - 빈 우리×2<br>
        동점이면 매력 점수가 높은 쪽 승리
      </div>
      <button class="btn primary" style="width:100%" id="endNewGame">새 게임 시작</button>
    </div>
  </div>`;
}

function attachEndEvents(){
  document.getElementById('endNewGame')?.addEventListener('click',()=>{ if (IS_SOLO_PARAM) clearSoloSave(); G=null; render(); });
}

// ══════════════════════════════════════════════════════════════════
// URL 파라미터 처리 & 온라인/솔로 브리지
// ══════════════════════════════════════════════════════════════════
const _Q = new URLSearchParams(location.search);
const IS_SOLO_PARAM    = _Q.get('solo')   === '1';
const IS_ONLINE_PARAM  = _Q.get('online') === '1' && window.parent !== window;
const ONLINE_SEAT      = Number.isFinite(Number(_Q.get('seat'))) ? Number(_Q.get('seat')) : 0;
const ONLINE_IS_HOST   = _Q.get('host')   === '1';
const IS_ONLINE_IS_HOST = IS_ONLINE_PARAM && ONLINE_IS_HOST;
let   ONLINE_NAMES    = [];
try { ONLINE_NAMES = JSON.parse(_Q.get('names') || '[]'); } catch {}

// 솔로 자동 저장/이어하기. 온라인 상태는 Supabase가 담당하므로 로컬 저장하지 않는다.
const SOLO_SAVE_KEY = 'boardmate:pokemon-minima:solo:v1';
function saveSoloState(){
  if(!IS_SOLO_PARAM || !G) return;
  try{ localStorage.setItem(SOLO_SAVE_KEY, JSON.stringify(G)); }catch{}
}
function loadSoloState(){
  if(!IS_SOLO_PARAM) return null;
  try{
    const raw=localStorage.getItem(SOLO_SAVE_KEY);
    if(!raw) return null;
    const parsed=JSON.parse(raw);
    if(!parsed?.players || parsed.players.length!==2) return null;
    return parsed;
  }catch{ return null; }
}
function clearSoloSave(){ try{ localStorage.removeItem(SOLO_SAVE_KEY); }catch{} }

// 온라인: 부모 창에 준비됨 알림
if (IS_ONLINE_PARAM) {
  setTimeout(() => window.parent.postMessage({ type: 'pokemon_minima_ready' }, '*'), 0);

  // 부모 창에서 상태 수신
  window.addEventListener('message', e => {
    if (e.source !== window.parent) return;
    if (e.data?.type === 'game_state' && e.data.state) {
      try {
        const incoming = typeof e.data.state === 'string'
          ? JSON.parse(e.data.state) : e.data.state;
        if (!incoming?.players?.length) return;
        G = incoming;
        // 내 차례가 아니면 읽기 전용
        uiState.viewPlayer = ONLINE_SEAT;
        render();
      } catch(err) { console.warn('[pm-online] state parse failed', err); }
    }
  });
}

// 상태 저장: 온라인 모드일 때 부모에 postMessage
function emitOnlineState() {
  if (IS_ONLINE_PARAM && G) {
    window.parent.postMessage({ type: 'game_state', state: JSON.stringify(G) }, '*');
  }
}
function nextTurn() {
  nextTurnCore();
  emitOnlineState();
  if (G?.phase === 'end') publishResult();
}

// 종료: 순위 전달
function publishResult() {
  if (!IS_ONLINE_PARAM || !G) return;
  const s = G.players.map((p,i) => ({ i, total: calcScores(p).total }))
    .sort((a,b) => b.total - a.total)
    .map(x => x.i);
  window.parent.postMessage({ type: 'game_result', order: s }, '*');
}

// ─── 초기 실행 ───
// 솔로 파라미터: 이름/모드 자동 설정
if (IS_SOLO_PARAM && !G) {
  // 저장된 솔로 판이 있으면 자동으로 이어서 시작한다. 없으면 새 판을 만든다.
  const saved = loadSoloState();
  if(saved && saved.phase !== 'end') G = saved;
  else {
    if(saved?.phase === 'end') clearSoloSave();
    G = newGame({ p1name: '트레이너', p2name: 'ARMIN', mode: 'solo', difficulty: 'normal' });
    startDraft();
  }
  uiState = { selectedHandCard:null, selectedZooCells:[], pendingAction:null,
    pendingCost:0, moneyCards:[], viewPlayer:0,
    draftStep:0, draftCurrentPlayer:0, draftPassCards:[] };
}

// 온라인 파라미터: 방장이면 설정, 게스트면 대기
if (IS_ONLINE_PARAM && !IS_ONLINE_IS_HOST) {
  // 게스트: 부모에서 상태 오기 전까지 대기 화면
  document.getElementById('root').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px;background:var(--bg)">
      <div style="font-size:1.5rem">🎮</div>
      <div style="color:var(--text);font-weight:900">포켓몬 미니마</div>
      <div style="color:var(--muted);font-size:.85rem">방장이 게임을 시작하기를 기다리는 중…</div>
    </div>`;
} else if (IS_ONLINE_PARAM && ONLINE_IS_HOST && ONLINE_NAMES.length >= 2) {
  // 방장: 이름 받아서 바로 게임 시작
  G = newGame({ p1name: ONLINE_NAMES[0], p2name: ONLINE_NAMES[1], mode: '2p', difficulty: 'normal' });
  uiState = { selectedHandCard:null, selectedZooCells:[], pendingAction:null,
    pendingCost:0, moneyCards:[], viewPlayer:ONLINE_SEAT,
    draftStep:0, draftCurrentPlayer:0, draftPassCards:[] };
  startDraft();
  render();
} else {
  render();
}

</script>
