<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>포켓몬 미니마 ⚡</title>
<style>
/* ─── 토큰 시스템 ─── */
:root {
  --red:#e53e3e; --blue:#3182ce; --yellow:#d69e2e; --green:#38a169;
  --purple:#805ad5; --teal:#319795; --orange:#dd6b20; --pink:#d53f8c;
  --bg:#0f1923; --surface:#182230; --card:#1e2d3d; --border:#2d4158;
  --text:#e8f0fe; --muted:#8a9bb8; --accent:#f6c90e;
  --starter:#f6e05e; --shadow:0 4px 20px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--text)}
button{cursor:pointer;font-family:inherit}
button:disabled{opacity:.4;cursor:not-allowed}

/* ─── 레이아웃 ─── */
#root{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-size:1.2rem;font-weight:900;letter-spacing:-.03em;color:var(--accent)}
.brand span{color:var(--text);font-weight:400;font-size:.85rem;margin-left:6px}
.round-badge{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:4px 12px;font-size:.8rem;font-weight:700;color:var(--muted)}
.top-btns{display:flex;gap:6px}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;padding:7px 14px;font-weight:700;font-size:.82rem;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){background:var(--border)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#000}
.btn.primary:hover:not(:disabled){opacity:.88}
.btn.danger{background:rgba(229,62,62,.15);border-color:var(--red);color:#fc8181}
.btn.small{padding:4px 9px;font-size:.75rem}

/* ─── 메인 레이아웃 ─── */
.game-area{display:grid;grid-template-columns:230px 1fr 230px;gap:12px;padding:12px;flex:1;min-height:0}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.panel-title{font-size:.72rem;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}

/* ─── 포켓몬 카드 ─── */
.poke-card{background:var(--card);border:2px solid var(--border);border-radius:11px;padding:9px;position:relative;cursor:pointer;transition:border-color .12s,transform .08s}
.poke-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.poke-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(246,201,14,.3)}
.poke-card.starter{border-color:var(--starter)}
.poke-card.spent{opacity:.6}
.poke-card.conserved{border-color:var(--green);background:rgba(56,161,105,.08)}
.poke-card.exhausted{opacity:.5;outline:2px dashed var(--muted)}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:4px;margin-bottom:5px}
.card-name{font-weight:900;font-size:.9rem;line-height:1.1}
.card-name small{display:block;font-size:.65rem;font-weight:400;color:var(--muted);font-style:italic}
.card-stats{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.stat-pill{display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.07);border-radius:5px;padding:2px 6px;font-size:.72rem;font-weight:700}
.appeal-num{font-size:1rem;font-weight:900;color:var(--accent)}
.cons-num{font-size:.85rem;font-weight:900;color:var(--green)}
.size-badge{background:rgba(99,102,241,.2);color:#a5b4fc;border-radius:4px;padding:1px 5px;font-size:.68rem;font-weight:800}
.icon-row{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:4px}
.icon{width:20px;height:20px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:900}
.card-ability{font-size:.7rem;color:var(--muted);line-height:1.35;border-top:1px solid var(--border);padding-top:4px;margin-top:2px}
.sponsor-section{background:rgba(49,130,206,.1);border:1px solid rgba(49,130,206,.3);border-radius:6px;padding:5px 7px;margin-top:4px}
.sponsor-label{font-size:.62rem;font-weight:800;color:#63b3ed;margin-bottom:2px}
.sponsor-text{font-size:.68rem;color:#90cdf4;line-height:1.3}
.cons-section{background:rgba(56,161,105,.1);border:1px solid rgba(56,161,105,.3);border-radius:6px;padding:5px 7px;margin-top:4px}
.cons-label{font-size:.62rem;font-weight:800;color:#68d391;margin-bottom:2px}
.cons-text{font-size:.68rem;color:#9ae6b4;line-height:1.3}
.card-state-badge{position:absolute;top:5px;right:5px;font-size:.58rem;font-weight:900;padding:1px 5px;border-radius:3px}
.state-ready{background:rgba(56,161,105,.2);color:#68d391}
.state-spent{background:rgba(100,116,139,.2);color:#94a3b8}
.state-conserved{background:rgba(56,161,105,.3);color:#68d391}

/* ─── 동물원 그리드 ─── */
.zoo-wrap{display:flex;flex-direction:column;gap:10px}
.zoo-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,80px);gap:6px}
.zoo-cell{background:var(--card);border:1.5px dashed var(--border);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--muted);position:relative;transition:border-color .12s}
.zoo-cell.occupied{border-style:solid;border-color:var(--border)}
.zoo-cell.enclosure{border-color:rgba(99,102,241,.5)}
.zoo-cell.has-pokemon{border-color:var(--accent);background:rgba(246,201,14,.05)}
.zoo-cell.valid-target{border-color:var(--green);background:rgba(56,161,105,.08);cursor:pointer;animation:pulse-green 1.2s infinite}
.zoo-cell.invalid-target{opacity:.3}
@keyframes pulse-green{0%,100%{border-color:rgba(56,161,105,.5)}50%{border-color:#68d391}}
.cell-content{text-align:center;padding:4px}
.cell-poke{font-size:.75rem;font-weight:800;color:var(--text);line-height:1.2}
.cell-poke small{display:block;font-size:.6rem;color:var(--muted);font-weight:400}
.cell-size{position:absolute;bottom:3px;right:4px;font-size:.6rem;font-weight:900;color:#6b7280}
.cell-icons{display:flex;gap:2px;position:absolute;top:3px;left:4px}
.enc-num{font-size:1.2rem;font-weight:900;color:rgba(99,102,241,.4)}

/* ─── 행동 카드 ─── */
.action-card{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:10px;margin-bottom:8px}
.action-card-title{font-size:.75rem;font-weight:900;color:var(--muted);margin-bottom:8px;letter-spacing:.05em}
.action-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px}
.action-slot{border-radius:7px;padding:6px 4px;text-align:center;cursor:pointer;border:1.5px solid var(--border);transition:all .12s;position:relative}
.action-slot:hover{border-color:var(--accent)}
.action-slot.active-slot{border-color:var(--accent);background:rgba(246,201,14,.1)}
.slot-num{font-size:1rem;font-weight:900;color:var(--accent);display:block}
.slot-label{font-size:.58rem;font-weight:700;color:var(--muted);display:block}
.slot-icon{font-size:1.1rem;display:block;margin-bottom:2px}
.strength-display{text-align:center;margin-bottom:8px}
.strength-num{font-size:2rem;font-weight:900;color:var(--accent);line-height:1}
.strength-label{font-size:.7rem;color:var(--muted)}
.pass-indicator{background:rgba(128,90,213,.15);border:1px solid rgba(128,90,213,.4);border-radius:7px;padding:5px 8px;font-size:.72rem;color:#b794f4;text-align:center}
.token-count{display:flex;align-items:center;gap:4px;font-size:.8rem;font-weight:700}
.x-token{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;background:var(--purple);border-radius:4px;font-size:.65rem;font-weight:900;color:#fff}

/* ─── 점수 패널 ─── */
.score-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)}
.score-row:last-child{border-bottom:none}
.score-label{font-size:.75rem;color:var(--muted)}
.score-val{font-size:.95rem;font-weight:900}

/* ─── 덱/버린패 ─── */
.deck-area{display:flex;gap:8px;align-items:stretch}
.deck-pile{flex:1;background:var(--card);border:1.5px solid var(--border);border-radius:9px;padding:8px;text-align:center;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:border-color .12s}
.deck-pile:hover{border-color:var(--accent)}
.deck-pile.valid{border-color:var(--green)}
.deck-count{font-size:1.2rem;font-weight:900;color:var(--accent)}
.deck-label{font-size:.65rem;color:var(--muted)}
.display-cards{display:flex;gap:5px;flex-wrap:wrap}
.display-mini{background:var(--card);border:1.5px solid var(--border);border-radius:7px;padding:5px 7px;font-size:.72rem;cursor:pointer;transition:border-color .12s;max-width:110px}
.display-mini:hover{border-color:var(--accent)}
.display-mini.valid{border-color:var(--green)}
.display-mini strong{display:block;font-size:.75rem}

/* ─── 손패 ─── */
.hand-area{display:flex;gap:6px;flex-wrap:wrap}
.hand-card{background:var(--card);border:2px solid var(--border);border-radius:9px;padding:6px 8px;font-size:.75rem;cursor:pointer;transition:all .12s;max-width:130px;position:relative}
.hand-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.hand-card.selected{border-color:var(--accent);background:rgba(246,201,14,.08)}
.hand-card.playable{border-color:var(--green)}
.hand-card.not-playable{opacity:.45}
.hand-count{font-size:.72rem;color:var(--muted);font-weight:700}

/* ─── 메시지/액션 선택 ─── */
.action-bar{background:var(--surface);border-top:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phase-msg{font-size:.82rem;font-weight:700;flex:1;color:var(--text)}
.phase-hint{font-size:.72rem;color:var(--muted)}
.action-btns{display:flex;gap:6px;flex-wrap:wrap}

/* ─── 설정 화면 ─── */
.setup-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.setup-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;max-width:480px;width:100%}
.setup-title{font-size:2rem;font-weight:900;text-align:center;margin-bottom:4px;color:var(--accent);letter-spacing:-.04em}
.setup-sub{font-size:.82rem;text-align:center;color:var(--muted);margin-bottom:24px}
.setup-field{margin-bottom:16px}
.setup-label{font-size:.75rem;font-weight:800;color:var(--muted);margin-bottom:6px;display:block}
.setup-input{width:100%;padding:10px 12px;background:var(--card);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem}
.setup-input:focus{outline:2px solid var(--accent);border-color:transparent}
.setup-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.setup-option{border:1.5px solid var(--border);background:var(--card);border-radius:9px;padding:12px;text-align:center;cursor:pointer;transition:all .12s}
.setup-option:hover,.setup-option.active{border-color:var(--accent);background:rgba(246,201,14,.08)}
.setup-option strong{display:block;font-size:.9rem;font-weight:900}
.setup-option small{font-size:.72rem;color:var(--muted)}
.setup-start{width:100%;margin-top:20px;padding:14px;font-size:1rem;font-weight:900;background:var(--accent);border:none;border-radius:10px;color:#000;cursor:pointer;transition:opacity .12s}
.setup-start:hover{opacity:.88}

/* ─── 로그 ─── */
.log-area{background:var(--card);border-radius:8px;padding:8px;max-height:120px;overflow-y:auto;font-size:.68rem;line-height:1.6;color:var(--muted)}
.log-area .entry{padding:1px 0}
.log-area .entry.ok{color:#68d391}.log-area .entry.warn{color:#f6c90e}.log-area .entry.act{color:#90cdf4}

/* ─── 종료 ─── */
.end-screen{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:100}
.end-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;max-width:440px;width:90%;text-align:center}
.end-title{font-size:1.8rem;font-weight:900;margin-bottom:8px;color:var(--accent)}
.score-table{width:100%;border-collapse:collapse;margin:16px 0;font-size:.82rem}
.score-table th{color:var(--muted);font-size:.7rem;padding:5px;border-bottom:1px solid var(--border)}
.score-table td{padding:8px 5px;border-bottom:1px solid rgba(45,65,88,.5)}
.score-table .total{font-weight:900;font-size:.95rem}
.winner-row{background:rgba(246,201,14,.08)}

/* ─── 툴팁 ─── */
.tooltip{position:relative}
.tooltip-body{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#0a1218;border:1px solid var(--border);border-radius:8px;padding:8px 10px;width:200px;font-size:.72rem;line-height:1.5;z-index:50;color:var(--text)}
.tooltip:hover .tooltip-body{display:block}

/* ─── ARMIN ─── */
.armin-area{background:rgba(128,90,213,.07);border:1px solid rgba(128,90,213,.3);border-radius:10px;padding:10px}
.armin-title{font-size:.7rem;font-weight:800;color:#b794f4;margin-bottom:6px}

/* ─── 모바일 ─── */
@media(max-width:900px){
  .game-area{grid-template-columns:1fr;grid-template-rows:auto}
  .zoo-grid{grid-template-rows:repeat(3,70px)}
}
.pokemon-card-art{width:58px;height:58px;object-fit:contain;display:block;margin:-2px auto 4px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.28))}.zoo-pokemon-art{width:52px;height:52px;object-fit:contain;display:block;margin:0 auto 3px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.28))} .card-header{position:relative;min-height:64px}.card-header .pokemon-card-art{position:absolute;right:0;top:0;width:52px;height:52px}.card-header .card-name{padding-right:48px}</style>
<script src="./solo-save-ui.js"></script>
</head>

const STARTER_IDS = ['c01','c02','c03','c04','c05','c06'];

// ══════════════════════════════════════════════════════════════════
// 게임 상태
// ══════════════════════════════════════════════════════════════════
let G = null; // 전체 게임 상태

function cardById(id){ return CARDS.find(c=>c.id===id); }

function shuffleArr(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function newGame(opts={}){
  const {p1name='트레이너1', p2name='트레이너2', mode='2p', difficulty='normal'} = opts;
  const starters = shuffleArr(STARTER_IDS);
  const nonStarters = shuffleArr(CARDS.filter(c=>!c.starter).map(c=>c.id));

  // 드래프트 준비: 각 플레이어에게 시작카드2 + 일반카드2 = 4장 배분
  const p1Draft = [starters[0], starters[1], nonStarters[0], nonStarters[1]];
  const p2Draft = [starters[2], starters[3], nonStarters[2], nonStarters[3]];
  const remainDeck = shuffleArr([
    starters[4], starters[5],
    ...nonStarters.slice(4)
  ]);

  const makePlayer = (name, draftCards, seat) => ({
    name, seat,
    hand: [],           // 현재 손패 (드래프트 완료 후 3장)
    zoo: Array(9).fill(null), // 3x3 grid, 각 칸: null | {type:'enclosure'|'pokemon', cardId?, size?, state?}
    money: 0,
    xTokens: 0,
    appealScore: 0,
    conservationScore: 0,
    draftPool: draftCards, // 드래프트 풀
    draftKept: [],         // 드래프트에서 고른 카드
    // 행동카드 상태: 현재 어느 면이 위(=강도)인지
    // 4개 방향: top=4, right=3, bottom=2, left=1
    actionOrientation: 'top', // top|right|bottom|left → strength 4|3|2|1
    isPurpleSide: false,       // X토큰면(보라색)이면 true
    exhaustedCards: new Set(), // 이번 라운드 소진된 카드ID
    exhaustDir: null,          // 소진 방향 (left|right)
  });

  return {
    phase: 'draft',  // draft | playing | break | end
    round: 1,        // 1~4
    turn: 0,
    currentPlayer: 0,
    mode,
    difficulty,
    players: [
      makePlayer(p1name, p1Draft, 0),
      makePlayer(mode==='solo' ? 'ARMIN' : p2name, p2Draft, 1),
    ],
    deck: remainDeck,
    discard: [],     // 버린 카드 더미 (두 개, 인덱스 0,1)
    discardPiles: [[], []],
    log: [],
    pendingAction: null, // 현재 진행 중인 행동
    draftRound: 0,
    draftPass: [],
  };
}

// ─── 강도 계산 ───
function getStrength(player){
  if(player.isPurpleSide) return 0; // 보라색(X토큰면) → 강도 없음
  const map = {top:4, right:3, bottom:2, left:1};
  return map[player.actionOrientation] || 1;
}

// 행동카드를 수행 후 왼쪽(1번)으로 로테이션
function rotateActionCard(player){
  const order = ['top','right','bottom','left'];
  const idx = order.indexOf(player.actionOrientation);
  player.actionOrientation = order[(idx+1)%4]; // 시계방향=다음 값 = 강도 낮아짐
  // 실제 규칙: 사용한 액션이 left(1) 위치로 이동, 나머지 밀려남
  // 단순화: 방향을 한 칸 반시계로
  // top→left, left→bottom, bottom→right, right→top
  const rotMap = {top:'left', left:'bottom', bottom:'right', right:'top'};
  player.actionOrientation = rotMap[player.actionOrientation];
  player.isPurpleSide = false;
}

// 패스: 반시계로 0~2칸 + 보라색면으로
function passAction(player, steps){
  const order = ['top','right','bottom','left'];
  let idx = order.indexOf(player.actionOrientation);
  idx = (idx - steps + 4) % 4;
  player.actionOrientation = order[idx];
  player.isPurpleSide = true;
}

// ─── 점수 계산 ───
function calcScores(player){
  let appeal = 0, conservation = 0, scoring = 0, emptyEnc = 0;
  player.zoo.forEach(cell=>{
    if(!cell) return;
    if(cell.type==='enclosure') emptyEnc++;
    if(cell.type==='pokemon'){
      const card = cardById(cell.cardId);
      if(card){
        appeal += card.appeal;
        if(cell.state==='conserved') conservation += card.conVal;
      }
    }
  });
  // 점수 능력 (갈색 원) - 단순화하여 기본 매력만
  return {
    appeal,
    conservation,
    emptyPenalty: emptyEnc * 2,
    scoring,
    total: appeal + conservation + scoring - (emptyEnc * 2),
  };
}

// ─── 인접 셀 ───
function adjacentCells(idx){
  const row = Math.floor(idx/3), col = idx%3, adj=[];
  if(row>0) adj.push(idx-3);
  if(row<2) adj.push(idx+3);
  if(col>0) adj.push(idx-1);
  if(col<2) adj.push(idx+1);
  return adj;
}

// 첫 배치 가능 칸: 왼쪽 하단(인덱스 6) 또는 인접
function validBuildPositions(zoo){
  const occupied = zoo.map((c,i)=>c?i:-1).filter(i=>i>=0);
  if(occupied.length===0) return [6]; // 첫 우리는 반드시 6번(좌측 하단)
  const valid = new Set();
  occupied.forEach(idx=>{
    adjacentCells(idx).forEach(a=>{
      if(!zoo[a]) valid.add(a);
    });
  });
  return [...valid];
}

// ─── 돈 생성 ───
function generateMoney(player, amount){
  player.money += amount;
}

function spendMoney(player, amount){
  if(player.money < amount) return false;
  player.money -= amount;
  return true;
}

// 카드 버리기 → 수입 = card.appeal (버리기 수입값)
function discardForMoney(G, playerIdx, cardId){
  const p = G.players[playerIdx];
  const hIdx = p.hand.indexOf(cardId);
  if(hIdx<0) return;
  const card = cardById(cardId);
  p.hand.splice(hIdx,1);
  // 버린 카드 더미에 추가
  if(G.discardPiles[0].length===0) G.discardPiles[0].push(cardId);
  else if(G.discardPiles[1].length===0) G.discardPiles[1].push(cardId);
  else {
    const pileIdx = Math.random()<0.5?0:1;
    G.discardPiles[pileIdx].push(cardId);
  }
  generateMoney(p, card.appeal);
  addLog(G, `${p.name}: ${card.name} 버려서 ${card.appeal}원 획득`, 'act');
}

// 동물원 카드 소비(ready→spent) → 수입 = 해당값
function spendZooCard(G, playerIdx, cellIdx){
  const p = G.players[playerIdx];
  const cell = p.zoo[cellIdx];
  if(!cell||cell.type!=='pokemon'||cell.state!=='ready') return;
  const card = cardById(cell.cardId);
  cell.state = 'spent';
  generateMoney(p, card.appeal);
  addLog(G, `${p.name}: ${card.name} 소비해 ${card.appeal}원 획득`, 'act');
}

function addLog(G, msg, cls='info'){
  G.log.unshift({msg, cls, t:Date.now()});
  if(G.log.length>50) G.log.pop();
}

// ══════════════════════════════════════════════════════════════════
// ARMIN 봇 로직
// ══════════════════════════════════════════════════════════════════
function arminInterest(cardId, round, botZoo){
  const card = cardById(cardId);
  if(!card) return -99;
  const E = Math.abs(round - card.size);
  // 봇 동물원의 아이콘과 매칭
  const botIcons = [];
  botZoo.forEach(cell=>{
    if(cell?.type==='pokemon'){ const c=cardById(cell.cardId); if(c) botIcons.push(...c.icons); }
  });
  const I = card.icons.filter(ic=>botIcons.includes(ic)).length;
  return I - E;
}

function arminTakeTurn(G){
  const bot = G.players[1];
  const strength = getStrength(bot);
  const orient = bot.actionOrientation;

  // 봇의 행동: 위/아래(수직) = 건설/보존 → 아무것도 안 함(critical mass 체크)
  // 좌/우(수평) = 카드/동물 → 덱 상단 버림
  if(orient==='left'||orient==='bottom'){
    // 수평 행동 → 카드 행동: 디스플레이 top 버림
    const allDisp = [...G.discardPiles[0].slice(-1), ...G.discardPiles[1].slice(-1)].filter(Boolean);
    if(allDisp.length===0 && G.deck.length>0){
      // 덱에서 뽑아 빈 디스플레이 채움
      const drawn = G.deck.shift();
      G.discardPiles[0].push(drawn);
      addLog(G, 'ARMIN: 덱 카드를 디스플레이로 이동', 'info');
    } else if(allDisp.length>0){
      // 가장 interest 낮은 것 덮음
      const sorted = allDisp.sort((a,b)=>arminInterest(a,G.round,bot.zoo)-arminInterest(b,G.round,bot.zoo));
      const toCover = sorted[0];
      // 덱 맨 위로 이동
      const pIdx = G.discardPiles[0].slice(-1)[0]===toCover ? 0 : 1;
      G.discardPiles[pIdx].pop();
      G.deck.unshift(toCover);
      if(G.deck.length>0){
        const n = G.deck.shift();
        if(G.discardPiles[pIdx].length===0) G.discardPiles[pIdx].push(n);
        else G.discardPiles[1-pIdx].push(n);
      }
      addLog(G, `ARMIN: interest 낮은 카드를 덱으로`, 'info');
    }
  }
  // Critical mass 체크 (normal: 보라색 건설 도달 시)
  const critMap={casual:5,easy:3,normal:2,hard:1,veryhard:0};
  const critAt = critMap[G.difficulty]||2;
  // 액션카드가 critAt 슬롯에 도달하면 카드 획득
  const strMap={top:4,right:3,bottom:2,left:1};
  if(!bot.isPurpleSide && (strMap[orient]||1)===critAt){
    // critical mass: 최고 interest 카드 획득
    const allDisp = [...G.discardPiles[0].slice(-1), ...G.discardPiles[1].slice(-1)].filter(Boolean);
    if(allDisp.length>0){
      const best = allDisp.sort((a,b)=>arminInterest(b,G.round,bot.zoo)-arminInterest(a,G.round,bot.zoo))[0];
      const pIdx = G.discardPiles[0].slice(-1)[0]===best?0:1;
      G.discardPiles[pIdx].pop();
      // 봇 동물원에 추가 (간단히 빈 칸에)
      const freeCell = bot.zoo.findIndex(c=>c===null);
      if(freeCell>=0){
        bot.zoo[freeCell] = {type:'pokemon', cardId:best, state:'ready'};
        addLog(G, `ARMIN: ${cardById(best)?.name} 획득 (critical mass)`, 'ok');
      }
      // 행동카드 시작으로 리셋
      bot.actionOrientation='top';
      bot.isPurpleSide=false;
    }
    return;
  }

  rotateActionCard(bot);
}

// ══════════════════════════════════════════════════════════════════
// 휴식 처리
// ══════════════════════════════════════════════════════════════════
function processBreak(G){
  addLog(G, `=== 휴식: 라운드 ${G.round} 종료 ===`, 'warn');
  G.players.forEach(p=>{
    // 손패 3장 초과 버림
    while(p.hand.length>3){
      const dropped = p.hand.pop();
      if(G.discardPiles[0].length===0) G.discardPiles[0].push(dropped);
      else G.discardPiles[1].push(dropped);
    }
    // 커피잔 동물 준비 상태로
    p.zoo.forEach(cell=>{
      if(cell?.type==='pokemon'){
        const card = cardById(cell.cardId);
        if(card?.coffee && cell.state==='spent') cell.state='ready';
      }
    });
    // 소진 초기화
    p.exhaustedCards = new Set();
    // 행동카드 X토큰면 → 수입이 아닌 단순 초기화
  });
  // 덱: 버린 카드 섞어 새 덱
  const allDiscard = [...G.discardPiles[0], ...G.discardPiles[1]];
  G.discardPiles = [[],[]];
  G.deck = shuffleArr([...G.deck, ...allDiscard]);

  G.round++;
  G.turn = 0;
  G.currentPlayer = 0;

  if(G.round > 4){
    G.phase = 'end';
    addLog(G, '=== 게임 종료! 최종 점수 계산 ===', 'ok');
  } else {
    G.phase = 'playing';
    addLog(G, `=== 라운드 ${G.round} 시작 ===`, 'ok');
  }
}

function renderZoo(player, playerIdx, interactive=false){

      const validAnimal = interactive && uiState.pendingAction==='animal' && uiState.selectedHandCard &&
        player.zoo.some(c=>c?.type==='enclosure');

      return `<div class="${cls}" data-cell="${idx}" data-player="${playerIdx}">

          <span class="enc-num">${cell.size}</span>
          <div style="font-size:.6rem;color:var(--muted)">크기 ${cell.size} 우리</div>
        </div>

function renderActionCard(player, interactive=false){
  const strength = getStrength(player);
  const orient = player.actionOrientation;
  const actions = [
    {id:'cards',   icon:'🃏', label:'카드',    desc:'덱에서 뽑기 or 스냅'},
    {id:'build',   icon:'🏗', label:'건설',    desc:'우리 건설 (크기×2원)'},
    {id:'animal',  icon:'🐾', label:'포켓몬', desc:'배치 (강도1=불가)'},
    {id:'sponsor', icon:'🤝', label:'후원보존',desc:'후원자 or 보존'},
  ];
  // 현재 top에 있는 행동
  const orientToAction = {top:'animal',right:'sponsor',bottom:'build',left:'cards'};
  const currentAction = orientToAction[orient]||'cards';
  const strengthNum = player.isPurpleSide ? 'X' : strength;

  const slots = actions.map(a=>{
    // 어느 슬롯이 현재 어떤 강도인지 계산
    const actionOrient = Object.entries(orientToAction).find(([,v])=>v===a.id)?.[0]||'left';
    const strMap={top:4,right:3,bottom:2,left:1};
    const aStr = strMap[actionOrient]||1;
    const isActive = a.id===currentAction && !player.isPurpleSide;
    return `<div class="action-slot ${isActive?'active-slot':''}" data-action="${a.id}">
      <span class="slot-icon">${a.icon}</span>
      <span class="slot-num">${aStr}</span>
      <span class="slot-label">${a.label}</span>
    </div>`;
  });

  return `<div class="action-card">
    <div class="action-card-title">행동 카드</div>
    <div class="action-slots">${slots.join('')}</div>
    <div class="strength-display">
      <div class="strength-num">${strengthNum}</div>
      <div class="strength-label">현재 강도 · ${player.isPurpleSide?'X토큰면(보라)':'파란면'}</div>
    </div>
    ${player.isPurpleSide?`<div class="pass-indicator">⚡ X토큰면 — 다음 행동 시 강도+1</div>`:''}
    <div class="token-count">${player.xTokens} <span class="x-token">X</span> X토큰</div>
  </div>`;
}

function attachDraftEvents(){
  document.querySelectorAll('[data-draft-pick]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      const id=btn.dataset.draftPick;
      draftPick(id);
    });
  });
  const doneBtn = document.getElementById('draftDoneBtn');
  if(doneBtn) doneBtn.addEventListener('click',()=>{
    finalizeDraft();
    render();
  });
}

function draftPick(cardId){
  const pIdx = G.draftCurrentPlayer;
  const p = G.players[pIdx];
  if(!p.draftPool.includes(cardId)) return;
  if(p.draftKept.length>=3) return;

  p.draftKept.push(cardId);

  // 나머지 전달
  const remaining = p.draftPool.filter(id=>id!==cardId);
  const nextP = G.players[1-pIdx];

  if(p.draftKept.length>=3){
    // 이 플레이어 드래프트 완료
    // 아직 선택 안 한 카드들 → 다음 플레이어에게
    if(pIdx===0){
      // P2 차례
      const p2 = G.players[1];
      if(p2.draftKept.length<3){
        // P2의 풀 = P1이 전달한 카드들 + P2 원래 풀
        G.draftPassCards = remaining;
        p2.draftPool = [...p2.draftPool, ...remaining.slice(0, Math.max(0,3-p2.draftKept.length))];
        G.draftCurrentPlayer = 1;
      }
    }
    render();
    return;
  }

  // 아직 3장 미만: 나머지를 상대에게 패스하고 상대가 1장 고른 뒤 다시 받음
  // 단순화: 그냥 계속 같은 플레이어가 고름 (2인의 경우 교차)
  if(remaining.length>0){
    G.draftPassCards = remaining;
    // 상대도 아직 3장 미만이면 상대 차례
    const other = G.players[1-pIdx];
    if(other.draftKept.length<3 && other.draftPool.length>0 && pIdx===0){
      G.draftCurrentPlayer = 1;
    }
  }

  render();
}

function finalizeDraft(){
  G.players.forEach(p=>{
    // 드래프트에서 고른 카드 = 손패
    p.hand = [...p.draftKept];
    // 남은 카드 덱으로
    const unchosen = p.draftPool.filter(id=>!p.draftKept.includes(id));
    G.deck = shuffleArr([...G.deck, ...unchosen]);
    // 초기 돈 = 0
    p.money = 0;
  });
  G.phase = 'playing';
  G.round = 1;
  G.currentPlayer = 0;
  addLog(G, '=== 라운드 1 시작 ===', 'ok');
}

function renderHandCardInner(id){
  const card = cardById(id);
  return `<div style="font-weight:900;font-size:.78rem">${card?.name}</div>
  <div class="icon-row">${(card?.icons||[]).map(ic=>icon(ic)).join('')}</div>
  <div style="font-size:.65rem;color:var(--muted)">🎟${card?.appeal}·크기${card?.size}·${card?.cost}원</div>`;
}

function actionLabel(a){
  return {cards:'카드 뽑기',build:'우리 건설',animal:'포켓몬 배치',sponsor:'후원/보존'}[a]||a;
}

// ─── 게임 이벤트 ───
function attachGameEvents(){
  // 손패 카드 선택
  document.querySelectorAll('[data-hand-card]').forEach(el=>{
    el.addEventListener('click',()=>{
      const id=el.dataset.handCard;
      uiState.selectedHandCard = uiState.selectedHandCard===id ? null : id;
      render();
    });
  });

  // 동물원 셀 클릭
  document.querySelectorAll('[data-cell]').forEach(el=>{
    el.addEventListener('click',()=>{
      const cellIdx=Number(el.dataset.cell);
      const playerIdx=Number(el.dataset.player);
      if(playerIdx!==G.currentPlayer) return;
      handleCellClick(cellIdx, playerIdx);
    });
  });

  // 디스플레이 카드 클릭 (스냅)
  document.querySelectorAll('[data-disp-card]').forEach(el=>{
    el.addEventListener('click',()=>{
      if(uiState.pendingAction!=='cards') return;
      const id=el.dataset.dispCard;
      const pileIdx=Number(el.dataset.dispPile);
      doSnapCard(id, pileIdx);
    });
  });

  // 덱 클릭 (뽑기)
  const deckPile=document.getElementById('deckPile');
  if(deckPile) deckPile.addEventListener('click',()=>{
    if(uiState.pendingAction==='cards') doDrawCards();
  });

  // 행동 버튼들
  document.getElementById('btnCards')?.addEventListener('click',()=>startAction('cards'));
  document.getElementById('btnBuild')?.addEventListener('click',()=>startAction('build'));
  document.getElementById('btnAnimal')?.addEventListener('click',()=>startAction('animal'));
  document.getElementById('btnSponsor')?.addEventListener('click',()=>startAction('sponsor'));
  document.getElementById('btnConfirmAction')?.addEventListener('click',confirmAction);
  document.getElementById('btnCancelAction')?.addEventListener('click',cancelAction);
  document.getElementById('btnPass')?.addEventListener('click',doPass);
  document.getElementById('btnDiscard')?.addEventListener('click',doDiscardCards);
  document.getElementById('btnNewGame')?.addEventListener('click',()=>{G=null;render();});
  document.getElementById('btnEarnMoney')?.addEventListener('click',showEarnMoneyUI);
  document.getElementById('btnUseXToken')?.addEventListener('click',useXToken);
}

function startAction(actionType){
  const cp=G.currentPlayer;
  const player=G.players[cp];
  const strength=getStrength(player);

  if(actionType==='animal'&&strength<2){
    addLog(G,'포켓몬 행동은 강도 2 이상 필요합니다.','warn');
    render();return;
  }
  uiState.pendingAction=actionType;
  uiState.selectedHandCard=null;
  addLog(G,`${player.name}: ${actionLabel(actionType)} 행동 시작 (강도 ${strength})`,'act');
  render();
}

function confirmAction(){
  const cp=G.currentPlayer;
  const player=G.players[cp];
  const strength=getStrength(player);

  if(uiState.pendingAction==='cards'){
    doDrawCards();return;
  }
  if(uiState.pendingAction==='build'){
    if(uiState.selectedZooCells.length===0){addLog(G,'건설할 칸을 선택하세요.','warn');render();return;}
    doBuild(uiState.selectedZooCells[0]);
    return;
  }
  if(uiState.pendingAction==='animal'){
    if(!uiState.selectedHandCard){addLog(G,'배치할 포켓몬을 선택하세요.','warn');render();return;}
    if(uiState.selectedZooCells.length===0){addLog(G,'배치할 우리를 선택하세요.','warn');render();return;}
    doPlayAnimal(uiState.selectedHandCard, uiState.selectedZooCells[0]);
    return;
  }
  if(uiState.pendingAction==='sponsor'){
    if(!uiState.selectedHandCard){addLog(G,'후원/보존할 카드를 선택하세요.','warn');render();return;}
    doSponsor(uiState.selectedHandCard);
    return;
  }
  endTurn();
}

function cancelAction(){
  uiState.pendingAction=null;
  uiState.selectedHandCard=null;
  uiState.selectedZooCells=[];
  render();
}

function handleCellClick(cellIdx, playerIdx){
  const player=G.players[playerIdx];
  const cell=player.zoo[cellIdx];

  if(uiState.pendingAction==='build'){
    const valid=validBuildPositions(player.zoo);
    if(!valid.includes(cellIdx)){addLog(G,'인접한 빈 칸에만 건설할 수 있습니다.','warn');return;}
    uiState.selectedZooCells=[cellIdx];
    doBuild(cellIdx);
    return;
  }
  if(uiState.pendingAction==='animal'){
    if(!uiState.selectedHandCard){addLog(G,'먼저 손패에서 포켓몬을 선택하세요.','warn');return;}
    if(cell?.type!=='enclosure'){addLog(G,'빈 우리(enclosure)에만 배치할 수 있습니다.','warn');return;}
    doPlayAnimal(uiState.selectedHandCard, cellIdx);
    return;
  }
  // 동물원 카드 선택 (돈 마련용)
  if(cell?.type==='pokemon'&&cell.state==='ready'){
    addLog(G,`${cardById(cell.cardId)?.name} 소비 → 돈 획득`,'act');
    spendZooCard(G, playerIdx, cellIdx);
    render();
  }
}

function doBuild(cellIdx){
  const cp=G.currentPlayer;
  const player=G.players[cp];
  const strength=getStrength(player);
  const size=Math.min(strength,5);
  const cost=size*2;

  if(player.money<cost){
    addLog(G,`돈 부족! (필요: ${cost}원, 보유: ${player.money}원)`,'warn');
    render();return;
  }
  const valid=validBuildPositions(player.zoo);
  if(!valid.includes(cellIdx)){addLog(G,'인접한 빈 칸에만 건설할 수 있습니다.','warn');return;}

  player.money-=cost;
  // 덱에서 카드 가져와 뒤집어서 우리로
  const encCard = G.deck.length>0 ? G.deck.shift() : null;
  player.zoo[cellIdx]={type:'enclosure', size, cardId:encCard};
  rotateActionCard(player);
  addLog(G,`${player.name}: 크기 ${size} 우리 건설 (-${cost}원)`,'ok');
  uiState.pendingAction=null;
  uiState.selectedZooCells=[];
  nextTurn();
}

function doPlayAnimal(cardId, cellIdx){
  const cp=G.currentPlayer;
  const player=G.players[cp];
  const strength=getStrength(player);
  const card=cardById(cardId);

  if(!card){addLog(G,'카드를 찾을 수 없습니다.','warn');return;}

  const cell=player.zoo[cellIdx];
  if(!cell||cell.type!=='enclosure'){
    addLog(G,'빈 우리에만 배치 가능합니다.','warn');render();return;
  }
  if(cell.size<card.size){
    addLog(G,`우리 크기 부족 (필요: ${card.size}, 우리: ${cell.size})`,'warn');render();return;
  }
  // 아이콘 요건 체크
  if(card.req.length>0){
    const zooIcons=[];
    player.zoo.forEach(c=>{if(c?.type==='pokemon'){const cc=cardById(c.cardId);if(cc)zooIcons.push(...cc.icons);}});
    for(const req of card.req){
      if(!zooIcons.includes(req)){addLog(G,`아이콘 요건 불충족: ${req}`,'warn');render();return;}
    }
  }
  if(player.money<card.cost){
    addLog(G,`돈 부족! (필요: ${card.cost}원, 보유: ${player.money}원)`,'warn');render();return;
  }

  player.money-=card.cost;
  const hIdx=player.hand.indexOf(cardId);
  if(hIdx>=0)player.hand.splice(hIdx,1);

  // 우리 제거하고 포켓몬 배치
  if(cell.cardId) G.deck.push(cell.cardId); // 우리 카드 덱 밑으로
  player.zoo[cellIdx]={type:'pokemon', cardId, state:'ready'};

  // 포켓몬 능력 발동 (단순화)
  addLog(G,`${player.name}: ${card.name} 배치! (매력 +${card.appeal})`,'ok');
  rotateActionCard(player);
  uiState.pendingAction=null;
  uiState.selectedHandCard=null;
  uiState.selectedZooCells=[];
  nextTurn();
}

function doDrawCards(){
  const cp=G.currentPlayer;
  const player=G.players[cp];
  const strength=getStrength(player);

  if(strength>=4){
    // 스냅 가능: 이미 UI에서 처리
    addLog(G,'강도 4: 덱에서 뽑거나 디스플레이에서 스냅 가능','info');
  }
  // 뽑기: 강도에 따라 카드 수
  const drawTable={1:1,2:1,3:2,4:2};
  const returnTable={1:0,2:1,3:1,4:0};
  let drawCount=drawTable[strength]||1;
  let returnCount=returnTable[strength]||0;

  let drawn=[];
  for(let i=0;i<drawCount&&G.deck.length>0;i++){
    drawn.push(G.deck.shift());
  }
  // 뽑은 카드 → 손패
  drawn.forEach(id=>player.hand.push(id));
  addLog(G,`${player.name}: 카드 ${drawn.length}장 뽑음`,'ok');
  if(returnCount>0&&drawn.length>0){
    // 단순화: 마지막으로 뽑은 카드 반납
    const toReturn=player.hand.splice(player.hand.length-1,1)[0];
    G.deck.push(toReturn);
    addLog(G,`카드 1장 반납`,'info');
  }
  // 손패 3장 초과 버림
  while(player.hand.length>3){
    const dropped=player.hand.pop();
    G.discardPiles[0].push(dropped);
  }

  // 덱이 비면 휴식
  if(G.deck.length===0){
    addLog(G,'덱이 비었습니다 — 휴식 발동!','warn');
    processBreak(G);
    uiState.pendingAction=null;
    render();return;
  }

  rotateActionCard(player);
  uiState.pendingAction=null;
  nextTurn();
}

function doSnapCard(cardId, pileIdx){
  const cp=G.currentPlayer;
  const player=G.players[cp];
  const strength=getStrength(player);
  if(strength<4){addLog(G,'스냅은 강도 4에서만 가능합니다.','warn');return;}
  G.discardPiles[pileIdx].pop();
  player.hand.push(cardId);
  addLog(G,`${player.name}: ${cardById(cardId)?.name} 스냅!`,'ok');
  while(player.hand.length>3){const d=player.hand.pop();G.discardPiles[0].push(d);}
  rotateActionCard(player);
  uiState.pendingAction=null;
  nextTurn();
}

function doSponsor(cardId){
  const cp=G.currentPlayer;
  const player=G.players[cp];
  const strength=getStrength(player);
  const card=cardById(cardId);

  // 후원 행동: 카드의 후원 강도 이상이면 후원자 행동
  if(strength>=card.sponsor.strength){
    // 단순화: 후원자 효과 설명만
    addLog(G,`${player.name}: ${card.name} 후원 행동 — ${card.sponsor.name}`,'ok');
    addLog(G,card.sponsor.text,'info');
    // 카드 버림
    const hIdx=player.hand.indexOf(cardId);
    if(hIdx>=0){player.hand.splice(hIdx,1);G.discardPiles[0].push(cardId);}
  }
  // 보존 행동 (강도 4+): 동물원 아이콘 체크
  if(strength>=4){
    const consCard=card;
    const zooIcons=[];
    player.zoo.forEach(c=>{if(c?.type==='pokemon'){const cc=cardById(c.cardId);if(cc)zooIcons.push(...cc.icons);}});
    const hasEnough=zooIcons.filter(ic=>ic===consCard.conservation.icons).length>=consCard.conservation.num;
    if(hasEnough){
      addLog(G,`보존 행동: ${consCard.conservation.points}점 획득!`,'ok');
      // 동물 보존
      let toConserve=consCard.conservation.points;
      player.zoo.forEach(c=>{
        if(c?.type==='pokemon'&&c.state!=='conserved'&&toConserve>0){
          const cc=cardById(c.cardId);
          c.state='conserved';
          toConserve-=cc.conVal;
        }
      });
    } else {
      addLog(G,`보존 조건 불충족: ${consCard.conservation.icons} ${consCard.conservation.num}개 필요`,'warn');
    }
  }

  rotateActionCard(player);
  uiState.pendingAction=null;
  uiState.selectedHandCard=null;
  nextTurn();
}

function doPass(){
  const cp=G.currentPlayer;
  const player=G.players[cp];
  const steps=Math.floor(Math.random()*3); // 0~2칸
  passAction(player, steps>0?steps:1);
  addLog(G,`${player.name}: 패스 → X토큰면으로 전환`,'info');
  uiState.pendingAction=null;
  nextTurn();
}

function doDiscardCards(){
  const cp=G.currentPlayer;
  const player=G.players[cp];
  if(player.hand.length===0){addLog(G,'버릴 카드가 없습니다.','warn');return;}
  // 전체 버리기 (단순화)
  const discarded=player.hand.splice(0);
  discarded.forEach(id=>{
    G.discardPiles[0].push(id);
    const card=cardById(id);
    addLog(G,`${player.name}: ${card?.name} 버림 (돈 획득 없음)`, 'info');
  });
  // 카드 버리기는 행동카드 회전 없음
  addLog(G,'카드 버리기 — 다른 행동 불가','warn');
  nextTurn();
}

function showEarnMoneyUI(){
  const cp=G.currentPlayer;
  const player=G.players[cp];
  // 손패에서 버려서 수입
  if(player.hand.length===0){addLog(G,'버릴 카드가 없습니다.','warn');return;}
  const id=player.hand[player.hand.length-1]; // 마지막 카드
  discardForMoney(G, cp, id);
  render();
}

function useXToken(){
  const cp=G.currentPlayer;
  const player=G.players[cp];
  if(player.xTokens<1){return;}
  player.xTokens--;
  // 단순화: X토큰면에서 파란면으로 전환 = 강도+1 효과 (orientation 변경)
  player.isPurpleSide=false;
  addLog(G,`${player.name}: X토큰 사용 → 강도+1`,'act');
  render();
}

function nextTurnCore(){
  const cp=G.currentPlayer;
  // 덱 체크
  if(G.deck.length===0){
    processBreak(G);
    uiState.pendingAction=null;
    render();return;
  }

  // ARMIN 솔로 모드
  if(G.mode==='solo'&&G.currentPlayer===1){
    G.currentPlayer=0;
    render();return;
  }

  // 차례 전환
  G.currentPlayer=1-G.currentPlayer;
  G.turn++;

  // ARMIN 차례 처리
  if(G.mode==='solo'&&G.currentPlayer===1){
    arminTakeTurn(G);
    G.currentPlayer=0;
  }

  render();
}

// ─── 종료 화면 ───
function renderEnd(){
  const s0=calcScores(G.players[0]);
  const s1=calcScores(G.players[1]);
  const winner=s0.total>s1.total?0:s1.total>s0.total?1:-1;

  // ARMIN 봇: 보존 점수 계산 (봇 동물원에서 보존 행동)
  if(G.mode==='solo'){
    const bot=G.players[1];
    bot.zoo.forEach(cell=>{
      if(cell?.type==='pokemon'){
        const card=cardById(cell.cardId);
        if(card){
          const zooIcons=[];
          bot.zoo.forEach(c=>{if(c?.type==='pokemon'){const cc=cardById(c.cardId);if(cc)zooIcons.push(...cc.icons);}});
          if(zooIcons.filter(ic=>ic===card.conservation.icons).length>=card.conservation.num){
            cell.state='conserved';
          }
        }
      }
    });
  }

  const rows=[G.players[0],G.players[1]].map((p,i)=>{
    const s=calcScores(p);
    const isWin=i===winner;
    return `<tr class="${isWin?'winner-row':''}">
      <td>${isWin?'🏆 ':''}${p.name}</td>
      <td>${s.appeal}</td>
      <td>${s.conservation}</td>
      <td>-${s.emptyPenalty}</td>
      <td class="total" style="color:var(--accent)">${s.total}</td>
    </tr>`;
  }).join('');

  return `<div class="end-screen">
    <div class="end-card">
      <div class="end-title">${winner===-1?'무승부!':G.players[winner].name+' 승리! 🎉'}</div>
      <div style="color:var(--muted);font-size:.82rem;margin-bottom:12px">4라운드 종료 · 최종 점수</div>
      <table class="score-table">
        <thead><tr><th>이름</th><th>매력</th><th>보존</th><th>빈우리</th><th>합계</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div style="font-size:.72rem;color:var(--muted);margin-bottom:16px;line-height:1.6">
        매력 점수 + 보존 점수 - 빈 우리×2<br>
        동점이면 매력 점수가 높은 쪽 승리
      </div>
      <button class="btn primary" style="width:100%" id="endNewGame">새 게임 시작</button>
    </div>
  </div>`;
}

function attachEndEvents(){
  document.getElementById('endNewGame')?.addEventListener('click',()=>{G=null;render();});
}

// ══════════════════════════════════════════════════════════════════
// URL 파라미터 처리 & 온라인/솔로 브리지
// ══════════════════════════════════════════════════════════════════
const _Q = new URLSearchParams(location.search);
const IS_SOLO_PARAM    = _Q.get('solo')   === '1';
const IS_ONLINE_PARAM  = _Q.get('online') === '1' && window.parent !== window;
const ONLINE_SEAT      = Number.isFinite(Number(_Q.get('seat'))) ? Number(_Q.get('seat')) : 0;
const ONLINE_IS_HOST   = _Q.get('host')   === '1';
const IS_ONLINE_IS_HOST = IS_ONLINE_PARAM && ONLINE_IS_HOST;
let   ONLINE_NAMES    = [];
try { ONLINE_NAMES = JSON.parse(_Q.get('names') || '[]'); } catch {}

// 온라인: 부모 창에 준비됨 알림
if (IS_ONLINE_PARAM) {
  setTimeout(() => window.parent.postMessage({ type: 'pokemon_minima_ready' }, '*'), 0);

  // 부모 창에서 상태 수신
  window.addEventListener('message', e => {
    if (e.source !== window.parent) return;
    if (e.data?.type === 'game_state' && e.data.state) {
      try {
        const incoming = typeof e.data.state === 'string'
          ? JSON.parse(e.data.state) : e.data.state;
        if (!incoming?.players?.length) return;
        G = incoming;
        // 내 차례가 아니면 읽기 전용
        uiState.viewPlayer = ONLINE_SEAT;
        render();
      } catch(err) { console.warn('[pm-online] state parse failed', err); }
    }
  });
}

// 상태 저장: 온라인 모드일 때 부모에 postMessage
const _origNextTurn = nextTurnCore;
function nextTurn() {
  _origNextTurn();
  if (IS_ONLINE_PARAM && G) {
    window.parent.postMessage({
      type: 'game_state',
      state: JSON.stringify(G),
    }, '*');
  }
}

// 종료: 순위 전달
function publishResult() {
  if (!IS_ONLINE_PARAM || !G) return;
  const s = G.players.map((p,i) => ({ i, total: calcScores(p).total }))
    .sort((a,b) => b.total - a.total)
    .map(x => x.i);
  window.parent.postMessage({ type: 'game_result', order: s }, '*');
}


// BoardMate v11.4.25: 포켓몬 미니마 솔로 저장
const BOARDMATE_PM_SOLO_SAVE='boardmate:solo:pokemon-minima:v1';
let __pmSoloAbandon=false;
function boardmatePokemonSoloSave(){
  if(!IS_SOLO_PARAM||IS_ONLINE_PARAM||__pmSoloAbandon||!G)return false;
  try{localStorage.setItem(BOARDMATE_PM_SOLO_SAVE,JSON.stringify({G,uiState,savedAt:new Date().toISOString()}));return true;}catch(e){return false;}
}
function boardmatePokemonSoloRestore(){
  if(!IS_SOLO_PARAM||IS_ONLINE_PARAM)return false;
  const raw=localStorage.getItem(BOARDMATE_PM_SOLO_SAVE);if(!raw)return false;
  try{const d=JSON.parse(raw);if(!d?.G)return false;G=d.G;if(d.uiState)uiState=d.uiState;render();return true;}catch(e){localStorage.removeItem(BOARDMATE_PM_SOLO_SAVE);return false;}
}
function boardmatePokemonSoloAbandon(){
  __pmSoloAbandon=true;localStorage.removeItem(BOARDMATE_PM_SOLO_SAVE);window.top.location.href='./index.html#/solo';
}

// ─── 초기 실행 ───
// 솔로 파라미터: 이름/모드 자동 설정
if (IS_SOLO_PARAM && !G) {
  if (!boardmatePokemonSoloRestore()) {
    // 설정 화면 건너뛰고 솔로 게임 바로 시작
    G = newGame({ p1name: '트레이너', p2name: 'ARMIN', mode: 'solo', difficulty: 'normal' });
    uiState = { selectedHandCard:null, selectedZooCells:[], pendingAction:null,
      pendingCost:0, moneyCards:[], viewPlayer:0,
      draftStep:0, draftCurrentPlayer:0, draftPassCards:[] };
    startDraft();
  }
}

// 온라인 파라미터: 방장이면 설정, 게스트면 대기
if (IS_ONLINE_PARAM && !IS_ONLINE_IS_HOST) {
  // 게스트: 부모에서 상태 오기 전까지 대기 화면
  document.getElementById('root').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px;background:var(--bg)">
      <div style="font-size:1.5rem">🎮</div>
      <div style="color:var(--text);font-weight:900">포켓몬 미니마</div>
      <div style="color:var(--muted);font-size:.85rem">방장이 게임을 시작하기를 기다리는 중…</div>
    </div>`;
} else if (IS_ONLINE_PARAM && ONLINE_IS_HOST && ONLINE_NAMES.length >= 2) {
  // 방장: 이름 받아서 바로 게임 시작
  G = newGame({ p1name: ONLINE_NAMES[0], p2name: ONLINE_NAMES[1], mode: '2p', difficulty: 'normal' });
  uiState = { selectedHandCard:null, selectedZooCells:[], pendingAction:null,
    pendingCost:0, moneyCards:[], viewPlayer:ONLINE_SEAT,
    draftStep:0, draftCurrentPlayer:0, draftPassCards:[] };
  startDraft();
  render();
} else {
  render();
}

</script>
<script>
if(IS_SOLO_PARAM&&!IS_ONLINE_PARAM){
  setInterval(boardmatePokemonSoloSave,1500);
  window.addEventListener('beforeunload',boardmatePokemonSoloSave);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)boardmatePokemonSoloSave();});
  window.addEventListener('DOMContentLoaded',()=>BoardMateSoloUI.install({save:()=>boardmatePokemonSoloSave(),abandon:()=>boardmatePokemonSoloAbandon()}));
}
</script>
