<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BoardMate Online · 마스크맨</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script>
<style>
:root{font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;color:#172033;background:#f6df27}*{box-sizing:border-box}body{margin:0;min-width:320px;background-image:radial-gradient(#d9c600 14%,transparent 15%);background-size:22px 22px}button{font:inherit;cursor:pointer}.bar{position:sticky;top:0;z-index:10;background:#111827;color:white;border-bottom:4px solid #000;padding:9px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}.bar a{color:white;text-decoration:none;font-weight:900}.wrap{width:min(1180px,calc(100% - 20px));margin:16px auto 50px}.card{background:#fff;border:3px solid #111827;border-radius:18px;padding:14px;box-shadow:0 6px 0 #111827;margin-bottom:12px}.players{display:flex;gap:7px;overflow:auto}.player{min-width:145px;border:2px solid #cbd5e1;border-radius:12px;padding:8px;background:#f8fafc}.player.active{outline:4px solid #f59e0b}.player b,.player small{display:block}.player small{color:#64748b;margin-top:3px}.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:12px}.field{min-height:190px;display:grid;place-items:center;background:#fff7db;border:2px dashed #e4a300;border-radius:14px;text-align:center;padding:18px}.play{font-size:22px;font-weight:1000}.wrestler-dot{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-3px;border:2px solid #000}.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.wbtn{border:3px solid #111827;border-radius:13px;padding:10px;background:#fff;font-weight:950;text-align:left;min-height:72px}.wbtn.sel{outline:4px solid #f59e0b}.wbtn .count{font-size:22px;float:right}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.controls button{border:2px solid #111827;border-radius:10px;padding:9px 12px;font-weight:950}.primary{background:#10b981}.pass{background:#e5e7eb}.count-btn.active{background:#fde047}.hint{font-size:12px;color:#475569;background:#f8fafc;border-radius:10px;padding:9px;margin-top:8px}.strength{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.rank-card{border:1px solid #d7dde5;border-radius:10px;padding:8px;font-size:12px}.rank-card b{display:block}.logs{max-height:180px;overflow:auto;font-size:11px;background:#111827;color:#dbe4ee;border-radius:10px;padding:9px}.logs div{margin-bottom:4px}.season-end{background:#fff3ba;border:2px solid #e6a600;border-radius:12px;padding:12px;margin-top:10px}.status{font-size:12px;color:#64748b}.disabled{opacity:.45;pointer-events:none}@media(max-width:800px){.grid{grid-template-columns:1fr}.hand{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="bar"><span style="display:flex;gap:6px"><a href="./index.html#/">← 홈</a><a href="./index.html#/multi">다인플</a></span><b id="roomTitle">🥊 마스크맨</b><span id="sync">연결 중…</span></header><main class="wrap"><div id="app" class="card">불러오는 중…</div></main>
<script type="module">
import {configured,sb,roomId,getMe,loadRoom,loadState,saveState,startStatePoll,submitMatch,ratingBadges,esc,showFatal,endPanel} from './multi-common.js';
if(!configured()||!roomId)showFatal('Supabase 설정 또는 room 주소가 없습니다.');
const W={ORANGE:{name:'타이거',color:'#ff6b00'},PURPLE:{name:'바이올렛',color:'#8e24aa'},SILVER:{name:'실버',color:'#78909c'},PINK:{name:'루비',color:'#e91e63'},GREEN:{name:'골리앗',color:'#2e7d32'},BLUE:{name:'엘 디아블로',color:'#0288d1'}};
const KEYS=Object.keys(W);let me,room,members,badges={},mySeat=-1,state=null,revision=0,selected='ORANGE',count=1,saving=false,submitted=false;
const clone=x=>JSON.parse(JSON.stringify(x));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function initSeason(s,start){const deck=[];KEYS.forEach(k=>{for(let i=0;i<10;i++)deck.push(k)});shuffle(deck);let cpp=s.playerCount===5?12:s.playerCount===6?10:15;s.hands=Array.from({length:s.playerCount},(_,p)=>deck.slice(p*cpp,(p+1)*cpp));s.strengthGraph={};s.debuted={};KEYS.forEach(a=>{s.strengthGraph[a]={};s.debuted[a]=false;KEYS.forEach(b=>s.strengthGraph[a][b]=false)});s.currentTurn=start;s.trickLeader=start;s.currentPlay=null;s.lastPlayPlayer=null;s.passedPlayers=[];s.finishedOrder=[];s.seasonOver=false;s.logs=[`시즌 ${s.currentSeason} 시작 · ${members[start]?.nickname||'플레이어'} 선`];}
function initialState(){const s={kind:'maskmen',playerCount:members.length,currentSeason:1,maxSeasons:4,scores:Array(members.length).fill(0),seasonHistory:[],gameOver:false,matchOrder:null};initSeason(s,0);return s}
function isStronger(s,a,b){return !!s.strengthGraph?.[a]?.[b]}
function addRelation(s,a,b){if(a===b)return;s.debuted[a]=s.debuted[b]=true;s.strengthGraph[a][b]=true;KEYS.forEach(k=>KEYS.forEach(i=>KEYS.forEach(j=>{if(s.strengthGraph[i][k]&&s.strengthGraph[k][j])s.strengthGraph[i][j]=true})));}
const active=(s,p)=>s.hands[p]?.length>0;const activeCount=s=>s.hands.filter(h=>h.length>0).length;
function allOthersPassed(s){if(!s.currentPlay||s.lastPlayPlayer==null)return false;for(let p=0;p<s.playerCount;p++)if(active(s,p)&&p!==s.lastPlayPlayer&&!s.passedPlayers.includes(p))return false;return true}
function valid(s,p,w,c){if(s.currentTurn!==p)return{valid:false,reason:'내 턴이 아닙니다.'};if(!active(s,p))return{valid:false,reason:'이미 손패를 다 냈습니다.'};if(s.currentPlay&&s.passedPlayers.includes(p))return{valid:false,reason:'이번 트릭에서 패스했습니다.'};const held=s.hands[p].filter(x=>x===w).length;if(held<c)return{valid:false,reason:'카드가 부족합니다.'};if(c<1||c>3)return{valid:false,reason:'1~3장만 낼 수 있습니다.'};if(!s.currentPlay){if(!s.debuted[w]&&c!==1)return{valid:false,reason:'미데뷔 레슬러는 선으로 1장만 낼 수 있습니다.'};return{valid:true}}const pw=s.currentPlay.wrestler,pc=s.currentPlay.count;if(w===pw)return{valid:false,reason:'같은 레슬러는 낼 수 없습니다.'};if(c===pc)return isStronger(s,w,pw)?{valid:true}:{valid:false,reason:'같은 장수는 이미 더 강한 레슬러만 가능합니다.'};if(c===pc+1){if(c>3)return{valid:false,reason:'최대 3장입니다.'};if(isStronger(s,pw,w))return{valid:false,reason:'이미 더 약한 레슬러라 역전할 수 없습니다.'};if(isStronger(s,w,pw))return{valid:false,reason:'이미 더 강하므로 같은 장수로 내야 합니다.'};return{valid:true,newRelation:true}}return{valid:false,reason:'같은 장수 또는 정확히 +1장이어야 합니다.'}}
function advance(s){let n=(s.currentTurn+1)%s.playerCount,loops=0;while(loops<s.playerCount*2&&(!active(s,n)||(s.currentPlay&&s.passedPlayers.includes(n)))){n=(n+1)%s.playerCount;loops++}s.currentTurn=n}
function resolveTrick(s){const win=s.lastPlayPlayer;s.currentPlay=null;s.passedPlayers=[];if(activeCount(s)<=1)return endSeason(s);if(win!=null&&active(s,win))s.currentTurn=s.trickLeader=win;else{let n=((win??s.currentTurn)+1)%s.playerCount;while(!active(s,n))n=(n+1)%s.playerCount;s.currentTurn=s.trickLeader=n}}
function endSeason(s){if(s.seasonOver)return;s.seasonOver=true;for(let p=0;p<s.playerCount;p++)if(!s.finishedOrder.includes(p))s.finishedOrder.push(p);const pts=Array(s.playerCount).fill(0);if(s.finishedOrder[0]!=null)pts[s.finishedOrder[0]]=2;if(s.finishedOrder[1]!=null)pts[s.finishedOrder[1]]=1;if(s.finishedOrder.length>2)pts[s.finishedOrder.at(-1)]=-1;pts.forEach((v,i)=>s.scores[i]+=v);s.seasonHistory.push({season:s.currentSeason,order:[...s.finishedOrder],points:pts});s.logs.unshift(`시즌 ${s.currentSeason} 종료 · 1위 ${members[s.finishedOrder[0]]?.nickname}`);if(s.currentSeason>=s.maxSeasons){s.gameOver=true;s.matchOrder=finalOrder(s);}}
function finalOrder(s){const last=s.seasonHistory.at(-1)?.order?.[0];const champs=p=>s.seasonHistory.filter(h=>h.points[p]===2).length;return Array.from({length:s.playerCount},(_,p)=>p).sort((a,b)=>s.scores[b]-s.scores[a]||champs(b)-champs(a)||(a===last?-1:b===last?1:0)||a-b)}
async function mutate(fn){if(saving||!state)return;saving=true;const next=clone(state);try{fn(next);const nr=await saveState(revision,next);revision=nr;state=next;render();document.querySelector('#sync').textContent='동기화됨';if(next.gameOver)maybeSubmit();}catch(e){document.querySelector('#sync').textContent='다시 동기화 중';const row=await loadState();revision=row.revision;state=row.state;render();}finally{saving=false}}
function play(){const v=valid(state,mySeat,selected,count);if(!v.valid)return render();mutate(s=>{const prev=s.currentPlay;let removed=0;s.hands[mySeat]=s.hands[mySeat].filter(x=>x===selected&&removed<count?(removed++,false):true);if(prev&&count===prev.count+1)addRelation(s,selected,prev.wrestler);else if(!s.debuted[selected])s.debuted[selected]=true;s.currentPlay={player:mySeat,wrestler:selected,count};s.lastPlayPlayer=mySeat;if(!s.hands[mySeat].length&&!s.finishedOrder.includes(mySeat))s.finishedOrder.push(mySeat);s.logs.unshift(`${members[mySeat].nickname}: ${W[selected].name} ${count}장`);if(activeCount(s)<=1)endSeason(s);else if(allOthersPassed(s))resolveTrick(s);else advance(s);});}
function pass(){if(state.currentTurn!==mySeat)return;mutate(s=>{if(s.currentPlay&&!s.passedPlayers.includes(mySeat))s.passedPlayers.push(mySeat);s.logs.unshift(`${members[mySeat].nickname}: 패스`);if(activeCount(s)<=1)endSeason(s);else if(allOthersPassed(s))resolveTrick(s);else advance(s);});}
function nextSeason(){if(!room||room.host_id!==me.user_id||!state.seasonOver||state.gameOver)return;mutate(s=>{const last=s.seasonHistory.at(-1).order.at(-1);s.currentSeason++;initSeason(s,last);});}
function rankAnalysis(s,w){const stronger=KEYS.filter(o=>o!==w&&isStronger(s,o,w)).length,weaker=KEYS.filter(o=>o!==w&&isStronger(s,w,o)).length;const min=stronger+1,max=KEYS.length-weaker;return !s.debuted[w]?'미데뷔':min===max?`${min}위 확정`:`${min}~${max}위 가능`}
async function maybeSubmit(){if(submitted||room.host_id!==me.user_id||!state?.gameOver||!state.matchOrder)return;submitted=true;try{await submitMatch(state.matchOrder.map(i=>members[i].user_id));document.querySelector('#sync').textContent='결과 반영 완료';}catch(e){if(!String(e.message).includes('already')){submitted=false;console.warn(e)}}}
function render(){if(!state)return;const app=document.querySelector('#app'),mine=state.hands[mySeat]||[],counts=Object.fromEntries(KEYS.map(k=>[k,mine.filter(x=>x===k).length])),v=valid(state,mySeat,selected,count);document.querySelector('#roomTitle').textContent=`🥊 ${room.title}`;app.innerHTML=`<div class="players">${members.map((m,i)=>`<div class="player ${i===state.currentTurn&&!state.gameOver?'active':''}"><b>${esc(badges[m.user_id]?.text||'🥉')} ${esc(m.nickname)}${i===mySeat?' · 나':''}</b><small>점수 ${state.scores[i]} · 손패 ${state.hands[i].length}장</small></div>`).join('')}</div><div class="status" style="margin-top:8px">시즌 ${state.currentSeason}/4 · ${state.seasonOver?'시즌 종료':`현재 턴: ${esc(members[state.currentTurn]?.nickname||'-')}`}</div><div class="grid" style="margin-top:12px"><section><div class="field">${state.currentPlay?`<div class="play"><span class="wrestler-dot" style="background:${W[state.currentPlay.wrestler].color}"></span> ${W[state.currentPlay.wrestler].name} × ${state.currentPlay.count}<br><small>${esc(members[state.currentPlay.player]?.nickname||'')}</small></div>`:'<div><b>빈 링</b><br><small>선 플레이어가 카드를 냅니다.</small></div>'}</div><h3>내 손패</h3><div class="hand">${KEYS.map(k=>`<button class="wbtn ${selected===k?'sel':''} ${counts[k]?'':'disabled'}" data-w="${k}"><span class="wrestler-dot" style="background:${W[k].color}"></span> ${W[k].name}<span class="count">${counts[k]}</span></button>`).join('')}</div><div class="controls"><button class="count-btn ${count===1?'active':''}" data-c="1">1장</button><button class="count-btn ${count===2?'active':''}" data-c="2">2장</button><button class="count-btn ${count===3?'active':''}" data-c="3">3장</button><button class="primary" id="playBtn" ${state.currentTurn===mySeat&&!state.seasonOver&&v.valid?'':'disabled'}>카드 내기</button><button class="pass" id="passBtn" ${state.currentTurn===mySeat&&!state.seasonOver?'':'disabled'}>패스</button></div><div class="hint">${state.currentTurn===mySeat&&!state.seasonOver?(v.valid?'낼 수 있습니다.':esc(v.reason)):'다른 플레이어의 턴을 기다리는 중입니다.'}</div>${state.seasonOver?`<div class="season-end"><b>${state.gameOver?'4시즌 종료':'시즌 종료'}</b><div>${state.finishedOrder.map((p,i)=>`${i+1}위 ${esc(members[p].nickname)}`).join(' · ')}</div>${!state.gameOver&&room.host_id===me.user_id?'<button id="nextSeason" style="margin-top:8px;padding:8px 12px;font-weight:900">다음 시즌 시작</button>':''}${state.gameOver?`<div style="margin-top:8px"><b>최종 순위</b><br>${state.matchOrder.map((p,i)=>`${i+1}위 ${esc(members[p].nickname)} (${state.scores[p]}점)`).join('<br>')}</div>`:''}</div>`:''}</section><aside><h3>레슬러 서열</h3><div class="strength">${KEYS.map(k=>`<div class="rank-card"><b><span class="wrestler-dot" style="background:${W[k].color}"></span> ${W[k].name}</b>${rankAnalysis(state,k)}</div>`).join('')}</div><h3>로그</h3><div class="logs">${(state.logs||[]).slice(0,40).map(x=>`<div>${esc(x)}</div>`).join('')}</div></aside></div>`;if(state.gameOver)app.insertAdjacentHTML('beforeend',endPanel('게임이 끝났습니다.','결과가 저장되었습니다. 홈이나 다인플 목록으로 이동할 수 있습니다.'));app.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{selected=b.dataset.w;render()});app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{count=Number(b.dataset.c);render()});app.querySelector('#playBtn')?.addEventListener('click',play);app.querySelector('#passBtn')?.addEventListener('click',pass);app.querySelector('#nextSeason')?.addEventListener('click',nextSeason);if(state.gameOver)maybeSubmit();}
(async()=>{try{me=await getMe();if(!me)return showFatal('로그인이 필요합니다.');({room,members}=await loadRoom());if(room.game!=='maskmen')return showFatal('마스크맨 방이 아닙니다.');mySeat=members.findIndex(m=>m.user_id===me.user_id);if(mySeat<0)return showFatal('이 방의 참가자가 아닙니다.');badges=await ratingBadges('maskmen',members.map(m=>m.user_id));const row=await loadState();revision=row.revision;state=row.state;if(!state&&room.host_id===me.user_id){state=initialState();revision=await saveState(0,state);}render();startStatePoll(async row=>{revision=row.revision;if(row.state){state=row.state;render();}},{interval:1500});}catch(e){showFatal(e.message)}})();
</script></body></html>
