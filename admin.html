<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#141922" />
  <meta name="description" content="보드메이트 운영진 관리 대시보드" />
  <title>운영진 관리 · BoardMate</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <style>
    /* ===== 사이트와 동일한 색상 팔레트 ===== */
    :root{
      --ink:#18202d; --muted:#697386; --line:#ded9d0; --card:#fff;
      --brand:#f36f21; --brand-dark:#cf5412; --navy:#141922;
    }
    *{box-sizing:border-box}
    body{
      margin:0; background:#f6f3ed; color:var(--ink);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
    }
    .container{max-width:960px; margin:0 auto; padding:0 16px 48px}

    /* 상단바 */
    .topbar{
      background:var(--navy); color:#fff; padding:14px 16px;
      display:flex; align-items:center; gap:12px; justify-content:space-between;
    }
    .brand{font-weight:900; letter-spacing:-.02em; display:flex; align-items:center; gap:8px}
    .brand .dot{color:var(--brand)}
    .home-link{
      color:#cfd7e4; text-decoration:none; font-size:13px; font-weight:800;
      border:1px solid #ffffff33; border-radius:10px; padding:7px 11px;
    }
    .home-link:hover{background:#fff; color:var(--ink)}

    /* 페이지 헤더 */
    .page-head{margin:28px 2px 8px}
    .page-head h1{margin:0; font-size:30px; letter-spacing:-.03em}
    .page-head p{margin:6px 0 0; color:var(--muted); line-height:1.6}
    .notice{
      margin-top:14px; background:#fff5ce; border:1px solid #efd982; color:#6f5200;
      border-radius:12px; padding:11px 14px; font-size:13px; line-height:1.6;
    }

    /* 기능 카드 그리드 */
    .section-title{margin:30px 2px 12px; font-size:20px; letter-spacing:-.02em}
    .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px}
    .card{
      display:block; text-decoration:none; color:inherit;
      background:var(--card); border:1px solid var(--line); border-radius:20px;
      padding:20px; box-shadow:0 10px 26px #1319230a; transition:.15s;
    }
    .card:hover{border-color:#f1b48d; transform:translateY(-2px)}
    .card .icon{font-size:30px}
    .card h3{margin:10px 0 5px; font-size:19px}
    .card p{margin:0; color:var(--muted); font-size:14px; line-height:1.55}
    .badge{
      display:inline-block; margin-top:12px; font-size:11px; font-weight:900;
      background:#eef2f7; color:#697386; border-radius:999px; padding:4px 9px;
    }
    .badge.ready{background:#e9f7ee; color:#237747}
    .footer{margin-top:36px; color:#94a3b8; font-size:12px; text-align:center}
  </style>
</head>
<body>
  <!-- 상단바: 홈으로 돌아가는 링크 -->
  <header class="topbar">
    <span class="brand"><span class="dot">●</span> BOARDMATE</span>
    <a class="home-link" href="./index.html">← 홈으로</a>
  </header>

  <main class="container">
    <div class="page-head">
      <h1>🛠 운영진 관리</h1>
      <p>보드메이트 운영에 필요한 기능을 한곳에 모았습니다.</p>
      <div class="notice">
        ℹ️ 지금은 <b>로그인 없이 누구나</b> 볼 수 있는 단순 페이지예요.
        나중에 운영진만 들어오게 하려면 로그인 기능을 추가할 수 있습니다.
      </div>
    </div>

    <h2 class="section-title">기능 바로가기</h2>

    <!-- =====================================================================
         👇 [편집 안내] 아래 카드 하나가 버튼 하나입니다.
            · 카드를 새로 만들려면 <a class="card"> ... </a> 블록을 복사해서 붙여넣으세요.
            · href="#" 자리에 실제 이동할 주소를 넣으면 됩니다.
              (같은 사이트 안의 페이지면  href="./파일이름.html")
            · 아직 링크가 없으면 href="#" 로 두고 badge를 '준비 중'으로 둡니다.
         ===================================================================== -->
    <section class="grid">

      <!-- 카드 1: 회의록 (board-mate note 사이트로 연결) -->
      <a class="card" href="https://board-mate.github.io/note/" target="_blank" rel="noreferrer">
        <div class="icon">📝</div>
        <h3>회의록</h3>
        <p>모임 회의 기록을 확인합니다.</p>
        <span class="badge ready">바로가기 ↗</span>
      </a>

      <!-- 카드 2: 연간 행사 -->
      <a class="card" href="#">
        <div class="icon">📅</div>
        <h3>연간 행사</h3>
        <p>연간 행사 일정을 확인합니다.</p>
        <span class="badge">준비 중</span>
      </a>

      <!-- 카드 3: 기타 설정 -->
      <a class="card" href="#">
        <div class="icon">⚙️</div>
        <h3>기타 설정</h3>
        <p>운영에 필요한 기타 설정입니다.</p>
        <span class="badge">준비 중</span>
      </a>

    </section>

    <p class="footer">© BoardMate · 운영진 관리 페이지</p>
  </main>
</body>
</html>
