<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#141922" />
  <meta name="description" content="보드메이트 모임원용 데일리 보드게임 아케이드" />
  <title>BoardMate Arcade</title>
  <link rel="stylesheet" href="./styles.css?v=60" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <style>
    #bootFallback{display:none;max-width:760px;margin:64px auto;padding:28px;background:#fff;border:1px solid #ddd7ce;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.08);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18202d}
    #bootFallback h1{margin:0 0 10px;font-size:1.35rem}#bootFallback p{color:#586474;line-height:1.65}
    #bootFallback a,#bootFallback button{display:inline-block;margin:8px 8px 0 0;padding:11px 15px;border-radius:10px;border:1px solid #cfc8bc;background:#18202d;color:#fff;text-decoration:none;cursor:pointer}
  </style>
</head>
<body>
  <div id="app"><div id="bootLoading" style="max-width:760px;margin:64px auto;padding:24px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#586474">🎲 BoardMate를 불러오는 중…</div></div>
  <section id="bootFallback">
    <h1>⚠️ BoardMate 화면을 불러오는 데 시간이 걸리고 있습니다.</h1>
    <p id="bootDetail">앱 파일을 다시 불러오는 중입니다. 잠시 후에도 이 화면이 유지되면 캐시 복구를 실행해 주세요.</p>
    <a href="./recovery.html">🧹 캐시 복구 페이지</a><button type="button" onclick="location.reload()">↻ 다시 불러오기</button>
  </section>
  <script src="./config.js"></script>
  <script>
    // v11.4.60: GitHub Pages 배포 직후의 일시적 404/캐시 불일치에도 앱 로더를 최대 3회 재시도한다.
    (function(){
      var fallback=document.getElementById('bootFallback');
      function showFallback(detail){
        var app=document.getElementById('app');
        if(app)app.innerHTML='';
        var d=document.getElementById('bootDetail');
        if(d&&detail)d.textContent=detail;
        if(fallback)fallback.style.display='block';
      }
      function loadApp(attempt){
        var s=document.createElement('script');
        s.type='module';
        s.src='./app.js?v=11.4.60'+(attempt?'&retry='+Date.now():'');
        s.onload=function(){setTimeout(function(){if(!window.__boardmateAppStarted)showFallback('앱 파일의 실행이 완료되지 않았습니다. v11.4.60 복구 페이지에서 캐시를 한 번 초기화해 주세요.');},1200);};
        s.onerror=function(){s.remove();if(attempt<2)setTimeout(function(){loadApp(attempt+1);},600*(attempt+1));else showFallback('앱 파일 로딩에 3회 실패했습니다.');};
        document.head.appendChild(s);
      }
      loadApp(0);

      // Supabase SDK는 메인 앱 부팅과 완전히 분리한다.
      var sdk=document.createElement('script');
      sdk.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
      sdk.async=true;
      sdk.onload=function(){window.dispatchEvent(new Event('boardmate:supabase-ready'));};
      sdk.onerror=function(){console.warn('[BoardMate] Supabase SDK load failed; main UI remains available.');};
      document.head.appendChild(sdk);
    })();
  </script>
</body>
</html>
