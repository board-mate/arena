<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182a24"><title>BoardMate · 크립티드 α</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script>
<style>
:root{font-family:system-ui,"Malgun Gothic",sans-serif;color:#eef1e7;background:#14231e;--line:#455b4e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#324b3e,#14231e 60%);min-height:100vh}button,select{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer;border:1px solid #718772;border-radius:9px;padding:10px 13px;background:#344b3b;color:#fff;font-weight:750}button:disabled{opacity:.4;cursor:default}button:hover:not(:disabled){background:#47684c}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #f2d27c;outline-offset:3px}a{color:#e9dfb1}.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 20px;background:#102019eF;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}.bar a{text-decoration:none}.bar strong{font-family:Georgia,serif;font-size:20px;letter-spacing:.08em}.alpha{display:inline-block;background:#d9b45e;color:#18251c;border-radius:4px;padding:2px 5px;font:800 10px system-ui;vertical-align:middle}.sync{font-size:11px;color:#b6c6b5}.wrap{max-width:1280px;margin:18px auto;padding:0 16px 30px}.demo-note,.notice{border:1px solid #8b8054;background:#403e26;padding:12px 15px;border-radius:12px;margin-bottom:14px;font-size:13px;line-height:1.6}.layout{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(280px,1fr);gap:16px;align-items:start}.panel{border:1px solid var(--line);border-radius:16px;background:#21372bbf;padding:16px;min-width:0}.panel h1,.panel h2,.panel h3{margin:0 0 12px}.panel h1{font-size:24px}.panel h2{font-size:16px}.sub{font-size:12px;color:#bdcbb9;line-height:1.6}.board-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.board-toolbar button{padding:5px 12px}.board-viewport{overflow:auto;overscroll-behavior:contain;background:#12231a;border-radius:12px;max-height:75vh}.board{display:block;min-width:640px;width:100%;height:auto}.hex{stroke:#c5c7ab;stroke-width:.7;transition:filter .1s}.hex-cell{cursor:pointer}.hex-cell:hover .hex{filter:brightness(1.18);stroke:#fff;stroke-width:2}.hex-cell.selected .hex{stroke:#ffe28c;stroke-width:3}.hex-cell:focus .hex{stroke:#fff;stroke-width:3}.hex-label{font-size:8px;fill:#fff;font-weight:800;paint-order:stroke;stroke:#0009;stroke-width:2px;pointer-events:none}.animal{font-size:12px;pointer-events:none}.structure{font-size:19px;font-weight:900;paint-order:stroke;stroke:#17231a;stroke-width:2px;pointer-events:none}.markers{pointer-events:none}.legend,.players,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.legend{margin-top:12px;font-size:11px}.legend span,.player{border:1px solid #ffffff25;border-radius:7px;padding:5px 7px}.terrain-key{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}.players{margin-bottom:15px}.player.active{border-color:#f6d275;background:#695b29}.player i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.side{display:grid;gap:14px}.actions{display:grid;gap:8px}.actions button{width:100%}.primary{background:#c7a859;color:#17251b;border-color:#dec78f}.private{background:#1a2931;border-color:#536d7d}.private-clue{font-size:17px;line-height:1.6;color:#f3e1ad;margin:12px 0}.selection{padding:10px;border:1px solid #63745e;border-radius:9px;margin:10px 0;background:#17291f;min-height:60px;font-size:13px;line-height:1.6}select{width:100%;padding:10px;background:#13291c;color:#fff;border:1px solid #718772;border-radius:8px}.logs{max-height:230px;overflow:auto;display:grid;gap:7px}.log{font-size:11px;line-height:1.6;padding-bottom:7px;border-bottom:1px solid #ffffff12}.error{color:#ffc3a7;font-size:12px;line-height:1.6}.result{border:2px solid #d7bc64;background:#4d4d2b;padding:16px;border-radius:12px}.tile-reference{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.tile-reference img{width:100%;border-radius:7px}details{margin-top:14px;font-size:12px;line-height:1.7}summary{cursor:pointer;font-weight:800}.setup{max-width:680px;margin:50px auto}.badge{font-size:11px;color:#cbd5be}.hidden{display:none!important}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{grid-row:1}.bar{padding:11px 12px}.bar strong{font-size:16px}.wrap{padding-inline:10px}.panel{padding:12px}.board-viewport{max-height:65vh}.players{gap:5px}.player{font-size:11px}.sync{max-width:100px;text-align:right}}
</style></head><body><header class="bar"><a href="./index.html#/multi">← 다인플</a><strong>CRYPTID <span class="alpha">ALPHA</span></strong><span id="sync" class="sync">연결 중…</span></header><main id="app" class="wrap"></main>
<script type="module">
import {configured,roomId,sb,getMe,loadRoom,esc} from './multi-common.js?v=11.4.95';
import {TILES} from './cryptid/board-data.js?v=11.4.95';
import {TERRAIN,STRUCTURE,COLOUR,cellName,buildBoard,cluePool,chooseClues,initializeGame,applyAction,viewGame} from './cryptid/engine.js?v=11.4.95';
const app=document.querySelector('#app'),sync=document.querySelector('#sync');
const demo=new URLSearchParams(location.search).has('demo');
const colours=['#65b5ef','#ef8e90','#e6c96c','#a8cf75','#c99bdb'],terrainColours={desert:'#b9973e',forest:'#33795b',water:'#347d9e',mountain:'#8a9391',swamp:'#685776'};
let me,room,members=[],view=null,localGame=null,selected=null,showClue=false,busy=false,refreshing=false,error='',zoom=1;
const tileArt=i=>`./assets/cryptid/tile-${i}.webp`;
const token=()=>localStorage.getItem('boardmate:member_session')||sessionStorage.getItem('boardmate:member_session')||'';
async function rpc(name,args={}){const {data,error}=await sb.rpc(name,{...args,p_token:token(),p_room_id:roomId});if(error)throw error;return data;}
const seat=()=>Number(view?.seat??0);
function describe(cell){const m=view.state.marks[cell.id]||{discs:[]};return `${cellName(cell.id)} · ${TERRAIN[cell.terrain]}${cell.animal?` · ${cell.animal==='bear'?'곰':'쿠거'} 영역`:''}${cell.structure?` · ${COLOUR[cell.structure.colour]} ${STRUCTURE[cell.structure.kind]}`:''}${m.cube!=null?` · ${view.state.players[m.cube].name} 큐브`:''}${m.discs.length?` · 디스크 ${m.discs.map(i=>view.state.players[i].name).join(', ')}`:''}`;}
function boardHtml(){return `<svg class="board" style="width:${zoom*100}%;min-width:${640*zoom}px" viewBox="0 0 540 480" aria-label="크립티드 지도 108칸">${view.state.board.cells.map(c=>{
 const x=c.col*42+32,y=c.row*48+(c.col%2)*24+30,m=view.state.marks[c.id]||{cube:null,discs:[]};
 const points=[[-28,0],[-14,-24],[14,-24],[28,0],[14,24],[-14,24]].map(([dx,dy])=>`${x+dx},${y+dy}`).join(' ');
 return `<g class="hex-cell ${selected===c.id?'selected':''}" role="button" tabindex="0" data-cell="${c.id}" aria-label="${esc(describe(c))}"><title>${esc(describe(c))}</title><polygon class="hex" points="${points}" fill="${terrainColours[c.terrain]}"></polygon><text class="hex-label" x="${x}" y="${y-11}" text-anchor="middle">${cellName(c.id)}</text>${c.animal?`<text class="animal" x="${x-17}" y="${y+5}">${c.animal==='bear'?'🐻':'🐾'}</text>`:''}${c.structure?`<text class="structure" x="${x+9}" y="${y+6}" text-anchor="middle" fill="${({white:'#fff',green:'#78d78a',blue:'#78c7ff',black:'#111'})[c.structure.colour]}">${c.structure.kind==='stone'?'⬡':'△'}</text>`:''}<g class="markers">${m.cube!=null?`<rect x="${x-5}" y="${y+9}" width="10" height="10" rx="1" fill="${colours[m.cube]}" stroke="#111"/><text x="${x}" y="${y+17}" font-size="7" text-anchor="middle" fill="#111">${m.cube+1}</text>`:m.discs.map((who,i)=>`<circle cx="${x-14+i*7}" cy="${y+14}" r="5" fill="${colours[who]}" stroke="#17231a"/><text x="${x-14+i*7}" y="${y+16.5}" font-size="6" text-anchor="middle" fill="#111">${who+1}</text>`).join('')}</g></g>`;
 }).join('')}</svg>`;}
function phaseText(s){if(view.roomStatus==='cancelled')return '이 방은 취소되었습니다.';if(s.over)return `${s.players[s.winner].name} 님이 서식지를 발견했습니다!`;if(s.current!==seat())return `${s.players[s.current].name} 님의 차례입니다.`;return ({sharing:'내 단서에서 서식지가 아닌 칸에 큐브를 놓으세요. 각자 두 번 공유합니다.',turn:'상대에게 질문하거나, 내 단서에 맞는 칸을 탐색하세요.',penalty:'상대가 큐브로 답했습니다. 다른 칸에 내 큐브를 하나 더 놓으세요.','search-offer':'탐색 칸에 내 디스크가 이미 있습니다. 내 단서에 맞는 다른 칸에 디스크를 놓으세요.'})[s.phase]||'동기화 중입니다.';}
function render(){
 const previousBoard=app.querySelector('.board-viewport'),boardScroll={top:previousBoard?.scrollTop||0,left:previousBoard?.scrollLeft||0};
 if(!view?.state){app.innerHTML=`<section class="panel setup"><h1>크립티드 <span class="alpha">ALPHA</span></h1><p class="sub">단서를 조합해 단 하나의 서식지를 찾는 3~5인 추리 게임입니다. 각자의 단서는 본인에게만 보입니다.</p>${room?.host_id===me?.user_id?'<p class="sub">기본 모드는 긍정 단서와 구조물 6개, 고급 모드는 부정 단서와 구조물 8개를 사용합니다.</p><div class="actions"><button data-init="normal" class="primary">기본 모드로 시작</button><button data-init="advanced">고급 모드로 시작</button></div>':'<div class="notice">방장이 모드를 선택할 때까지 기다려 주세요.</div>'}<p class="error">${esc(error)}</p></section>`;app.querySelectorAll('[data-init]').forEach(b=>b.onclick=()=>initialize(b.dataset.init==='advanced'));return;}
 const s=view.state,cell=s.board.cells.find(c=>c.id===selected),mine=s.current===seat()&&!s.over&&view.roomStatus!=='cancelled';
 const status=phaseText(s),controls=mine?(s.phase==='turn'?`<select id="target" aria-label="질문할 플레이어">${s.players.map((p,i)=>i!==seat()?`<option value="${i}">${esc(p.name)}</option>`:'').join('')}</select><button data-action="question" ${selected==null||busy?'disabled':''}>선택한 칸 질문하기</button><button data-action="search" class="primary" ${selected==null||busy?'disabled':''}>선택한 칸 탐색하기</button>`:`<button data-action="${s.phase==='search-offer'?'disc':'cube'}" class="primary" ${selected==null||busy?'disabled':''}>선택한 칸에 ${s.phase==='search-offer'?'디스크':'큐브'} 놓기</button>`):'';
 app.innerHTML=`${demo?`<div class="demo-note"><b>로컬 연습 · 실제 회원 게임이 아닙니다.</b><div class="row"><label for="demoSeat">볼 플레이어</label><select id="demoSeat" style="width:auto">${s.players.map((p,i)=>`<option value="${i}" ${i===seat()?'selected':''}>${esc(p.name)}</option>`).join('')}</select><button id="followTurn">현재 차례로 전환</button></div></div>`:''}<div class="players">${s.players.map((p,i)=>`<span class="player ${i===s.current&&!s.over?'active':''}"><i style="background:${colours[i]}"></i>${esc(p.name)}${i===seat()?' · 나':''}</span>`).join('')}<span class="badge">${s.board.advanced?'고급':'기본'} · ${s.turn}번째 차례</span></div><div class="layout"><section class="panel"><div class="board-toolbar"><h2>탐사 지도</h2><div class="row"><button id="zoomOut" aria-label="지도 축소">−</button><button id="zoomIn" aria-label="지도 확대">＋</button></div></div><div class="board-viewport">${boardHtml()}</div><div class="legend">${Object.entries(TERRAIN).map(([id,name])=>`<span><i class="terrain-key" style="background:${terrainColours[id]}"></i>${name}</span>`).join('')}<span>🐻 곰 · 🐾 쿠거</span><span>⬡ 거석 · △ 폐가</span><span>■ 서식지 아님 · ● 가능</span></div></section><aside class="side"><section class="panel ${s.over?'result':''}"><h2>${s.over?'발견 완료':'현재 진행'}</h2><p class="sub">${esc(status)}</p><div class="selection">${cell?esc(describe(cell)):'지도에서 칸을 선택하세요.'}</div><div class="actions">${controls}</div><p class="error" role="status">${esc(error)}</p>${s.over?`<div class="sub">${s.revealedClues?.map((c,i)=>`${esc(s.players[i].name)}: ${esc(c)}`).join('<br>')||''}</div>`:''}</section><section class="panel private"><h2>🔒 내 비공개 단서</h2><button id="toggleClue">${showClue?'단서 가리기':'내 단서 보기'}</button>${showClue?`<div class="private-clue">서식지는 ${esc(view.clue.text)}</div>`:'<p class="sub">필요할 때만 열어 확인할 수 있습니다.</p>'}</section><section class="panel"><h2>탐사 기록</h2><div class="logs">${s.log.map(t=>`<div class="log">${esc(t)}</div>`).join('')||'<span class="sub">아직 기록이 없습니다.</span>'}</div></section></aside></div><section class="panel" style="margin-top:16px"><details><summary>플레이 안내 · 알파 범위</summary><p>시작 시 각자 두 칸에 큐브를 놓습니다. 큐브는 내 단서에 맞지 않는 칸, 디스크는 내 단서에 맞는 칸입니다. 큐브가 놓인 칸에는 더 이상 말 배치·질문·탐색을 할 수 없습니다.</p><p>질문 답변과 탐색의 시계 방향 응답은 각자의 비공개 단서로 자동 판정합니다. 누군가 큐브로 답하면 질문·탐색을 한 플레이어도 다른 칸에 큐브를 놓습니다. 전원이 디스크로 인정한 서식지를 탐색하면 승리합니다.</p><p>이미 내 디스크가 있는 칸을 탐색할 때는 다른 유효한 칸에 디스크를 추가합니다. 알파에서는 추가 말을 놓을 유효 칸이 남지 않은 경우 자동으로 진행합니다. 힌트 투표·2인 변형·ELO 반영은 지원하지 않습니다.</p><p>거리에는 해당 칸 자체(0칸)도 포함됩니다. 모든 구조물은 종류와 색을 함께 확인하세요.</p><div class="tile-reference">${[1,2,3,4,5,6].map(i=>`<img src="${tileArt(i)}" alt="실물 지도 타일 ${i}" loading="lazy">`).join('')}</div></details></section>`;
 app.querySelectorAll('[data-cell]').forEach(g=>{const choose=()=>{selected=Number(g.dataset.cell);render();};g.addEventListener('click',choose);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose();}});});
 app.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act({type:b.dataset.action,cell:selected,target:Number(app.querySelector('#target')?.value)}));
 app.querySelector('#toggleClue').onclick=()=>{showClue=!showClue;render();};
 app.querySelector('#zoomIn').onclick=()=>{zoom=Math.min(2,zoom+.25);render();};app.querySelector('#zoomOut').onclick=()=>{zoom=Math.max(.75,zoom-.25);render();};
 app.querySelector('#demoSeat')?.addEventListener('change',e=>{view={...viewGame(localGame,Number(e.target.value)),seat:Number(e.target.value)};showClue=false;render();});
 const nextBoard=app.querySelector('.board-viewport');if(nextBoard){nextBoard.scrollTop=boardScroll.top;nextBoard.scrollLeft=boardScroll.left;}
 app.querySelector('#followTurn')?.addEventListener('click',()=>{view={...viewGame(localGame,s.current),seat:s.current};showClue=false;render();});
}
async function initialize(advanced){if(busy)return;busy=true;error='';try{view=await rpc('boardmate_cryptid_init',{p_advanced:advanced});}catch(e){error=e.message||String(e);}finally{busy=false;render();}}
async function act(action){if(busy||selected==null)return;busy=true;error='';try{if(demo){localGame=applyAction(localGame,seat(),action);view={...viewGame(localGame,seat()),seat:seat()};}else{const latest=await rpc('boardmate_cryptid_action',{p_expected_revision:view.revision,p_action:action});if(!view||latest.revision>=view.revision)view=latest;}selected=null;sync.textContent=demo?'로컬 연습':'자동 저장됨';}catch(e){error=String(e.message||e);if(!demo)await refresh();}finally{busy=false;render();}}
async function refresh(){if(refreshing||demo)return;refreshing=true;try{const latest=await rpc('boardmate_cryptid_view');if(!view||latest.revision>view.revision||(latest.revision===view.revision&&latest.roomStatus!==view.roomStatus)){view=latest;render();}sync.textContent='동기화됨';}catch(e){sync.textContent='연결 재확인 중';console.warn('[Cryptid]',e);}finally{refreshing=false;}}
async function boot(){try{
 if(demo){const board=buildBoard(TILES),chosen=chooseClues(cluePool(board),3);localGame=initializeGame(board,chosen.clues,[{name:'연습자 1'},{name:'연습자 2'},{name:'연습자 3'}],chosen.solution);view={...viewGame(localGame,0),seat:0};sync.textContent='로컬 연습';render();return;}
 if(!configured()||!roomId)throw Error('다인플에서 크립티드 방을 만들어 입장하세요.');
 me=await getMe();if(!me)throw Error('로그인이 필요합니다.');({room,members}=await loadRoom());if(room.game!=='cryptid')throw Error('크립티드 방이 아닙니다.');
 view=await rpc('boardmate_cryptid_view');render();sync.textContent='동기화됨';
 let timer;const startPolling=()=>{if(!timer)timer=setInterval(()=>{if(!document.hidden)void refresh();},3000);},wake=()=>{startPolling();if(!document.hidden)void refresh();};startPolling();
 document.addEventListener('visibilitychange',wake);window.addEventListener('focus',wake);window.addEventListener('online',wake);window.addEventListener('pageshow',wake);window.addEventListener('pagehide',()=>{clearInterval(timer);timer=null;});
 }catch(e){app.innerHTML=`<section class="panel setup"><h1>크립티드 α</h1><p class="error">${esc(e.message||e)}</p><p><a href="./index.html#/multi">방 목록으로 돌아가기</a> · <a href="?demo=1">로컬 연습 보기</a></p></section>`;sync.textContent='연결 확인 필요';}}
void boot();
</script></body></html>
