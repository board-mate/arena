<script type="module">
import {configured,roomId,sb,getMe,loadRoom,loadState,saveState,startStatePoll,sendRoomBroadcast,subscribeRoomBroadcast,submitMatch,showFatal,endPanel,esc} from './multi-common.js?v=11.4.57';
const SESSION_KEY='boardmate:member_session';
const token=()=>localStorage.getItem(SESSION_KEY)||sessionStorage.getItem(SESSION_KEY)||'';
const rpc=async(name,args={})=>{const {data,error}=await sb.rpc(name,args);if(error)throw error;return data};
const OBJ={asteroid:'🌑 소행성',comet:'🌠 혜성',dwarf:'🪐 왜소행성',gas:'☁️ 가스 구름',empty:'⬚ 비어 보임',x:'✦ 행성 X'};
const OBJSHORT={asteroid:'A',comet:'C',dwarf:'D',gas:'G',empty:'E',x:'X'};
const OBJICON={asteroid:'🌑',comet:'🌠',dwarf:'🪐',gas:'☁️',empty:'⬚',x:'✦'};
const OBJNOTE={asteroid:'소행성',comet:'혜성',dwarf:'왜소행성',gas:'가스 구름',empty:'비어 보임',x:'행성 X'};
const RAW_NOUN_KO={asteroid:'소행성',asteroids:'소행성',comet:'혜성',comets:'혜성','dwarf planet':'왜소행성','dwarf planets':'왜소행성','gas cloud':'가스 구름','gas clouds':'가스 구름','empty sector':'진짜 빈 섹터','empty sectors':'진짜 빈 섹터','planet x':'행성 X'};
function nounKo(raw){let v=String(raw??'').trim().toLowerCase(),another=/^another\s+/.test(v);v=v.replace(/^(?:the|a|an|another)\s+/,'');const out=RAW_NOUN_KO[v]||String(raw??'');return another?`다른 ${out}`:out}
function hasBatchim(text){const c=String(text??'').trim().slice(-1).charCodeAt(0);return c>=0xAC00&&c<=0xD7A3&&((c-0xAC00)%28)!==0}
function josa(text,pair){const t=String(text??'');const b=hasBatchim(t);if(pair==='은는')return t+(b?'은':'는');if(pair==='이가')return t+(b?'이':'가');if(pair==='과와')return t+(b?'과':'와');return t}
function topicKo(raw){const t=String(raw??'').trim();if(!t)return'';return t.split(/\s*&\s*/).map(nounKo).join(' · ')}
function ruleKo(raw){const r=String(raw??'').trim();if(!r)return'';let m;
 if((m=r.match(/^All the (.+) are in a band of (\d+) sectors or less\.$/i))){const a=nounKo(m[1]);return`모든 ${josa(a,'은는')} ${m[2]}개 이하의 연속 섹터 범위 안에 있습니다.`}
 if((m=r.match(/^All the (.+) are in consecutive sectors\.$/i))){const a=nounKo(m[1]);return`모든 ${josa(a,'은는')} 서로 연속된 섹터에 있습니다.`}
 if((m=r.match(/^At least one (.+) is adjacent to (.+)\.$/i))){const a=nounKo(m[1]),b=nounKo(m[2]);return`최소 1개의 ${josa(a,'이가')} ${josa(b,'과와')} 인접합니다.`}
 if((m=r.match(/^At least one (.+) is directly opposite (.+)\.$/i))){const a=nounKo(m[1]),b=nounKo(m[2]);return`최소 1개의 ${josa(a,'이가')} ${b}의 정반대편에 있습니다.`}
 if((m=r.match(/^Every (.+) is adjacent to (.+)\.$/i))){const a=nounKo(m[1]),b=nounKo(m[2]);return`모든 ${josa(a,'은는')} ${josa(b,'과와')} 인접합니다.`}
 if((m=r.match(/^Every (.+) is directly opposite (.+)\.$/i))){const a=nounKo(m[1]),b=nounKo(m[2]);return`모든 ${josa(a,'은는')} ${b}의 정반대편에 있습니다.`}
 if((m=r.match(/^Every (.+) is within (\d+) sectors of (.+)\.$/i))){const a=nounKo(m[1]),b=nounKo(m[3]);return`모든 ${josa(a,'은는')} ${b}에서 ${m[2]}섹터 이내에 있습니다.`}
 if((m=r.match(/^No (.+) is adjacent to (.+)\.$/i))){const a=nounKo(m[1]),b=nounKo(m[2]);return`어떤 ${a}도 ${josa(b,'과와')} 인접하지 않습니다.`}
 if((m=r.match(/^No (.+) is directly opposite (.+)\.$/i))){const a=nounKo(m[1]),b=nounKo(m[2]);return`어떤 ${a}도 ${b}의 정반대편에 있지 않습니다.`}
 if((m=r.match(/^No (.+) is within (\d+) sectors of (.+)\.$/i))){const a=nounKo(m[1]),b=nounKo(m[3]);return`어떤 ${a}도 ${b}에서 ${m[2]}섹터 이내에 있지 않습니다.`}
 if((m=r.match(/^(.+) is not adjacent to (.+)\.$/i))){const a=nounKo(m[1]),b=nounKo(m[2]);return`${josa(a,'은는')} ${josa(b,'과와')} 인접하지 않습니다.`}
 if((m=r.match(/^(.+) is not directly opposite (.+)\.$/i))){const a=nounKo(m[1]),b=nounKo(m[2]);return`${josa(a,'은는')} ${b}의 정반대편에 있지 않습니다.`}
 if((m=r.match(/^(.+) is not within (\d+) sectors of (.+)\.$/i))){const a=nounKo(m[1]),b=nounKo(m[3]);return`${josa(a,'은는')} ${b}에서 ${m[2]}섹터 이내에 있지 않습니다.`}
 if((m=r.match(/^(.+) is adjacent to (.+)\.$/i))){const a=nounKo(m[1]),b=nounKo(m[2]);return`${josa(a,'은는')} ${josa(b,'과와')} 인접합니다.`}
 if((m=r.match(/^(.+) is directly opposite (.+)\.$/i))){const a=nounKo(m[1]),b=nounKo(m[2]);return`${josa(a,'은는')} ${b}의 정반대편에 있습니다.`}
 if((m=r.match(/^(.+) is within (\d+) sectors of (.+)\.$/i))){const a=nounKo(m[1]),b=nounKo(m[3]);return`${josa(a,'은는')} ${b}에서 ${m[2]}섹터 이내에 있습니다.`}
 if((m=r.match(/^There are (\d+) (.+) in consecutive sectors\.$/i)))return`${nounKo(m[2])} ${m[1]}개가 연속된 섹터에 있습니다.`;
 return r.replace(/Planet X/gi,'행성 X').replace(/dwarf planets?/gi,'왜소행성').replace(/gas clouds?/gi,'가스 구름').replace(/asteroids?/gi,'소행성').replace(/comets?/gi,'혜성').replace(/empty sectors?/gi,'진짜 빈 섹터');}
function displayKo(raw){const t=String(raw??'').trim();let m;if((m=t.match(/^(X[12] 회의 공개 · )([^:]+):\s*(.+)$/)))return`${m[1]}${topicKo(m[2])}: ${ruleKo(m[3])}`;if((m=t.match(/^([^:]+):\s*(.+)$/))&&/(Asteroid|Comet|Dwarf Planet|Gas Cloud|Planet X)/i.test(m[1]))return`${topicKo(m[1])}: ${ruleKo(m[2])}`;return t.replace(/Planet X/gi,'행성 X').replace(/dwarf planets?/gi,'왜소행성').replace(/gas clouds?/gi,'가스 구름').replace(/asteroids?/gi,'소행성').replace(/comets?/gi,'혜성').replace(/empty sectors?/gi,'진짜 빈 섹터').replace(/🪨/g,'🌑').replace(/\uAC00\uC124/g,'논문')}

const SEASONS=['spring','summer','autumn','winter'];
const SEASON_KO={spring:'🌸 춘분',summer:'☀️ 하지',autumn:'🍂 추분',winter:'❄️ 동지'};
const DIFF={youth:['유스',12],beginner:['초보자',8],experienced:['경험자',4],genius:['천재',0]};
const PLAYER_COLORS=['#4ea5ff','#ff6374','#f2c84b','#58d68d'];
const PLAYER_COLOR_NAMES=['파랑','빨강','노랑','초록'];
function playerColor(seat){return PLAYER_COLORS[((Number(seat)||0)%PLAYER_COLORS.length+PLAYER_COLORS.length)%PLAYER_COLORS.length]}
function playerColorName(seat){return PLAYER_COLOR_NAMES[((Number(seat)||0)%PLAYER_COLOR_NAMES.length+PLAYER_COLOR_NAMES.length)%PLAYER_COLOR_NAMES.length]}
function playerNameHtml(seat,meMark=false){return `<span style="color:${playerColor(seat)};font-weight:950">●</span> <span>${esc(memberName(seat))}</span>${meMark&&seat===mySeat()?' <span class="badge">나</span>':''}`}
function publicLogHtml(raw){const t=displayKo(raw);for(let i=0;i<members.length;i++){const n=memberName(i),prefix=n+' ·',reviewPrefix='교차 검증 · '+n+' ·';if(t.startsWith(prefix))return `${playerNameHtml(i)}${esc(t.slice(n.length))}`;if(t.startsWith(reviewPrefix))return `교차 검증 · ${playerNameHtml(i)}${esc(t.slice(('교차 검증 · '+n).length))}`;}return esc(t)}
function reviewLogCore(x){const who=memberName(Number(x.ownerSeat)),obj=objLabel(x.object);return`교차 검증 · ${who} · 섹터 ${Number(x.sector)} ${obj} 논문 ${x.correct?'맞음':`틀림 → 해당 섹터에는 ${obj} 없음`}`}
function reviewLogText(x,{penalty=true}={}){const actual=x.actual?` · 실제 개체: ${objLabel(x.actual)}`:'';return`${reviewLogCore(x)}${x.correct?'':(penalty?' · 패널티 시간 +1':'')}${actual}`}
function publicLogRows(){
 const rows=(state?.log||[]).map(x=>({...x,text:displayKo(x.text)}));
 const wrong=(state?.theories||[])
  .filter(t=>t&&t.correct===false&&t.object&&Number.isFinite(Number(t.sector)))
  .map(t=>({ownerSeat:Number(t.ownerSeat),sector:Number(t.sector),object:t.object,correct:false,submitRound:Number(t.submitRound||0),actual:null}))
  .sort((a,b)=>b.submitRound-a.submitRound||a.sector-b.sector);
 const queues=new Map();
 for(const x of wrong){if(!queues.has(x.ownerSeat))queues.set(x.ownerSeat,[]);queues.get(x.ownerSeat).push(x)}
 const merged=new Set(),out=[];
 const keyOf=x=>`${x.ownerSeat}:${x.sector}:${x.object}:0`;
 const detailedFor=t=>wrong.find(x=>t.startsWith(`교차 검증 · ${memberName(x.ownerSeat)} · 섹터 ${x.sector} ${objLabel(x.object)} 논문`));
 for(const row of rows){
  const t=String(row.text||'');let handled=false;
  for(let seat=0;seat<members.length;seat++){
   const who=memberName(seat),q=queues.get(seat)||[];
   if(!q.length)continue;
   if(t===`${who} · 틀린 논문 패널티 시간 +1`||t===`${who} · 틀린 논문 시간 +1`){
    const x=q.shift();merged.add(keyOf(x));out.push({...row,text:reviewLogText(x,{penalty:true})});handled=true;break;
   }
  }
  if(handled)continue;
  const dx=detailedFor(t);
  if(dx&&merged.has(keyOf(dx)))continue;
  if(dx&&!t.includes('패널티 시간 +1')){out.push({...row,text:reviewLogText(dx,{penalty:true})});continue}
  out.push(row);
 }
 const r=state?.lastReview;
 if(!r?.entries?.length)return out;
 const recent=r.entries.map(x=>({...x,ownerSeat:Number(x.ownerSeat),sector:Number(x.sector),correct:Boolean(x.correct)}));
 const seen=new Set();
 for(const row of out){const t=String(row.text||'');for(const x of recent){const key=`${x.ownerSeat}:${x.sector}:${x.object}:${x.correct?'1':'0'}`;if(t.startsWith(reviewLogCore(x)))seen.add(key)}}
 const synthetic=[];
 for(const x of recent){const key=`${x.ownerSeat}:${x.sector}:${x.object}:${x.correct?'1':'0'}`;if(!seen.has(key))synthetic.push({at:out[0]?.at||'',text:reviewLogText(x,{penalty:!x.correct})})}
 return[...synthetic,...out]
}
const PRIVATE_KEY=()=>`boardmate:planetx:private:${roomId}:${me?.user_id||'anon'}`;
let room=null,members=[],me=null,state=null,revision=-1,busy=false,saving=false,setupTimer=null,theoryTimer=null,selectedMode='standard',selectedDiff='beginner';
let theoryPlacing=false,theoryAutoKey='';
let privateSaveChain=Promise.resolve();
let uiRecordOpen=false;
const RECORD_LAYOUT_KEY='boardmate:planetx:record-layout';
function initialRecordLayout(){try{return localStorage.getItem(RECORD_LAYOUT_KEY)==='square'?'square':'circle'}catch{return'circle'}}
let uiRecordLayout=initialRecordLayout();
let researchTopics={};
let priv={hints:[],season:'',difficulty:'',observations:[],marks:{},research:{}};

function mySeat(){return members.findIndex(m=>m.user_id===me?.user_id)}
function memberName(i){return members[i]?.nickname||members[i]?.name||`플레이어 ${i+1}`}
function sectorCount(s=state){return s?.mode==='expert'?18:12}
function cometSectors(s=state){return s?.mode==='expert'?[2,3,5,7,11,13,17]:[2,3,5,7,11]}
function oppositeSector(sec,s=state){const n=sectorCount(s);return ((Number(sec)-1+n/2)%n)+1}
async function ensureResearchTopics(){if(Object.keys(researchTopics||{}).length===6)return researchTopics;try{const r=await rpc('boardmate_planetx_research_topics',{p_token:token(),p_room_id:roomId});if(r&&typeof r==='object')researchTopics=r}catch(e){console.warn('[planetx research topics]',e)}return researchTopics||{}}
function visibleSectors(s=state){const n=sectorCount(s),half=n/2,start=((Number(s?.earth||1)-1)%n+n)%n+1;return Array.from({length:half},(_,i)=>((start-1+i)%n)+1)}
function playerOrder(s=state){return [...s.players].sort((a,b)=>a.time-b.time||a.tie-b.tie).map(p=>p.seat)}
function activeSeat(s=state){return playerOrder(s)[0]??0}
function canAct(){return state?.phase==='turn'&&state.current===mySeat()&&!busy}
function objLabel(x){return OBJ[x]||x}
function normalizePrivate(v={}){const out=Object.assign({hints:[],season:'',difficulty:'',observations:[],marks:{},research:{}},v||{});out.hints??=[];out.observations??=[];out.marks??={};out.research??={};return out}
function savePrivate(){const snapshot=structuredClone(normalizePrivate(priv));privateSaveChain=privateSaveChain.catch(()=>{}).then(()=>rpc('boardmate_planetx_save_private_sheet',{p_token:token(),p_room_id:roomId,p_data:snapshot})).catch(e=>{console.warn('[planetx private save]',e);toast('내 기록지 계정 저장에 실패했습니다. 잠시 후 다시 시도해 주세요.','error')});return privateSaveChain}
async function loadPrivate(){let server=null;try{server=await rpc('boardmate_planetx_get_private_sheet',{p_token:token(),p_room_id:roomId})}catch(e){console.warn('[planetx private load]',e);throw e}const legacyKey=PRIVATE_KEY();let legacy=null;try{legacy=JSON.parse(localStorage.getItem(legacyKey)||'null')}catch{};const hasServer=server&&typeof server==='object'&&Object.keys(server).length>0;const hasLegacy=legacy&&typeof legacy==='object'&&Object.keys(legacy).length>0;if(!hasServer&&hasLegacy){priv=normalizePrivate(legacy);await rpc('boardmate_planetx_save_private_sheet',{p_token:token(),p_room_id:roomId,p_data:structuredClone(priv)});try{localStorage.removeItem(legacyKey)}catch{};toast('기존 브라우저 기록을 계정 기록지로 옮겼습니다.')}else{priv=normalizePrivate(hasServer?server:{});if(hasServer){try{localStorage.removeItem(legacyKey)}catch{}}}}
function toast(msg,kind=''){let d=document.createElement('div');d.textContent=String(msg??'').replace(/\uAC00\uC124/g,'논문');d.style.cssText=`position:fixed;z-index:3000;left:50%;bottom:22px;transform:translateX(-50%);background:${kind==='error'?'#722635':'#18334c'};color:white;border:1px solid #55738e;border-radius:12px;padding:10px 14px;box-shadow:0 10px 30px #0008;font-weight:800;font-size:12px`;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function modal(html,bind){const r=document.querySelector('#modalRoot');r.innerHTML=`<div class="modal-back"><div class="modal">${html}</div></div>`;const m=r.firstElementChild.firstElementChild;m.parentElement.addEventListener('click',e=>{if(e.target===m.parentElement)closeModal()});bind?.(m)}

function addPrivate(type,text){priv.observations.unshift({at:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),type,text});priv.observations=priv.observations.slice(0,80);savePrivate()}
function logPublic(s,text){s.log??=[];s.log.unshift({at:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),text});s.log=s.log.slice(0,70)}
function cloneState(){return structuredClone(state)}
async function commit(s,reason='update'){
  if(saving)return false;saving=true;setSync(`저장 중 · ${reason}`);
  try{const nr=await saveState(revision,s);revision=nr;state=s;render();setSync('동기화됨');return true}
  catch(e){console.warn(e);toast(e.message||'동기화 충돌. 최신 상태를 다시 불러옵니다.','error');await refreshState();return false}
  finally{saving=false}
}
function setSync(x){const el=document.querySelector('#sync');if(el)el.textContent=x}
async function refreshState(){try{const row=await loadState();if(row){revision=Number(row.revision||0);state=row.state;render()}}catch(e){console.warn(e)}}

function theoryEvents(mode){return mode==='expert'?[3,6,9,12,15,18]:[3,6,9,12]}
function conferenceAt(mode,sector){if(mode==='expert'){if(sector===8)return'X1';if(sector===16)return'X2'}else if(sector===10)return'X1';return null}
function isTheorySector(mode,sec){return theoryEvents(mode).includes(sec)}
function nextEvent(earth,target,s){const n=sectorCount(s);for(let t=earth+1;t<=target;t++){const sec=((t-1)%n)+1,key=conferenceAt(s.mode,sec);if(key&&!s.conferences?.[key])return{time:t,type:'conference',key};if(isTheorySector(s.mode,sec))return{time:t,type:'theory'};}return null}
async function rotateToNextTurn(s){
  s.conferences??={};
  for(;;){const target=Math.min(...s.players.map(p=>p.time));const ev=nextEvent(Number(s.earth||1),target,s);if(!ev){s.earth=target;s.phase='turn';s.current=activeSeat(s);return s}
    s.earth=ev.time;
    if(ev.type==='conference'){
      const clue=await rpc('boardmate_planetx_conference',{p_token:token(),p_room_id:roomId,p_key:ev.key});s.conferences[ev.key]=clue;logPublic(s,`${ev.key} 회의 공개 · ${topicKo(clue.topic)}: ${ruleKo(clue.rule)}`);continue;
    }
    s.theoryRound=Number(s.theoryRound||0)+1;s.phase='theory-select';s.theoryPlaceIndex=0;s.theoryQueue=[];s.current=activeSeat(s);logPublic(s,`논문 단계 ${s.theoryRound} 시작`);return s;
  }
}
function makeInitial(mode,code){const order=[...members.keys()];for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}const rank=Object.fromEntries(order.map((x,i)=>[x,i]));return{kind:'planetx-pvp-v1',version:'11.4.47',mode,code,phase:'setup',earth:1,current:0,tieSeq:members.length,theoryRound:0,theoryPlaceIndex:0,theoryQueue:[],players:members.map((m,i)=>({seat:i,name:memberName(i),time:1,tie:rank[i],targetUsed:0,lastAction:'',xScore:0})),conferences:{},confirmed:{},theories:[],log:[{at:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),text:`게임 ${code} · ${mode==='expert'?'전문가':'표준'} 모드 준비`}],finalQueue:[],finalIndex:0,firstLocator:null,scores:null,over:false}}

function captureScroll(){const inner={};document.querySelectorAll('[data-scroll-key]').forEach(el=>{inner[el.dataset.scrollKey]={top:el.scrollTop,left:el.scrollLeft}});return{x:window.scrollX,y:window.scrollY,inner}}
function restoreScroll(snap){if(!snap)return;requestAnimationFrame(()=>{window.scrollTo(snap.x,snap.y);document.querySelectorAll('[data-scroll-key]').forEach(el=>{const p=snap.inner?.[el.dataset.scrollKey];if(p){el.scrollTop=p.top;el.scrollLeft=p.left}})})}
function sameJson(a,b){try{return JSON.stringify(a??null)===JSON.stringify(b??null)}catch{return false}}
function render(){
  const snap=captureScroll();
  if(!state)renderNoState();
  else if(state.phase==='setup')renderSetupReady();
  else{renderGame();if(state.phase==='theory-select')startTheoryPoll();else stopTheoryPoll();if(state.phase==='reveal')void revealAndFinish();if(state.phase==='finished')void maybeSubmitResult()}
  restoreScroll(snap);
}

 const seat=mySeat(),host=room?.host_id===me?.user_id;
 document.querySelector('#app').innerHTML=`<section class="setup"><div class="card"><h1>🪐 행성 X를 찾아서 · 온라인 PVP</h1><p class="sub">실물 보조 앱이 아니라, 이 화면에서 관찰·타임 트랙·논문·교차 검증·점수까지 진행하는 완전 플레이 모드입니다. 정답 태양계는 Supabase의 비공개 게임 카탈로그에만 저장됩니다.</p><h3 style="margin-top:18px">게임 모드</h3><div class="mode-row"><button class="choice selected" data-mode="standard"><b>표준 모드</b><span class="sub">12 섹터 · 첫 게임 권장</span></button><button class="choice" data-mode="expert"><b>전문가 모드</b><span class="sub">18 섹터 · 논문 2개 / X2 회의</span></button></div><div style="margin-top:16px">${host?`<button id="initGame" class="btn gold">숨은 태양계 생성</button>`:`<div class="notice">방장이 숨은 태양계를 생성할 때까지 기다리고 있습니다.</div>`}</div></div></section>`;
 document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{selectedMode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('selected',x===b))});
 document.querySelector('#initGame')?.addEventListener('click',async()=>{try{busy=true;const r=await rpc('boardmate_planetx_start',{p_token:token(),p_room_id:roomId,p_mode:selectedMode});const s=makeInitial(r.mode,r.code);const nr=await saveState(Math.max(0,revision),s);revision=nr;state=s;render()}catch(e){toast((e.message||e)+' · SUPABASE_PLANETX_PVP_V1.sql 실행 여부를 확인하세요.','error')}finally{busy=false}})
}

 const readyHtml=state.setupStatus||[];const myReady=readyHtml.find(x=>x.seat===mySeat())?.ready;const allReady=readyHtml.length===members.length&&readyHtml.every(x=>x.ready);
 document.querySelector('#app').innerHTML=`<section class="setup"><div class="card"><div class="board-head"><div><h1>게임 ${esc(state.code)}</h1><div class="sub">${state.mode==='expert'?'전문가 18섹터':'표준 12섹터'} · 각자 시작 정보는 다른 플레이어에게 공개되지 않습니다.</div></div><span class="badge gold">준비 단계</span></div><h3>내 시작 정보 난이도</h3><div class="diff-row">${Object.entries(DIFF).map(([k,[label,n]])=>`<button class="choice ${selectedDiff===k?'selected':''}" data-diff="${k}"><b>${label}</b><span class="sub">시작 정보 ${n}개</span></button>`).join('')}</div><div style="margin-top:12px"><button id="getHints" class="btn primary">${myReady?'시작 정보 다시 받기':'시작 정보 받고 준비 완료'}</button></div><div class="ready-list">${members.map((m,i)=>{const x=readyHtml.find(a=>a.seat===i);return`<div class="ready-row" style="border-left:4px solid ${playerColor(i)}"><b>${playerNameHtml(i)} <span class="player-color-name" style="--pc:${playerColor(i)}">${playerColorName(i)}</span></b><span class="${x?.ready?'ok':''}">${x?.ready?'✓ 준비 완료':'대기 중'}</span></div>`}).join('')}</div>${allReady&&mySeat()===0?`<button id="startPlay" class="btn green">모두 준비됨 · 관측 시작</button>`:allReady?`<div class="notice">모두 준비되었습니다. 방장이 관측을 시작하는 중입니다.</div>`:`<div class="notice">모든 플레이어가 시작 정보를 받으면 게임을 시작할 수 있습니다.</div>`}<div class="card private" style="margin-top:12px"><h3>🔒 내 시작 정보</h3>${priv.hints.length?`<div class="hints" data-scroll-key="setup-hints">${priv.hints.map(h=>`<div class="line">섹터 <b>${h.sector}</b>에는 <b>${esc(nounKo(h.not))}</b>이(가) 없습니다.</div>`).join('')}</div>`:`<div class="sub">아직 받지 않았습니다.</div>`}</div></div></section>`;
 document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{selectedDiff=b.dataset.diff;render()});
 document.querySelector('#getHints').onclick=async()=>{try{busy=true;const r=await rpc('boardmate_planetx_start_info',{p_token:token(),p_room_id:roomId,p_difficulty:selectedDiff});priv.hints=r.hints||[];priv.season=r.season;priv.difficulty=r.difficulty;savePrivate();await updateSetupStatus();toast(`${SEASON_KO[r.season]} 시작 정보 ${priv.hints.length}개를 받았습니다.`)}catch(e){toast(e.message||e,'error')}finally{busy=false}};
 document.querySelector('#startPlay')?.addEventListener('click',async()=>{const s=cloneState();s.phase='turn';s.current=activeSeat(s);logPublic(s,'모든 관측자 준비 완료 · 게임 시작');await commit(s,'게임 시작')});
 startSetupPoll();

async function updateSetupStatus(){if(!state||state.phase!=='setup')return;try{const st=await rpc('boardmate_planetx_setup_status',{p_token:token(),p_room_id:roomId});if(!sameJson(state.setupStatus,st)){state.setupStatus=st;render()}}catch(e){console.warn(e)}}
function startSetupPoll(){if(setupTimer)return;updateSetupStatus();setupTimer=setInterval(updateSetupStatus,1800)}function stopSetupPoll(){if(setupTimer){clearInterval(setupTimer);setupTimer=null}}

function referencePanel(){const expert=state.mode==='expert',comets=cometSectors().join(', '),dwarfCount=expert?4:1,emptyCount=expert?5:2,dwarfRule=expert?'정확히 6개 섹터의 띠 안에 있으며 띠의 양 끝이 왜소행성입니다. 행성 X와 인접하지 않습니다.':'행성 X와 인접하지 않습니다.',dwarfPaperScore=expert?2:4,topicRows=['A','B','C','D','E','F'].map(k=>`<tr><th>${k}</th><td class="ref-rule">${esc(topicKo(researchTopics?.[k]||'제목 정보 없음'))}</td></tr>`).join('');return`<details class="reference" open><summary>📌 개체 규칙 · 논문 점수 참조표</summary><table class="ref-table"><tbody><tr><th>개체</th><th>수</th><th>정확한 논문</th><th>기본 규칙</th></tr><tr><td class="ref-obj">🌠 혜성</td><td>2</td><td><b>3점</b></td><td class="ref-rule">${comets}번 섹터에만 있을 수 있습니다.</td></tr><tr><td class="ref-obj">🌑 소행성</td><td>4</td><td><b>2점</b></td><td class="ref-rule">각 소행성은 최소 1개의 다른 소행성과 인접합니다.</td></tr><tr><td class="ref-obj">🪐 왜소행성</td><td>${dwarfCount}</td><td><b>${dwarfPaperScore}점</b>${expert?'<br><small>전문가</small>':'<br><small>표준</small>'}</td><td class="ref-rule">${dwarfRule}</td></tr><tr><td class="ref-obj">☁️ 가스 구름</td><td>2</td><td><b>4점</b></td><td class="ref-rule">각 가스 구름은 최소 1개의 진짜 빈 섹터와 인접합니다.</td></tr><tr><td class="ref-obj">✦ 행성 X</td><td>1</td><td>—</td><td class="ref-rule">왜소행성과 인접하지 않으며, 개체 탐사/섹터 지정에서는 ‘비어 보임’으로 나타납니다.</td></tr><tr><td class="ref-obj">⬚ 진짜 빈 섹터</td><td>${emptyCount}</td><td>—</td><td class="ref-rule">실제로 아무 개체도 없는 섹터입니다. ‘비어 보임’ 결과에는 행성 X도 포함될 수 있습니다.</td></tr></tbody></table><div class="sub" style="margin-top:8px"><b>논문 리더 보너스:</b> 각 섹터에서 올바른 논문을 가장 먼저 제출한 플레이어(공동 1위 포함) +1점.<br><b>행성 X:</b> 최초 발견 10점 · 이후 올바르게 찾으면 선두보다 뒤처진 섹터당 2점(2~10점).</div></details><details class="reference" open><summary>📚 연구 주제 제목 A–F</summary><div class="sub" style="margin-top:7px">제목은 공개 정보이며 실제 논리 규칙은 연구한 플레이어만 확인합니다.</div><table class="ref-table"><tbody>${topicRows}</tbody></table></details><details class="reference"><summary>⏱ 액션 시간 비용</summary><table class="ref-table"><tbody><tr><td>행성 X 찾기</td><td><b>5</b></td></tr><tr><td>섹터 지정</td><td><b>4</b></td></tr><tr><td>개체 탐사 1~3섹터</td><td><b>4</b></td></tr><tr><td>개체 탐사 4~6섹터</td><td><b>3</b></td></tr>${expert?'<tr><td>개체 탐사 7~9섹터</td><td><b>2</b></td></tr>':''}<tr><td>주제 조사</td><td><b>1</b></td></tr></tbody></table></details>`}
function orbitPanel(){
 const n=sectorCount(),vis=new Set(visibleSectors()),earth=((state.earth-1)%n)+1,nodeR=43;
 const spokes=Array.from({length:n},(_,i)=>`<i class="orbit-spoke" style="transform:rotate(${(i*360/n).toFixed(3)}deg)"></i>`).join('');
 const nodes=Array.from({length:n},(_,i)=>i+1).map(sec=>{
   const a=(-90+(sec-1)*360/n)*Math.PI/180,x=50+nodeR*Math.cos(a),y=50+nodeR*Math.sin(a),finalObj=state.phase==='finished'&&Array.isArray(state.board)?state.board[sec-1]:null,cf=finalObj||state.confirmed?.[sec],opp=oppositeSector(sec),here=state.players.filter(p=>((p.time-1)%n)+1===sec);
   return`<div class="orbit-node ${vis.has(sec)?'visible':''} ${sec===earth?'earth':''} ${cf?'confirmed':''} ${finalObj==='x'?'final-x':''}" style="left:${x.toFixed(3)}%;top:${y.toFixed(3)}%" title="${sec}번 섹터 · 정반대 ${opp}번${vis.has(sec)?' · 관찰 가능':''}${finalObj?` · 최종 정답 ${esc(finalObjLabel(finalObj))}`:''}"><div class="orbit-pawns">${here.map(p=>`<i class="orbit-pawn" style="background:${playerColor(p.seat)}" title="${esc(memberName(p.seat))} · 시간 ${p.time}"></i>`).join('')}</div><div><div class="orbit-no">${sec}</div><div class="orbit-opp">↔ ${opp}</div>${cf?`<div class="orbit-object" title="${esc(finalObj?finalObjLabel(cf):objLabel(cf))}">${OBJICON[cf]||'✓'}</div>`:''}</div></div>`
 }).join('');
 const eventR=49.2;
 const eventMarkers=Array.from({length:n},(_,i)=>i+1).map(sec=>{
   const confKey=conferenceAt(state.mode,sec),festival=isTheorySector(state.mode,sec);if(!confKey&&!festival)return'';
   const a=(-90+(sec-1)*360/n)*Math.PI/180,x=50+eventR*Math.cos(a),y=50+eventR*Math.sin(a),label=confKey?`${confKey} 회의`:'학술제',icon=confKey?'🔭':'📚',klass=confKey?'conference-event':'festival';
   return`<div class="orbit-event-marker ${klass}" style="left:${x.toFixed(3)}%;top:${y.toFixed(3)}%" title="${label} · 시간 트랙 ${sec}"><span>${icon}</span><small>${label}</small></div>`
 }).join('');
 const festivalTimes=theoryEvents(state.mode).join(' · '),conferenceTimes=state.mode==='expert'?'X1=8 · X2=16':'X1=10';
 const eventSchedule=`<div class="orbit-event-schedule"><span>📚 학술제 <b>${festivalTimes}</b></span><span>🔭 회의 <b>${conferenceTimes}</b></span></div>`;
 const tokens=[];
 for(let sec=1;sec<=n;sec++){
   const ts=(state.theories||[]).filter(t=>t.sector===sec&&!t.removed);
   const grouped={}; for(const t of ts){const d=Math.max(1,Math.min(3,Number(t.depth||1)));(grouped[d]??=[]).push(t)}
   for(const [depthText,arr] of Object.entries(grouped)){
     const depth=Number(depthText),baseR=depth===1?33.5:depth===2?27.5:21.5;
     arr.forEach((t,idx)=>{
       const angle=(-90+(sec-1)*360/n)*Math.PI/180;
       const spread=(idx-(arr.length-1)/2)*(n>=18?1.25:1.6);
       const x=50+baseR*Math.cos(angle)-spread*Math.sin(angle),y=50+baseR*Math.sin(angle)+spread*Math.cos(angle);
       const face=Boolean(t.faceUp),symbol=face?(OBJICON[t.object]||'?'):(t.ownerSeat+1),age=depth===1?'신규':depth===2?'1단계 전':'검증';
       const round=t.submitRound?` · 논문 단계 ${t.submitRound}`:'';
       tokens.push(`<div class="orbit-theory-token ${face?'face':''} ${t.correct===false?'wrong':''}" style="left:${x.toFixed(3)}%;top:${y.toFixed(3)}%;background:${face?'#e9f7ff':playerColor(t.ownerSeat)};border-color:${playerColor(t.ownerSeat)}" title="${esc(memberName(t.ownerSeat))} · ${age}${round} · 깊이 ${depth}/3${face?` · ${esc(objLabel(t.object))}`:''}"><span class="theory-symbol">${symbol}</span>${face?`<small class="theory-seat" style="color:${playerColor(t.ownerSeat)}">${t.ownerSeat+1}</small>`:''}<small class="theory-age">${age}</small></div>`);
     })
   }
 }
 const playerKey=state.players.map(p=>`<span><i style="background:${playerColor(p.seat)}"></i>${p.seat+1} ${esc(memberName(p.seat))}</span>`).join('');
 return`<div class="orbit-wrap"><div class="orbit-board ${state.mode==='expert'?'expert':''}">${spokes}${eventMarkers}<i class="orbit-lane-ring r1"></i><i class="orbit-lane-ring r2"></i><i class="orbit-lane-ring r3"></i>${tokens.join('')}${nodes}<div class="orbit-sun"><span>☀️</span><small>태양</small></div></div></div>${eventSchedule}<div class="theory-player-key">${playerKey}</div><div class="orbit-legend-row"><span>논문: <b>바깥=신규 · 중간=1단계 전 · 안쪽=검증 직전</b></span><span>색/숫자 = 제출자</span><span>공개되면 천체 이모지 표시</span></div><div class="orbit-help">🌍 지구 기준 <b>${earth}</b> · 청록 = 관찰 가능 · 금색 = 지구 위치 · 맞은편은 +${n/2}섹터</div>`
}
function renderGame(){stopSetupPoll();const n=sectorCount(),vis=new Set(visibleSectors()),current=state.current;const eventNote=state.phase==='theory-select'?'📄 논문 비공개 선택':state.phase==='theory-place'?'📄 논문 배치':state.phase==='final'?'🏁 마지막 점수 기회':state.phase==='finished'?'🏆 게임 종료':'🔭 관측 중';
 const playerCards=state.players.map(p=>`<div class="player ${p.seat===current?'active':''} ${p.seat===mySeat()?'me':''}" style="--pc:${playerColor(p.seat)}"><div class="pname"><span class="player-dot"></span>${esc(memberName(p.seat))}${p.seat===mySeat()?' · 나':''}<span class="player-color-name">${playerColorName(p.seat)}</span></div><div class="ptime">시간 ${p.time} · 섹터 ${((p.time-1)%n)+1}</div><div style="margin-top:5px"><span class="badge">타겟 ${2-p.targetUsed}/2</span>${p.xScore?` <span class="badge gold">X ${p.xScore}점</span>`:''}</div></div>`).join('');
 const sectors=Array.from({length:n},(_,i)=>i+1).map(sec=>{const cf=state.confirmed?.[sec],ts=(state.theories||[]).filter(t=>t.sector===sec&&!t.removed);return`<div class="sector ${vis.has(sec)?'visible':''} ${cf?'confirmed':''}"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><span class="no">${sec}</span><span class="opposite-tag">↔ 맞은편 ${oppositeSector(sec)}</span></div>${vis.has(sec)?'<span class="vis">관찰 가능</span>':''}</div>${cf?`<div class="confirmed-label">${objLabel(cf)}</div>`:'<div class="sub" style="margin-top:8px">미확인</div>'}<div class="track">${ts.map(t=>`<div class="theory ${t.faceUp?'face':''} ${t.correct===false?'wrong':''}" style="border-color:${playerColor(t.ownerSeat)};box-shadow:inset 0 0 0 1px ${playerColor(t.ownerSeat)}55" title="${esc(memberName(t.ownerSeat))} (${playerColorName(t.ownerSeat)}) · 깊이 ${t.depth}">${t.faceUp?OBJICON[t.object]||'?':'?'}<small class="theory-owner" style="background:${playerColor(t.ownerSeat)};color:#07111f">${t.ownerSeat+1}</small></div>`).join('')}</div><div class="depth">${ts.length?`논문 · ${ts.map(t=>`${t.ownerSeat+1}번 제출자 · ${t.submitRound?`${t.submitRound}차 · `:''}${Math.max(1,Number(t.depth||1))}/3`).join(' / ')}`:'논문 없음'}</div></div>`}).join('');
 const ticks=Array.from({length:n},(_,i)=>i+1).map(sec=>{const here=state.players.filter(p=>((p.time-1)%n)+1===sec);return`<div class="tick ${((state.earth-1)%n)+1===sec?'earth':''} ${isTheorySector(state.mode,sec)?'theory-event':''} ${conferenceAt(state.mode,sec)?'conf-event':''}"><span class="tick-num">${sec}</span><span class="tick-pawns">${here.map(p=>`<i class="pawn-dot ${p.seat===current?'active':''}" style="background:${playerColor(p.seat)}" title="${esc(memberName(p.seat))} · 시간 ${p.time}"></i>`).join('')}</span></div>`}).join('');
 const conf=Object.entries(state.conferences||{}).map(([k,v])=>`<div class="conference"><b>${k} 회의 · ${esc(topicKo(v.topic||''))}</b><div class="sub" style="color:#f3e7bd">${esc(ruleKo(v.rule||''))}</div></div>`).join('');
 document.querySelector('#app').innerHTML=`<div class="players" data-scroll-key="players">${playerCards}</div><div class="grid"><section class="card board-card"><div class="board-head"><div><h2>태양계 게임판 · ${state.mode==='expert'?'전문가':'표준'} 모드</h2><div class="sub">게임 코드 ${esc(state.code)} · 지구 위치 ${((state.earth-1)%n)+1} · 관찰 가능 하늘 ${visibleSectors().join(', ')}</div></div><span class="badge gold">${eventNote}</span></div>${orbitPanel()}<div class="time-line" data-scroll-key="time-line">${ticks}</div><div class="sub board-legend">📚 학술제(논문 단계) · 🔭 회의 · 원형 보드 바깥 배지에 발생 시점을 표시합니다. 색 점은 플레이어 시간 위치입니다.</div>${privateObservationPanel()}<details class="sector-detail-box"><summary>🧩 섹터 상세 · 논문 트랙</summary><div class="sky ${state.mode==='expert'?'expert':''}">${sectors}</div></details></section><aside class="game-side"><section class="card"><h3>현재 진행</h3>${phasePanel()}${reviewResultPanel()}</section><section class="card"><h3>공개 회의 정보</h3>${conf||'<div class="sub">아직 공개된 회의 정보가 없습니다.</div>'}</section><section class="card"><h3>공개 기록</h3><div class="log" data-scroll-key="public-log">${publicLogRows().map(x=>`<div class="line"><b>${esc(x.at)}</b> · ${publicLogHtml(x.text)}</div>`).join('')||'<div class="sub">기록 없음</div>'}</div></section><details class="card private private-sheet private-sheet-box" ${uiRecordOpen?'open':''}><summary>🔒 내 기록지</summary><div class="private-sheet-body"><div class="sub">시작 정보·조사 기록·섹터 메모는 로그인 계정에 비공개로 저장됩니다.</div>${privatePanel()}</div></details></aside>${state.phase==='finished'?`${finalSolutionPanel()}<section class="card full">${scorePanel()}</section>`:''}<section class="card full reference-bottom"><h3>참조표</h3>${referencePanel()}</section></div>`;

}
function phasePanel(){
 const seat=mySeat(),p=state.players[seat];
 if(state.phase==='turn')return state.current===seat?`<div class="notice"><b>당신의 차례입니다.</b><br>액션 1개를 선택하세요. 액션 후 시간 비용만큼 자동 이동하고 지구가 회전합니다.</div><div class="actions"><button class="btn primary" id="survey">🔭 개체 탐사</button><button class="btn primary" id="target" ${p.targetUsed>=2?'disabled':''}>🎯 섹터 지정</button><button class="btn primary" id="research" ${p.lastAction==='research'?'disabled':''}>📚 주제 조사</button><button class="btn gold" id="locate">✦ 행성 X 찾기</button></div>`:`<div class="notice"><b>${playerNameHtml(state.current)}</b>의 차례입니다.<br>상대가 비공개 결과를 확인하고 행동을 마칠 때까지 기다리세요.</div>`;
 if(state.phase==='theory-select')return theorySelectPanel();
 if(state.phase==='theory-place'){const q=state.theoryQueue||[],who=q[state.theoryPlaceIndex];return who===seat?`<div class="notice auto-place-note"><span>선택한 논문을 보드에 자동 배치하고 있습니다. 별도 확정은 필요 없습니다.</span></div>`:`<div class="notice"><b>${playerNameHtml(who)}</b>의 논문을 자동 배치하는 중입니다.</div>`}
 if(state.phase==='final')return finalPanel();
 if(state.phase==='reveal')return`<div class="notice">최종 정답과 모든 남은 논문을 공개하고 점수를 계산하는 중입니다.</div>`;
 if(state.phase==='finished')return`<div class="notice">게임이 종료되었습니다. 아래 최종 점수를 확인하세요.</div>`;
 return`<div class="notice">진행 상태를 동기화하는 중입니다.</div>`;
}
function theorySelectPanel(){const status=state.theoryStatus||[],mine=status.find(x=>x.seat===mySeat());return`<div class="notice">모든 플레이어가 동시에 논문을 비공개로 선택합니다. ${state.mode==='expert'?'최대 2개':'최대 1개'}이며 0개 제출도 가능합니다.</div><button id="chooseTheory" class="btn ${mine?.ready?'ghost':'green'}">${mine?.ready?'내 선택 수정':'논문 비공개 선택'}</button><div class="theory-status">${members.map((m,i)=>{const x=status.find(a=>a.seat===i);return`<span class="badge ${x?.ready?'gold':''}" style="border:1px solid ${playerColor(i)}66"><span style="color:${playerColor(i)}">●</span> ${x?.ready?'✓':'…'} ${esc(memberName(i))}</span>`}).join('')}</div>`}
function finalPanel(){const item=state.finalQueue?.[state.finalIndex];if(!item)return`<button id="finishReveal" class="btn gold">정답 공개 · 점수 계산</button>`;if(item.seat!==mySeat())return`<div class="notice"><b>${playerNameHtml(item.seat)}</b>의 마지막 점수 기회입니다.<br>선두보다 ${item.distance}칸 뒤였습니다.</div>`;const max=item.distance<=3?1:2;return`<div class="notice"><b>마지막 점수 기회</b><br>선두보다 ${item.distance}칸 뒤 · 논문 ${max}개 제출 <b>또는</b> 행성 X 찾기를 시도할 수 있습니다. 이때 시간은 이동하지 않습니다.</div><div class="actions"><button id="finalTheory" class="btn green">논문 최대 ${max}개 제출</button><button id="finalLocate" class="btn gold">행성 X 찾기</button></div>`}
function reviewResultPanel(){const r=state.lastReview;if(!r?.entries?.length)return'';const rows=r.entries.map(x=>{const who=esc(memberName(Number(x.ownerSeat))),obj=objLabel(x.object),actual=x.actual?` · 실제 개체: <b>${objLabel(x.actual)}</b>`:'';return`<div class="line">${x.correct?'✅':'❌'} <b>${who}</b> · 섹터 <b>${Number(x.sector)}</b> · ${obj} 논문 <b>${x.correct?'맞음':'틀림'}</b>${x.correct?'':` → 이 섹터에는 <b>${obj}</b> 없음`}${actual}</div>`}).join('');return`<div class="notice"><b>📄 최근 논문 교차 검증 결과${r.round?` · ${r.round}차`:''}</b><div style="display:grid;gap:6px;margin-top:7px">${rows}</div><div class="sub" style="margin-top:7px">틀린 논문은 ‘그 섹터에는 제출한 개체가 없다’는 사실까지 공개됩니다. 실제 개체는 같은 섹터에서 올바른 논문이 확인된 경우에만 함께 표시됩니다.</div></div>`}
function privateObservationPanel(){const rows=priv.observations||[];return`<section class="private-quick"><div class="private-quick-head"><h3>🔒 내 비공개 조사 기록</h3><span class="badge">${rows.length}건</span></div><div class="record-tip">조사 결과가 최신순으로 바로 쌓입니다. 보드 아래에서 계속 확인할 수 있습니다.</div><div class="obs quick-obs" data-scroll-key="private-observations" style="margin-top:7px">${rows.map(o=>`<div class="line"><b>${esc(o.at)} · ${esc(o.type)}</b><br>${esc(displayKo(o.text))}</div>`).join('')||'<div class="sub">아직 조사 기록이 없습니다.</div>'}</div></section>`}
function recordPoint(angleDeg,radiusPct){const rad=angleDeg*Math.PI/180;return{x:50+Math.sin(rad)*radiusPct,y:50-Math.cos(rad)*radiusPct}}
function recordEmojiFootnote(){return`<div class="record-emoji-footnote"><b>※ 이모지 각주</b> · 이모지는 화면에서 개체를 빠르게 구분하기 위한 표기입니다.<div class="record-emoji-items"><span>${OBJICON.asteroid} 소행성</span><span>${OBJICON.comet} 혜성</span><span>${OBJICON.dwarf} 왜소행성</span><span>${OBJICON.gas} 가스 구름</span><span>${OBJICON.empty} 비어 보임</span><span>${OBJICON.x} 행성 X</span><span>× 없음</span><span>✓ 있음</span></div></div>`}
function squareRecordSheet(){const allowedComets=new Set(cometSectors());const marks=Array.from({length:sectorCount()},(_,i)=>i+1).map(sec=>{const objects=['asteroid',...(allowedComets.has(sec)?['comet']:[]),'dwarf','gas','empty','x'];return`<div class="note-cell ${allowedComets.has(sec)?'comet-possible':''}"><b>${sec}</b>${allowedComets.has(sec)?'<span class="comet-possible-label">🌠 혜성 가능</span>':''}<div class="mark-row">${objects.map(o=>{const v=priv.marks?.[sec]?.[o]||'',label=objLabel(o);return`<button type="button" class="mark ${v}" title="${esc(label)} · 미정/없음/있음 전환" aria-label="${sec}섹터 ${esc(label)} 기록" data-mark="${sec}:${o}">${OBJNOTE[o]}<span class="mkstate">${v==='no'?'×':v==='yes'?'✓':''}</span></button>`}).join('')}</div></div>`}).join('');return`<div class="square-record-wrap"><div class="record-sheet-tip">기존 네모 기록지입니다. 아이콘/항목을 누르면 미정 → × 없음 → ✓ 있음으로 바뀝니다. 혜성은 가능한 섹터에만 표시됩니다.</div><div class="note-grid">${marks}</div></div>`}
function circularRecordSheet(){const n=sectorCount(),expert=n===18,step=360/n,sectorOneAngle=0,allowedComets=new Set(cometSectors());const radii=expert?{number:46.0,x:39.4,empty:34.7,gas:30.0,dwarf:25.3,asteroid:20.6,comet:15.9}:{number:46.0,x:39.7,empty:35.0,gas:30.3,dwarf:25.6,asteroid:20.9,comet:16.2};const spokes=Array.from({length:n},(_,i)=>{const a=sectorOneAngle+(i*step)-(step/2);return`<i class="record-spoke" style="transform:translateX(-50%) rotate(${a+180}deg)"></i>`}).join('');const sectorMarks=Array.from({length:n},(_,i)=>i+1).map(sec=>{const angle=sectorOneAngle+(sec-1)*step,num=recordPoint(angle,radii.number),objects=['x','empty','gas','dwarf','asteroid',...(allowedComets.has(sec)?['comet']:[])];return`<span class="record-sector-no" style="left:${num.x.toFixed(3)}%;top:${num.y.toFixed(3)}%">${sec}</span>${objects.map(o=>{const p=recordPoint(angle,radii[o]),v=priv.marks?.[sec]?.[o]||'',label=objLabel(o);return`<button type="button" class="record-mark ${o==='comet'?'comet-mark ':''}${v}" style="left:${p.x.toFixed(3)}%;top:${p.y.toFixed(3)}%" title="${esc(label)} · 미정/없음/있음 전환" aria-label="${sec}섹터 ${esc(label)} 기록" data-mark="${sec}:${o}"><span class="record-mark-icon">${OBJICON[o]}</span><span class="mkstate">${v==='no'?'×':v==='yes'?'✓':''}</span></button>`}).join('')}`}).join('');const modeLabel=expert?'전문가 · 18섹터':'표준 · 12섹터';return`<div class="record-sheet-tip">게임판과 동일하게 1번 섹터가 맨 위(12시)이고, 이후 시계방향으로 증가합니다. 바깥쪽 섹터 번호에서 안쪽으로 개체 아이콘을 배치했으며 아이콘을 누르면 미정 → × 없음 → ✓ 있음으로 바뀝니다. 혜성은 가능한 섹터에만 표시됩니다.</div><div class="record-wheel-wrap"><div class="record-wheel ${expert?'expert':'standard'}" style="--sector-count:${n}">${spokes}${sectorMarks}<div class="record-wheel-center"><strong>섹터 메모</strong><span>${SEASON_KO[priv.season]||modeLabel}</span><small>${modeLabel}<br>× 없음 · ✓ 있음</small></div></div></div>`}
function privatePanel(){return`<div style="margin:10px 0"><b>${SEASON_KO[priv.season]||'시작 정보'}</b> · ${DIFF[priv.difficulty]?.[0]||'미선택'}</div><div class="hints" data-scroll-key="private-hints">${(priv.hints||[]).map(h=>`<div class="line">섹터 <b>${h.sector}</b>에는 <b>${esc(nounKo(h.not))}</b>이(가) 없습니다.</div>`).join('')||'<div class="sub">계정에 저장된 시작 정보가 없습니다. 같은 방에서 준비 단계의 시작 정보를 다시 받으세요.</div>'}</div><div class="record-layout-head"><h3>📝 섹터 기록지</h3><div class="record-layout-switch" role="group" aria-label="기록지 모양"><button type="button" class="${uiRecordLayout==='circle'?'active':''}" aria-pressed="${uiRecordLayout==='circle'}" data-record-layout="circle">◯ 원형</button><button type="button" class="${uiRecordLayout==='square'?'active':''}" aria-pressed="${uiRecordLayout==='square'}" data-record-layout="square">▦ 기존 네모</button></div></div>${uiRecordLayout==='square'?squareRecordSheet():circularRecordSheet()}${recordEmojiFootnote()}`}

function scorePanel(){const scores=state.scores||[];return`<h2>🏆 최종 점수</h2><table class="score-table"><thead><tr><th>플레이어</th><th>논문</th><th>리더</th><th>행성 X</th><th>합계</th></tr></thead><tbody>${scores.map(x=>`<tr><td style="border-left:4px solid ${playerColor(x.seat)}">${x.rank===1?'🏆 ':''}<span style="color:${playerColor(x.seat)}">●</span> ${esc(memberName(x.seat))} <span class="player-color-name" style="--pc:${playerColor(x.seat)}">${playerColorName(x.seat)}</span></td><td>${x.theory}</td><td>${x.leader}</td><td>${x.x}</td><td><b>${x.total}</b></td></tr>`).join('')}</tbody></table>${state.sharedTie?'<div class="notice" style="margin-top:10px">공식 타이브레이커 후에도 완전 동점이라 공동 승리입니다. 이 경우 BoardMate ELO는 자동 반영하지 않습니다.</div>':''}${endPanel('게임 종료',scores.filter(x=>x.rank===1).map(x=>memberName(x.seat)).join(', ')+' 승리')}`}

function bindGameControls(){
 document.querySelector('#survey')?.addEventListener('click',openSurvey);document.querySelector('#target')?.addEventListener('click',openTarget);document.querySelector('#research')?.addEventListener('click',openResearch);document.querySelector('#locate')?.addEventListener('click',()=>openLocate(false));document.querySelector('#chooseTheory')?.addEventListener('click',openTheoryChoice);document.querySelector('#finalTheory')?.addEventListener('click',openFinalTheory);document.querySelector('#finalLocate')?.addEventListener('click',()=>openLocate(true));document.querySelector('#finishReveal')?.addEventListener('click',async()=>{const s=cloneState();s.phase='reveal';await commit(s,'정답 공개')});

 document.querySelectorAll('[data-record-layout]').forEach(b=>b.addEventListener('click',()=>{const next=b.dataset.recordLayout==='square'?'square':'circle';if(next===uiRecordLayout)return;uiRecordLayout=next;uiRecordOpen=true;try{localStorage.setItem(RECORD_LAYOUT_KEY,next)}catch{}render()}));
 document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>{const [sec,o]=b.dataset.mark.split(':');priv.marks[sec]??={};const cur=priv.marks[sec][o]||'';const next=cur===''?'no':cur==='no'?'yes':'';priv.marks[sec][o]=next;savePrivate();b.classList.remove('no','yes');if(next)b.classList.add(next);const st=b.querySelector('.mkstate');if(st)st.textContent=next==='no'?'×':next==='yes'?'✓':''});

function optionObjects(includeEmpty=false){const xs=['asteroid','comet','dwarf','gas'];if(includeEmpty)xs.push('empty');return xs.map(o=>`<option value="${o}">${objLabel(o)}</option>`).join('')}

function openSurvey(){if(!canAct())return;const vis=visibleSectors();modal(`<h2>🔭 개체 탐사</h2><p class="sub">현재 관찰 가능한 연속 섹터 범위에서 선택한 개체 수를 비공개로 확인합니다. 행성 X는 ‘비어 보임’에 포함됩니다.</p><div class="form-row"><div class="field"><label>개체</label><select id="svObj">${optionObjects(true)}</select></div><div class="field"><label>범위</label><select id="svRange">${vis.map((_,i)=>vis.slice(0,i+1)).map(a=>`<option value="${a.join(',')}">${a.join('–')} (${a.length}개)</option>`).join('')}</select></div></div><div class="chips" id="rangeStarts">${vis.map((sec,i)=>`<button class="chip ${i===0?'on':''}" data-start="${i}">시작 ${sec}</button>`).join('')}</div><div class="modal-actions"><button class="btn ghost" data-close>취소</button><button class="btn primary" id="doSurvey">탐사 실행</button></div>`,m=>{let start=0;const range=m.querySelector('#svRange');const rebuild=()=>{const linear=vis.slice(start);range.innerHTML=linear.map((_,i)=>linear.slice(0,i+1)).map(a=>`<option value="${a.join(',')}">${a.join(' → ')} (${a.length}개)</option>`).join('')};m.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{start=Number(b.dataset.start);m.querySelectorAll('[data-start]').forEach(x=>x.classList.toggle('on',x===b));rebuild()});m.querySelector('[data-close]').onclick=closeModal;m.querySelector('#doSurvey').onclick=async()=>{const obj=m.querySelector('#svObj').value,sectors=range.value.split(',').map(Number);if(obj==='comet'){const allowed=cometSectors();if(!allowed.includes(sectors[0])||!allowed.includes(sectors.at(-1))){toast('혜성 탐사는 혜성이 있을 수 있는 섹터에서 시작하고 끝나야 합니다.','error');return}}const len=sectors.length,cost=len<=3?4:len<=6?3:2;if(state.mode!=='expert'&&len>6)return;try{busy=true;const cnt=await rpc('boardmate_planetx_survey',{p_token:token(),p_room_id:roomId,p_object:obj,p_sectors:sectors});addPrivate('개체 탐사',`${objLabel(obj)} · ${sectors.join(', ')} → ${cnt}개`);closeModal();await finishAction(cost,'survey',`${memberName(mySeat())} · ${objLabel(obj)} 탐사 [${sectors.join(', ')}]`,false);toast(`비공개 결과: ${objLabel(obj)} ${cnt}개`)}catch(e){toast(e.message||e,'error')}finally{busy=false}}})}
function openTarget(){if(!canAct())return;const vis=visibleSectors();modal(`<h2>🎯 섹터 지정 조사</h2><p class="sub">남은 토큰 ${2-state.players[mySeat()].targetUsed}/2. 결과는 나에게만 보입니다. 행성 X가 있으면 ‘비어 보임’으로 표시됩니다.</p><div class="form-row one"><div class="field"><label>섹터</label><select id="tgSec">${optionSectors(vis)}</select></div></div><div class="modal-actions"><button class="btn ghost" data-close>취소</button><button class="btn primary" id="doTarget">조사 실행</button></div>`,m=>{m.querySelector('[data-close]').onclick=closeModal;m.querySelector('#doTarget').onclick=async()=>{const sec=Number(m.querySelector('#tgSec').value);try{busy=true;const res=await rpc('boardmate_planetx_target',{p_token:token(),p_room_id:roomId,p_sector:sec});addPrivate('섹터 지정',`섹터 ${sec} → ${objLabel(res)}`);closeModal();await finishAction(4,'target',`${memberName(mySeat())} · 섹터 ${sec} 지정 조사`,false);toast(`비공개 결과: ${objLabel(res)}`)}catch(e){toast(e.message||e,'error')}finally{busy=false}}})}
async function openResearch(){if(!canAct()||state.players[mySeat()].lastAction==='research')return;const topics=await ensureResearchTopics();const options=['A','B','C','D','E','F'].map(x=>{const title=topicKo(topics?.[x]||'');return`<option value="${x}">${x}${title?` · ${esc(title)}`:' · 제목 정보를 불러오지 못함'}</option>`}).join('');modal(`<h2>📚 주제 조사</h2><p class="sub">A–F 중 하나를 선택합니다. <b>주제 제목은 공개 정보</b>이며, 선택 후 나타나는 논리 규칙만 비공개입니다. 같은 플레이어는 연구를 연속 두 턴 할 수 없습니다.</p><div class="form-row one"><div class="field"><label>주제</label><select id="rsTopic">${options}</select></div></div><div class="modal-actions"><button class="btn ghost" data-close>취소</button><button class="btn primary" id="doResearch">연구 실행</button></div>`,m=>{m.querySelector('[data-close]').onclick=closeModal;m.querySelector('#doResearch').onclick=async()=>{const topic=m.querySelector('#rsTopic').value;try{busy=true;const r=await rpc('boardmate_planetx_research',{p_token:token(),p_room_id:roomId,p_topic:topic});priv.research[topic]={...r,topicKo:topicKo(r.topic),ruleKo:ruleKo(r.rule)};savePrivate();addPrivate(`주제 조사 ${topic}`,`${topicKo(r.topic)}: ${ruleKo(r.rule)}`);closeModal();await finishAction(1,'research',`${memberName(mySeat())} · 주제 ${topic} (${topicKo(r.topic)}) 조사`,false);toast(`비공개 연구 ${topic}: ${ruleKo(r.rule)}`)}catch(e){toast(e.message||e,'error')}finally{busy=false}}})}

function finalObjLabel(x){return x==='empty'?'⬚ 진짜 빈 섹터':objLabel(x)}
function adjacentSectors(sec,n=sectorCount()){sec=Number(sec);return{left:((sec+n-2)%n)+1,right:(sec%n)+1}}
function finalSolutionPanel(){if(state.phase!=='finished'||!Array.isArray(state.board)||!state.board.length)return'';const n=sectorCount(),xIndex=state.board.findIndex(o=>o==='x'),xSec=xIndex>=0?xIndex+1:null,adj=xSec?adjacentSectors(xSec):null;const cards=state.board.slice(0,n).map((o,i)=>`<div class="final-solution-sector ${o==='x'?'x-sector':''}"><div class="secno">섹터 ${i+1}</div><div class="secobj">${finalObjLabel(o)}</div></div>`).join('');const summary=xSec?`<div class="final-x-summary"><b>✦ 행성 X 위치: 섹터 ${xSec}</b><br>왼쪽 섹터 ${adj.left}: ${finalObjLabel(state.board[adj.left-1])}<br>오른쪽 섹터 ${adj.right}: ${finalObjLabel(state.board[adj.right-1])}</div>`:'';return`<section class="card full"><div class="final-solution-head"><div><h2>🌌 최종 태양계 정답</h2><div class="sub">게임 종료 후 모든 섹터의 실제 개체와 행성 X 위치를 공개합니다.</div></div>${summary}</div><div class="final-solution-grid ${state.mode==='expert'?'expert':''}">${cards}</div></section>`}
function openLocate(finalMode){if((!finalMode&&!canAct())||(finalMode&&state.finalQueue?.[state.finalIndex]?.seat!==mySeat()))return;const n=sectorCount();modal(`<h2>✦ 행성 X 찾기</h2><p class="sub">행성 X 섹터와 양쪽 인접 섹터의 실제 개체를 모두 맞혀야 성공합니다. 시도한 섹터는 다른 플레이어에게 공개되지 않고 성공/실패만 공개됩니다.</p><div class="form-row"><div class="field"><label>행성 X 섹터</label><select id="lxSec">${optionSectors()}</select></div><div></div></div><div class="locate-adjacent-note" id="lxAdjNote"></div><div class="form-row"><div class="field"><label id="lxLeftLabel">왼쪽 인접 섹터</label><select id="lxLeft">${optionObjects(true)}</select></div><div class="field"><label id="lxRightLabel">오른쪽 인접 섹터</label><select id="lxRight">${optionObjects(true)}</select></div></div><div class="modal-actions"><button class="btn ghost" data-close>취소</button><button class="btn gold" id="doLocate">위치 제출</button></div>`,m=>{const secEl=m.querySelector('#lxSec'),leftLabel=m.querySelector('#lxLeftLabel'),rightLabel=m.querySelector('#lxRightLabel'),note=m.querySelector('#lxAdjNote');const refreshAdjacent=()=>{const sec=Number(secEl.value),a=adjacentSectors(sec);leftLabel.textContent=`왼쪽 인접 · 섹터 ${a.left}의 개체`;rightLabel.textContent=`오른쪽 인접 · 섹터 ${a.right}의 개체`;note.innerHTML=`행성 X를 <b>섹터 ${sec}</b>로 지목했습니다.<br>→ <b>섹터 ${a.left}</b>에 무엇이 있는지 왼쪽에서 선택하고, <b>섹터 ${a.right}</b>에 무엇이 있는지 오른쪽에서 선택하세요.`};secEl.addEventListener('change',refreshAdjacent);refreshAdjacent();m.querySelector('[data-close]').onclick=closeModal;m.querySelector('#doLocate').onclick=async()=>{const sec=Number(secEl.value),a=adjacentSectors(sec),left=m.querySelector('#lxLeft').value,right=m.querySelector('#lxRight').value;try{busy=true;const r=await rpc('boardmate_planetx_locate',{p_token:token(),p_room_id:roomId,p_sector:sec,p_left:left,p_right:right});addPrivate('행성 X 찾기',`섹터 ${sec} / 왼쪽 ${a.left}번 ${objLabel(left)} / 오른쪽 ${a.right}번 ${objLabel(right)} → ${r.correct?'성공':'실패'}`);closeModal();if(finalMode)await finishFinalLocate(Boolean(r.correct));else await finishAction(5,'locate',`${memberName(mySeat())} · 행성 X 찾기 ${r.correct?'성공!':'실패'}`,Boolean(r.correct));toast(r.correct?'행성 X를 찾았습니다!':'행성 X 찾기 실패',r.correct?'':'error')}catch(e){toast(e.message||e,'error')}finally{busy=false}}})}
async function finishAction(cost,type,publicText,located){const s=cloneState(),p=s.players[mySeat()];p.time+=cost;p.tie=++s.tieSeq;p.lastAction=type;if(type==='target')p.targetUsed++;logPublic(s,publicText);if(located){p.xScore=10;s.firstLocator={seat:mySeat(),time:p.time};s.finalQueue=s.players.filter(x=>x.seat!==mySeat()&&x.time<p.time).sort((a,b)=>a.time-b.time||a.tie-b.tie).map(x=>({seat:x.seat,distance:p.time-x.time}));s.finalIndex=0;s.phase=s.finalQueue.length?'final':'reveal';s.current=s.finalQueue[0]?.seat??mySeat();logPublic(s,'게임 종료 조건 발동 · 정확한 위치는 아직 공개되지 않습니다.');await commit(s,'행성 X 발견');return}await rotateToNextTurn(s);await commit(s,'액션 완료')}

function openTheoryChoice(){const max=state.mode==='expert'?2:1;modal(`<h2>📄 논문 비공개 선택</h2><p class="sub">개체 종류는 서버의 비공개 테이블에 저장되며, 배치 후 다른 플레이어에게는 섹터와 토큰 소유자만 보입니다. 0개도 가능합니다.</p><div id="theoryRows">${Array.from({length:max},(_,i)=>`<div class="form-row"><div class="field"><label>${i+1}번째 개체</label><select data-th-obj><option value="">제출 안 함</option>${optionObjects(false)}</select></div><div class="field"><label>섹터</label><select data-th-sec>${optionSectors()}</select></div></div>`).join('')}</div><div class="modal-actions"><button class="btn ghost" data-close>취소</button><button class="btn green" id="saveTheoryChoice">비공개 선택 완료</button></div>`,m=>{m.querySelector('[data-close]').onclick=closeModal;m.querySelector('#saveTheoryChoice').onclick=async()=>{const os=[...m.querySelectorAll('[data-th-obj]')],ss=[...m.querySelectorAll('[data-th-sec]')],choices=os.map((o,i)=>o.value?{object:o.value,sector:Number(ss[i].value)}:null).filter(Boolean);if(new Set(choices.map(x=>`${x.sector}:${x.object}`)).size!==choices.length){toast('같은 섹터에 같은 종류의 논문 토큰을 2개 제출할 수 없습니다.','error');return}try{await rpc('boardmate_planetx_set_theory_choice',{p_token:token(),p_room_id:roomId,p_phase_id:state.theoryRound,p_choices:choices});closeModal();await sendRoomBroadcast('planetx_theory_ready',{phase:state.theoryRound});await updateTheoryStatus();toast('논문 선택이 비공개로 저장되었습니다.')}catch(e){toast(e.message||e,'error')}}})}
async function updateTheoryStatus(){if(!state||state.phase!=='theory-select')return;try{const st=await rpc('boardmate_planetx_theory_status',{p_token:token(),p_room_id:roomId,p_phase_id:state.theoryRound});if(!sameJson(state.theoryStatus,st)){state.theoryStatus=st;render()}if(st.length===members.length&&st.every(x=>x.ready))await transitionTheoryPlacement()}catch(e){console.warn(e)}}
function startTheoryPoll(){if(theoryTimer)return;updateTheoryStatus();theoryTimer=setInterval(updateTheoryStatus,1900)}function stopTheoryPoll(){if(theoryTimer){clearInterval(theoryTimer);theoryTimer=null}}
async function transitionTheoryPlacement(){if(state.phase!=='theory-select'||busy)return;const s=cloneState();s.phase='theory-place';s.theoryQueue=playerOrder(s);s.theoryPlaceIndex=0;s.current=s.theoryQueue[0];await commit(s,'논문 배치 시작')}
function maybeAutoPlaceTheory(){if(!state||state.phase!=='theory-place')return;const q=state.theoryQueue||[],idx=Number(state.theoryPlaceIndex||0),who=q[idx];if(who!==mySeat()||theoryPlacing)return;const key=`${state.theoryRound}:${idx}:${who}`;if(theoryAutoKey===key)return;theoryAutoKey=key;setTimeout(()=>void placeTheory(key),120)}
async function placeTheory(autoKey=''){if(theoryPlacing||state.phase!=='theory-place'||state.theoryQueue[state.theoryPlaceIndex]!==mySeat())return;theoryPlacing=true;try{const round=Number(state.theoryRound||0);const rows=await rpc('boardmate_planetx_place_theory_choice',{p_token:token(),p_room_id:roomId,p_phase_id:round});const s=cloneState();for(const r of rows||[]){if(!s.theories.some(t=>t.id===r.id))s.theories.push({...r,submitRound:round,faceUp:false})}s.theoryPlaceIndex++;logPublic(s,`${memberName(mySeat())} · 논문 ${rows?.length||0}개 자동 배치`);if(s.theoryPlaceIndex<s.theoryQueue.length){s.current=s.theoryQueue[s.theoryPlaceIndex];const ok=await commit(s,'논문 자동 배치');if(!ok&&autoKey&&theoryAutoKey===autoKey)theoryAutoKey='';return}const advanced=await rpc('boardmate_planetx_advance_theories',{p_token:token(),p_room_id:roomId,p_phase_id:s.theoryRound});const byId=Object.fromEntries((advanced||[]).map(x=>[x.id,x]));s.theories=s.theories.map(t=>byId[t.id]?{...t,depth:byId[t.id].depth}:t);const review=await rpc('boardmate_planetx_review_due',{p_token:token(),p_room_id:roomId});applyReview(s,review);await rotateToNextTurn(s);const ok=await commit(s,'논문 단계 완료');if(!ok&&autoKey&&theoryAutoKey===autoKey)theoryAutoKey=''}catch(e){if(autoKey&&theoryAutoKey===autoKey)theoryAutoKey='';toast(e.message||e,'error')}finally{theoryPlacing=false}}
function applyReview(s,r){const revealed=r?.revealed||[],confirmed=r?.confirmed||[],actualBySector=Object.fromEntries(confirmed.map(c=>[Number(c.sector),c.object]));const reviewEntries=revealed.map(rv=>({ownerSeat:Number(rv.ownerSeat),sector:Number(rv.sector),object:rv.object,correct:Boolean(rv.correct),actual:actualBySector[Number(rv.sector)]||null}));for(const rv of revealed){const t=s.theories.find(x=>x.id===rv.id);if(t){Object.assign(t,{faceUp:true,object:rv.object,correct:rv.correct,removed:rv.correct===false})}}if(reviewEntries.length)s.lastReview={round:Number(s.theoryRound||0),entries:reviewEntries};for(const seat of r?.penalties||[]){const p=s.players[Number(seat)];if(p){p.time+=1;p.tie=++s.tieSeq}}for(const x of reviewEntries)logPublic(s,reviewLogText(x,{penalty:!x.correct}));for(const c of confirmed){s.confirmed[c.sector]=c.object;logPublic(s,`교차 검증 · 섹터 ${c.sector} = ${objLabel(c.object)} 확인`)}}

function openFinalTheory(){const item=state.finalQueue[state.finalIndex],max=item.distance<=3?1:2;modal(`<h2>🏁 마지막 논문 제출</h2><p class="sub">최대 ${max}개. 이 최종 기회의 논문들은 채점상 동시에 제출된 것으로 처리됩니다.</p>${Array.from({length:max},(_,i)=>`<div class="form-row"><div class="field"><label>개체</label><select data-f-obj><option value="">제출 안 함</option>${optionObjects(false)}</select></div><div class="field"><label>섹터</label><select data-f-sec>${optionSectors()}</select></div></div>`).join('')}<div class="modal-actions"><button class="btn ghost" data-close>취소</button><button class="btn green" id="doFinalTheory">제출</button></div>`,m=>{m.querySelector('[data-close]').onclick=closeModal;m.querySelector('#doFinalTheory').onclick=async()=>{const os=[...m.querySelectorAll('[data-f-obj]')],ss=[...m.querySelectorAll('[data-f-sec]')],choices=os.map((o,i)=>o.value?{object:o.value,sector:Number(ss[i].value)}:null).filter(Boolean);if(new Set(choices.map(x=>`${x.sector}:${x.object}`)).size!==choices.length){toast('같은 섹터에 같은 종류의 논문 토큰을 2개 제출할 수 없습니다.','error');return}try{const rows=await rpc('boardmate_planetx_final_submit',{p_token:token(),p_room_id:roomId,p_choices:choices,p_max:max});closeModal();const s=cloneState();for(const r of rows||[])s.theories.push({...r,submitRound:'최종',faceUp:false});logPublic(s,`${memberName(mySeat())} · 마지막 논문 ${rows?.length||0}개 제출`);advanceFinal(s);await commit(s,'마지막 논문')}catch(e){toast(e.message||e,'error')}}})}
async function finishFinalLocate(correct){const s=cloneState(),item=s.finalQueue[s.finalIndex];if(correct)s.players[mySeat()].xScore=2*item.distance;logPublic(s,`${memberName(mySeat())} · 마지막 행성 X 찾기 ${correct?'성공':'실패'}`);advanceFinal(s);await commit(s,'마지막 행성 X 찾기')}
function advanceFinal(s){s.finalIndex++;if(s.finalIndex>=s.finalQueue.length){s.phase='reveal';s.current=s.firstLocator?.seat??0}else{s.current=s.finalQueue[s.finalIndex].seat}}
async function revealAndFinish(){if(busy||state.phase!=='reveal')return;try{busy=true;const data=await rpc('boardmate_planetx_final_data',{p_token:token(),p_room_id:roomId});const s=cloneState();s.board=data.board;const th=data.theories||[];const theoryPts={asteroid:2,comet:3,gas:4,dwarf:s.mode==='expert'?2:4};const score=members.map((_,seat)=>({seat,theory:0,leader:0,x:Number(s.players[seat].xScore||0),total:0,rank:0}));for(const t of th)if(t.correct)score[t.ownerSeat].theory+=(theoryPts[t.object]||0);for(let sec=1;sec<=sectorCount(s);sec++){const cs=th.filter(t=>t.sector===sec&&t.correct);if(!cs.length)continue;const min=Math.min(...cs.map(t=>Number(t.submitRound)));for(const seat of new Set(cs.filter(t=>Number(t.submitRound)===min).map(t=>t.ownerSeat)))score[seat].leader++}for(const x of score)x.total=x.theory+x.leader+x.x;score.sort((a,b)=>b.total-a.total||b.x-a.x||b.leader-a.leader||a.seat-b.seat);let rank=1;for(let i=0;i<score.length;i++){if(i&&!(score[i].total===score[i-1].total&&score[i].x===score[i-1].x&&score[i].leader===score[i-1].leader))rank=i+1;score[i].rank=rank}s.sharedTie=score.filter(x=>x.rank===1).length>1;s.scores=score;s.phase='finished';s.over=true;s.current=s.firstLocator?.seat??0;s.revealedTheories=th;const xSec=Array.isArray(s.board)?s.board.findIndex(o=>o==='x')+1:0;logPublic(s,`모든 섹터와 남은 논문 공개 · 최종 점수 계산 완료${xSec?` · 행성 X = 섹터 ${xSec}`:''}`);busy=false;await commit(s,'최종 점수')}catch(e){busy=false;toast(e.message||e,'error')}}
async function maybeSubmitResult(){if(state.matchSubmitted||state.sharedTie||mySeat()!==0||!state.scores?.length)return;try{const order=[...state.scores].sort((a,b)=>a.rank-b.rank).map(x=>members[x.seat]?.user_id).filter(Boolean);if(order.length===members.length){await submitMatch(order);const s=cloneState();s.matchSubmitted=true;await commit(s,'대전 결과 반영')}}catch(e){console.warn('match submit',e)}}

async function boot(){
 if(!configured()||!roomId)showFatal('Supabase 설정 또는 room 파라미터가 없습니다.');
 try{me=await getMe();if(!me)showFatal('로그인이 필요합니다.');({room,members}=await loadRoom());members=[...members].sort((a,b)=>Number(a.seat)-Number(b.seat));if(room.game!=='planetx')showFatal('행성 X 방이 아닙니다.');if(!members.some(m=>m.user_id===me.user_id))showFatal('이 방의 참가자가 아닙니다.');await loadPrivate();const row=await loadState();if(row){revision=Number(row.revision||0);state=row.state}else{const status=await rpc('boardmate_planetx_status',{p_token:token(),p_room_id:roomId}).catch(()=>null);if(status?.started){state=makeInitial(status.mode,status.code);revision=await saveState(Math.max(0,revision),state)}}if(state)await ensureResearchTopics();render();startStatePoll(async row=>{if(Number(row.revision)<=revision)return;revision=Number(row.revision);state=row.state;render()},{interval:5000});await subscribeRoomBroadcast('planetx_theory_ready',()=>void updateTheoryStatus());setSync('동기화됨')
 }catch(e){showFatal((e.message||e)+(String(e.message||'').includes('boardmate_planetx')?' · SUPABASE_PLANETX_PVP_V1.sql을 먼저 실행하세요.':''))}
}
boot();
</script>
