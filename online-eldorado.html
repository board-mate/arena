function makeUid(prefix='c'){return `${prefix}-${Math.random().toString(36).slice(2,9)}-${Date.now().toString(36)}`}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function makeCard(type){return {uid:makeUid(type),type}}
function cardDef(c){return CARDS[c.type]||CARDS.explorer}
function nowLog(msg){state.log=state.log||[];state.log.unshift(`${state.round}R · ${msg}`);state.log=state.log.slice(0,40)}
function toast(msg){const e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function esc(s){return String(s??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}

function parseCell(code,c,r){
  if(!code)return null;
  if(code==='S')return {id:`${c},${r}`,c,r,type:'start',cost:0,label:'출발'};
  if(code==='M')return {id:`${c},${r}`,c,r,type:'mountain',cost:99,label:'산'};
  const first=code[0],n=Number(code.slice(1)||1);
  if(first==='G')return {id:`${c},${r}`,c,r,type:'green',cost:n};
  if(first==='Y')return {id:`${c},${r}`,c,r,type:'yellow',cost:n};
  if(first==='B')return {id:`${c},${r}`,c,r,type:'blue',cost:n};
  if(first==='X')return {id:`${c},${r}`,c,r,type:'gray',cost:n,label:'돌무더기'};
  if(first==='R')return {id:`${c},${r}`,c,r,type:'red',cost:n,label:'베이스캠프'};
  if(first==='F'){
    const t=code[1]==='G'?'green':code[1]==='Y'?'yellow':'blue';
    return {id:`${c},${r}`,c,r,type:t,cost:1,finish:true,label:'엘도라도'};
  }
  return null;
}
function mapDef(id=state?.mapId||'arena'){return MAPS[id]||MAPS.arena}
function buildCells(mapId='arena'){
  const rows=mapDef(mapId).rows,out=[];
  for(let r=0;r<rows.length;r++)for(let c=0;c<rows[r].length;c++){
    const cell=parseCell(rows[r][c],c,r);if(cell)out.push(cell);
  }
  return out;
}
function cellById(id){return state.board.cells.find(x=>x.id===id)||null}
function neighborCoords(c,r){
  return c%2===0
    ?[[c+1,r],[c+1,r-1],[c,r-1],[c-1,r-1],[c-1,r],[c,r+1]]
    :[[c+1,r+1],[c+1,r],[c,r-1],[c-1,r],[c-1,r+1],[c,r+1]];
}
function neighbors(cell){return neighborCoords(cell.c,cell.r).map(([c,r])=>cellById(`${c},${r}`)).filter(Boolean)}
function occupied(cellId,ignoreSeat=-1,ignorePiece=-1){
  for(let si=0;si<state.players.length;si++)for(let pi=0;pi<state.players[si].positions.length;pi++){
    if(si===ignoreSeat&&pi===ignorePiece)continue;
    if(state.players[si].positions[pi]===cellId)return true;
  }
  return false;
}
function gateFor(a,b){
  if(!a||!b)return null; const lo=Math.min(a.c,b.c),hi=Math.max(a.c,b.c); if(hi-lo!==1)return null;
  return state.board.gates.find(g=>g.afterCol===lo&&!g.removed)||null;
}
function player(){return state.players[state.current]}
function mySeat(){return members.findIndex(x=>x.user_id===me?.user_id)}
function isMyTurn(){return !state?.gameOver && mySeat()===state?.current}
function requiredPieces(){return state.players.length===2?2:1}
function activePieceIndex(){const p=player();if(!p.positions[selectedPiece]){const idx=p.positions.findIndex(Boolean);if(idx>=0)selectedPiece=idx}return selectedPiece}
function currentCell(){const p=player(),i=activePieceIndex();return cellById(p.positions[i])}

function startDeck(){
  return shuffle([makeCard('sailor'),makeCard('explorer'),makeCard('explorer'),makeCard('explorer'),makeCard('traveler'),makeCard('traveler'),makeCard('traveler'),makeCard('traveler')]);
}
function drawOne(p){
  if(!p.deck.length&&p.discard.length){p.deck=shuffle(p.discard.splice(0));}
  return p.deck.length?p.deck.pop():null;
}
function drawCards(p,n){for(let i=0;i<n;i++){const c=drawOne(p);if(!c)break;p.hand.push(c)}}
function freshState(){
  const mapId='arena',md=mapDef(mapId),cells=buildCells(mapId);
  const startIds=['0,0','0,1','0,2','0,3'];
  const blocks=shuffle(BLOCKADE_POOL).slice(0,md.gates.length);
  const ps=members.map((m,i)=>{
    const deck=startDeck(),p={id:m.user_id,name:m.nickname,deck,discard:[],hand:[],played:[],trash:[],positions:[],finishedPieces:0,blockades:[],qualified:false,reachedSeq:null};
    if(members.length===2)p.positions=i===0?[startIds[0],startIds[2]]:[startIds[1],startIds[3]];else p.positions=[startIds[i]];
    drawCards(p,4);return p;
  });
  const stock=Object.fromEntries(MARKET_IDS.map(id=>[id,3]));
  return {version:2,gameId:'eldorado-pvp',mapId,current:0,round:1,phase:'action',players:ps,marketSlots:[...START_MARKET],stock,
    board:{cells,gates:md.gates.map((afterCol,i)=>({afterCol,...blocks[i],removed:false,removedBy:null}))},
    turn:{move:null,pending:null},finalTriggered:false,finishSeq:0,gameOver:false,finalOrder:null,log:[`게임 시작 · ${md.name} · 손패 4장`]};
}
function normalizeState(){
  if(!state)return;
  state.version=2;state.mapId=state.mapId||'arena';state.stock=state.stock||{};
  for(const id of MARKET_IDS)if(state.stock[id]==null)state.stock[id]=3;
  state.board=state.board||{cells:buildCells(state.mapId),gates:[]};
  if(!Array.isArray(state.board.cells)||!state.board.cells.length)state.board.cells=buildCells(state.mapId);
  state.turn=state.turn||{move:null,pending:null};
}

async function loadContext(){
  if(!configured()||!roomId)showFatal('BoardMate 다인플 방에서 열어 주세요. (config.js / room 파라미터 필요)');
  me=await getMe();if(!me)showFatal('BoardMate 로그인이 필요합니다.');
  ({room,members}=await loadRoom());members=[...members].sort((a,b)=>Number(a.seat)-Number(b.seat));
  if(room.game!=='eldorado')showFatal('엘도라도 방이 아닙니다.');
  if(!members.some(m=>m.user_id===me.user_id))showFatal('이 방의 참가자가 아닙니다.');
  badges=await ratingBadges('eldorado',members.map(m=>m.user_id)).catch(()=>({}));
  const row=await loadState();revision=Number(row?.revision||0);state=row?.state?clone(row.state):null;normalizeState();
  if(state&&state.gameId!=='eldorado-pvp')showFatal('이 방에는 호환되지 않는 저장 상태가 있습니다. 새 방을 만들어 주세요.');
  if(!state){
    if(room.host_id===me.user_id){state=freshState();await directSave(state);}
    else renderWaiting();
  }
  if(!unsubPoll){unsubPoll=startStatePoll(async r=>{
    const rv=Number(r?.revision||0);if(rv<=revision)return;revision=rv;
    if(r?.state&&saving===0){state=clone(r.state);buySelection.clear();render();maybeSubmit();}
  },{interval:10000});}
}
async function directSave(snapshot){
  const next=await saveState(revision,clone(snapshot));revision=Number(next??revision+1);return revision;
}
function commit(reason='행동'){
  const snap=clone(state);saving++;
  saveChain=saveChain.then(async()=>{
    try{await directSave(snap);state=snap;}
    catch(e){
      const row=await loadState().catch(()=>null);if(row){revision=Number(row.revision||revision);if(row.state)state=clone(row.state)}
      toast(String(e?.message||e).includes('revision')?'다른 기기에서 먼저 갱신되어 최신 상태를 불러왔습니다.':`저장 실패: ${e.message||e}`);
    }finally{saving--;render();maybeSubmit();}
  });return saveChain;
}
async function maybeSubmit(){
  if(matchSubmitted||!state?.gameOver||!Array.isArray(state.finalOrder)||room?.host_id!==me?.user_id)return;
  const order=state.finalOrder.map(i=>members[i]?.user_id).filter(Boolean);if(order.length!==members.length)return;
  matchSubmitted=true;try{await submitMatch(order)}catch(e){if(!String(e?.message||e).toLowerCase().includes('already')){matchSubmitted=false;console.warn(e)}}
}

function renderBoard(){

  const pos=(c,r)=>({x:originX+c*stepX,y:originY+r*stepY+(c%2?stepY/2:0)});
  const targets=new Set(validTargets().map(x=>x.id));
  for(const cell of state.board.cells){
    const {x,y}=pos(cell.c,cell.r);const b=document.createElement('button');b.className=`hex ${cell.type}${cell.finish?' finish':''}${targets.has(cell.id)?' target':''}${occupied(cell.id)?' occupied':''}`;b.style.left=`${x}px`;b.style.top=`${y}px`;b.dataset.cell=cell.id;b.disabled=cell.type==='mountain'&&!targets.has(cell.id);

    b.innerHTML=`<div><div class="cost">${icon}${cell.cost&&cell.cost<90?` ${cell.cost}`:''}</div><div class="label">${cell.finish?'엘도라도':cell.label||''}</div></div>`;stage.appendChild(b);
  }
  state.board.gates.forEach((g,i)=>{
    const c=g.afterCol+.5,{x,y}=pos(c,2.05);const el=document.createElement('div');el.className=`gate ${g.removed?'cleared':''}`;el.style.left=`${x-18}px`;el.style.top=`${y-13+(i-1)*18}px`;el.innerHTML=`<span class="sym">${SYMBOL[g.symbol]}</span> 봉쇄 ${g.cost}${g.removed?' ✓':''}`;stage.appendChild(el);
  });
  state.players.forEach((p,si)=>p.positions.forEach((id,pi)=>{if(!id)return;const c=cellById(id);if(!c)return;const {x,y}=pos(c.c,c.r);const t=document.createElement('div');t.className=`token p${si} ${pi===1?'second':''}`;t.style.left=`${x+W/2}px`;t.style.top=`${y+H/2}px`;t.textContent=`${si+1}${p.positions.length>1?String.fromCharCode(65+pi):''}`;stage.appendChild(t)}));
}
function specialCanEnter(m,n,isOccupied){
  if(n.type==='start')return false;
  if(m.special==='native')return !isOccupied&&n.type!=='mountain';
  if(m.special==='botanist')return !isOccupied&&n.type==='green';
  if(m.special==='missionary')return !isOccupied&&n.type==='yellow';
  if(m.special==='brute')return n.type!=='mountain'&&n.cost>=3;
  if(m.special==='elevationMap')return true;
  if(m.special==='trailChart')return !isOccupied&&n.type!=='mountain'&&n.cost===1;
  return false;
}
function specialCanBlockade(m){return ['native','botanist','missionary','elevationMap','trailChart'].includes(m.special)}
function validTargets(){
  if(!isMyTurn()||state.gameOver||state.turn.pending)return[];const p=player(),pi=state.turn.move?.piece??activePieceIndex(),id=p.positions[pi];if(!id)return[];const cur=cellById(id);if(!cur)return[];
  return neighbors(cur).filter(n=>{
    const occ=occupied(n.id,state.current,pi),gate=gateFor(cur,n);
    if(state.turn.move){const m=state.turn.move;
      if(m.special){if(gate)return specialCanBlockade(m);return specialCanEnter(m,n,occ)}
      if(occ||n.type==='mountain'||n.type==='start')return false;
      if(gate)return gate.symbol===m.symbol&&m.remaining>=gate.cost;return ['green','yellow','blue'].includes(n.type)&&n.type===m.symbol&&n.cost<=m.remaining;
    }
    if(occ||n.type==='mountain'||n.type==='start'||gate)return false;return n.type==='gray'||n.type==='red';
  });
}

function usedCardDestination(card,usePower=true){const d=cardDef(card),p=player();if(d.item&&usePower)p.trash.push(card);else p.played.push(card)}

function clickCell(id){
  if(!guard()||state.gameOver||state.turn.pending)return;const p=player();
  const pi=state.turn.move?.piece??activePieceIndex(),fromId=p.positions[pi];if(!fromId)return;const from=cellById(fromId),to=cellById(id);if(!from||!to||!neighbors(from).some(n=>n.id===id))return;

    const m=state.turn.move;
    if(m.special){
      if(gate){if(!specialCanBlockade(m)){toast('이 효과로 봉쇄를 제거할 수 없습니다.');return}gate.removed=true;gate.removedBy=state.current;p.blockades.push({symbol:gate.symbol,cost:gate.cost});m.remaining--;nowLog(`${p.name} ${CARDS[m.type].name}으로 봉쇄 ${SYMBOL[gate.symbol]}${gate.cost} 제거`);if(m.remaining<=0)state.turn.move=null;commit('special-blockade');return;}
      if(!specialCanEnter(m,to,occ)){toast('현재 특수 이동으로 갈 수 없는 칸입니다.');return}

    if(gate){
      if(gate.symbol!==m.symbol||m.remaining<gate.cost){toast('현재 카드로 이 봉쇄를 제거할 수 없습니다.');return}
      m.remaining-=gate.cost;gate.removed=true;gate.removedBy=state.current;p.blockades.push({symbol:gate.symbol,cost:gate.cost});nowLog(`${p.name} 봉쇄 ${SYMBOL[gate.symbol]}${gate.cost} 제거`);if(m.remaining<=0)state.turn.move=null;commit('remove-blockade');return;
    }

  if(pend.type==='transmitter'){
    const ids=MARKET_IDS.filter(id=>(state.stock[id]||0)>0&&id!=='transmitter');
    modal(`<h2>📡 송신기 · 무료 카드 선택</h2><p>시장 또는 예비 시장에서 원하는 카드 1장을 골라 버린 카드 더미에 놓습니다.</p><div class="modal-grid">${ids.map(id=>marketCardPlain(id)).join('')}</div>`,m=>m.querySelectorAll('[data-free]').forEach(b=>b.onclick=()=>{const id=b.dataset.free;if((state.stock[id]||0)<=0)return;state.stock[id]--;p.discard.push(makeCard(id));const slot=state.marketSlots.indexOf(id);if(slot>=0&&state.stock[id]<=0)state.marketSlots[slot]=null;state.turn.pending=null;nowLog(`${p.name} 송신기로 ${CARDS[id].name} 획득`);closeModal();commit('transmitter-pick')}));return;
  }
  if(pend.type==='telegram'){
    const ids=state.marketSlots.filter(id=>id&&(state.stock[id]||0)>0&&id!=='telegram');
    modal(`<h2>✉️ 전보 · 시장 카드 선택</h2><p>현재 시장판에 놓인 카드 1장을 비용 없이 즉시 손에 넣습니다.</p><div class="modal-grid">${ids.map(id=>marketCardPlain(id).replaceAll('data-free','data-telegram')).join('')||'<div class="tiny">가져올 수 있는 카드가 없습니다.</div>'}</div><div class="modal-actions"><button class="btn" data-close>취소</button></div>`,m=>{m.querySelector('[data-close]').onclick=()=>{state.turn.pending=null;closeModal();commit('telegram-cancel')};m.querySelectorAll('[data-telegram]').forEach(b=>b.onclick=()=>{const id=b.dataset.telegram;if((state.stock[id]||0)<=0)return;state.stock[id]--;p.hand.push(makeCard(id));const slot=state.marketSlots.indexOf(id);if(slot>=0&&state.stock[id]<=0)state.marketSlots[slot]=null;state.turn.pending=null;nowLog(`${p.name} 전보로 ${CARDS[id].name}을 손에 추가`);closeModal();commit('telegram-pick')})});return;
  }
  if(pend.type==='binoculars'){
    const ids=[...new Set(state.marketSlots.filter(id=>id&&(state.stock[id]||0)>0&&id!=='binoculars'))];
    modal(`<h2>🔭 쌍안경 · 효과 복사</h2><p>현재 시장판 카드 1장의 효과를 복사합니다. 시장의 카드는 줄어들지 않습니다.</p><div class="modal-grid">${ids.map(id=>marketCardPlain(id).replaceAll('data-free','data-copy')).join('')||'<div class="tiny">복사할 카드가 없습니다.</div>'}</div><div class="modal-actions"><button class="btn" data-close>취소</button></div>`,m=>{m.querySelector('[data-close]').onclick=()=>{state.turn.pending=null;closeModal();commit('binoculars-cancel')};m.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const id=b.dataset.copy;state.turn.pending=null;closeModal();playCopiedCard(id)})});return;
  }
}
function marketCardPlain(id){const d=CARDS[id];return `<button class="exp-card ${d.color}" data-free="${id}"><span class="name">${esc(d.name)}</span><span class="price">${d.price}🪙</span><div class="power">${powerLabel(d)}</div><div class="desc">${esc(d.desc)}</div>${d.pack?`<span class="pack-badge">${esc(d.pack)}</span>`:''}<span class="count">×${state.stock[id]}</span></button>`}

function purchasePile(id,where){
  if(!guard()||state.phase!=='purchase'||state.turn.pending||state.turn.move)return;const d=CARDS[id];if(!d||!canBuyFrom(id,where))return;
  const total=buyTotal();if(total<d.price){toast(`금화가 부족합니다. 필요 ${d.price}, 선택 ${total}`);return}
  if(!buySelection.size){toast('구매에 사용할 손패를 먼저 선택하세요.');return}
  const p=player(),spent=[];for(const uid of [...buySelection]){const c=removeHand(uid,p);if(c)spent.push(c)}
  for(const c of spent){const cd=cardDef(c),usesPower=Boolean(cd.power?.yellow);if(cd.item&&usesPower)p.trash.push(c);else p.played.push(c)}
  p.discard.push(makeCard(id));state.stock[id]--;
  const marketIdx=state.marketSlots.indexOf(id);
  if(marketIdx>=0&&state.stock[id]<=0)state.marketSlots[marketIdx]=null;
  if(where==='reserve'){
    const empty=state.marketSlots.findIndex(x=>x===null);if(empty>=0&&state.stock[id]>0)state.marketSlots[empty]=id;
  }
  buySelection.clear();nowLog(`${p.name} ${d.name} 구매 (${d.price}🪙)`);state.phase='action';openEndTurn(true);
}

function openEndTurn(afterPurchase=false){
  if(!guard()||state.turn.pending||state.turn.move)return;const p=player();let discardSet=new Set();
  modal(`<h2>${afterPurchase?'구매 완료 · ':''}턴 종료</h2><p>아직 손에 남은 카드는 다음 턴까지 보관하거나 원하는 만큼 버릴 수 있습니다. 버릴 카드를 선택하세요.</p><div class="modal-grid">${p.hand.map(c=>miniChoiceCard(c)).join('')||'<div class="tiny">남은 손패가 없습니다.</div>'}</div><div class="modal-actions"><button class="btn" data-close>취소</button><button class="btn primary" id="confirmEnd">선택한 0장 버리고 턴 종료</button></div>`,m=>{
    m.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const uid=b.dataset.choice;discardSet.has(uid)?discardSet.delete(uid):discardSet.add(uid);b.classList.toggle('active',discardSet.has(uid));m.querySelector('#confirmEnd').textContent=`선택한 ${discardSet.size}장 버리고 턴 종료`;});
    m.querySelector('[data-close]').onclick=closeModal;
    m.querySelector('#confirmEnd').onclick=()=>{for(const uid of discardSet){const c=removeHand(uid,p);if(c)p.discard.push(c)}finishTurn();closeModal()};
  });
}
function finishTurn(){
  const p=player();p.discard.push(...p.played.splice(0));drawCards(p,Math.max(0,4-p.hand.length));state.turn={move:null,pending:null};buySelection.clear();
  const old=state.current;nowLog(`${p.name} 턴 종료`);
  if(state.finalTriggered&&old===state.players.length-1){finishGame();commit('finish-game');return;}
  state.current=(old+1)%state.players.length;if(state.current===0)state.round++;state.phase='action';selectedPiece=0;commit('end-turn');
}
function progressScore(p){
  let s=p.finishedPieces*100;for(const id of p.positions){const c=cellById(id);if(c)s=Math.max(s,p.finishedPieces*100+c.c*7+(12-Math.abs(2-c.r)))}return s;
}
function finishGame(){
  state.gameOver=true;state.phase='gameover';const seats=state.players.map((_,i)=>i);
  seats.sort((a,b)=>{
    const A=state.players[a],B=state.players[b];if(A.qualified!==B.qualified)return A.qualified?-1:1;
    if(A.qualified&&B.qualified){if(B.blockades.length!==A.blockades.length)return B.blockades.length-A.blockades.length;const am=Math.max(0,...A.blockades.map(x=>x.cost)),bm=Math.max(0,...B.blockades.map(x=>x.cost));if(bm!==am)return bm-am;return (A.reachedSeq??999)-(B.reachedSeq??999)}
    return progressScore(B)-progressScore(A);
  });state.finalOrder=seats;nowLog(`게임 종료 · 승자 ${state.players[seats[0]].name}`);
}


function canChangeMap(){
  if(room?.host_id!==me?.user_id||state.gameOver||state.round!==1||state.current!==0||state.finalTriggered)return false;
  return state.players.every(p=>p.finishedPieces===0&&p.blockades.length===0&&p.discard.length===0&&p.played.length===0&&p.trash.length===0&&p.hand.length===4&&p.deck.length===4);
}
function showMapPicker(){
  if(room?.host_id!==me?.user_id){toast('방장만 맵을 바꿀 수 있습니다.');return}
  const enabled=canChangeMap();
  modal(`<h2>🗺️ 맵 선택</h2><p>${enabled?'게임 시작 전에 사용할 추상 맵을 고르세요. 맵만 바뀌고 카드/플레이어 상태는 그대로입니다.':'맵 변경은 첫 행동 전에만 가능합니다.'}</p><div class="modal-grid">${Object.entries(MAPS).map(([id,m])=>`<button class="choice-card ${state.mapId===id?'active':''}" data-map="${id}" ${enabled?'':'disabled'}><b>${esc(m.name)}</b><br><span class="tiny">${esc(m.difficulty)} · ${esc(m.note)}</span></button>`).join('')}</div><div class="modal-actions"><button class="btn" data-close>닫기</button></div>`,m=>{m.querySelector('[data-close]').onclick=closeModal;m.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>selectMap(b.dataset.map))});
}
function selectMap(id){
  if(!canChangeMap()||!MAPS[id])return;const md=MAPS[id],blocks=shuffle(BLOCKADE_POOL).slice(0,md.gates.length);state.mapId=id;state.board={cells:buildCells(id),gates:md.gates.map((afterCol,i)=>({afterCol,...blocks[i%blocks.length],removed:false,removedBy:null}))};
  const starts=['0,0','0,1','0,2','0,3'];state.players.forEach((p,i)=>{p.positions=state.players.length===2?(i===0?[starts[0],starts[2]]:[starts[1],starts[3]]):[starts[i]]});state.log=[`게임 시작 · ${md.name} · 손패 4장`];closeModal();commit('change-map');
}

function showRules(){
  modal(`<h2>🧭 규칙 요약</h2><ul style="line-height:1.7;color:#526057"><li>각자 시작 덱 8장(선원 1, 탐험가 3, 여행가 4)에서 손패 4장으로 시작합니다.</li><li>이동 카드는 같은 색 지형을 힘만큼 연속 이동할 수 있으며, 한 칸의 높은 요구치를 여러 카드로 합칠 수 없습니다.</li><li>🪨 돌무더기는 표시된 장수만큼 아무 카드를 사용합니다. 🏕 베이스캠프는 그 장수만큼 카드를 게임에서 제거합니다.</li><li>한 턴에 카드 1장만 구매합니다. 시장 칸이 비어 있으면 예비 시장 카드도 살 수 있고, 남은 같은 종류 카드가 빈 칸으로 들어옵니다.</li><li><b>추가 카드:</b> 특제 노, 정찰자, 식물학자, 선교사, 막일꾼, 등고선 지도, 길 안내도, 쌍안경, 전보를 예비 시장에 추가했습니다.</li><li><b>맵:</b> 기본 코스와 추천 루트/확장 맵 모티브의 추상 코스를 선택할 수 있습니다. 동굴·저주·용·사원 전용 규칙은 생략되어 모든 맵을 기본 지형 규칙으로 플레이합니다.</li><li>2인전은 각자 말 2개가 모두 도착해야 합니다. 3–4인전은 말 1개가 도착하면 최종 라운드가 발동합니다.</li><li>동률이면 획득 봉쇄 수, 그래도 같으면 가장 높은 봉쇄 수치로 비교합니다.</li></ul><div class="modal-actions"><button class="btn primary" data-close>닫기</button></div>`,m=>m.querySelector('[data-close]').onclick=closeModal);
}
function modal(inner,onMount){closeModal();const ov=document.createElement('div');ov.className='overlay';ov.id='modalOverlay';ov.innerHTML=`<div class="modal">${inner}</div>`;document.body.appendChild(ov);onMount?.(ov.querySelector('.modal'))}
function closeModal(){$('#modalOverlay')?.remove()}

await loadContext();if(state)render();
</script>
</body>
</html>
