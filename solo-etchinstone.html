<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>에친스톤의 용들 · BoardMate</title>
<style>
:root{--bg:#0b0d12;--panel:#151923;--panel2:#1d2230;--line:#343b4d;--text:#f6f2ea;--muted:#aeb6c8;--gold:#e9b75c;--red:#e85b56;--green:#62c48d;--blue:#63a9ef;--shadow:#b07bea;--fire:#ef6b4a;--water:#52a7e8;--lightning:#e9c84d;--ink:#0c0f15}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% 0,#242033 0,#10131a 34%,#090b10 78%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;min-height:100vh}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(8,10,15,.92);border-bottom:1px solid #2b3040;backdrop-filter:blur(10px)}.top a{color:white;text-decoration:none;font-weight:800}.brand{letter-spacing:.08em}.grow{flex:1}.save{font-size:12px;color:#9fb0c9}.wrap{width:min(1260px,calc(100% - 24px));margin:22px auto 70px}.hero{border:1px solid #3b3442;border-radius:22px;padding:24px;background:linear-gradient(135deg,rgba(53,38,46,.93),rgba(20,25,34,.94));box-shadow:0 20px 60px #0008}.hero h1{font-size:clamp(30px,5vw,56px);margin:0 0 6px;font-family:Georgia,"Noto Serif KR",serif}.hero p{margin:0;color:#d4cbd0}.notice{margin-top:15px;padding:12px 14px;border-radius:14px;background:#231e21;border:1px solid #604851;color:#e9d8d7;font-size:13px;line-height:1.55}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.75fr);gap:16px;margin-top:16px}.panel{background:rgba(20,24,33,.95);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 12px 35px #0005}.panel h2,.panel h3{margin:0 0 12px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.statbar{display:grid;grid-template-columns:repeat(6,minmax(80px,1fr));gap:8px;margin:14px 0}.stat{background:#10141d;border:1px solid #2d3445;border-radius:12px;padding:9px;text-align:center}.stat b{display:block;font-size:18px}.stat small{color:var(--muted)}button,select{font:inherit}button{border:1px solid #4a5367;border-radius:11px;padding:9px 13px;background:#252b39;color:white;font-weight:750;cursor:pointer}button:hover{filter:brightness(1.12)}button.primary{background:linear-gradient(135deg,#8d352f,#c14f45);border-color:#d06b61}button.gold{background:linear-gradient(135deg,#7a5824,#b28034);border-color:#d2aa5e}button.good{background:#235b3b;border-color:#4b9a6b}button.ghost{background:#151a24}button.danger{background:#5b2327;border-color:#94434a}button:disabled{opacity:.4;cursor:not-allowed}.setup{display:grid;grid-template-columns:1fr 1fr;gap:14px}.setup label{display:block;color:#c7cfde;font-size:13px;margin-bottom:6px}.setup select{width:100%;padding:11px;background:#0f131b;color:white;border:1px solid #41495c;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.mage{position:relative;min-height:220px;border:1px solid #485064;border-radius:16px;padding:12px;background:linear-gradient(160deg,#232938,#11151d);overflow:hidden}.mage::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--el,#999)}.mage.selected{outline:2px solid var(--gold);box-shadow:0 0 0 4px #e9b75c22}.mage.removed{opacity:.35;filter:grayscale(1)}.mage .title{display:flex;justify-content:space-between;gap:8px;font-weight:900;font-size:16px}.mage .lvl{font-size:12px;padding:3px 7px;border-radius:999px;background:#0007}.mage .meta{font-size:12px;color:#c4ccdc;margin:6px 0}.numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px}.num{font-size:12px;text-align:center;padding:6px 2px;background:#0b0e14;border-radius:8px;border:1px solid #282e3b}.num b{display:block;font-size:15px}.roles{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:9px}.roles button{padding:6px;font-size:12px}.roles button.on{background:#7a5824;border-color:#e1b963}.encounter{border:1px solid #5d4b4b;background:linear-gradient(135deg,#2a1e23,#151923);border-radius:17px;padding:15px;margin-bottom:12px}.encounter.enemy{border-color:#7b4040}.encounter.journey{border-color:#405e7b}.encounter h2{font-family:Georgia,"Noto Serif KR",serif;font-size:24px}.encstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:7px}.encstat{background:#0c1017;border:1px solid #32394a;border-radius:10px;padding:8px;text-align:center}.encstat b{display:block;font-size:18px}.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid #465063;background:#151a25;border-radius:999px;padding:4px 9px;font-size:12px;margin:3px}.tag.warn{border-color:#8a5938;background:#35271d}.tag.bad{border-color:#7e3f45;background:#321e22}.tag.good{border-color:#32654a;background:#183022}.calc{margin-top:12px;padding:12px;border-radius:13px;background:#10141c;border:1px dashed #465067}.calc strong{color:#f2c574}.progress{height:10px;background:#0c0f15;border-radius:999px;overflow:hidden;border:1px solid #303746}.progress span{display:block;height:100%;background:linear-gradient(90deg,#8b3a38,#e0a85c)}.log{max-height:330px;overflow:auto;font-size:13px;line-height:1.55;color:#cad1dd}.log div{padding:6px 0;border-bottom:1px solid #262c39}.small{font-size:12px;color:var(--muted)}.phase{font-size:13px;color:#efc777;font-weight:800;letter-spacing:.04em}.damage-list{display:grid;gap:8px}.damage-option{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px;border:1px solid #3a4253;border-radius:11px;background:#11151e}.damage-option.on{border-color:#d7a65b;background:#2c2418}.upgrade-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.final-banner{padding:15px;border-radius:16px;background:linear-gradient(135deg,#422126,#151923);border:1px solid #914a50;margin-bottom:12px}.result{position:fixed;inset:0;z-index:50;background:#05070bdc;display:flex;align-items:center;justify-content:center;padding:20px}.result-card{width:min(650px,100%);border-radius:24px;padding:28px;background:linear-gradient(150deg,#2c2524,#131721);border:1px solid #82613b;box-shadow:0 25px 90px #000}.result-card h1{font-size:46px;margin:0;font-family:Georgia,"Noto Serif KR",serif}.rank-score{font-size:34px;color:#f0c06a;font-weight:900}.hidden{display:none!important}.divider{height:1px;background:#343b4c;margin:14px 0}.role-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.role-summary div{padding:8px;border-radius:9px;background:#0e121a;text-align:center;font-size:12px}.footer-note{margin-top:18px;color:#8f9aae;font-size:11px;line-height:1.5}
@media(max-width:880px){.grid{grid-template-columns:1fr}.statbar{grid-template-columns:repeat(3,1fr)}.setup{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.mage{min-height:200px;padding:10px}.top{padding:10px 12px}.wrap{width:min(100% - 14px,1260px);margin-top:10px}.role-summary{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.cards{grid-template-columns:1fr 1fr;gap:7px}.mage{font-size:12px;min-height:190px}.mage .title{font-size:14px}.numbers{gap:3px}.num{padding:5px 1px}.hero{padding:18px}.panel{padding:12px}.statbar{gap:5px}.stat{padding:7px 4px}}
</style>
</head>
<body>
<header class="top"><a href="./index.html#/solo" class="brand">● BOARDMATE</a><span>› 에친스톤의 용들</span><div class="grow"></div><span class="save" id="saveState">💾 자동 저장</span><button class="ghost" onclick="showRules()">규칙 요약</button></header>
<main class="wrap" id="app"></main>
<script>
const SAVE_KEY='boardmate:etchinstone:v1';
const BEST_KEY='boardmate:etchinstone:best';
const E={water:{name:'물',icon:'💧',color:'#52a7e8'},fire:{name:'불',icon:'🔥',color:'#ef6b4a'},lightning:{name:'번개',icon:'⚡',color:'#e9c84d'},shadow:{name:'그림자',icon:'✦',color:'#b07bea'}};
const CIRC={ambush:'매복',rough:'험지',night:'야간 이동',storm:'폭풍'};
const ABILITY={freeze:'빙결',poison:'중독',ranged:'원거리',slow:'느림'};
const PERIL={steep:'가파름',unstable:'불안정'};
const MAGES=[
{id:'A01',name:'맹공',element:'fire',focus:'attack',enc:'enemy',idx:1,circ:'ambush'},
{id:'A02',name:'마법사 A02',element:'fire',focus:'move',enc:'journey',idx:2,circ:'storm'},
{id:'A03',name:'마법사 A03',element:'fire',focus:'attack',enc:'enemy',idx:3,circ:null},
{id:'A04',name:'마법사 A04',element:'fire',focus:'move',enc:'journey',idx:4,circ:'rough'},
{id:'A05',name:'마법사 A05',element:'water',focus:'move',enc:'journey',idx:1,circ:null},
{id:'A06',name:'마법사 A06',element:'water',focus:'attack',enc:'enemy',idx:2,circ:'rough'},
{id:'A07',name:'조화',element:'shadow',focus:'dual',enc:'journey',idx:3,circ:'night'},
{id:'A08',name:'마법사 A08',element:'shadow',focus:'attack',enc:'enemy',idx:4,circ:'ambush'},
{id:'A09',name:'마법사 A09',element:'shadow',focus:'move',enc:'journey',idx:2,circ:'storm'},
{id:'A10',name:'피의 비',element:'fire',focus:'attack',enc:'enemy',idx:1,circ:null},
{id:'A11',name:'마법사 A11',element:'lightning',focus:'move',enc:'journey',idx:4,circ:'night'},
{id:'A12',name:'민첩한 발놀림',element:'lightning',focus:'move',enc:'journey',idx:1,circ:null},
{id:'A13',name:'마법사 A13',element:'lightning',focus:'attack',enc:'enemy',idx:3,circ:'ambush'},
{id:'A14',name:'서리불꽃 장벽',element:'water',focus:'attack',enc:'enemy',idx:2,circ:'rough'},
{id:'A15',name:'결연한 비행',element:'lightning',focus:'move',enc:'journey',idx:3,circ:'storm'},
{id:'A16',name:'배수의 진',element:'shadow',focus:'dual',enc:'enemy',idx:4,circ:'night'}
];
const PROFILE={
fire:{init:[1,2,2,3],atk:[3,4,5,6],move:[1,1,2,2],boost:[1,1,2,2],armor:[1,1,1,2],cost:[2,3,4]},
water:{init:[2,3,4,5],atk:[1,2,2,3],move:[2,2,3,3],boost:[1,2,2,3],armor:[2,2,3,3],cost:[2,3,4]},
lightning:{init:[2,3,4,5],atk:[1,1,2,2],move:[3,4,5,6],boost:[1,1,2,2],armor:[1,1,2,2],cost:[3,4,5]},
shadow:{init:[1,2,3,3],atk:[2,2,3,4],move:[2,2,3,4],boost:[2,3,4,5],armor:[1,1,2,2],cost:[2,3,4]}
};
const DRAGONS={
burhast:{name:'부르하스트',element:'fire',magic:[13,17,21],time:[1,2,3],hp:[20,25,29],attack:[8,13,17],initiative:13,pre:4,armor:{fire:2,shadow:1}},
frost:{name:'서리의 용 · BoardMate',element:'water',magic:[12,17,22],time:[1,2,3],hp:[19,25,31],attack:[8,12,17],initiative:15,pre:4,armor:{water:2,lightning:1}},
storm:{name:'폭풍의 용 · BoardMate',element:'lightning',magic:[14,18,23],time:[1,2,3],hp:[21,26,31],attack:[9,13,18],initiative:16,pre:5,armor:{lightning:2,water:1}},
void:{name:'그림자의 용 · BoardMate',element:'shadow',magic:[13,19,24],time:[1,2,3],hp:[20,27,32],attack:[9,14,19],initiative:14,pre:5,armor:{shadow:2,fire:1}}
};
const DIFF={intro:'입문',easy:'쉬움',normal:'보통',hard:'어려움',impossible:'불가능',forbidden:'시도 금지'};
let s=null;
const $=q=>document.querySelector(q); const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rngShuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function mage(id){return MAGES.find(x=>x.id===id)}
function st(id){const c=mage(id),lv=s.cards[id].level,p=PROFILE[c.element],i=lv-1;return{level:lv,init:p.init[i],attack:p.atk[i],move:p.move[i],boost:p.boost[i],armor:p.armor[i],cost:lv<4?p.cost[lv-1]:null,enhAttack:p.atk[i]+2,enhMove:p.move[i]+2}}
function activeIds(){return MAGES.map(x=>x.id).filter(id=>!s.cards[id].removed)}
function save(){if(!s)return;localStorage.setItem(SAVE_KEY,JSON.stringify(s));$('#saveState')&&($('#saveState').textContent='💾 저장됨 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));}
function log(t){s.log.unshift(t);s.log=s.log.slice(0,60)}
function newState(diff='normal',dragon='burhast',chivalry=false,glass=false){const cards={};MAGES.forEach(c=>cards[c.id]={level:2,removed:false});let ids=rngShuffle(MAGES.map(x=>x.id));const n=diff==='forbidden'?7:5, sample=ids.slice(0,n);if(diff==='intro')sample.slice(0,4).forEach(id=>cards[id].level=3);if(diff==='easy')sample.slice(0,2).forEach(id=>cards[id].level=3);if(diff==='hard')sample.slice(0,2).forEach(id=>cards[id].level=1);if(diff==='impossible'||diff==='forbidden')sample.forEach(id=>cards[id].level=1);return{version:1,difficulty:diff,dragon,chivalry,glass,cards,region:1,phase:'challenge',deck:[],hand:[],discard:[],roles:{spell:null,element:null,boost:null,boostTarget:'attack'},encounter:null,bypassStreak:0,xp:0,pendingDamage:null,damageSelected:[],upgradeLocked:[],poisonPending:0,regroupUsed:false,finalAssign:{},log:[],stats:{encounters:0,perfect:0,narrow:0,defeat:0,bypass:0,stuns:0,upgrades:0},startedAt:Date.now(),result:null}}
function setupRegion(initial=false){const ids=rngShuffle(activeIds());s.deck=ids;s.hand=[];s.discard=[];for(let i=0;i<4&&s.deck.length;i++)s.hand.push(s.deck.shift());s.phase='challenge';s.encounter=null;s.roles={spell:null,element:null,boost:null,boostTarget:'attack'};s.bypassStreak=0;log(`${s.region}지역 탐험을 시작했습니다.`);if(initial)log(`난이도 ${DIFF[s.difficulty]} · ${DRAGONS[s.dragon].name} 추적 시작.`)}
function encounterFor(core){const r=s.region,c=mage(core),idx=c.idx;if(c.enc==='enemy'){const el=['fire','water','lightning','shadow'][(r+idx)%4];return{type:'enemy',idx,name:`지역 ${r} · 적 ${idx}`,hp:5+r*2+idx*2,initiative:2+r+idx,attack:2+Math.ceil(r/2)+idx,armor:Math.max(0,Math.floor((r+idx-1)/3)),armorElement:el,attackElement:el,xp:1+Math.floor((r+idx)/2),ability:['freeze','poison','ranged','slow'][(idx+r)%4],circ:c.circ}}else{const el=['water','lightning','shadow','fire'][(r+idx)%4];return{type:'journey',idx,name:`지역 ${r} · 여정 ${idx}`,mp:5+r*2+idx*2,time:1+Math.floor((r+idx-1)/3),xp:1+Math.floor((r+idx)/2),element:el,peril:[null,'steep','unstable',null][(idx+r)%4],circ:c.circ}}}
function currentCore(){return s.deck[0]||null}
function ensureEncounter(){if(!s.encounter&&currentCore())s.encounter=encounterFor(currentCore())}
function startGame(){const diff=$('#difficulty').value,dragon=$('#dragon').value,chivalry=$('#chivalry').checked,glass=$('#glass').checked;s=newState(diff,dragon,chivalry,glass);setupRegion(true);save();render()}
function resetGame(){if(confirm('저장된 에친스톤 게임을 지우고 새 게임을 시작할까요?')){localStorage.removeItem(SAVE_KEY);s=null;render()}}
function render(){if(!s){renderSetup();return}if(s.result){renderResult();return}ensureEncounter();const app=$('#app');app.innerHTML=`${heroHtml()}<div class="statbar">${stat('지역',s.region+'/4')}${stat('덱',s.deck.length)}${stat('손패',s.hand.length)}${stat('버림',s.discard.length)}${stat('제거',MAGES.length-activeIds().length)}${stat('최고점',localStorage.getItem(BEST_KEY)||'—')}</div><div class="grid"><section class="panel">${mainPhaseHtml()}</section><aside class="panel"><div class="row between"><h3>탐험 기록</h3><button class="ghost" onclick="resetGame()">새 게임</button></div><div class="log">${s.log.map(x=>`<div>${esc(x)}</div>`).join('')||'<div>아직 기록이 없습니다.</div>'}</div><div class="divider"></div><div class="small">난이도 <b>${DIFF[s.difficulty]}</b> · 목표 <b>${esc(DRAGONS[s.dragon].name)}</b><br>완벽 ${s.stats.perfect} · 근소 ${s.stats.narrow} · 패배 ${s.stats.defeat} · 우회 ${s.stats.bypass} · 기절 ${s.stats.stuns}</div></aside></div>`;bindAfterRender();save()}
function heroHtml(){return `<section class="hero"><div class="row between"><div><div class="phase">${phaseName()}</div><h1>에친스톤의 용들</h1><p>4개의 지역을 돌파하고 최후의 여정과 용을 넘어 살아남으세요.</p></div><div style="font-size:56px">🐉</div></div><div class="notice"><b>BoardMate 규칙 엔진 v0.1</b> · 업로드된 한국어 규칙서의 단계·피해·향상·최후의 전투 구조를 구현했습니다. 규칙서에는 16장 마법사 카드와 모든 지역/용의 카드별 원본 수치가 전부 수록되어 있지 않아, 카드별 수치는 규칙서의 원소 성향과 예시를 따르는 <b>BoardMate 밸런스 세트</b>입니다. 원본 카드 스캔을 주면 정확한 데이터로 교체할 수 있습니다.</div></section>`}
function phaseName(){return({challenge:'도전 단계',action:'행동 단계',damage:'불이익 단계',upgrade:'향상 단계',finalJourney:'최후의 여정',finalEnemy:'최후의 적'}[s.phase]||s.phase)}
function stat(a,b){return `<div class="stat"><small>${a}</small><b>${b}</b></div>`}
function renderSetup(){const old=localStorage.getItem(SAVE_KEY);let loaded=null;try{loaded=old&&JSON.parse(old)}catch{};$('#app').innerHTML=`<section class="hero"><h1>🐉 에친스톤의 용들</h1><p>1인 전용 손패 관리 퍼즐을 BoardMate용 웹 게임으로 옮긴 첫 구현입니다.</p><div class="notice">규칙서는 16장 마법사 카드, 2장 지역 카드, 2장 용 카드를 구성품으로 제시하고, 4개 지역을 지나 최후의 여정과 최후의 적을 해결하는 구조를 설명합니다. 이 버전은 그 규칙 흐름을 자동화한 웹 프로토타입입니다.</div></section><section class="panel" style="margin-top:16px"><h2>새 모험 준비</h2><div class="setup"><div><label>난이도</label><select id="difficulty"><option value="intro">입문</option><option value="easy">쉬움</option><option value="normal" selected>보통</option><option value="hard">어려움</option><option value="impossible">불가능</option><option value="forbidden">시도 금지</option></select></div><div><label>추적할 용</label><select id="dragon">${Object.entries(DRAGONS).map(([k,d])=>`<option value="${k}">${d.name}</option>`).join('')}</select></div></div><div class="row" style="margin-top:14px"><label class="tag"><input type="checkbox" id="chivalry"> 기사도 · 카드 융합 금지</label><label class="tag"><input type="checkbox" id="glass"> 유리 대포 · 속성 일치 방어는 ×2 대신 +1</label></div><div class="row" style="margin-top:16px"><button class="primary" onclick="startGame()">모험 시작</button>${loaded?'<button class="gold" onclick="resumeGame()">저장된 게임 이어하기</button>':''}<a href="./index.html#/solo"><button class="ghost">1인플 목록</button></a></div></section>`}
function resumeGame(){try{s=JSON.parse(localStorage.getItem(SAVE_KEY));render()}catch{localStorage.removeItem(SAVE_KEY);render()}}
function mainPhaseHtml(){if(s.phase==='damage')return damageHtml();if(s.phase==='upgrade')return upgradeHtml();if(s.phase==='finalJourney')return finalJourneyHtml();if(s.phase==='finalEnemy')return finalEnemyHtml();return encounterHtml()}
function encounterHtml(){if(!currentCore())return `<div class="final-banner"><h2>지역의 끝</h2><p>현재 지역에서 사용할 카드가 부족합니다.</p><button class="primary" onclick="endRegion()">다음 단계</button></div>`;const e=s.encounter,core=mage(currentCore());return `${encounterCard(e)}<div class="row between"><div><span class="tag">핵심 카드 ${core.id} · ${esc(core.name)}</span>${e.circ?`<span class="tag warn">역경 · ${CIRC[e.circ]}</span>`:''}</div><div class="small">연속 우회 ${s.bypassStreak}/2</div></div>${s.phase==='challenge'?challengeActions():actionPanel()}`}
function encounterCard(e){if(e.type==='enemy')return `<div class="encounter enemy"><h2>⚔️ ${e.name}</h2><div class="encstats">${es('체력',e.hp)}${es('선제권',e.initiative)}${es('공격',e.attack)}${es('방어',e.armor)}${es('경험치',e.xp)}</div><div style="margin-top:8px"><span class="tag bad">${E[e.attackElement].icon} 공격</span><span class="tag">${E[e.armorElement].icon} 방어</span><span class="tag warn">능력 · ${ABILITY[e.ability]}</span></div></div>`;return `<div class="encounter journey"><h2>🧭 ${e.name}</h2><div class="encstats">${es('마력',e.mp)}${es('시간 불이익',e.time)}${es('경험치',e.xp)}${es('원소',E[e.element].icon+' '+E[e.element].name)}</div><div style="margin-top:8px">${e.peril?`<span class="tag warn">위험 · ${PERIL[e.peril]}</span>`:'<span class="tag good">위험 없음</span>'}</div></div>`}
function es(a,b){return `<div class="encstat"><small>${a}</small><b>${b}</b></div>`}
function challengeActions(){const can=s.bypassStreak<2&&s.hand.length>0;return `<h3>도전 단계</h3><p class="small">핵심 카드가 조우와 역경을 결정합니다. 현재 조우를 진행하거나, 핵심 카드와 손패 1장을 버려 우회할 수 있습니다.</p><div class="row"><button class="primary" onclick="enterAction()">조우 진행</button><button class="ghost" ${can?'':'disabled'} onclick="toggleBypass()">우회${can?'':' 불가'}</button></div><div id="bypassBox"></div><h3 style="margin-top:16px">현재 손패</h3><div class="cards">${s.hand.map(id=>cardHtml(id,false)).join('')}</div>`}
function toggleBypass(){const box=$('#bypassBox');box.innerHTML=`<div class="notice"><b>우회할 손패 1장 선택</b><div class="row" style="margin-top:8px">${s.hand.map(id=>`<button onclick="bypass('${id}')">${mage(id).id} ${esc(mage(id).name)}</button>`).join('')}</div></div>`}
function bypass(id){const core=s.deck.shift();s.discard.push(core);s.hand=s.hand.filter(x=>x!==id);s.discard.push(id);s.stats.bypass++;s.bypassStreak++;s.encounter=null;log(`${mage(core).name}의 조우를 우회했습니다. ${mage(id).name}도 버렸습니다.`);if(totalCurrent()<5)endRegion();else render()}
function totalCurrent(){return s.deck.length+s.hand.length}
function enterAction(){s.phase='action';s.roles={spell:null,element:null,boost:null,boostTarget:s.encounter.type==='enemy'?'attack':'move'};render()}
function actionPanel(){const e=s.encounter,calc=calcAction();return `<h3>행동 단계 · 역할 지정</h3><p class="small">주문·원소·증폭 역할을 각각 1장에 지정하세요. 남는 카드는 예비 카드입니다.${s.hand.length<3?' 손패가 3장 미만이므로 주문만 필수입니다.':''}</p><div class="cards">${s.hand.map(id=>cardHtml(id,true)).join('')}</div><div class="calc">${calc.summary}</div>${e.ability==='ranged'&&reserveId()?`<label class="tag"><input type="checkbox" id="ignoreRanged"> 예비 카드를 버려 원거리 선제 피해 무시</label>`:''}<div class="row" style="margin-top:10px"><label class="small">증폭 적용:</label><select id="boostTarget" onchange="setBoostTarget(this.value)"><option value="${e.type==='enemy'?'attack':'move'}">${e.type==='enemy'?'공격':'이동'}</option>${e.type==='enemy'?'<option value="init">선제권</option>':''}</select><button class="primary" ${rolesReady()?'':'disabled'} onclick="resolveEncounter()">조우 해결</button><button class="ghost" onclick="backChallenge()">역할 초기화</button></div><div class="footer-note">융합은 4장 손패에서 예비 카드와 같은 원소의 행동 카드를 겹치는 규칙입니다. 이 첫 버전에서는 기본 플레이를 안정화하기 위해 융합 UI를 아직 자동화하지 않았습니다. 기사도 변형은 그대로 적용됩니다.</div>`}
function cardHtml(id,withRoles){const c=mage(id),x=st(id),el=E[c.element],selected=Object.values(s.roles||{}).includes(id);return `<article class="mage ${selected?'selected':''}" style="--el:${el.color}"><div class="title"><span>${el.icon} ${esc(c.name)}</span><span class="lvl">Lv.${x.level}</span></div><div class="meta">${id} · ${c.focus==='attack'?'공격형':c.focus==='move'?'이동형':'유연형'} · ${el.name}</div><div class="numbers"><div class="num">선제<b>${x.init}</b></div><div class="num">공격<b>${x.attack}/${x.enhAttack}</b></div><div class="num">이동<b>${x.move}/${x.enhMove}</b></div><div class="num">증폭<b>${x.boost}</b></div><div class="num">방어<b>${x.armor}</b></div><div class="num">향상<b>${x.cost??'MAX'}</b></div></div>${withRoles?`<div class="roles"><button class="${s.roles.spell===id?'on':''}" onclick="role('${id}','spell')">주문</button><button class="${s.roles.element===id?'on':''}" onclick="role('${id}','element')">원소</button><button class="${s.roles.boost===id?'on':''}" onclick="role('${id}','boost')">증폭</button><button class="${reserveId()===id?'on':''}" disabled>예비</button></div>`:''}</article>`}
function role(id,r){for(const k of ['spell','element','boost'])if(s.roles[k]===id)s.roles[k]=null;if(s.roles[r]===id)s.roles[r]=null;else{s.roles[r]=id;for(const k of ['spell','element','boost'])if(k!==r&&s.roles[k]===id)s.roles[k]=null}render()}
function reserveId(){return s.hand.find(id=>![s.roles.spell,s.roles.element,s.roles.boost].includes(id))||null}
function rolesReady(){if(!s.roles.spell)return false;if(s.hand.length>=3)return Boolean(s.roles.element&&s.roles.boost&&new Set([s.roles.spell,s.roles.element,s.roles.boost]).size===3);return true}
function setBoostTarget(v){s.roles.boostTarget=v;render()}
function backChallenge(){s.phase='challenge';s.roles={spell:null,element:null,boost:null,boostTarget:'attack'};render()}
function calcAction(){if(!rolesReady())return{summary:'역할을 지정하면 예상 결과를 계산합니다.'};const e=s.encounter,spell=st(s.roles.spell),spellCard=mage(s.roles.spell),element=s.roles.element?mage(s.roles.element).element:null,elStats=s.roles.element?st(s.roles.element):{init:0};let boost=s.roles.boost?st(s.roles.boost).boost:0,init=elStats.init||0;if(e.circ==='night')boost=Math.max(0,boost-init);const enhanced=element&&element===spellCard.element;let attack=spellCard.focus==='move'?1:(enhanced?spell.enhAttack:spell.attack),move=spellCard.focus==='attack'?1:(enhanced?spell.enhMove:spell.move);if(spellCard.focus==='dual'){attack=enhanced?spell.enhAttack:spell.attack;move=enhanced?spell.enhMove:spell.move}if(s.roles.boostTarget==='attack')attack+=boost;if(s.roles.boostTarget==='move')move+=boost;if(s.roles.boostTarget==='init')init+=boost;let target=e.type==='enemy'?attack:move;if(e.type==='enemy'&&e.armor>0&&enhanced&&spellCard.element===e.armorElement)target=Math.max(0,target-e.armor);const reserve=reserveId()?st(reserveId()).boost:0;const effectiveMp=e.type==='journey'?e.mp+(e.peril==='steep'?reserve:0):0;const detail=e.type==='enemy'?`공격 ${target} · 선제권 ${init} · ${enhanced?'강화 공격':'기본 공격'}`:`이동 ${target} · 선제권 ${init} · ${enhanced?'강화 이동':'기본 이동'}${e.peril==='steep'?` · 가파름으로 마력 ${effectiveMp}`:''}`;return{attack:target,move:target,init,enhanced,element:spellCard.element,boost,effectiveMp,summary:`<strong>${detail}</strong><br><span class="small">원소 역할이 주문 카드의 강화 원소와 일치하면 강화 행동을 사용합니다.</span>`}}
function resolveEncounter(){if(!rolesReady())return;const e=s.encounter,c=calcAction(),reserve=reserveId();let xp=0,time=0,damage=0,damageEl=e.type==='enemy'?e.attackElement:null,result='';let pre=false,combat=false;if(e.type==='enemy'){let power=c.attack;if(e.ability==='slow'){const moveCalc=(()=>{const old=s.roles.boostTarget;s.roles.boostTarget='move';const z=calcAction();s.roles.boostTarget=old;return z.move})();power=Math.max(power,moveCalc)}pre=(e.ability==='ranged'||c.init<e.initiative);if(e.ability==='ranged'&&$('#ignoreRanged')?.checked&&reserve){pre=false;s.discard.push(reserve);s.hand=s.hand.filter(x=>x!==reserve);log(`예비 카드 ${mage(reserve).name}을 버려 원거리 능력을 무시했습니다.`)}let preD=pre?e.attack:0;if(pre&&e.circ==='ambush')preD*=2;const half=Math.ceil(e.hp/2);if(power>=e.hp){result='완벽한 승리';xp=e.xp;s.stats.perfect++}else if(power>=half){result='근소한 승리';xp=e.xp;combat=true;s.stats.narrow++}else{result='패배';combat=true;s.stats.defeat++}if(combat)damage+=e.attack;damage+=preD;if(e.circ==='rough'){if(pre)time++;if(combat)time++}if(e.ability==='poison'&&damage>0)s.poisonPending+=(pre?1:0)+(combat?1:0);if(e.ability==='freeze'&&pre&&reserve&&s.hand.includes(reserve)){s.discard.push(reserve);s.hand=s.hand.filter(x=>x!==reserve);log(`빙결로 예비 카드 ${mage(reserve).name}을 버렸습니다.`)}}else{const mp=c.effectiveMp||e.mp,half=Math.ceil(mp/2),power=c.move;if(power>=mp){result='완벽한 승리';xp=e.xp;s.stats.perfect++}else if(power>=half){result='근소한 승리';xp=e.xp;time+=e.time;s.stats.narrow++}else{result='패배';time+=e.time;s.stats.defeat++}if(e.peril==='unstable'&&result!=='완벽한 승리')damage+=1}if(e.circ==='storm'&&time>0)damage+=time;const overflow=applyTime(time);damage+=overflow;s.stats.encounters++;s.bypassStreak=0;s.xp=xp;log(`${e.name}: ${result}${xp?` · 경험치 ${xp}`:''}${time?` · 시간 -${time}`:''}${damage?` · 피해 ${damage}`:''}`);s.upgradeLocked=[];if(damage>0){s.pendingDamage={amount:damage,element:damageEl,after:'upgrade',final:false,label:e.name};s.damageSelected=[];s.phase='damage'}else if(xp>0)s.phase='upgrade';else cleanupEncounter();save();render()}
function applyTime(n){let overflow=0;for(let i=0;i<n;i++){if(s.deck.length)s.discard.push(s.deck.shift());else overflow++}return overflow}
function damageHtml(){const p=s.pendingDamage,selected=s.damageSelected||[],absorbed=selected.reduce((sum,id)=>sum+armorAbsorb(id,p.element),0),max=s.hand.reduce((sum,id)=>sum+armorAbsorb(id,p.element),0);return `<div class="final-banner"><h2>💥 ${esc(p.label||'피해')} · ${p.amount} 피해</h2><p>손패의 카드를 강등해 피해를 흡수하세요. 같은 조우에서 각 카드는 1번만 강등할 수 있습니다.</p><div class="progress"><span style="width:${Math.min(100,absorbed/p.amount*100)}%"></span></div><p><b>${absorbed} / ${p.amount}</b> 흡수 선택</p></div><div class="damage-list">${s.hand.map(id=>`<button class="damage-option ${selected.includes(id)?'on':''}" onclick="toggleDamage('${id}')"><span>${E[mage(id).element].icon} ${esc(mage(id).name)} · Lv.${st(id).level}</span><b>방어 ${armorAbsorb(id,p.element)}</b></button>`).join('')}</div><div class="row" style="margin-top:12px"><button class="primary" ${absorbed>=p.amount?'':'disabled'} onclick="confirmDamage()">피해 흡수 확정</button>${max<p.amount&&!p.final?`<button class="danger" onclick="stun()">기절 처리 (${max}/${p.amount})</button>`:''}${max<p.amount&&p.final?`<button class="danger" onclick="finishGame(false,'용의 공격을 흡수하지 못했습니다.')">패배 확정</button>`:''}</div>`}
function armorAbsorb(id,attackEl){const x=st(id),c=mage(id);if(!attackEl||c.element!==attackEl)return x.armor;if(s.glass)return x.armor+1;return x.armor*2}
function toggleDamage(id){const a=s.damageSelected,i=a.indexOf(id);if(i>=0)a.splice(i,1);else a.push(id);render()}
function downgrade(id){if(s.cards[id].level<=1){s.cards[id].removed=true;s.hand=s.hand.filter(x=>x!==id);s.deck=s.deck.filter(x=>x!==id);s.discard=s.discard.filter(x=>x!==id);log(`${mage(id).name}이 1레벨에서 강등되어 제거되었습니다.`)}else{s.cards[id].level--;s.upgradeLocked.push(id);log(`${mage(id).name}이 Lv.${s.cards[id].level}로 강등되었습니다.`)}}
function confirmDamage(){const p=s.pendingDamage,absorbed=s.damageSelected.reduce((sum,id)=>sum+armorAbsorb(id,p.element),0);if(absorbed<p.amount)return;[...s.damageSelected].forEach(downgrade);const after=p.after;s.pendingDamage=null;s.damageSelected=[];if(p.final){finishGame(true,'용의 공격을 견뎌냈습니다.')}else if(after==='upgrade'&&s.xp>0)s.phase='upgrade';else if(after==='cleanup')cleanupEncounter();else if(after==='nextChallenge')s.phase='challenge';else if(after==='finalEnemy')startFinalEnemy();else if(after==='afterFinalJourney')completeFinalJourney();else cleanupEncounter();render()}
function stun(){const after=s.pendingDamage?.after;s.stats.stuns++;const ids=[...s.hand];ids.forEach(id=>downgrade(id));for(let i=0;i<4;i++)if(s.deck.length)s.discard.push(s.deck.shift());log('피해를 흡수하지 못해 기절했습니다. 남은 손패를 강등하고 덱 4장을 버립니다.');s.pendingDamage=null;s.damageSelected=[];if(after==='afterFinalJourney'){completeFinalJourney();return}if(s.xp>0)s.phase='upgrade';else cleanupEncounter();render()}
function upgradeHtml(){return `<div class="final-banner"><h2>✨ 향상 단계 · 경험치 ${s.xp}</h2><p>이번 조우에서 얻은 경험치를 사용하세요. 남은 경험치는 다음 조우로 이월되지 않습니다.</p></div><div class="upgrade-grid">${s.hand.map(id=>{const x=st(id),locked=s.upgradeLocked.includes(id),can=!locked&&x.level<4&&x.cost<=s.xp;return `<article class="mage" style="--el:${E[mage(id).element].color};min-height:150px"><div class="title">${E[mage(id).element].icon} ${esc(mage(id).name)} <span class="lvl">Lv.${x.level}</span></div><div class="meta">다음 향상 비용 ${x.cost??'MAX'}${locked?' · 이번 조우 강등됨':''}</div><button class="gold" ${can?'':'disabled'} onclick="upgrade('${id}')">레벨 향상</button></article>`}).join('')}</div><div class="row" style="margin-top:12px"><button class="primary" onclick="finishUpgrade()">향상 종료 · 남은 XP 버리기</button></div>`}
function upgrade(id){const x=st(id);if(s.upgradeLocked.includes(id)||x.level>=4||x.cost>s.xp)return;s.xp-=x.cost;s.cards[id].level++;s.stats.upgrades++;log(`${mage(id).name}을 Lv.${s.cards[id].level}로 향상했습니다.`);render()}
function finishUpgrade(){s.xp=0;cleanupEncounter()}
function cleanupEncounter(){const used=[s.roles.spell,s.roles.element,s.roles.boost].filter(Boolean);for(const id of used){if(s.hand.includes(id)){s.hand=s.hand.filter(x=>x!==id);s.discard.push(id)}}while(s.hand.length<4&&s.deck.length)s.hand.push(s.deck.shift());s.roles={spell:null,element:null,boost:null,boostTarget:'attack'};s.encounter=null;s.upgradeLocked=[];if(s.poisonPending>0){const d=s.poisonPending;s.poisonPending=0;s.pendingDamage={amount:d,element:null,after:'nextChallenge',final:false,label:'중독'};s.damageSelected=[];s.phase='damage';log(`중독으로 새 손패에 ${d} 피해가 발생합니다.`)}else if(totalCurrent()<5)endRegion();else s.phase='challenge';save();render()}
function endRegion(){if(s.region>=4){startFinalJourney();return}s.region++;setupRegion(false);save();render()}
function startFinalJourney(){const ids=rngShuffle(activeIds());s.deck=ids;s.hand=[];s.discard=[];for(let i=0;i<7&&s.deck.length;i++)s.hand.push(s.deck.shift());s.phase='finalJourney';s.finalAssign={};s.encounter=null;log('4개 지역을 돌파했습니다. 최후의 여정을 시작합니다.');save();render()}
function finalJourneyHtml(){const d=DRAGONS[s.dragon],ready=finalReady();return `<div class="final-banner"><h2>🗺️ 최후의 여정 · ${esc(d.name)}</h2><p>${E[d.element].icon} 마력 등급 ${d.magic.join(' / ')} · 시간 불이익 ${d.time.join(' / ')}</p></div>${finalAssignHelp('이동')}<div class="cards">${s.hand.map(id=>finalCard(id)).join('')}</div><div class="calc">${ready?finalCalc('journey').summary:'A/B 행동 조합에 각각 주문·원소·증폭을 1장씩 지정하세요. 남은 카드는 예비입니다.'}</div><div class="row" style="margin-top:12px">${!s.regroupUsed?'<button class="ghost" onclick="regroup()">재정비 1회 사용</button>':''}<button class="primary" ${ready?'':'disabled'} onclick="resolveFinalJourney()">최후의 여정 해결</button></div>`}
function finalAssignHelp(kind){return `<p class="small">각 카드에서 A 또는 B 행동 조합의 역할을 선택하세요. ${kind} 수치를 두 조합에서 합산합니다.</p>`}
function finalCard(id){const c=mage(id),x=st(id),el=E[c.element],r=s.finalAssign[id]||'';return `<article class="mage ${r?'selected':''}" style="--el:${el.color}"><div class="title">${el.icon} ${esc(c.name)} <span class="lvl">Lv.${x.level}</span></div><div class="numbers"><div class="num">선제<b>${x.init}</b></div><div class="num">공격<b>${x.attack}/${x.enhAttack}</b></div><div class="num">이동<b>${x.move}/${x.enhMove}</b></div><div class="num">증폭<b>${x.boost}</b></div><div class="num">방어<b>${x.armor}</b></div><div class="num">향상<b>${x.cost??'MAX'}</b></div></div><select style="width:100%;margin-top:8px;padding:7px;background:#0e121a;color:#fff;border:1px solid #3d4557;border-radius:8px" onchange="finalRole('${id}',this.value)"><option value="">예비</option>${['A-spell','A-element','A-boost','B-spell','B-element','B-boost'].map(v=>`<option value="${v}" ${r===v?'selected':''}>${v.replace('spell','주문').replace('element','원소').replace('boost','증폭')}</option>`).join('')}</select></article>`}
function finalRole(id,r){for(const k of Object.keys(s.finalAssign))if(s.finalAssign[k]===r&&r)s.finalAssign[k]='';s.finalAssign[id]=r;render()}
function finalReady(){const vals=Object.values(s.finalAssign).filter(Boolean);if(s.phase==='finalEnemy')return vals.includes('A-spell')&&vals.includes('B-spell');return ['A-spell','A-element','A-boost','B-spell','B-element','B-boost'].every(x=>vals.includes(x))}
function finalCombo(prefix,type){const get=role=>Object.keys(s.finalAssign).find(id=>s.finalAssign[id]===`${prefix}-${role}`),spellId=get('spell'),elId=get('element'),boostId=get('boost');if(!spellId)return{value:0,init:0,enh:false,element:null};const sc=mage(spellId),ss=st(spellId),element=elId?mage(elId).element:null,enh=Boolean(element&&element===sc.element),b=boostId?st(boostId).boost:0;let base=type==='journey'?(sc.focus==='attack'?1:(enh?ss.enhMove:ss.move)):(sc.focus==='move'?1:(enh?ss.enhAttack:ss.attack));if(sc.focus==='dual')base=type==='journey'?(enh?ss.enhMove:ss.move):(enh?ss.enhAttack:ss.attack);return{value:base+b,init:elId?st(elId).init:0,enh,element:sc.element}}
function finalCalc(type){const a=finalCombo('A',type),b=finalCombo('B',type),reserve=s.hand.find(id=>!s.finalAssign[id]),d=DRAGONS[s.dragon];let value=a.value+b.value,init=a.init+b.init;if(type==='journey'&&reserve&&(a.enh&&a.element===d.element||b.enh&&b.element===d.element))value+=st(reserve).boost;if(type==='enemy'){const matched=new Set([a,b].filter(x=>x.enh).map(x=>x.element));for(const el of matched)value-=Number(d.armor[el]||0);value=Math.max(0,value)}return{value,init,a,b,reserve,summary:`<strong>${type==='journey'?'총 이동':'총 공격'} ${value}${type==='enemy'?` · 총 선제권 ${init}`:''}</strong><br><span class="small">A ${a.value} + B ${b.value}${reserve&&type==='journey'?` · 예비 ${mage(reserve).name}`:''}</span>`}}
function regroup(){if(s.regroupUsed||s.hand.length<1)return;const options=s.hand.map(id=>`${id} ${mage(id).name}`).join('\n'),id=prompt('버릴 카드 ID를 입력하세요.\n'+options);if(!id||!s.hand.includes(id))return;s.discard.push(id);const keep=s.hand.filter(x=>x!==id);s.deck=rngShuffle([...s.deck,...keep]);s.hand=[];for(let i=0;i<7&&s.deck.length;i++)s.hand.push(s.deck.shift());s.regroupUsed=true;s.finalAssign={};log(`최후의 여정에서 재정비를 사용해 ${mage(id).name}을 버렸습니다.`);render()}
function resolveFinalJourney(){if(!finalReady())return;const d=DRAGONS[s.dragon],c=finalCalc('journey');let tier=-1;for(let i=0;i<3;i++)if(c.value>=d.magic[i])tier=i;if(tier<0){finishGame(false,'최후의 여정에서 마력 1등급을 넘지 못했습니다.');return}const time=d.time[tier],overflow=applyTime(time);log(`최후의 여정: 이동 ${c.value} · ${tier+1}등급 도달 · 시간 -${time}`);if(overflow>0){s.pendingDamage={amount:overflow,element:null,after:'afterFinalJourney',final:false,label:'최후의 여정 시간 불이익'};s.damageSelected=[];s.phase='damage';render();return}completeFinalJourney()}
function completeFinalJourney(){const used=[...s.hand];s.discard.push(...used);s.hand=[];s.finalAssign={};startFinalEnemy()}
function startFinalEnemy(){s.hand=[...s.deck];s.deck=[];if(s.hand.length<2){finishGame(false,'최후의 적과 두 행동 조합을 만들 카드가 부족합니다.');return}s.phase='finalEnemy';s.finalAssign={};log(`${DRAGONS[s.dragon].name}과 최후의 적 전투를 시작합니다.`);save();render()}
function finalEnemyHtml(){const d=DRAGONS[s.dragon],ready=finalReady();return `<div class="final-banner"><h2>🐲 최후의 적 · ${esc(d.name)}</h2><div class="encstats">${es('체력 등급',d.hp.join(' / '))}${es('공격 등급',d.attack.join(' / '))}${es('선제권',d.initiative)}${es('선제 피해',d.pre)}</div><div style="margin-top:8px">${Object.entries(d.armor).map(([el,v])=>`<span class="tag">${E[el].icon} 방어 ${v}</span>`).join('')}</div></div>${finalAssignHelp('공격')}<p class="small">최후의 적에서는 카드가 부족해 행동 조합이 3장 미만이어도 됩니다. 각 조합의 <b>주문</b>만은 반드시 지정하세요.</p><div class="cards">${s.hand.map(id=>finalCard(id)).join('')}</div><div class="calc">${ready?finalCalc('enemy').summary:'A/B 행동 조합에 각각 주문 카드를 1장씩 지정하세요. 원소·증폭은 남은 카드 수에 따라 선택 사항입니다.'}</div><div class="row" style="margin-top:12px"><button class="primary" ${ready?'':'disabled'} onclick="resolveFinalEnemy()">용과 결전</button></div>`}
function resolveFinalEnemy(){if(!finalReady())return;const d=DRAGONS[s.dragon],c=finalCalc('enemy');let tier=-1;for(let i=0;i<3;i++)if(c.value>=d.hp[i])tier=i;if(tier<0){finishGame(false,`총 공격 ${c.value}로 체력 1등급 ${d.hp[0]}을 넘지 못했습니다.`);return}const pre=c.init<d.initiative?d.pre:0,combat=d.attack[tier],damage=pre+combat;log(`최후의 적: 공격 ${c.value} · 선제권 ${c.init} · 체력 ${tier+1}등급 · 피해 ${damage}`);if(damage<=0){finishGame(true,'용을 쓰러뜨렸습니다.');return}s.pendingDamage={amount:damage,element:d.element,after:null,final:true,label:`${d.name}의 최후 공격`};s.damageSelected=[];s.phase='damage';render()}
function finishGame(win,reason){const score=win?activeIds().reduce((sum,id)=>sum+s.cards[id].level,0):0;const best=Number(localStorage.getItem(BEST_KEY)||0);if(score>best)localStorage.setItem(BEST_KEY,String(score));s.result={win,reason,score,best:Math.max(best,score),elapsed:Date.now()-s.startedAt};localStorage.removeItem(SAVE_KEY);render()}
function renderResult(){const r=s.result,min=Math.max(1,Math.round(r.elapsed/60000));$('#app').innerHTML=`<section class="hero"><div class="phase">모험 종료</div><h1>${r.win?'🏆 에테르 마법사 승리':'☠️ 원정 실패'}</h1><p>${esc(r.reason)}</p></section><section class="panel" style="margin-top:16px;text-align:center"><div class="rank-score">${r.score}점</div><p>${r.win?'제거되지 않은 모든 마법사 카드의 최종 레벨 합계':'규칙에 따라 패배 점수는 0점'}</p><div class="statbar">${stat('지역',s.region+'/4')}${stat('조우',s.stats.encounters)}${stat('완벽',s.stats.perfect)}${stat('근소',s.stats.narrow)}${stat('기절',s.stats.stuns)}${stat('플레이',min+'분')}</div><div class="row" style="justify-content:center"><button class="primary" onclick="startOver()">새 모험</button><a href="./index.html#/solo"><button class="ghost">1인플 목록</button></a></div></section>`}
function startOver(){s=null;localStorage.removeItem(SAVE_KEY);render()}
function showRules(){const w=window.open('','etchrules','width=720,height=820,scrollbars=yes');w.document.write(`<meta charset="utf-8"><style>body{font-family:system-ui;padding:25px;line-height:1.6;background:#11151d;color:#eee}h1,h2{color:#e9b75c}b{color:#fff}</style><h1>에친스톤 규칙 요약</h1><h2>지역 조우</h2><p>도전 → 행동 → 불이익 → 향상 → 정리. 손패에서 주문·원소·증폭 역할을 정하고, 남는 카드는 예비가 됩니다.</p><h2>적</h2><p>선제권을 비교하고 공격을 체력과 비교합니다. 체력 이상은 완벽, 절반(올림) 이상은 근소, 그 미만은 패배입니다. 완벽이 아니면 전투 피해를 받습니다.</p><h2>여정</h2><p>이동을 마력과 비교합니다. 마력 이상은 완벽, 절반 이상은 근소, 그 미만은 패배이며 근소/패배 시 시간 불이익을 받습니다.</p><h2>피해</h2><p>손패 카드를 강등해 방어만큼 흡수합니다. 공격 원소와 카드 원소가 일치하면 방어가 2배입니다(유리 대포 변형 제외). Lv.1 강등은 카드 제거입니다.</p><h2>향상</h2><p>이번 조우 경험치를 사용해 손패 카드를 향상합니다. 경험치는 다음 조우로 이월되지 않습니다.</p><h2>최후의 전투</h2><p>7장으로 최후의 여정에서 2개 행동 조합을 만든 뒤, 남은 카드로 최후의 적과 싸웁니다. 최종 공격이 체력 1등급보다 낮으면 즉시 패배합니다. 용의 피해를 모두 흡수하면 승리합니다.</p>`);w.document.close()}
function bindAfterRender(){if(s.phase==='action'){const sel=$('#boostTarget');if(sel)sel.value=s.roles.boostTarget}}
render();
</script>
</body>
