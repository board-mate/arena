};

 [[0,0],[1,0],[2,0],[0,1],[1,1],[0,2]],[[0,0],[1,0],[2,0],[3,0],[1,1],[1,2],[2,2]],[[0,0],[1,0],[2,0],[3,0],[0,1],[3,1],[0,2],[1,2],[2,2],[3,2]],

];
function norm(cells){let minx=Math.min(...cells.map(c=>c[0])),miny=Math.min(...cells.map(c=>c[1]));return cells.map(([x,y])=>[x-minx,y-miny]).sort((a,b)=>a[1]-b[1]||a[0]-b[0])}
function oriCells(id,rot=0,flip=false){let cells=PIECES[id].cells.map(c=>[...c]);if(flip)cells=cells.map(([x,y])=>[-x,y]);for(let k=0;k<rot%4;k++)cells=cells.map(([x,y])=>[-y,x]);return norm(cells)}
function dims(cells){return [Math.max(...cells.map(c=>c[0]))+1,Math.max(...cells.map(c=>c[1]))+1]}
function rewardFor(i,black){const pool=black?['triI','triL','tetI','tetL','tetT','tetS','tetO']:['dot','domino','triI','triL'];return pool[i%pool.length]}
function puzzleDeck(kind,count){const black=kind==='black',arr=[];for(let i=0;i<count;i++){let mask=TEMPLATES[(i+(black?6:0))%TEMPLATES.length];if(black&&mask.length<7)mask=TEMPLATES[(i+12)%TEMPLATES.length];const [w,h]=dims(mask),area=mask.length;arr.push({id:`${kind}-${i+1}`,kind,mask:clone(mask),w,h,points:black?Math.max(2,Math.min(5,Math.ceil((area-3)/2))):Math.max(0,Math.min(2,Math.floor((area-3)/2))),reward:rewardFor(i,black)})}return shuffle(arr)}
function reserveInit(){return Object.fromEntries(IDS.map(id=>[id,15]))}

function initState(members){const n=members.length,blackCount=({2:12,3:14,4:16})[n]||16;const s={kind:'projectl-v1',version:1,current:0,round:1,first:0,actionsLeft:3,masterUsed:false,masterMode:false,masterPlaced:[],blackTakenThisTurn:0,phase:'play',endTriggered:false,triggerRound:null,over:false,finalOrder:null,logs:[],reserve:reserveInit(),whiteDeck:puzzleDeck('white',32),blackDeck:puzzleDeck('black',20),rows:{white:[],black:[]},players:members.slice().sort((a,b)=>a.seat-b.seat).map(m=>({id:m.user_id,name:m.nickname,supply:{},puzzles:[],completed:[],finishingPenalty:0,finishingDone:false}))};s.blackDeck=shuffle(s.blackDeck).slice(0,blackCount);for(const p of s.players){const a=takeReserve(s,'dot'),b=takeReserve(s,'domino');if(a)addSupply(p,a);if(b)addSupply(p,b)}for(let i=0;i<4;i++){if(s.whiteDeck.length)s.rows.white.push(s.whiteDeck.pop());if(s.blackDeck.length)s.rows.black.push(s.blackDeck.pop())}log(s,`${n}인 게임 시작 · 각자 레벨 1/2 조각 1개`);return s}
function log(s,msg){s.logs.unshift(`R${s.round} · ${msg}`);s.logs=s.logs.slice(0,80)}
let room,members=[],me,badges={},state,revision=0,mySeat=-1,saveChain=Promise.resolve(),submitted=false,selectedPiece=null,rotation=0,flipped=false,selectedPuzzle=null;
function seatName(i){return state?.players?.[i]?.name||`P${i+1}`}
function myPlayer(){return state.players[mySeat]}
function isMyTurn(){return state&&!state.over&&state.current===mySeat}
function occupiedSet(pz){return new Set((pz.placed||[]).flatMap(pl=>pl.cells.map(([x,y])=>`${x},${y}`)))}
function maskSet(pz){return new Set(pz.mask.map(([x,y])=>`${x},${y}`))}
function validPlacement(pz,id,ax,ay,rot=rotation,flip=flipped){const occ=occupiedSet(pz),mask=maskSet(pz);return oriCells(id,rot,flip).every(([x,y])=>mask.has(`${ax+x},${ay+y}`)&&!occ.has(`${ax+x},${ay+y}`))}
function completeNow(pz){const occ=occupiedSet(pz);return pz.mask.every(([x,y])=>occ.has(`${x},${y}`))}
function grantReward(p,reward){const got=takeReserve(state,reward);if(got){addSupply(p,got);log(state,`${p.name}: 보상 ${PIECES[got].name} 획득`)}else log(state,`${p.name}: 비축고에 받을 조각이 없음`)}

function takePuzzle(kind,index=null){if(!isMyTurn()||state.phase!=='play'||state.actionsLeft<=0)return;if(myPlayer().puzzles.length>=4)return toast('미완성 퍼즐은 최대 4개입니다.');if(kind==='black'&&state.endTriggered&&state.blackTakenThisTurn>=1)return toast('게임 종료가 발동된 뒤에는 한 차례에 검정 퍼즐을 1개만 가져갈 수 있습니다.');let pz;if(index===null){const deck=kind==='white'?state.whiteDeck:state.blackDeck;if(!deck.length)return toast('덱이 비어 있습니다.');pz=deck.pop();if(kind==='black'&&!state.blackDeck.length&&!state.endTriggered){state.endTriggered=true;state.triggerRound=state.round;log(state,'검정 퍼즐 덱 소진 · 현재 라운드 후 마지막 라운드 진행')}}else{pz=state.rows[kind].splice(index,1)[0];if(!pz)return;refillRow(kind,index)}myPlayer().puzzles.push({...pz,placed:[]});if(kind==='black')state.blackTakenThisTurn++;log(state,`${myPlayer().name}: ${kind==='black'?'검정':'하양'} 퍼즐 가져가기`);consumeAction('take')}

function advanceTurn(){selectedPiece=null;selectedPuzzle=null;rotation=0;flipped=false;state.masterMode=false;state.masterPlaced=[];const prev=state.current;state.current=(state.current+1)%state.players.length;if(state.current===state.first){state.round++;if(state.endTriggered&&state.round>state.triggerRound+1){startFinishing();return}}state.actionsLeft=3;state.masterUsed=false;state.blackTakenThisTurn=0;log(state,`차례: ${seatName(state.current)}`)}

function finishTouchesDone(){if(!isMyTurn()||state.phase!=='finishing')return;const p=myPlayer();resolveCompleted(p,{finishing:true});p.finishingDone=true;log(state,`${p.name}: 마무리 터치 완료`);let next=-1;for(let k=1;k<=state.players.length;k++){const i=(state.current+k)%state.players.length;if(!state.players[i].finishingDone){next=i;break}}if(next>=0)state.current=next;else finishGame();commit('finishing-done')}
function scorePlayer(p){const completed=p.completed.reduce((a,x)=>a+x.points,0),incomplete=p.puzzles.reduce((a,x)=>a+x.points,0);return {score:completed-incomplete-p.finishingPenalty,completed:p.completed.length,left:Object.values(p.supply).reduce((a,b)=>a+b,0)}}
function finishGame(){state.phase='done';state.over=true;state.current=null;const scores=state.players.map(scorePlayer);state.finalOrder=state.players.map((_,i)=>i).sort((a,b)=>scores[b].score-scores[a].score||scores[b].completed-scores[a].completed||scores[b].left-scores[a].left||a-b);log(state,`게임 종료 · ${seatName(state.finalOrder[0])} 선두`)}

function endMaster(){if(!state.masterMode||!isMyTurn())return;state.masterMode=false;resolveCompleted(myPlayer());log(state,`${myPlayer().name}: 마스터 액션 종료`);if(state.actionsLeft===0)advanceTurn();commit('master-end')}
function placeSelected(pzIndex,ax,ay){if(!isMyTurn()||!selectedPiece)return;const p=myPlayer(),pz=p.puzzles[pzIndex];if(!pz||!validPlacement(pz,selectedPiece,ax,ay))return;if(state.phase==='play'){if(state.masterMode&&state.masterPlaced.includes(pz.id))return toast('마스터 액션에서는 한 퍼즐에 조각 1개만 놓을 수 있습니다.');if(!state.masterMode&&state.actionsLeft<=0)return}if(!spendSupply(p,selectedPiece))return;const cells=oriCells(selectedPiece,rotation,flipped).map(([x,y])=>[x+ax,y+ay]);pz.placed.push({id:selectedPiece,cells});if(state.phase==='finishing'){p.finishingPenalty++;log(state,`${p.name}: 마무리 터치 조각 배치 (-1점)`)}else if(state.masterMode){state.masterPlaced.push(pz.id);log(state,`${p.name}: 마스터로 ${pz.id}에 조각 배치`);resolveCompleted(p)}else{log(state,`${p.name}: ${pz.id}에 조각 배치`);resolveCompleted(p);state.actionsLeft--;if(state.actionsLeft===0)advanceTurn()}commit('place')}
function upgradeModal(){if(!isMyTurn()||state.phase!=='play'||state.actionsLeft<=0)return;const p=myPlayer();modal(`<h2>⬆ 업그레이드</h2><p class="hint">새 레벨-1 조각을 얻거나, 개인 공급처의 조각 1개를 같은 레벨·더 낮은 레벨·한 단계 높은 레벨 조각으로 교체합니다.</p><div class="choice-grid"><button class="choice" data-new1><b>새 레벨-1 조각</b><br><span class="hint">비축고에서 점 조각 1개</span></button>${IDS.filter(id=>(p.supply[id]||0)>0).map(id=>`<button class="choice" data-up-src="${id}"><b>${PIECES[id].name}</b><br><span class="hint">Lv.${PIECES[id].level} · ${p.supply[id]}개 보유</span></button>`).join('')}</div>`,m=>{m.querySelector('[data-new1]')?.addEventListener('click',()=>{const got=takeReserve(state,'dot');if(!got)return toast('레벨-1 조각이 없습니다.');addSupply(p,got);closeModal();log(state,`${p.name}: 레벨-1 조각 획득`);consumeAction('upgrade-new')});m.querySelectorAll('[data-up-src]').forEach(b=>b.onclick=()=>showUpgradeTargets(b.dataset.upSrc))})}
function showUpgradeTargets(src){const p=myPlayer(),lv=PIECES[src].level,opts=IDS.filter(id=>PIECES[id].level<=lv+1&&(state.reserve[id]||0)>0);modal(`<h2>${PIECES[src].name} 교체</h2><div class="choice-grid">${opts.map(id=>`<button class="choice" data-target="${id}"><b>${PIECES[id].name}</b><br><span class="hint">Lv.${PIECES[id].level}</span></button>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn" data-close>취소</button></div>`,m=>{m.querySelector('[data-close]').onclick=closeModal;m.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{const dst=b.dataset.target;if(!spendSupply(p,src))return;state.reserve[src]=(state.reserve[src]||0)+1;const got=takeReserve(state,dst);if(!got){state.reserve[src]--;addSupply(p,src);return toast('선택한 조각을 가져올 수 없습니다.')}addSupply(p,got);closeModal();log(state,`${p.name}: ${PIECES[src].name} → ${PIECES[got].name} 업그레이드`);consumeAction('upgrade')})})}
function shapeMini(id){const cells=PIECES[id].cells,[w,h]=dims(cells),set=new Set(cells.map(c=>c.join(',')));let html=`<span class="piece-mini" style="grid-template-columns:repeat(${w},8px);color:${COLORS[id]}">`;for(let y=0;y<h;y++)for(let x=0;x<w;x++)html+=set.has(`${x},${y}`)?'<i></i>':'<i style="opacity:0"></i>';return html+'</span>'}
function puzzleGrid(pz,{clickable=false,index=0}={}){const mask=maskSet(pz),occ=occupiedSet(pz),plByCell=new Map();for(const pl of pz.placed||[])for(const c of pl.cells)plByCell.set(c.join(','),pl.id);let html=`<div class="puzzle-grid" style="--w:${pz.w}">`;for(let y=0;y<pz.h;y++)for(let x=0;x<pz.w;x++){const k=`${x},${y}`,on=mask.has(k),pid=plByCell.get(k),can=clickable&&on&&!occ.has(k)&&selectedPiece&&validPlacement(pz,selectedPiece,x,y),body=pid?`<span class="piece-dot" style="background:${COLORS[pid]}"></span>`:'';html+=can?`<button class="pcell ${on?'':'off'} ${pid?'occ':''} placeable clickable" data-place-cell="${index}:${x}:${y}">${body}</button>`:`<span class="pcell ${on?'':'off'} ${pid?'occ':''}">${body}</span>`}return html+'</div>'}
function puzzleCard(pz,kind,index){if(!pz)return'<div class="puzzle-card" style="opacity:.3">빈 자리</div>';return `<button class="puzzle-card ${kind}" data-take="${kind}:${index}" ${!isMyTurn()||state.phase!=='play'||myPlayer().puzzles.length>=4?'disabled':''}><div class="puzzle-meta"><span class="vp">${pz.points} VP</span><span class="reward">보상 ${shapeMini(pz.reward)}</span></div>${puzzleGrid({...pz,placed:[]})}<div class="hint">${pz.mask.length}칸 퍼즐</div></button>`}
function personalPuzzle(pz,index){const can=isMyTurn()&&(state.phase==='finishing'||state.phase==='play')&&selectedPiece;return `<div class="personal-puzzle ${selectedPuzzle===index?'selected':''}"><div class="pp-head"><b>${pz.kind==='black'?'검정':'하양'} · ${pz.points}점</b><span>보상 ${shapeMini(pz.reward)}</span></div>${puzzleGrid(pz,{clickable:can,index})}<div class="hint">채움 ${occupiedSet(pz).size}/${pz.mask.length}</div></div>`}
function supplyHtml(){const p=myPlayer();return `<div class="supply">${IDS.map(id=>`<button class="piece-btn ${selectedPiece===id?'selected':''}" data-piece="${id}" ${(p.supply[id]||0)<1||!isMyTurn()?'disabled':''}><div class="shape">${shapeMini(id)}</div><div><b>${PIECES[id].name}</b> <span class="pill">Lv.${PIECES[id].level}</span></div><div class="qty">${p.supply[id]||0}개</div></button>`).join('')}</div>`}
function playerHtml(p,i){const sc=scorePlayer(p);return `<div class="player ${state.current===i?'active':''}"><div class="name">${esc(p.name)}${i===mySeat?'<span class="me">나</span>':''}</div><div class="meta">완성 ${p.completed.length} · 미완성 ${p.puzzles.length} · 현재 점수 ${sc.score}${state.phase==='finishing'?` · 마무리 -${p.finishingPenalty}`:''}</div></div>`}
function actionHtml(){if(state.over)return'';if(!isMyTurn())return `<div class="card action-panel"><h3>⏳ ${esc(seatName(state.current))} 차례</h3><p class="hint">상태가 바뀌면 자동으로 갱신됩니다.</p></div>`;if(state.phase==='finishing')return `<div class="card action-panel"><h3>✨ 마무리 터치</h3><p class="hint">공급처 조각을 원하는 만큼 미완성 퍼즐에 배치할 수 있습니다. 배치한 조각 하나마다 최종 점수 -1점입니다. 이 단계에서 완성한 퍼즐은 보상 조각을 주지 않습니다.</p><div class="row"><button class="btn" id="rotBtn">↻ 회전</button><button class="btn" id="flipBtn">⇋ 뒤집기</button><button class="btn primary" id="finishTouches">마무리 터치 완료</button></div><p class="hint">선택: ${selectedPiece?PIECES[selectedPiece].name:'조각을 고르세요'} · 회전 ${rotation*90}° ${flipped?'· 뒤집힘':''}</p></div>`;return `<div class="card action-panel"><div class="section-title"><h3>내 차례</h3><span class="pill turn">액션 <b class="action-count">${state.actionsLeft}</b> / 3</span></div>${state.masterMode?'<div class="finish-note">마스터 진행 중 · 각 미완성 퍼즐에 조각을 최대 1개씩 놓을 수 있습니다. 배치 후 마스터 종료를 누르세요.</div>':''}<div class="row" style="margin-top:8px"><button class="btn" id="upgradeBtn" ${state.masterMode?'disabled':''}>⬆ 업그레이드</button><button class="btn pink" id="masterBtn" ${state.masterUsed||state.masterMode?'disabled':''}>✦ 마스터</button>${state.masterMode?'<button class="btn primary" id="endMaster">마스터 종료</button>':''}<button class="btn" id="rotBtn">↻ 회전</button><button class="btn" id="flipBtn">⇋ 뒤집기</button></div><p class="hint">퍼즐 가져가기: 시장 카드 클릭 · 조각 배치: 공급처에서 조각 선택 → 내 퍼즐 칸 클릭 · 같은 액션을 여러 번 사용해도 됩니다.</p><p class="hint">선택: ${selectedPiece?PIECES[selectedPiece].name:'없음'} · 회전 ${rotation*90}° ${flipped?'· 뒤집힘':''}</p></div>`}
function resultHtml(){if(!state.over)return'';const scores=state.players.map(scorePlayer);return `<div class="card winner"><h2>🏆 ${esc(seatName(state.finalOrder[0]))}</h2><div>${state.finalOrder.map((i,n)=>`${n+1}위 ${esc(seatName(i))} ${scores[i].score}점`).join(' · ')}</div><p class="hint">동점: 완성 퍼즐 수 → 남은 개인 공급처 조각 수</p></div>`}
function render(){if(!state)return;const p=myPlayer();app.innerHTML=`<div class="card status"><div><h1>PROJECT L <span class="pill">BoardMate ALPHA</span></h1><div class="sub">기본 게임 규칙 기반 · 코드 생성 퍼즐 세트 · 2–4인</div></div><div class="row"><span class="pill">Round ${state.round}</span>${state.endTriggered?'<span class="pill danger">마지막 라운드 진행 중</span>':''}<button class="btn small danger" id="cancelBtn">게임 취소</button></div><div class="players" style="width:100%">${state.players.map(playerHtml).join('')}</div></div>${resultHtml()}<div class="layout"><section class="stack"><div class="card"><div class="section-title"><h2>퍼즐 시장</h2><span class="pill">미완성 최대 4개</span></div><div class="market-row-label"><b>WHITE</b><div class="row"><button class="btn small" id="recycleWhite" ${!isMyTurn()||state.phase!=='play'?'disabled':''}>행 재순환</button><button class="btn small deck-btn" id="blindWhite" ${!state.whiteDeck.length||!isMyTurn()?'disabled':''}>덱 맨 위 (${state.whiteDeck.length})</button></div></div><div class="market">${state.rows.white.map((x,i)=>puzzleCard(x,'white',i)).join('')}</div><div class="market-row-label"><b>BLACK</b><div class="row"><button class="btn small" id="recycleBlack" ${!isMyTurn()||state.phase!=='play'?'disabled':''}>행 재순환</button><button class="btn small deck-btn" id="blindBlack" ${!state.blackDeck.length||!isMyTurn()?'disabled':''}>덱 맨 위 (${state.blackDeck.length})</button></div></div><div class="market">${state.rows.black.map((x,i)=>puzzleCard(x,'black',i)).join('')}</div></div><div class="card"><div class="section-title"><h2>${esc(p.name)}의 퍼즐</h2><span class="pill">${p.puzzles.length}/4</span></div><div class="personal-puzzles">${p.puzzles.length?p.puzzles.map(personalPuzzle).join(''):'<div class="hint">시장이나 덱에서 퍼즐을 가져오세요.</div>'}</div></div></section><aside class="stack">${actionHtml()}<div class="card"><div class="section-title"><h3>내 조각 공급처</h3><span class="pill">${Object.values(p.supply).reduce((a,b)=>a+b,0)}개</span></div>${supplyHtml()}</div><div class="card"><h3>점수 현황</h3><div class="score">${state.players.map((x,i)=>{const s=scorePlayer(x);return `<div class="score-box"><span class="hint">${esc(x.name)}</span><br><b>${s.score}</b><div class="hint">완성 ${s.completed}</div></div>`}).join('')}</div></div><div class="card"><h3>진행 기록</h3><div class="log">${state.logs.map(x=>`<div>${esc(x)}</div>`).join('')}</div></div><div class="card"><h3>규칙 핵심</h3><p class="hint">차례마다 정확히 3액션: 가져가기 / 행 재순환 / 업그레이드 / 조각 배치 / 마스터(차례당 1회). 검정 덱이 비면 현재 라운드를 마치고 마지막 라운드를 한 번 더 진행합니다.</p></div></aside></div>`;bind();maybeSubmit()}
function bind(){document.querySelectorAll('[data-take]').forEach(b=>b.onclick=()=>{const[k,i]=b.dataset.take.split(':');takePuzzle(k,Number(i))});$('#blindWhite')?.addEventListener('click',()=>takePuzzle('white',null));$('#blindBlack')?.addEventListener('click',()=>takePuzzle('black',null));$('#recycleWhite')?.addEventListener('click',()=>recycle('white'));$('#recycleBlack')?.addEventListener('click',()=>recycle('black'));$('#upgradeBtn')?.addEventListener('click',upgradeModal);$('#masterBtn')?.addEventListener('click',startMaster);$('#endMaster')?.addEventListener('click',endMaster);$('#rotBtn')?.addEventListener('click',()=>{rotation=(rotation+1)%4;render()});$('#flipBtn')?.addEventListener('click',()=>{flipped=!flipped;render()});$('#finishTouches')?.addEventListener('click',finishTouchesDone);$('#cancelBtn')?.addEventListener('click',()=>openCancelVotePanel());document.querySelectorAll('[data-piece]').forEach(b=>b.onclick=()=>{selectedPiece=b.dataset.piece;rotation=0;flipped=false;render()});document.querySelectorAll('[data-place-cell]').forEach(b=>b.onclick=()=>{const[i,x,y]=b.dataset.placeCell.split(':').map(Number);placeSelected(i,x,y)})}
function modal(html,onMount){closeModal();const ov=document.createElement('div');ov.className='overlay';ov.id='overlay';ov.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(ov);onMount?.(ov.querySelector('.modal'));ov.onclick=e=>{if(e.target===ov)closeModal()}}
function closeModal(){$('#overlay')?.remove()}
function toast(msg){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;z-index:120;left:50%;bottom:20px;transform:translateX(-50%);background:#f7fafc;color:#111827;border-radius:999px;padding:10px 14px;font-weight:850;box-shadow:0 10px 30px #0008';document.body.appendChild(t)}t.textContent=msg;clearTimeout(window.__t);window.__t=setTimeout(()=>t.remove(),2200)}
async function commit(reason){render();const snap=clone(state);saveChain=saveChain.then(async()=>{try{const newRev=await saveState(revision,snap);revision=Number(newRev);sync.textContent='저장됨'}catch(e){if(/revision conflict/i.test(String(e.message||e))){const row=await loadState();if(row){revision=Number(row.revision);state=row.state;render()}return}sync.textContent='저장 실패';toast(e.message||'저장 실패')}});await saveChain}
async function maybeSubmit(){if(submitted||!state?.over||!state.finalOrder||room.host_id!==me.user_id)return;submitted=true;try{const order=state.finalOrder.map(i=>state.players[i].id);await submitMatch(order);sync.textContent='결과 반영 완료'}catch(e){console.warn(e);if(!String(e.message||'').includes('already'))submitted=false}}
async function loadContext(){me=await getMe();if(!me)showFatal('로그인이 필요합니다.');const data=await loadRoom();room=data.room;members=(data.members||[]).slice().sort((a,b)=>a.seat-b.seat);if(room.game!=='projectl')showFatal('Project L 방이 아닙니다.');if(members.length>4){showFatal('Project L 5인전은 Line Clear 규칙 구현 전까지 지원하지 않습니다. 새 2–4인 방을 만들어 주세요.');return;}mySeat=members.findIndex(m=>m.user_id===me.user_id);if(mySeat<0)showFatal('이 방의 참가자가 아닙니다.');badges=await ratingBadges('projectl',members.map(m=>m.user_id)).catch(()=>({}));const row=await loadState();if(row?.state){revision=Number(row.revision);state=row.state}else if(room.host_id===me.user_id){state=initState(members);revision=Number(await saveState(0,state))}else{sync.textContent='방장 초기화 대기 중';return}startStatePoll(async row=>{if(Number(row.revision)<=revision)return;revision=Number(row.revision);state=row.state;selectedPiece=null;render()},{interval:7000});render()}
await loadContext();
</script>
