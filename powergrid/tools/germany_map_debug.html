<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Power Grid Germany map audit</title>
<style>
body{margin:0;background:#111;color:#eee;font:14px system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:12px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.board{position:relative;width:min(100%,675px);margin:auto}.board img{display:block;width:100%}.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.edge{stroke:#00e5ff;stroke-width:1.2;opacity:.65}.cost{fill:#fff;font-size:8px;paint-order:stroke;stroke:#000;stroke-width:2px}.city{position:absolute;transform:translate(-50%,-50%);width:12px;height:12px;border:2px solid #fff;border-radius:50%;background:#ff3b30;box-shadow:0 0 0 2px #0008}.city span{position:absolute;left:12px;top:-5px;white-space:nowrap;font-size:9px;background:#000c;padding:1px 3px;border-radius:3px}.list{margin-top:12px;columns:2;column-gap:24px;font-size:12px}.list div{break-inside:avoid;padding:2px 0}.muted{color:#aaa}@media(max-width:700px){.list{columns:1}.city span{display:none}}
</style>
</head><body><div class="wrap">
<h1>독일맵 42도시 / 83연결 감사 도구</h1>
<p class="muted">게임에는 이 페이지가 노출되지 않습니다. 지도 좌표와 연결비를 원본 이미지에 겹쳐 확인하는 개발용 도구입니다.</p>
<div class="bar"><label><input id="showEdges" type="checkbox" checked> 연결선/비용 표시</label><label><input id="showNames" type="checkbox" checked> 도시명 표시</label><span id="stats"></span></div>
<div class="board" id="board"><img src="../assets/maps/germany.webp" alt="Germany board"><svg class="overlay" id="overlay" viewBox="0 0 675 900"></svg></div>
<div class="list" id="list"></div>
</div><script src="../data/germany-map.js"></script><script>
const G=PowerGridGermanyMap,board=document.querySelector('#board'),svg=document.querySelector('#overlay'),list=document.querySelector('#list');
const ns='http://www.w3.org/2000/svg';
for(const e of G.EDGES){const a=G.CITY_BY_ID[e.a],b=G.CITY_BY_ID[e.b];const line=document.createElementNS(ns,'line');line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);line.setAttribute('class','edge');svg.append(line);const t=document.createElementNS(ns,'text');t.setAttribute('x',(a.x+b.x)/2);t.setAttribute('y',(a.y+b.y)/2);t.setAttribute('class','cost');t.textContent=e.cost;svg.append(t);}
for(const c of G.CITIES){const m=document.createElement('div');m.className='city';m.style.left=(c.x/G.BOARD_WIDTH*100)+'%';m.style.top=(c.y/G.BOARD_HEIGHT*100)+'%';m.title=`${c.name} (${c.x},${c.y})`;m.innerHTML=`<span>${c.name}</span>`;board.append(m);}
list.innerHTML=G.EDGES.map((e,i)=>`<div>${String(i+1).padStart(2,'0')}. ${G.CITY_BY_ID[e.a].name} ↔ ${G.CITY_BY_ID[e.b].name} = <b>${e.cost}</b></div>`).join('');
document.querySelector('#stats').textContent=`도시 ${G.CITIES.length} · 연결 ${G.EDGES.length}`;
document.querySelector('#showEdges').onchange=e=>svg.style.display=e.target.checked?'':'none';
document.querySelector('#showNames').onchange=e=>document.querySelectorAll('.city span').forEach(x=>x.style.display=e.target.checked?'':'none');
</script></body></html>
