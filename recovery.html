<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BoardMate 복구</title>
<style>body{margin:0;background:#f5f1eb;color:#18202d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.card{max-width:680px;margin:8vh auto;padding:28px;background:#fff;border:1px solid #ddd7ce;border-radius:20px;box-shadow:0 12px 32px #0001}.ok{color:#176c3a}.bad{color:#a33}button,a{display:inline-block;padding:12px 16px;margin:8px 8px 0 0;border-radius:10px;border:0;background:#18202d;color:#fff;text-decoration:none;cursor:pointer}</style></head>
<body><main class="card"><h1>🧹 BoardMate 캐시 복구</h1><p>화면이 비거나 새로고침이 먹지 않을 때 사용하는 안전 복구 페이지입니다. 계정/게임 데이터가 저장된 localStorage는 지우지 않습니다.</p><p id="status">복구 준비 중…</p><button id="repair">캐시 초기화 후 다시 열기</button><a href="./?recovery=1">그냥 홈으로</a></main>
<script>document.getElementById('repair').onclick=async function(){var st=document.getElementById('status');st.textContent='서비스워커와 앱 캐시를 정리하는 중…';try{if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();}if('caches'in window){for(const k of await caches.keys())if(k.startsWith('boardmate-shell-'))await caches.delete(k);}st.className='ok';st.textContent='복구 완료. 최신 파일로 다시 엽니다.';setTimeout(()=>location.replace('./?recovered='+Date.now()),500);}catch(e){st.className='bad';st.textContent='자동 복구 중 오류: '+e.message+' — 브라우저의 사이트 데이터에서 캐시만 삭제해 주세요.';}};</script></body></html>
