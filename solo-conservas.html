ap:3px;margin:5px 0}.mini-token{display:inline-grid;width:24px;height:24px;border-radius:50%;place-items:center;font-size:.6rem;font-weight:1000;border:2px solid #fff;box-shadow:0 1px 4px #0002}.mini-token.sardine{background:var(--blue);color:white}.mini-token.mussel{background:var(--mussel);color:white}.mini-token.scallop{background:var(--scallop);color:#503b12}.mini-token.octopus{background:var(--pink);color:white}.mini-token.water{background:#edf2f4}.shop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.shop-card{border:1px solid #d5dedf;border-radius:13px;background:#fff;padding:9px;text-align:left;min-height:122px}.shop-card h4{margin:0 0 5px;color:#155f78}.shop-card .cost{font-size:.68rem;font-weight:950;color:#926a11}.shop-card p{font-size:.69rem;color:#67767d;line-height:1.45;margin:5px 0}.owned{display:flex;gap:6px;flex-wrap:wrap}.owned span{border:1px solid #d4e0e2;border-radius:999px;background:#f8fbfb;padding:4px 7px;font-size:.65rem;font-weight:850}.log{max-height:190px;overflow:auto;font-size:.7rem;line-height:1.5;color:#6b777d}.log div{padding:3px 0;border-bottom:1px dashed #d9e2e4}.objective{background:#fff4c9;border:1px solid #e5c85f;border-radius:13px;padding:10px}.objective b{color:#75550d}.result{border:2px solid #5cb189;text-align:center;background:#eefaf3}.result.lose{border-color:#d77c75;background:#fff1f0}.result h2{margin:0 0 6px}.setup{max-width:900px;margin:30px auto}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{border:1px solid #a9cbd3;border-radius:15px;padding:12px;background:#eef9fb;text-align:left}.choice:hover{border-color:#167da0}.overlay{position:fixed;inset:0;z-index:50;background:#153744b8;display:grid;place-items:center;padding:16px}.modal{width:min(680px,96vw);max-height:88vh;overflow:auto;background:#fffdf8;border-radius:18px;padding:16px;box-shadow:0 25px 80px #0007}.modal h2{margin:0 0 8px}.checklist{display:grid;gap:6px}.check{display:flex;justify-content:space-b <script>
const KEY='boardmate:solo:conservas:v1';
const TYPES=['sardine','mussel','scallop','octopus','water'];
const KOR={sardine:'정어리',mussel:'홍합',scallop:'가리비',octopus:'문어',water:'물'};
const ICON={sardine:'🐟',mussel:'🦪',scallop:'◉',octopus:'🐙',water:'≈'};
const TOTAL={sardine:30,mussel:30,scallop:20,octopus:16,water:20};
const BOATS=[
 {id:'b1',name:'라 루스',buy:3,upkeep:0,catch:2},{id:'b2',name:'엘 도라도',buy:4,upkeep:1,catch:2},{id:'b3',name:'페즈 리몬첼로',buy:7,upkeep:0,catch:3},
 {id:'b4',name:'퀴드 프로 풀포',buy:4,upkeep:1,catch:2},{id:'b5',name:'마르 아술',buy:5,upkeep:1,catch:3},{id:'b6',name:'라 에스페란사',buy:6,upkeep:2,catch:4},
 {id:'b7',name:'산타 루시아',buy:3,upkeep:1,catch:2},{id:'b8',name:'코스타 베르데',buy:8,upkeep:2,catch:4},{id:'b9',name:'라 페를라',buy:6,upkeep:1,catch:3},
 {id:'b10',name:'마리네라',buy:5,upkeep:0,catch:2},{id:'b11',name:'아틀란티코',buy:7,upkeep:2,catch:4},{id:'b12',name:'에스트레야',buy:4,upkeep:1,catch:3}
];
const UPGRADES=[
 {id:'fishfinder',name:'물고기 탐지기',cost:{mode:'same',n:2},text:'라운드마다 한 번, 방금 뽑은 토큰 묶음을 주머니로 되돌리고 다시 뽑습니다.',kind:'sea'},
 {id:'secondary',name:'보조 그물',cost:{mode:'same',n:2},text:'바다 단계에서 각 뽑기를 5개 대신 8개로 합니다.',kind:'passive'},
 {id:'coldstorage',name:'냉장 창고',cost:{mode:'different',n:2},text:'하루 종료 시 어획 물고기 1개를 다음 라운드까지 보관할 수 있습니다.',kind:'end'},
 {id:'marketboost',name:'고급 포장',cost:{mode:'any',n:1},text:'라운드마다 첫 시장 판매에서 +€1.',kind:'land'},
 {id:'efficient',name:'효율 엔진',cost:{mode:'different',n:2},text:'유지비 총액을 매 라운드 €1 줄입니다.',kind:'end'},
 {id:'deepnet',name:'심해 그물',cost:{mode:'same',n:2},text:'라운드마다 한 번, 심해의 물고기 1개를 어획으로 옮길 수 있습니다.',kind:'land'},
 {id:'cooperative',name:'지역 협동조합',cost:{mode:'any',n:1},text:'보트를 살 때 €1 할인.',kind:'land'},
 {id:'waterfilter',name:'해수 필터',cost:{mode:'different',n:2},text:'라운드마다 한 번, 주머니 부족으로 보충할 물 1개를 일반 공급처의 물고기 1개로 바꿀 수 있습니다. (BoardMate 구현)',kind:'sea'},
 {id:'preserver',name:'보전 기금',cost:{mode:'same',n:2},text:'게임 종료 시 지속 가능성 판정에서 정어리와 가리비를 각각 +1로 계산합니다.',kind:'passive'},
 {id:'broker',name:'수산 중개인',cost:{mode:'different',n:2},text:'라운드마다 두 번째 시장 판매에서 +€1.',kind:'land'},
 {id:'crew',name:'숙련 선원',cost:{mode:'any',n:1},text:'보트 1척의 어획량을 라운드마다 한 번 +1로 취급할 수 있습니다.',kind:'sea'},
 {id:'canner',name:'통조림 자동화',cost:{mode:'same',n:2},text:'3개 이상 물고기를 한 주문에 판매하면 +€1.',kind:'land'}
];
const ORDERS=[
 {row:0,req:{sardine:1},money:1},{row:0,req:{sardine:2},money:2},{row:0,req:{sardine:2,scallop:1},money:4},{row:0,req:{sardine:3},money:5},
 {row:1,req:{scallop:1},money:1},{row:1,req:{scallop:2},money:2},{row:1,req:{sardine:1,scallop:2},money:4},{row:1,req:{scallop:3},money:5},
 {row:2,req:{sardine:1,scallop:1},money:3},{row:2,req:{sardine:2,scallop:1},money:4},{row:2,req:{sardine:1,scallop:2},money:5},{row:2,req:{sardine:2,scallop:2},money:7},
 {row:3,req:{sardine:3,scallop:1},money:6},{row:3,req:{sardine:1,scallop:3},money:6},{row:3,req:{sardine:3,scallop:2},money:8},{row:3,req:{sardine:2,scallop:3},money:8}
];
const MONTH={name:'1월',rounds:7,startMoney:10,bag:{sardine:5,scallop:5,water:10},goal:{money:40,sardine:4,scallop:4},note:'시장 행은 왼쪽에서 오른쪽으로 채웁니다.'};
const $=s=>document.querySelector(s),clone=x=>JSON.parse(JSON.stringify(x));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function blankCounts(){return Object.fromEntries(TYPES.map(t=>[t,0]))}
function arrFromCounts(c){const a=[];for(const t of TYPES)for(let i=0;i<(c[t]||0);i++)a.push(t);return a}
function countArr(a){const c=blankCounts();for(const t of a)c[t]=(c[t]||0)+1;return c}
function generalFromBag(bag){const c={...TOTAL};for(const t of bag)c[t]--;return c}
function hasUp(id){return state.upgrades.some(u=>u.id===id)}
function newState(){const bag=shuffle(arrFromCounts(MONTH.bag)),boats=shuffle(BOATS),ups=shuffle(UPGRADES);return {version:1,month:'jan',phase:'setup',round:1,money:MONTH.startMoney,bag,general:generalFromBag(bag),boats:[],boatOffer:[boats.pop(),boats.pop()],boatMarket:[boats.pop(),boats.pop(),boats.pop()],boatDeck:boats,upgradeMarket:[ups.pop(),ups.pop(),ups.pop()],upgradeDeck:ups,openWater:{used:false,deep:[]},drawn:[],selectedCatch:[],target:null,orders:ORDERS.map((x,i)=>({...clone(x),id:i,done:false,marker:null})),upgrades:[],heldFish:[],storedFish:[],boughtBoatIds:[],boughtBoatThisRound:false,boughtUpgradeThisRound:false,rerollUsed:false,deepnetUsed:false,crewUsed:false,filterUsed:false,salesThisRound:0,logs:['1월 시나리오 준비'],over:false,win:null}}
let state=load()||newState();
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}
function reset(){if(confirm('현재 Conservas 진행을 지우고 새 게임을 시작할까요?')){state=newState();save();render()}}
function log(msg){state.logs.unshift(`R${state.round} · ${msg}`);state.logs=state.logs.slice(0,70)}
function tokenHtml(t,selected=false,idx=null){return `<button class="token ${t} ${selected?'selected':''}" ${idx!==null?`data-drawn="${idx}"`:''} title="${KOR[t]}">${ICON[t]}<small>${KOR[t]}</small></button>`}
function miniToken(t){return `<span class="mini-token ${t}">${ICON[t]}</span>`}
function bagCounts(){return countArr(state.bag)}
function catchFish(){const out=[];for(const b of state.boats)out.push(...b.catchTokens.filter(t=>t!=='water'));out.push(...state.heldFish);return out}
function allDeep(){return [...state.openWater.deep,...state.boats.flatMap(b=>b.deep)]}
function drawN(n){const out=[];for(let i=0;i<n;i++){if(state.bag.length){out.push(state.bag.splice(Math.floor(Math.random()*state.bag.length),1)[0]);continue}if(hasUp('waterfilter')&&!state.filterUsed){const fish=TYPES.filter(t=>t!=='water'&&(state.general[t]||0)>0).sort((a,b)=>(state.general[b]||0)-(state.general[a]||0))[0];if(fish){state.general[fish]--;out.push(fish);state.filterUsed=true;log(`해수 필터: 보충 물 대신 ${KOR[fish]} 1개`);continue}}if((state.general.water||0)>0){state.general.water--;out.push('water')}else{state.over=true;state.win=false;state.failReason='바다 주머니와 일반 공급처의 물 토큰이 모두 부족해 남획으로 패배했습니다.';break}}return out}
function chooseStarter(id){if(state.phase!=='setup')return;const chosen=state.boatOffer.find(x=>x.id===id);if(!chosen)return;chosen.boughtRound=0;chosen.used=false;chosen.catchTokens=[];chosen.deep=[];state.boats=[chosen];state.boatOffer=[];state.phase='sea';log(`${chosen.name}으로 출항 준비`);save();render()}
function drawTokens(){if(state.phase!=='sea'||state.drawn.length||state.over)return;const unused=targets().filter(x=>!x.used);if(!unused.length)return beginLand();const n=hasUp('secondary')?8:5;state.drawn=drawN(n);state.selectedCatch=[];state.target=null;log(`바다 주머니에서 ${state.drawn.length}개 뽑기`);save();render()}
function reroll(){if(!hasUp('fishfinder')||state.rerollUsed||!state.drawn.length)return;state.bag.push(...state.drawn);state.bag=shuffle(state.bag);state.drawn=[];state.selectedCatch=[];state.target=null;state.rerollUsed=true;log('물고기 탐지기: 방금 뽑은 토큰을 되돌리고 재뽑기');drawTokens()}
function targets(){return [...state.boats.map((b,i)=>({type:'boat',i,used:b.used,name:b.name,catch:b.catch+(hasUp('crew')&&!state.crewUsed?1:0)})),{type:'water',i:-1,used:state.openWater.used,name:'외해',catch:0}]}
function pickTarget(type,i){if(!state.drawn.length)return;const t=type==='water'?state.openWater:state.boats[i];if(!t||t.used)return;state.target={type,i};state.selectedCatch=[];render()}
function toggleDrawn(i){if(!state.target||state.target.type!=='boat')return;const boat=state.boats[state.target.i],cap=boat.catch+(hasUp('crew')&&!state.crewUsed?1:0),at=state.selectedCatch.indexOf(i);if(at>=0)state.selectedCatch.splice(at,1);else if(state.selectedCatch.length<cap)state.selectedCatch.push(i);render()}
function placeDraw(){if(!state.target||!state.drawn.length)return;if(state.target.type==='water'){state.openWater.deep.push(...state.drawn);state.openWater.used=true;log('뽑은 토큰을 외해에 배치');state.drawn=[];state.target=null;afterSeaPlacement();return}const boat=state.boats[state.target.i],cap=boat.catch+(hasUp('crew')&&!state.crewUsed?1:0);if(state.selectedCatch.length!==cap)return alert(`이 보트의 어획 구역에는 정확히 ${cap}개를 선택해야 합니다.`);const set=new Set(state.selectedCatch),catchTokens=[],deep=[];state.drawn.forEach((t,i)=>(set.has(i)?catchTokens:deep).push(t));boat.catchTokens.push(...catchTokens);boat.deep.push(...deep);boat.used=true;if(cap>boat.catch&&hasUp('crew'))state.crewUsed=true;log(`${boat.name}: 어획 ${catchTokens.length} / 심해 ${deep.length}`);state.drawn=[];state.selectedCatch=[];state.target=null;afterSeaPlacement()}
function afterSeaPlacement(){if(targets().every(x=>x.used))beginLand();save();render()}
function beginLand(){state.phase='land';const fresh=state.boats.flatMap(b=>(b.catchTokens||[]).filter(t=>t!=='water'));state.heldFish=[...(state.storedFish||[]),...fresh];state.storedFish=[];for(const b of state.boats)b.catchTokens=(b.catchTokens||[]).filter(t=>t==='water');log('육지 단계 시작');save();render()}
function fishCounts(){return countArr(state.heldFish)}
function canPayReq(req){const c=fishCounts();return Object.entries(req).every(([t,n])=>(c[t]||0)>=n)}
function removeFish(req,{keepMarketMarker=false}={}){const removed=[];for(const[t,n]of Object.entries(req))for(let k=0;k<n;k++){const i=state.heldFish.indexOf(t);if(i>=0){state.heldFish.splice(i,1);removed.push(t)}}const marker=keepMarketMarker?removed.shift()||null:null;for(const t of removed)state.general[t]=(state.general[t]||0)+1;return marker}
function orderUnlocked(o){if(o.done)return false;return !state.orders.some(x=>x.row===o.row&&x.id<o.id&&!x.done)}
function sellOrder(id){if(state.phase!=='land'||state.over)return;const o=state.orders[id];if(!o||o.done||!orderUnlocked(o))return alert('1월 시장은 각 행을 왼쪽에서 오른쪽으로 채워야 합니다.');if(!canPayReq(o.req))return alert('이번 라운드 어획물이 부족합니다.');o.marker=removeFish(o.req,{keepMarketMarker:true});o.done=true;let gain=o.money;state.salesThisRound++;if(hasUp('marketboost')&&state.salesThisRound===1)gain++;if(hasUp('broker')&&state.salesThisRound===2)gain++;const n=Object.values(o.req).reduce((a,b)=>a+b,0);if(hasUp('canner')&&n>=3)gain++;state.money+=gain;log(`콘세르바스 판매 +€${gain}`);save();render()}
function costText(c){if(c.mode==='same')return `같은 어종 ${c.n}개`;if(c.mode==='different')return `서로 다른 어종 ${c.n}개`;return `아무 어종 ${c.n}개`}
function chooseFishForCost(cost){const c=fishCounts(),fish=TYPES.filter(t=>t!=='water'&&(c[t]||0)>0);if(cost.mode==='any')return state.heldFish.filter(t=>t!=='water').slice(0,cost.n);if(cost.mode==='same'){const t=fish.find(t=>(c[t]||0)>=cost.n);return t?Array(cost.n).fill(t):null}if(cost.mode==='different'){if(fish.length<cost.n)return null;return fish.slice(0,cost.n)}return null}
function buyUpgrade(i){if(state.phase!=='land')return;const u=state.upgradeMarket[i];if(!u)return;const paid=chooseFishForCost(u.cost);if(!paid)return alert(`비용을 낼 수 없습니다: ${costText(u.cost)}`);for(const t of paid){const idx=state.heldFish.indexOf(t);state.heldFish.splice(idx,1);state.general[t]++}state.upgrades.push(u);state.upgradeMarket.splice(i,1);state.boughtUpgradeThisRound=true;log(`업그레이드 구매: ${u.name}`);save();render()}
function buyBoat(i){if(state.phase!=='land')return;const b=state.boatMarket[i];if(!b)return;let cost=Math.max(0,b.buy-(hasUp('cooperative')?1:0));if(state.money<cost)return alert('돈이 부족합니다.');state.money-=cost;state.boatMarket.splice(i,1);state.boats.push({...b,boughtRound:state.round,used:true,catchTokens:[],deep:[]});state.boughtBoatIds.push(b.id);state.boughtBoatThisRound=true;log(`새 보트 ${b.name} 구매 -€${cost}`);save();render()}
function useDeepNet(){if(!hasUp('deepnet')||state.deepnetUsed||state.phase!=='land')return;const deep=allDeep();const t=deep.find(x=>x!=='water');if(!t)return alert('심해에 옮길 물고기가 없습니다.');let removed=false;for(const zone of [state.openWater,...state.boats]){const a=zone.deep;const i=a.indexOf(t);if(i>=0){a.splice(i,1);removed=true;break}}if(removed){state.heldFish.push(t);state.deepnetUsed=true;log(`심해 그물: ${KOR[t]} 1개를 어획으로 이동`);save();render()}}
function endLand(){if(state.phase!=='land')return;state.phase='endday';save();render()}
function endDay(){if(state.phase!=='endday'||state.over)return;if(hasUp('coldstorage')&&state.heldFish.length){const t=state.heldFish.shift();state.storedFish=[t];log(`냉장 창고: ${KOR[t]} 1개 보관`)}else state.storedFish=[];for(const t of state.heldFish)state.general[t]=(state.general[t]||0)+1;state.heldFish=[];for(const b of state.boats){for(const t of (b.catchTokens||[])){if(t==='water')state.bag.push(t);else state.general[t]=(state.general[t]||0)+1}b.catchTokens=[]}
 // refresh markets
 if(!state.boughtBoatThisRound){state.boatDeck.push(...state.boatMarket);state.boatDeck=shuffle(state.boatDeck);state.boatMarket=[]}while(state.boatMarket.length<3&&state.boatDeck.length)state.boatMarket.push(state.boatDeck.pop());if(!state.boatDeck.length){state.boatDeck=shuffle(BOATS.filter(b=>!state.boats.some(x=>x.id===b.id)&&!state.boatMarket.some(x=>x.id===b.id)))}
 if(!state.boughtUpgradeThisRound){state.upgradeDeck.push(...state.upgradeMarket);state.upgradeDeck=shuffle(state.upgradeDeck);state.upgradeMarket=[]}while(state.upgradeMarket.length<3&&state.upgradeDeck.length)state.upgradeMarket.push(state.upgradeDeck.pop());
 // upkeep
 let upkeep=state.boats.filter(b=>b.boughtRound!==state.round).reduce((a,b)=>a+b.upkeep,0);if(hasUp('efficient'))upkeep=Math.max(0,upkeep-1);if(upkeep>state.money){let need=upkeep-state.money;state.money=0;const candidates=state.boats.filter(b=>b.boughtRound!==state.round).sort((a,b)=>b.upkeep-a.upkeep);while(need>0&&candidates.length){const rm=candidates.shift();const idx=state.boats.findIndex(b=>b.id===rm.id);if(idx>=0){state.boats.splice(idx,1);need=Math.max(0,need-rm.upkeep);log(`유지비 부족: ${rm.name} 버림`)}}}else state.money-=upkeep;log(`보트 유지비 -€${upkeep}`);
 // spawn deep
 const deep=allDeep(),dc=countArr(deep);for(const t of TYPES.filter(x=>x!=='water')){const n=dc[t]||0;if(n>=2){const spawn=Math.min(n-1,state.general[t]||0);for(let i=0;i<spawn;i++){deep.push(t);state.general[t]--}if(spawn)log(`${KOR[t]} 산란 +${spawn}`)}}state.bag.push(...deep);state.bag=shuffle(state.bag);state.openWater.deep=[];state.boats.forEach(b=>{b.deep=[]});
 if(state.round>=MONTH.rounds){evaluate();save();render();return}state.round++;state.phase='sea';state.openWater.used=false;state.boats.forEach(b=>{b.used=false;b.catchTokens=[];b.deep=[]});state.boughtBoatThisRound=false;state.boughtUpgradeThisRound=false;state.rerollUsed=false;state.deepnetUsed=false;state.crewUsed=false;state.filterUsed=false;state.salesThisRound=0;state.boughtBoatIds=[];log('새 라운드 시작');save();render()}
function evaluate(){const c=bagCounts(),bonus=hasUp('preserver')?1:0;const moneyOK=state.money>=MONTH.goal.money,sardine=(c.sardine||0)+bonus>=MONTH.goal.sardine,scallop=(c.scallop||0)+bonus>=MONTH.goal.scallop;state.over=true;state.phase='done';state.win=moneyOK&&sardine&&scallop;state.result={moneyOK,sardine,scallop,counts:c};log(state.win?'1월 목표 달성!':'1월 목표 미달')}
function boatHtml(b,i,market=false){if(market)return `<button class="shop-card" data-buy-boat="${i}"><h4>🚤 ${b.name}</h4><div class="cost">구매 €${b.buy} · 유지 €${b.upkeep}</div><p>어획량 ${b.catch}</p></button>`;return `<div class="boat ${b.used?'used':''} ${b.boughtRound===state.round?'new':''}"><div class="boat-head"><div><div class="boat-name">🚤 ${b.name}</div><div class="boat-meta">어획 ${b.catch} · 유지 €${b.upkeep}${b.boughtRound===state.round?' · 이번 라운드 구매':''}</div></div><span class="pill ${b.used?'':'sea'}">${b.used?'배치 완료':'미배치'}</span></div><div class="zones"><div class="zone catch"><div class="zone-title">어획</div><div class="tokens">${(b.catchTokens||[]).map(t=>tokenHtml(t)).join('')}</div></div><div class="zone deep"><div class="zone-title">심해</div><div class="tokens">${(b.deep||[]).map(t=>tokenHtml(t)).join('')}</div></div></div>${state.phase==='sea'&&state.drawn.length&&!b.used?`<button class="btn small primary" data-target-boat="${i}" style="margin-top:7px">이 보트에 배치</button>`:''}</div>`}
function orderHtml(o){const unlocked=orderUnlocked(o);return `<button class="order ${o.done?'done':''} ${!unlocked&&!o.done?'locked':''}" data-order="${o.id}" ${state.phase!=='land'||o.done||!unlocked?'disabled':''}><b>${o.done?'✓ 판매 완료':`€${o.money}`}</b><div class="need">${o.done&&o.marker?miniToken(o.marker):Object.entries(o.req).flatMap(([t,n])=>Array.from({length:n},()=>miniToken(t))).join('')}</div><span class="hint">${o.row+1}행 ${o.id%4+1}칸</span></button>`}
function upgradeHtml(u,i){return `<button class="shop-card" data-buy-up="${i}"><h4>⚙ ${u.name}</h4><div class="cost">${costText(u.cost)}</div><p>${u.text}</p></button>`}
function drawPanel(){if(!state.drawn.length)return `<div class="draw-box"><b>🎣 바다 주머니에서 토큰 뽑기</b><p class="hint">각 보트와 외해에는 라운드마다 한 번씩 토큰 묶음을 배치합니다.</p><button class="btn primary" id="drawBtn">${hasUp('secondary')?'8':'5'}개 뽑기</button></div>`;const target=state.target?.type==='boat'?state.boats[state.target.i]:state.target?.type==='water'?state.openWater:null,cap=state.target?.type==='boat'?(target.catch+(hasUp('crew')&&!state.crewUsed?1:0)):0;return `<div class="draw-box"><b>이번 뽑기</b><div class="tokens">${state.drawn.map((t,i)=>tokenHtml(t,state.selectedCatch.includes(i),i)).join('')}</div><div class="row">${targets().filter(x=>!x.used).map(x=>`<button class="btn small ${state.target?.type===x.type&&state.target?.i===x.i?'primary':''}" data-target="${x.type}:${x.i}">${x.name}${x.type==='boat'?` · 어획 ${x.catch}`:''}</button>`).join('')}</div>${state.target?.type==='boat'?`<p class="hint">어획 구역으로 보낼 토큰을 정확히 ${cap}개 선택하세요. 나머지는 심해로 갑니다.</p>`:state.target?.type==='water'?'<p class="hint">외해에 놓으면 전부 심해로 갑니다.</p>':'<p class="hint">배치할 보트 또는 외해를 먼저 선택하세요.</p>'}<div class="row"><button class="btn primary" id="placeDraw" ${!state.target||state.target.type==='boat'&&state.selectedCatch.length!==cap?'disabled':''}>배치 확정</button>${hasUp('fishfinder')&&!state.rerollUsed?'<button class="btn" id="rerollBtn">물고기 탐지기 · 재뽑기</button>':''}</div></div>`}
function objectiveHtml(){const c=bagCounts(),bonus=hasUp('preserver')?1:0;return `<div class="objective"><b>1월 목표</b><div class="checklist"><div class="check"><span>최종 자금</span><b>€${state.money} / €${MONTH.goal.money}</b></div><div class="check"><span>바다의 정어리</span><b>${(c.sardine||0)+bonus} / ${MONTH.goal.sardine}</b></div><div class="check"><span>바다의 가리비</span><b>${(c.scallop||0)+bonus} / ${MONTH.goal.scallop}</b></div></div><p class="hint">지속 가능성 목표는 마지막 라운드의 산란과 유지비 처리 후 판정합니다.</p></div>`}
function setupHtml(){return `<div class="setup card"><h1>🐟 Conservas · 1월</h1><p class="hint">규칙서의 1월 예시를 바탕으로 한 BoardMate ALPHA 시나리오입니다. 시작 주머니: 정어리 5 · 가리비 5 · 물 10, 시작 자금 €10.</p><h2>첫 보트 선택</h2><div class="choice-grid">${state.boatOffer.map(b=>`<button class="choice" data-starter="${b.id}"><h3>🚤 ${b.name}</h3><p>어획량 ${b.catch} · 구매 가치 €${b.buy} · 유지비 €${b.upkeep}</p></button>`).join('')}</div><p class="hint" style="margin-top:12px">실물 카드 이미지가 아니라 규칙 구조를 코드로 재구성했습니다. 보트/업그레이드 카드 세부 구성은 BoardMate용 구현 세트입니다.</p></div>`}
function resultHtml(){if(!state.over)return'';const r=state.result||{};return `<div class="card result ${state.win?'':'lose'}"><h2>${state.win?'🏆 1월 목표 달성':'🌊 목표 미달'}</h2><p>${state.failReason||`최종 자금 €${state.money} · 정어리 ${r.counts?.sardine||0} · 가리비 ${r.counts?.scallop||0}`}</p><button class="btn primary" id="againBtn">다시 도전</button></div>`}
function render(){if(state.phase==='setup'){app.innerHTML=setupHtml();bind();return}const counts=bagCounts(),fish=fishCounts();app.innerHTML=`<div class="card status"><div><h1>🐟 Conservas <span class="pill sea">1인플 ALPHA</span></h1><div class="sub">${MONTH.name} 시나리오 · 라운드 ${state.round}/${MONTH.rounds} · ${MONTH.note}</div></div><div class="row"><span class="pill money">€${state.money}</span><span class="pill">주머니 ${state.bag.length}</span></div><div class="phasebar" style="width:100%"><div class="phase ${state.phase==='sea'?'active':state.phase!=='sea'?'done':''}">🌊 바다</div><div class="phase ${state.phase==='land'?'active':['endday','done'].includes(state.phase)?'done':''}">🏘 육지</div><div class="phase ${state.phase==='endday'?'active':state.phase==='done'?'done':''}">🌅 하루의 끝</div></div></div>${resultHtml()}<div class="layout"><section class="stack"><div class="card"><div class="section-title"><h2>🌊 바다</h2><div class="bag-counts">${TYPES.map(t=>`<span>${KOR[t]} ${counts[t]||0}</span>`).join('')}</div></div>${state.phase==='sea'?drawPanel():''}<div class="sea-board" style="margin-top:8px"><div class="boat-grid">${state.boats.map((b,i)=>boatHtml(b,i)).join('')}</div><div class="open-water"><div class="boat-head"><b>🌐 외해</b><span class="pill ${state.openWater.used?'':'sea'}">${state.openWater.used?'배치 완료':'미배치'}</span></div><div class="zone deep" style="margin-top:7px"><div class="zone-title">심해</div><div class="tokens">${state.openWater.deep.map(t=>tokenHtml(t)).join('')}</div></div>${state.phase==='sea'&&state.drawn.length&&!state.openWater.used?'<button class="btn small primary" data-target="water:-1" style="margin-top:7px">외해에 배치</button>':''}</div></div></div>${state.phase==='land'?`<div class="card"><div class="section-title"><h2>🏘 육지 · 이번 어획</h2><span class="pill">물고기 ${state.heldFish.length}개</span></div><div class="tokens">${state.heldFish.map(t=>tokenHtml(t)).join('')||'<span class="hint">판매/구매에 쓸 물고기가 없습니다.</span>'}</div>${hasUp('deepnet')&&!state.deepnetUsed?'<button class="btn small" id="deepNetBtn" style="margin-top:10px">심해 그물 사용</button>':''}</div><div class="card"><div class="section-title"><h2>🥫 1월 시장</h2><span class="pill">왼쪽 → 오른쪽</span></div><div class="market-orders">${state.orders.map(orderHtml).join('')}</div></div><div class="card"><div class="section-title"><h2>⚙ 업그레이드</h2><span class="pill">3장 공개</span></div><div class="shop">${state.upgradeMarket.map(upgradeHtml).join('')||'<span class="hint">카드 없음</span>'}</div></div><div class="card"><div class="section-title"><h2>🚤 새 보트</h2><span class="pill">3장 공개</span></div><div class="shop">${state.boatMarket.map((b,i)=>boatHtml(b,i,true)).join('')||'<span class="hint">카드 없음</span>'}</div><div class="row" style="margin-top:10px"><button class="btn primary" id="endLandBtn">육지 단계 종료</button></div></div>`:''}${state.phase==='endday'?`<div class="card"><h2>🌅 하루의 끝</h2><p class="hint">남은 어획 정리 → 공개 카드 보충 → 유지비 → 심해 물고기 산란 → 다음 라운드 순서로 처리합니다.</p><button class="btn gold" id="endDayBtn">하루 마감 처리</button></div>`:''}</section><aside class="stack"><div class="sticky stack">${objectiveHtml()}<div class="card"><h3>보유 업그레이드</h3><div class="owned">${state.upgrades.map(u=>`<span title="${u.text}">⚙ ${u.name}</span>`).join('')||'<span class="hint">없음</span>'}</div></div><div class="card"><h3>보트</h3><div class="owned">${state.boats.map(b=>`<span>🚤 ${b.name} · 어획 ${b.catch} · 유지 €${b.upkeep}</span>`).join('')}</div></div><div class="card"><h3>진행 기록</h3><div class="log">${state.logs.map(x=>`<div>${x}</div>`).join('')}</div></div><div class="card"><h3>규칙 핵심</h3><p class="hint">바다에서 각 보트와 외해에 한 번씩 토큰을 배치합니다. 육지에서는 어획 물고기로 시장 주문을 채우거나 업그레이드를 사고, 돈으로 보트를 삽니다. 하루 끝에는 유지비를 내고 심해의 같은 어종이 2개 이상이면 첫 1개를 제외한 수만큼 번식합니다.</p></div></div></aside></div>`;bind()}
function bind(){$('#resetBtn')?.addEventListener('click',reset);$('#rulesBtn')?.addEventListener('click',showRules);document.querySelectorAll('[data-starter]').forEach(b=>b.onclick=()=>chooseStarter(b.dataset.starter));$('#drawBtn')?.addEventListener('click',drawTokens);$('#rerollBtn')?.addEventListener('click',reroll);document.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{const[t,i]=b.dataset.target.split(':');pickTarget(t,Number(i))});document.querySelectorAll('[data-target-boat]').forEach(b=>b.onclick=()=>pickTarget('boat',Number(b.dataset.targetBoat)));document.querySelectorAll('[data-drawn]').forEach(b=>b.onclick=()=>toggleDrawn(Number(b.dataset.drawn)));$('#placeDraw')?.addEventListener('click',placeDraw);document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>sellOrder(Number(b.dataset.order)));document.querySelectorAll('[data-buy-up]').forEach(b=>b.onclick=()=>buyUpgrade(Number(b.dataset.buyUp)));document.querySelectorAll('[data-buy-boat]').forEach(b=>b.onclick=()=>buyBoat(Number(b.dataset.buyBoat)));$('#deepNetBtn')?.addEventListener('click',useDeepNet);$('#endLandBtn')?.addEventListener('click',endLand);$('#endDayBtn')?.addEventListener('click',endDay);$('#againBtn')?.addEventListener('click',()=>{state=newState();save();render()})}
function showRules(){modal(`<h2>Conservas · BoardMate 규칙 요약</h2><div class="checklist"><div class="check"><b>1. 바다</b><span>주머니에서 토큰을 뽑아 각 보트/외해에 한 번씩 배치</span></div><div class="check"><b>2. 육지</b><span>어획 물고기를 시장·업그레이드에 사용, 돈으로 보트 구매</span></div><div class="check"><b>3. 하루의 끝</b><span>유지비 → 심해 물고기 번식 → 주머니로 복귀</span></div><div class="check"><b>1월 승리</b><span>€40 이상 + 바다 정어리 4 이상 + 가리비 4 이상</span></div></div><p class="hint">현재 BoardMate 구현은 규칙서의 1월 예시와 핵심 시스템을 우선 구현했습니다. 시장 주문·보트·업그레이드 전체 카드 데이터는 규칙서에 모두 수록되어 있지 않아 BoardMate용 코드 세트로 구성했습니다.</p><div class="row"><button class="btn primary" data-close>닫기</button></div>`,m=>m.querySelector('[data-close]').onclick=closeModal)}
function modal(html,onMount){closeModal();const ov=document.createElement('div');ov.className='overlay';ov.id='overlay';ov.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(ov);onMount?.(ov.querySelector('.modal'));ov.onclick=e=>{if(e.target===ov)closeModal()}}
function closeModal(){$('#overlay')?.remove()}
document.getElementById('rulesBtn').onclick=showRules;document.getElementById('resetBtn').onclick=reset;render();
</script>
</body>
</html>
