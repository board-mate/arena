<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BoardMate Online · 에어 랜드 & 씨</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<style>
/* ── 토큰 ── */
:root {
  --bg:      #1c1f1a;
  --bg2:     #252820;
  --bg3:     #2e3228;
  --border:  #404535;
  --air:     #4a6a7c;
  --air-bg:  #1a2a32;
  --land:    #6b5a2e;
  --land-bg: #28220e;
  --sea:     #2e6b4a;
  --sea-bg:  #0e2818;
  --gold:    #d4a847;
  --red:     #c0392b;
  --text:    #e8e4d8;
  --text2:   #a09880;
  --muted:   #5a5848;
  --instant: #e8a020;
  --ongoing: #5ab8d8;
  --radius:  10px;
  font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif;
  color: var(--text); background: var(--bg);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text)}
button{font:inherit;cursor:pointer;border:none;border-radius:7px}

/* ── 상단 바 ── */
.bar{position:sticky;top:0;z-index:40;background:#111210;padding:9px 14px;
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--border)}
.bar a{color:var(--text);text-decoration:none;font-weight:700;font-size:13px}
#bar-title{font-weight:900;font-size:14px;color:var(--gold);letter-spacing:.03em}
#sync{font-size:10px;color:var(--muted)}

/* ── 레이아웃 ── */
.wrap{width:min(1040px,calc(100% - 20px));margin:14px auto}
.card{background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;margin-bottom:10px}

/* ── 버튼 ── */
.btn{padding:9px 16px;font-weight:800;font-size:12px;border-radius:7px}
.btn-primary{background:#5a7a3a;color:#e8f0d8}
.btn-gold{background:var(--gold);color:#1a1200}
.btn-red{background:#7a2a1a;color:#f8c0b0;border:1px solid #a03a28}
.btn-ghost{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.btn-air{background:#2a4a5c;color:#c8e0ec;border:1px solid var(--air)}
.btn-land{background:#3a2e10;color:#e0d0a0;border:1px solid var(--land)}
.btn-sea{background:#103a22;color:#a0e0c0;border:1px solid var(--sea)}
.btn-facedown{background:#2a2a28;color:var(--text2);border:1px solid #444}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ── 점수 ── */
.score-bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.vp-box{background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;
  padding:8px 14px;text-align:center;min-width:80px}
.vp-num{font-size:28px;font-weight:900;color:var(--gold);line-height:1}
.vp-label{font-size:10px;color:var(--text2);margin-top:2px}
.vp-bar-wrap{flex:1;min-width:120px}
.vp-bar-bg{height:8px;background:#1a1a18;border-radius:4px;overflow:hidden;margin-top:4px}
.vp-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold),#e8c050);transition:width .4s}

/* ── 전장 레이아웃 ── */
.theaters-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.theater-col{border-radius:var(--radius);overflow:hidden}
.theater-col.air   .theater-header{background:#1e3a4a;border-bottom:2px solid var(--air)}
.theater-col.land  .theater-header{background:#2a1e08;border-bottom:2px solid var(--land)}
.theater-col.sea   .theater-header{background:#0a2218;border-bottom:2px solid var(--sea)}
.theater-header{padding:7px 10px;text-align:center}
.theater-name{font-weight:900;font-size:15px;letter-spacing:.08em}
.theater-col.air  .theater-name{color:#7ab8d8}
.theater-col.land .theater-name{color:#d8b840}
.theater-col.sea  .theater-name{color:#60c890}
.theater-ctrl{font-size:10px;margin-top:2px;color:var(--text2)}
.theater-ctrl.i-win{color:var(--gold)}
.theater-ctrl.opp-win{color:#e07070}
.theater-ctrl.tie{color:var(--muted)}
.theater-str{display:flex;justify-content:space-between;padding:4px 8px;
  font-size:11px;font-weight:700;background:#111210}
.opp-side{background:var(--bg3);min-height:54px;padding:6px;
  display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.my-side{background:var(--bg2);min-height:54px;padding:6px;
  display:flex;flex-wrap:wrap;gap:4px}

/* ── 필드 카드 ── */
.field-card{border-radius:7px;padding:6px 8px;min-width:54px;max-width:72px;
  font-size:10px;cursor:default;position:relative;text-align:center;
  border:1.5px solid transparent;transition:border-color .15s,transform .15s}
.field-card .fc-str{font-size:18px;font-weight:900;line-height:1}
.field-card .fc-name{font-size:9px;color:var(--text2);line-height:1.2}
.field-card .fc-type{font-size:8px;margin-top:2px}
.field-card.air-card {background:var(--air-bg);border-color:#2a4a5c;color:#9acce0}
.field-card.land-card{background:var(--land-bg);border-color:#5a4018;color:#d8c080}
.field-card.sea-card {background:var(--sea-bg);border-color:#1a5030;color:#80d0a8}
.field-card.face-down{background:#1e1e1c;border-color:#333;color:var(--muted)}
.field-card.face-down .fc-str{color:#555}
.field-card.clickable{cursor:pointer}
.field-card.clickable:hover{transform:translateY(-3px);border-color:var(--gold)!important}
.field-card.selected-target{border-color:var(--red)!important;box-shadow:0 0 8px #c0392b66}
.field-card.selected-src{border-color:var(--gold)!important;box-shadow:0 0 8px #d4a84766}
.ability-sym{position:absolute;top:3px;right:3px;font-size:9px}

/* ── 손패 ── */
.hand-area{background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px;margin-bottom:10px}
.hand-area h3{font-size:12px;color:var(--text2);margin-bottom:8px;font-weight:700}
.hand-cards{display:flex;gap:8px;flex-wrap:wrap}
.hand-card{border-radius:9px;padding:9px 10px;min-width:70px;cursor:pointer;
  border:2px solid transparent;transition:all .15s;position:relative}
.hand-card .hc-str{font-size:22px;font-weight:900;line-height:1}
.hand-card .hc-name{font-size:10px;font-weight:700;margin:3px 0 1px;line-height:1.2}
.hand-card .hc-ability{font-size:9px;line-height:1.4;color:var(--text2)}
.hand-card .hc-type{font-size:9px;margin-top:4px;opacity:.7}
.hand-card.air-card {background:#1e3a4a;border-color:#2a4a5c;color:#9acce0}
.hand-card.land-card{background:#2a1e08;border-color:#5a4018;color:#d8c080}
.hand-card.sea-card {background:#0a2218;border-color:#1a5030;color:#80d0a8}
.hand-card.selected{border-color:var(--gold)!important;transform:translateY(-6px);box-shadow:0 6px 16px #d4a84744}
.hand-card:hover:not(.selected){border-color:#666;transform:translateY(-2px)}
.hc-instant{color:var(--instant)}
.hc-ongoing{color:var(--ongoing)}
.sym{font-size:12px;margin-right:3px}

/* ── 행동 패널 ── */
.action-box{background:#1a1e14;border:2px solid #3a4a2a;border-radius:var(--radius);
  padding:12px;margin-bottom:10px}
.action-box h3{color:var(--gold);margin-bottom:8px;font-size:13px;font-weight:900}
.action-hint{font-size:11px;color:var(--text2);margin-top:6px;line-height:1.5}

/* ── 모달 오버레이 ── */
.modal-overlay{position:fixed;inset:0;background:#000000bb;
  display:flex;align-items:center;justify-content:center;z-index:100}
.modal-box{background:var(--bg2);border:2px solid var(--border);
  border-radius:var(--radius);padding:20px;max-width:400px;width:90%;max-height:80vh;overflow-y:auto}
.modal-box h3{color:var(--gold);margin-bottom:10px;font-size:14px}
.modal-box p{font-size:12px;color:var(--text2);margin-bottom:12px;line-height:1.6}
.modal-grid{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

/* ── 철수 테이블 ── */
.withdraw-table{font-size:11px;border-collapse:collapse;width:100%;margin:8px 0}
.withdraw-table th{background:var(--bg3);color:var(--text2);padding:5px 8px;text-align:left;border:1px solid var(--border)}
.withdraw-table td{padding:4px 8px;border:1px solid var(--border);text-align:center}
.withdraw-table tr.highlight td{color:var(--gold);font-weight:700}

/* ── 로그 ── */
.log-box{max-height:130px;overflow-y:auto;background:#0d0e0b;
  border-radius:8px;padding:8px;font-size:10px;color:var(--text2);line-height:1.7}
.log-box div::before{content:'▸ ';color:var(--muted)}

/* ── 결과 ── */
.result-panel{text-align:center;padding:20px;border-radius:var(--radius);margin-bottom:10px}
.result-panel.win{background:#0e1e0a;border:2px solid var(--gold)}
.result-panel.lose{background:#1e0a0a;border:2px solid var(--red)}
.result-panel h2{font-size:24px;margin-bottom:6px}
.result-panel p{font-size:12px;color:var(--text2)}

/* ── 전투 결과 알림 ── */
.battle-result{text-align:center;padding:14px;border-radius:8px;margin:8px 0}
.battle-result.b-win{background:#0a1e08;border:1px solid #4a7a2a}
.battle-result.b-lose{background:#1e0808;border:1px solid #7a2a2a}

/* ── 설정 화면 ── */
.setup{text-align:center;padding:24px}
.setup h2{font-size:22px;color:var(--gold);margin-bottom:8px}
.setup p{color:var(--text2);font-size:12px;line-height:1.7;margin-bottom:14px}

/* ── 뱃지 ── */
.badge{display:inline-block;font-size:10px;font-weight:800;
  padding:2px 7px;border-radius:999px;vertical-align:middle}
.badge-air{background:#1e3a4a;color:#7ab8d8;border:1px solid var(--air)}
.badge-land{background:#2a1e08;color:#d8b840;border:1px solid var(--land)}
.badge-sea{background:#0a2218;color:#60c890;border:1px solid var(--sea)}
.badge-instant{background:#2a1800;color:var(--instant)}
.badge-ongoing{background:#001828;color:var(--ongoing)}
.badge-me{background:#2a2a14;color:var(--gold);border:1px solid #555}

/* ── 상태 알림 ── */
.notice{background:var(--bg3);border:1px solid var(--border);
  border-radius:8px;padding:8px 12px;font-size:11px;color:var(--text2);
  line-height:1.6;margin:6px 0}

@media(max-width:600px){
  .theaters-wrap{grid-template-columns:1fr;gap:6px}
  .hand-card{min-width:60px}
}
</style>
</head>

<header class="bar">

  </span>
  <span id="bar-title">✈️ 에어 랜드 &amp; 씨</span>

</header>

<main class="wrap">
  <div id="app">불러오는 중…</div>

<!-- 모달 -->
<div id="modal" style="display:none"></div>

<script type="module">
import {
  configured, roomId, getMe, loadRoom, loadState, saveState,
  startStatePoll, esc, showFatal, endPanel
} from './multi-common.js?v=11.4.57';

if (!configured() || !roomId) showFatal('Supabase 설정 또는 room 주소가 없습니다.');

// ═══════════════════════════════════════════════════════
// 카드 데이터 (18장)
// ═══════════════════════════════════════════════════════
const CARDS = [
  // AIR (6장)
  { id:'air1',  type:'air',  str:1, name:'지원',     kor:'지원',     ability:'∞ 지원: 인접한 각 전장에서 힘+3을 얻는다.',      kind:'ongoing',  tag:'support'     },
  { id:'air2',  type:'air',  str:2, name:'공수',     kor:'공수',     ability:'⚡ 공수: 다음 차례에 전장과 맞지 않는 카드를 낼 수 있다.', kind:'instant', tag:'airdrop'     },
  { id:'air3',  type:'air',  str:3, name:'기동',     kor:'기동',     ability:'⚡ 기동: 인접한 전장에서 카드 1장을 뒤집는다.',   kind:'instant',  tag:'maneuver'    },
  { id:'air4',  type:'air',  str:4, name:'비행장',   kor:'비행장',   ability:'∞ 비행장: 힘 3 이하의 카드를 맞지 않는 전장에 낼 수 있다.', kind:'ongoing', tag:'aerodrome'  },
  { id:'air5',  type:'air',  str:5, name:'봉쇄 전략',kor:'봉쇄 전략',ability:'∞ 봉쇄: 누군가 뒷면으로 카드를 내면 그 카드를 즉시 버린다.', kind:'ongoing', tag:'containment'},
  { id:'air6',  type:'air',  str:6, name:'무거운 폭격기',kor:'폭격기', ability:null, kind:null, tag:null },
  // LAND (6장)
  { id:'land1', type:'land', str:1, name:'증원',     kor:'증원',     ability:'⚡ 증원: 덱 맨 위 카드를 확인하고 인접한 전장에 뒷면으로 낼 수 있다.', kind:'instant', tag:'reinforce' },
  { id:'land2', type:'land', str:2, name:'매복',     kor:'매복',     ability:'⚡ 매복: 원하는 전장에서 카드 1장을 뒤집는다.',  kind:'instant',  tag:'ambush'      },
  { id:'land3', type:'land', str:3, name:'기동',     kor:'기동',     ability:'⚡ 기동: 인접한 전장에서 카드 1장을 뒤집는다.',  kind:'instant',  tag:'maneuver'    },
  { id:'land4', type:'land', str:4, name:'재배치',   kor:'재배치',   ability:'⚡ 재배치: 뒷면 카드 1장을 손으로 회수. 회수했으면 추가 차례를 얻는다.', kind:'instant', tag:'redeploy'  },
  { id:'land5', type:'land', str:5, name:'해상 봉쇄',kor:'해상 봉쇄',ability:'∞ 해상 봉쇄: 인접 전장에 카드가 3장 이상 있을 때 새 카드가 놓이면 효과 없이 버린다.', kind:'ongoing', tag:'blockade'},
  { id:'land6', type:'land', str:6, name:'무거운 탱크',kor:'탱크',   ability:null, kind:null, tag:null },
  // SEA (6장)
  { id:'sea1',  type:'sea',  str:1, name:'이동',     kor:'이동',     ability:'⚡ 이동: 카드 1장을 다른 전장으로 이동한다.',     kind:'instant',  tag:'transport'   },
  { id:'sea2',  type:'sea',  str:2, name:'확대',     kor:'확대',     ability:'∞ 확대: 뒷면 카드 힘이 모두 4가 된다.',         kind:'ongoing',  tag:'escalation'  },
  { id:'sea3',  type:'sea',  str:3, name:'기동',     kor:'기동',     ability:'⚡ 기동: 인접한 전장에서 카드 1장을 뒤집는다.',  kind:'instant',  tag:'maneuver'    },
  { id:'sea4',  type:'sea',  str:4, name:'엄호 사격',kor:'엄호 사격',ability:'∞ 엄호 사격: 이 카드 아래 덮인 모든 카드의 힘이 4가 된다.', kind:'ongoing', tag:'coverfire'  },
  { id:'sea5',  type:'sea',  str:5, name:'방해',     kor:'방해',     ability:'⚡ 방해: 상대가 자신의 카드 1장을 선택해 뒤집고, 그 다음 당신도 1장을 뒤집는다.', kind:'instant', tag:'disrupt'},
  { id:'sea6',  type:'sea',  str:6, name:'초전함',   kor:'초전함',   ability:null, kind:null, tag:null },
];

const CARD_MAP = Object.fromEntries(CARDS.map(c => [c.id, c]));

// 1P 철수표 (cards_left → vp to opponent)
const WITHDRAW_VP_P1 = { 6:2, 5:2, 4:2, 3:3, 2:3, 1:4, 0:6 };
const WITHDRAW_VP_P2 = { 6:2, 5:2, 4:3, 3:3, 2:4, 1:6, 0:6 };

function getWithdrawVP(isFirstPlayer, cardsLeft) {
  const table = isFirstPlayer ? WITHDRAW_VP_P1 : WITHDRAW_VP_P2;
  for (let k = Math.min(cardsLeft, 6); k >= 0; k--) {
    if (table[k] !== undefined && k <= cardsLeft) return table[k];
  }
  // 구간 매핑
  if (isFirstPlayer) {
    if (cardsLeft >= 4) return 2;
    if (cardsLeft >= 2) return 3;
    if (cardsLeft === 1) return 4;
    return 6;
  } else {
    if (cardsLeft >= 5) return 2;
    if (cardsLeft >= 3) return 3;
    if (cardsLeft === 2) return 4;
    return 6;
  }
}

// ═══════════════════════════════════════════════════════
// 유틸
// ═══════════════════════════════════════════════════════
const clone  = x => JSON.parse(JSON.stringify(x));
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}; return a; };
const esc2   = s => String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const typeLabel = t => t==='air'?'✈ 공기':t==='land'?'🚀 육지':'⛵ 바다';
const typeCls   = t => `${t}-card`;
const typeColor = t => t==='air'?'#7ab8d8':t==='land'?'#d8b840':'#60c890';
const typeBadge = t => `<span class="badge badge-${t}">${t==='air'?'공기':t==='land'?'육지':'바다'}</span>`;

// ═══════════════════════════════════════════════════════
// 게임 상태
// ═══════════════════════════════════════════════════════
function setupState() {
  return { kind:'als-v1', setup:true, over:false };
}

const THEATER_ORDER = ['air','land','sea'];

function createGame(members) {
  const deck = shuffle(CARDS.map(c=>c.id));
  const hand0 = deck.splice(0, 6);
  const hand1 = deck.splice(0, 6);
  // 전장 순서 무작위
  const theaters = shuffle([...THEATER_ORDER]);
  return {
    kind: 'als-v1',
    setup: false,
    over: false,
    winner: null,        // seat
    // 점수
    vp: [0, 0],          // [seat0, seat1]
    // 배틀
    battleNum: 1,
    // 첫 플레이어: 0 or 1
    firstPlayer: 0,
    currentTurn: 0,      // seat (첫 플레이어부터)
    // 전장 3개: 순서 배열 (인덱스 = 위치, 값 = 'air'/'land'/'sea')
    theaters,            // [pos0, pos1, pos2]
    // 필드: { air: { 0:[{id,face},...], 1:[{id,face},...] }, land:..., sea:... }
    field: { air:{0:[],1:[]}, land:{0:[],1:[]}, sea:{0:[],1:[]} },
    // 손패
    hands: [hand0, hand1],
    // 덱 나머지
    deck,
    // 상태 플래그
    airdropNext: null,    // seat: 다음 차례 공수 가능
    extraTurn: null,      // seat: 재배치 추가 차례
    phase: 'play',        // 'play' | 'battle_end' | 'game_over'
    battleResult: null,   // { winner, vp, reason }
    // 로그
    logs: ['배틀 1 시작! 선공: Player 1'],
  };
}

// ═══════════════════════════════════════════════════════
// 전투 계산
// ═══════════════════════════════════════════════════════
function getEffectiveStr(cardEntry, field, seat) {
  const card = CARD_MAP[cardEntry.id];
  if (!cardEntry.face) {
    // 뒷면: 기본 2, 확대(escalation) 효과로 4
    let base = 2;
    // 확대: sea2 앞면이 같은 소유자 어딘가에 있으면
    if (hasOngoingFor(seat, 'escalation', field)) base = 4;
    return base;
  }
  // 앞면: 원래 힘
  return card.str;
}

function hasOngoingFor(seat, tag, field) {
  for (const th of THEATER_ORDER) {
    for (const entry of field[th][seat] || []) {
      if (!entry.face) continue;
      const c = CARD_MAP[entry.id];
      if (c.tag === tag) return true;
    }
  }
  return false;
}

function getTheaterStr(th, seat, state) {
  let total = 0;
  for (const entry of state.field[th][seat] || []) {
    let s = getEffectiveStr(entry, state.field, seat);
    // 엄호 사격(coverfire): sea4가 앞면이면 덮인 카드 힘 = 4
    // -> 위에서 덮인(covered) 카드인지 확인
    // 덮인 카드 = 인덱스가 마지막이 아닌 카드
    const arr = state.field[th][seat];
    const idx = arr.indexOf(entry);
    const isCovered = idx < arr.length - 1;
    if (isCovered) {
      // 같은 side의 어느 전장에 coverfire가 있는지
      if (hasOngoingFor(seat, 'coverfire', state.field)) s = 4;
    }
    // 지원(support): air1 앞면이면 인접 전장에서 +3
    // → 해당 전장이 air1 소유자의 전장에 인접해 있으면 +3
    // (아래에서 계산)
    total += s;
  }
  // 지원(support) 보너스
  const thIdx = state.theaters.indexOf(th);
  for (const adjSeat of [seat]) {
    for (const adjEntry of state.field[th][adjSeat] || []) {
      // 이미 합산했음, 지원은 별도 처리
    }
  }
  // 지원(support): air1이 앞면이고, 이 전장이 air1의 전장(air)에 인접한 경우 +3
  for (const supportSeat of [0, 1]) {
    // 자신 side에 support가 있고 이 전장 side가 해당 seat라면
    if (supportSeat !== seat) continue;
    const supportTh = THEATER_ORDER.find(t => {
      return (state.field[t][seat] || []).some(e => e.face && CARD_MAP[e.id].tag === 'support');
    });
    if (!supportTh) continue;
    const supportThIdx = state.theaters.indexOf(supportTh);
    const adjacent = Math.abs(thIdx - supportThIdx) === 1;
    if (adjacent && th !== supportTh) total += 3;
  }
  return total;
}

function countTheatersControlled(seat, state) {
  let count = 0;
  for (const th of THEATER_ORDER) {
    const myStr = getTheaterStr(th, seat, state);
    const oppStr = getTheaterStr(th, 1 - seat, state);
    if (myStr > oppStr) count++;
    else if (myStr === oppStr && seat === state.firstPlayer) count++; // 동점 = 선공자
  }
  return count;
}

// ═══════════════════════════════════════════════════════
// 배틀 종료
// ═══════════════════════════════════════════════════════
function resolveBattleEnd(s, withdrawingSeat, vpOverride) {
  let vpEarned, winnerSeat;
  if (withdrawingSeat !== null) {
    winnerSeat = 1 - withdrawingSeat;
    const isP1 = withdrawingSeat === s.firstPlayer;
    const cardsLeft = s.hands[withdrawingSeat].length;
    vpEarned = vpOverride ?? getWithdrawVP(isP1, cardsLeft);
  } else {
    // 모든 카드 소진
    const c0 = countTheatersControlled(0, s);
    const c1 = countTheatersControlled(1, s);
    if (c0 > c1) winnerSeat = 0;
    else if (c1 > c0) winnerSeat = 1;
    else winnerSeat = s.firstPlayer; // 동점 = 선공자
    vpEarned = 6;
  }
  s.vp[winnerSeat] += vpEarned;
  s.battleResult = { winner: winnerSeat, vp: vpEarned, reason: withdrawingSeat !== null ? '철수' : '카드 소진' };
  s.logs.unshift(`배틀 ${s.battleNum} 종료 — Player${winnerSeat+1} +${vpEarned}VP (${s.battleResult.reason})`);

  if (s.vp[winnerSeat] >= 12) {
    s.over = true;
    s.winner = winnerSeat;
    s.phase = 'game_over';
    s.logs.unshift(`🏆 Player${winnerSeat+1} 12VP 달성 — 전쟁 승리!`);
  } else {
    s.phase = 'battle_end';
  }
}

function nextBattle(s) {
  // 전장 rotate: [0→1→2→0]
  s.theaters = [s.theaters[2], s.theaters[0], s.theaters[1]];
  // 선공 교체
  s.firstPlayer = 1 - s.firstPlayer;
  s.currentTurn = s.firstPlayer;
  // 덱 재구성
  const allCards = CARDS.map(c => c.id);
  const newDeck = shuffle(allCards);
  s.hands[0] = newDeck.splice(0, 6);
  s.hands[1] = newDeck.splice(0, 6);
  s.deck = newDeck;
  // 필드 초기화
  s.field = { air:{0:[],1:[]}, land:{0:[],1:[]}, sea:{0:[],1:[]} };
  s.airdropNext = null;
  s.extraTurn = null;
  s.battleNum++;
  s.phase = 'play';
  s.battleResult = null;
  s.logs.unshift(`배틀 ${s.battleNum} 시작! 선공: Player${s.firstPlayer+1}`);
}

// ═══════════════════════════════════════════════════════
// 전역 상태
// ═══════════════════════════════════════════════════════
let me, room, members, mySeat = -1;
let state = null, revision = 0, saving = false;
// 클라이언트 UI 임시 상태
let selectedHandIdx = null; // 손패에서 선택한 카드 인덱스
let pendingAction = null;   // { type, ... } 진행 중인 능력 처리

// ═══════════════════════════════════════════════════════
// 상태 저장
// ═══════════════════════════════════════════════════════
async function mutate(fn) {
  if (saving || !state) return;
  saving = true;
  const next = clone(state);
  try {
    fn(next);
    const nr = await saveState(revision, next);
    revision = nr; state = next;
    syncLabel('저장됨');
  } catch(e) {
    syncLabel('재동기화 중…');
    const row = await loadState();
    revision = row.revision; state = row.state;
  } finally {
    saving = false;
    selectedHandIdx = null;
    pendingAction = null;
    render();
  }
}
function syncLabel(t) { document.querySelector('#sync').textContent = t; }

// ═══════════════════════════════════════════════════════
// 게임 시작
// ═══════════════════════════════════════════════════════
function startGame() {
  if (room.host_id !== me.user_id || !state.setup) return;
  mutate(s => {
    Object.keys(s).forEach(k => delete s[k]);
    Object.assign(s, createGame(members));
  });
}

// ═══════════════════════════════════════════════════════
// 카드 내기 (Deploy faceup)
// ═══════════════════════════════════════════════════════
function playFaceup(handIdx, theater) {
  if (state.currentTurn !== mySeat) return;
  const cardId = state.hands[mySeat][handIdx];
  const card = CARD_MAP[cardId];
  const canAny = state.airdropNext === mySeat ||
    (hasOngoingFor(mySeat, 'aerodrome', state.field) && card.str <= 3);
  if (!canAny && card.type !== theater) {
    alert(`이 카드(${card.kor})는 ${typeLabel(theater)} 전장에 낼 수 없습니다.`); return;
  }
  mutate(s => {
    s.hands[mySeat].splice(handIdx, 1);
    s.field[theater][mySeat].push({ id: cardId, face: true });
    s.logs.unshift(`P${mySeat+1} → [${card.kor}] 앞면으로 ${theater.toUpperCase()} 전장에 배치`);
    if (s.airdropNext === mySeat) s.airdropNext = null;
    // 봉쇄(containment) 체크: 다른 플레이어 앞면에 containment가 있으면 이 카드 즉시 버림
    // (봉쇄는 뒷면 카드를 낼 때 적용, 앞면은 해당 없음)
    // 즉시 능력 처리 → 여기서는 별도 UI 흐름으로
    applyInstantAbility(s, cardId, theater, mySeat);
    checkBattleEnd(s);
  });
}

// ═══════════════════════════════════════════════════════
// 카드 내기 (Improvise facedown)
// ═══════════════════════════════════════════════════════
function playFacedown(handIdx, theater) {
  if (state.currentTurn !== mySeat) return;
  const cardId = state.hands[mySeat][handIdx];
  const card = CARD_MAP[cardId];
  mutate(s => {
    // 봉쇄(containment): 상대방 any theater에 containment 앞면이 있으면 이 카드 즉시 버림
    const oppHasContainment = hasOngoingFor(1 - mySeat, 'containment', s.field);
    s.hands[mySeat].splice(handIdx, 1);
    if (oppHasContainment) {
      s.deck.push(cardId);
      s.logs.unshift(`P${mySeat+1} → 봉쇄 전략! 뒷면 카드(${card.kor}) 즉시 버려짐`);
    } else {
      // 해상 봉쇄(blockade): 인접 전장에 총 3장 이상이면 버림
      if (isBlockaded(theater, s)) {
        s.deck.push(cardId);
        s.logs.unshift(`P${mySeat+1} → 해상 봉쇄! ${theater.toUpperCase()} 인접에 카드가 많아 버려짐`);
      } else {
        s.field[theater][mySeat].push({ id: cardId, face: false });
        s.logs.unshift(`P${mySeat+1} → 카드 뒷면으로 ${theater.toUpperCase()} 전장에 배치`);
      }
    }
    checkBattleEnd(s);
  });
}

function isBlockaded(theater, s) {
  const thIdx = s.theaters.indexOf(theater);
  for (let pos = 0; pos < s.theaters.length; pos++) {
    if (Math.abs(pos - thIdx) !== 1) continue;
    const adjTh = s.theaters[pos];
    const totalCards = (s.field[adjTh][0]?.length||0) + (s.field[adjTh][1]?.length||0);
    // 해상 봉쇄: 인접 전장에 blockade가 앞면이고 3장 이상
    if (hasOngoingFor(0,'blockade',s.field) || hasOngoingFor(1,'blockade',s.field)) {
      if (totalCards >= 3) return true;
    }
  }
  return false;
}

// ═══════════════════════════════════════════════════════
// 즉시 능력 처리 (mutate 안에서 호출)
// ═══════════════════════════════════════════════════════
function applyInstantAbility(s, cardId, theater, seat) {
  const card = CARD_MAP[cardId];
  if (!card.tag) return;
  switch(card.tag) {
    case 'airdrop':
      s.airdropNext = seat;
      s.logs.unshift('⚡ 공수: 다음 차례에 맞지 않는 전장에 낼 수 있습니다.');
      break;
    case 'reinforce': {
      // 덱 맨 위 카드 확인 후 인접 전장에 뒷면으로 낼 수 있음
      // → 클라이언트 선택이 필요하므로, 플래그 설정 후 UI에서 처리
      if (s.deck.length > 0) {
        s.pendingAbility = { tag:'reinforce', seat, theater, topCard: s.deck[0] };
        s.logs.unshift('⚡ 증원: 덱 맨 위 카드를 확인했습니다. 인접 전장에 뒷면으로 낼지 선택하세요.');
      }
      break;
    }
    case 'maneuver':
      // 인접 전장에서 카드 1장 뒤집기 → UI 선택
      s.pendingAbility = { tag:'maneuver', seat, theater };
      s.logs.unshift('⚡ 기동: 인접 전장에서 카드 1장을 뒤집을 대상을 선택하세요.');
      break;
    case 'ambush':
      // 원하는 전장에서 카드 1장 뒤집기 → UI 선택
      s.pendingAbility = { tag:'ambush', seat, theater };
      s.logs.unshift('⚡ 매복: 어느 전장에서든 카드 1장을 뒤집을 대상을 선택하세요.');
      break;
    case 'transport':
      // 카드 1장을 다른 전장으로 이동 → UI 선택
      s.pendingAbility = { tag:'transport', seat, theater };
      s.logs.unshift('⚡ 이동: 이동할 카드를 선택하세요.');
      break;
    case 'redeploy':
      // 뒷면 카드 1장 회수 → UI 선택
      s.pendingAbility = { tag:'redeploy', seat, theater };
      s.logs.unshift('⚡ 재배치: 회수할 뒷면 카드를 선택하세요.');
      break;
    case 'disrupt':
      // 상대가 자신 카드 1장 뒤집기, 그 다음 나도 1장 뒤집기
      s.pendingAbility = { tag:'disrupt', seat, theater, step: 1 };
      s.logs.unshift('⚡ 방해: 상대방이 자신의 카드 1장을 선택해 뒤집어야 합니다.');
      break;
  }
}

function checkBattleEnd(s) {
  // 양쪽 손패가 모두 비면 배틀 종료
  if (!s.pendingAbility && s.hands[0].length === 0 && s.hands[1].length === 0) {
    resolveBattleEnd(s, null, null);
    return;
  }
  // 턴 넘기기 (pendingAbility가 없을 때만)
  if (!s.pendingAbility) {
    if (s.extraTurn === s.currentTurn) {
      s.extraTurn = null; // 추가 차례 소모, 같은 사람 계속
    } else {
      s.currentTurn = 1 - s.currentTurn;
    }
  }
}

// ═══════════════════════════════════════════════════════
// 철수
// ═══════════════════════════════════════════════════════
function withdraw() {
  if (state.currentTurn !== mySeat) return;
  if (!confirm('정말 철수하시겠습니까? 상대방이 VP를 획득합니다.')) return;
  mutate(s => {
    resolveBattleEnd(s, mySeat, null);
  });
}

// ═══════════════════════════════════════════════════════
// 능력 처리 확인 (pendingAbility 해결)
// ═══════════════════════════════════════════════════════
function resolveAbility(decision) {
  // decision: 능력별 결정 데이터
  mutate(s => {
    const pa = s.pendingAbility;
    if (!pa) return;
    delete s.pendingAbility;
    const { tag, seat, theater } = pa;

    switch(tag) {
      case 'reinforce': {
        if (decision.place && s.deck.length > 0) {
          const topId = s.deck.shift();
          s.field[decision.th][seat].push({ id: topId, face: false });
          s.logs.unshift(`⚡ 증원: ${decision.th.toUpperCase()} 전장에 뒷면으로 배치`);
        } else {
          s.logs.unshift('⚡ 증원: 패스');
        }
        break;
      }
      case 'maneuver':
      case 'ambush': {
        // decision: { th, owner, idx }
        const { th: tgt, owner, idx } = decision;
        const entry = s.field[tgt][owner]?.[idx];
        if (entry) {
          // 덮인 카드는 뒤집기 불가
          const arr = s.field[tgt][owner];
          const isCovered = idx < arr.length - 1;
          if (isCovered) { s.logs.unshift('덮인 카드는 뒤집을 수 없습니다.'); break; }
          entry.face = !entry.face;
          const card = CARD_MAP[entry.id];
          s.logs.unshift(`⚡ ${tag==='maneuver'?'기동':'매복'}: ${tgt.toUpperCase()} P${owner+1}의 [${card.kor}] 뒤집기`);
          // 앞면이 됐으면 즉시 능력 발동
          if (entry.face && card.kind === 'instant') {
            applyInstantAbility(s, entry.id, tgt, owner);
          }
        }
        break;
      }
      case 'transport': {
        // decision: { srcTh, srcOwner, srcIdx, dstTh }
        const { srcTh, srcOwner, srcIdx, dstTh } = decision;
        const arr = s.field[srcTh][srcOwner];
        if (arr && arr[srcIdx]) {
          const [entry] = arr.splice(srcIdx, 1);
          s.field[dstTh][srcOwner].push(entry);
          const card = CARD_MAP[entry.id];
          s.logs.unshift(`⚡ 이동: [${card.kor}] → ${dstTh.toUpperCase()}`);
        }
        break;
      }
      case 'redeploy': {
        // decision: { th, owner, idx }
        const { th: tgt, owner, idx } = decision;
        const arr = s.field[tgt][owner];
        if (arr && arr[idx] && !arr[idx].face) {
          const [entry] = arr.splice(idx, 1);
          s.hands[owner].push(entry.id);
          s.extraTurn = owner;
          const card = CARD_MAP[entry.id];
          s.logs.unshift(`⚡ 재배치: [${card.kor}] 회수 + 추가 차례`);
        }
        break;
      }
      case 'disrupt': {
        if (pa.step === 1) {
          // 상대가 선택 → decision: { th, owner(=opp), idx }
          const { th: tgt, owner, idx } = decision;
          const entry = s.field[tgt][owner]?.[idx];
          if (entry) {
            const arr = s.field[tgt][owner];
            const isCovered = idx < arr.length - 1;
            if (!isCovered) {
              entry.face = !entry.face;
              const card = CARD_MAP[entry.id];
              s.logs.unshift(`⚡ 방해 1: P${owner+1} [${card.kor}] 뒤집기`);
              if (entry.face && card.kind === 'instant') applyInstantAbility(s, entry.id, tgt, owner);
            }
          }
          // 이제 시전자가 1장 뒤집기
          s.pendingAbility = { tag:'disrupt', seat, theater, step:2 };
          return; // mutate 루프 탈출 방지
        } else if (pa.step === 2) {
          const { th: tgt, owner, idx } = decision;
          const entry = s.field[tgt][owner]?.[idx];
          if (entry) {
            const arr = s.field[tgt][owner];
            const isCovered = idx < arr.length - 1;
            if (!isCovered) {
              entry.face = !entry.face;
              const card = CARD_MAP[entry.id];
              s.logs.unshift(`⚡ 방해 2: P${owner+1} [${card.kor}] 뒤집기`);
              if (entry.face && card.kind === 'instant') applyInstantAbility(s, entry.id, tgt, owner);
            }
          }
        }
        break;
      }
    }
    if (!s.pendingAbility) checkBattleEnd(s);
  });
}

// ═══════════════════════════════════════════════════════
// 렌더
// ═══════════════════════════════════════════════════════
function render() {
  const app = document.querySelector('#app');
  document.querySelector('#bar-title').textContent = `✈️ ${esc2(room?.title || '에어 랜드 & 씨')}`;

  if (!state || state.setup) {
    app.innerHTML = `<section class="card setup">
      <h2>✈️ 에어 랜드 &amp; 씨</h2>
      <p>2인 전략 카드게임 · 세 전장에서 승리하여 12VP를 먼저 모으세요.<br>
      카드 18장 · 배틀마다 6장씩 배분 · 철수로 VP를 아낄 수도 있습니다.</p>
      ${room?.host_id === me?.user_id
        ? `<div class="row" style="justify-content:center"><button class="btn btn-gold" id="start-btn">🎖 게임 시작</button></div>`
        : `<p style="color:var(--muted);margin-top:12px">방장이 시작할 때까지 기다리세요…</p>`}
    </section>`;
    document.querySelector('#start-btn')?.addEventListener('click', startGame);
    return;
  }

  const isMyTurn = state.currentTurn === mySeat && state.phase === 'play' && !state.over;
  const oppSeat  = 1 - mySeat;
  const hasPending = !!state.pendingAbility;

  // ── VP 바 ──
  const myVP  = state.vp[mySeat];
  const oppVP = state.vp[oppSeat];
  const myPct  = Math.min(100, (myVP / 12) * 100);
  const oppPct = Math.min(100, (oppVP / 12) * 100);

  let html = `
  <section class="card">
    <div class="score-bar">
      <div class="vp-box"><div class="vp-num">${myVP}</div><div class="vp-label">나 (P${mySeat+1})</div></div>
      <div class="vp-bar-wrap">
        <div style="font-size:10px;color:var(--text2);margin-bottom:2px">목표: 12 VP</div>
        <div class="vp-bar-bg"><div class="vp-bar-fill" style="width:${myPct}%"></div></div>
        <div style="font-size:9px;color:var(--muted);margin-top:2px">${esc2(members[mySeat]?.nickname)}</div>
      </div>
      <div class="vp-box" style="border-color:#7a3a3a"><div class="vp-num" style="color:#e07070">${oppVP}</div><div class="vp-label">상대 (P${oppSeat+1})</div></div>
    </div>
    <div style="margin-top:8px;font-size:11px;color:var(--text2)">
      배틀 ${state.battleNum} · 선공: P${state.firstPlayer+1}
      ${state.phase==='play' ? `· <b style="color:var(--gold)">P${state.currentTurn+1} 차례</b>` : ''}
      ${isMyTurn && !hasPending ? '<span class="badge badge-me"> 내 차례</span>' : ''}
    </div>
  </section>`;

  // ── 전장 ──
  html += `<section class="card" style="padding:10px">
    <div style="font-size:11px;color:var(--text2);margin-bottom:6px">🗺 전장 (인접: ${state.theaters.map(t=>t==='air'?'공기':t==='land'?'육지':'바다').join(' ↔ ')})</div>
    <div class="theaters-wrap">`;

  for (let pos = 0; pos < 3; pos++) {
    const th = state.theaters[pos];
    const myStr  = getTheaterStr(th, mySeat, state);
    const oppStr = getTheaterStr(th, oppSeat, state);
    const iWin  = myStr > oppStr || (myStr === oppStr && mySeat === state.firstPlayer);
    const oppWin = !iWin;
    const ctrlCls = iWin ? 'i-win' : oppWin ? 'opp-win' : 'tie';
    const ctrlText = iWin ? '✦ 내가 장악' : '✧ 상대 장악';

    html += `<div class="theater-col ${th}">
      <div class="theater-header">
        <div class="theater-name">${th==='air'?'✈ 공기':th==='land'?'🚀 육지':'⛵ 바다'}</div>
        <div class="theater-ctrl ${ctrlCls}">${ctrlText}</div>
      </div>
      <div class="theater-str">
        <span style="color:var(--text2)">나 ${myStr}</span>
        <span style="color:#a07070">상대 ${oppStr}</span>
      </div>`;

    // 상대 카드 (위)
    html += `<div class="opp-side">`;
    const oppCards = state.field[th][oppSeat] || [];
    for (let i = 0; i < oppCards.length; i++) {
      const entry = oppCards[i];
      const isCovered = i < oppCards.length - 1;
      html += renderFieldCard(entry, oppSeat, th, i, isCovered, false, state, mySeat);
    }
    html += `</div>`;

    // 내 카드 (아래)
    html += `<div class="my-side">`;
    const myCards = state.field[th][mySeat] || [];
    for (let i = 0; i < myCards.length; i++) {
      const entry = myCards[i];
      const isCovered = i < myCards.length - 1;
      html += renderFieldCard(entry, mySeat, th, i, isCovered, true, state, mySeat);
    }
    html += `</div></div>`;
  }
  html += `</div></section>`;

  // ── 배틀 결과 알림 ──
  if (state.battleResult && state.phase === 'battle_end') {
    const bWin = state.battleResult.winner === mySeat;
    html += `<div class="battle-result ${bWin?'b-win':'b-lose'}">
      <div style="font-size:16px;font-weight:900;margin-bottom:4px">${bWin?'✦ 배틀 승리!':'✧ 배틀 패배'}</div>
      <div style="font-size:12px;color:var(--text2)">${esc2(state.battleResult.reason)} · P${state.battleResult.winner+1} +${state.battleResult.vp}VP</div>
      ${room.host_id === me.user_id
        ? `<div style="margin-top:10px"><button class="btn btn-gold" id="next-battle-btn">다음 배틀 시작 →</button></div>`
        : `<div style="font-size:11px;color:var(--muted);margin-top:8px">방장이 다음 배틀을 시작합니다…</div>`}
    </div>`;
  }

  // ── 게임 오버 ──
  if (state.phase === 'game_over' && state.over) {
    const gWin = state.winner === mySeat;
    html += `<div class="result-panel ${gWin?'win':'lose'}">
      <h2>${gWin?'🏆 전쟁 승리!':'💀 전쟁 패배'}</h2>
      <p>${esc2(members[state.winner]?.nickname)} — ${state.vp[state.winner]}VP</p>
    </div>`;
  }

  // ── 진행 중 능력 처리 UI ──
  if (hasPending && state.phase === 'play') {
    html += renderPendingAbilityUI(state.pendingAbility, mySeat, oppSeat, state);
  }

  // ── 내 손패 ──
  if (state.phase === 'play' && !state.over) {
    html += `<div class="hand-area">
      <h3>✋ 내 손패 (${state.hands[mySeat]?.length || 0}장)
        ${isMyTurn && !hasPending ? ' — 카드를 선택하세요' : ''}
        &nbsp;<span style="font-size:10px;color:var(--muted)">상대 손패: ${state.hands[oppSeat]?.length || 0}장</span>
      </h3>
      <div class="hand-cards">`;
    (state.hands[mySeat] || []).forEach((cardId, i) => {
      const card = CARD_MAP[cardId];
      const sel = selectedHandIdx === i ? 'selected' : '';
      const sym = card.kind === 'instant' ? '<span class="hc-instant sym">⚡</span>' :
                  card.kind === 'ongoing' ? '<span class="hc-ongoing sym">∞</span>' : '';
      html += `<div class="hand-card ${typeCls(card.type)} ${sel}" data-hand="${i}">
        <div class="hc-str" style="color:${typeColor(card.type)}">${card.str}</div>
        <div class="hc-name">${esc2(card.kor)}</div>
        <div class="hc-ability">${sym}${esc2(card.ability||'없음')}</div>
        <div class="hc-type">${typeLabel(card.type)}</div>
      </div>`;
    });
    html += `</div>`;

    // 행동 버튼
    if (isMyTurn && !hasPending) {
      if (selectedHandIdx !== null) {
        const card = CARD_MAP[state.hands[mySeat][selectedHandIdx]];
        const canAny = state.airdropNext === mySeat ||
          (hasOngoingFor(mySeat, 'aerodrome', state.field) && card.str <= 3);
        html += `<div class="action-box" style="margin-top:8px">
          <h3>선택: [${card.kor}] ${card.str} · ${typeLabel(card.type)}</h3>
          <div class="row">`;
        // 앞면 배치 버튼
        for (const th of state.theaters) {
          const ok = canAny || card.type === th;
          html += `<button class="btn btn-${th} play-faceup-btn" data-th="${th}" ${!ok?'disabled':''}>
            ${th==='air'?'✈':th==='land'?'🚀':'⛵'} ${th==='air'?'공기':th==='land'?'육지':'바다'} 앞면
          </button>`;
        }
        // 뒷면 배치 버튼
        for (const th of state.theaters) {
          html += `<button class="btn btn-facedown play-facedown-btn" data-th="${th}">
            ${th==='air'?'✈':th==='land'?'🚀':'⛵'} ${th==='air'?'공기':th==='land'?'육지':'바다'} 뒷면
          </button>`;
        }
        html += `</div>
          <div class="action-hint">앞면 배치 시 전술 능력이 발동합니다. 뒷면은 힘 2의 와일드 카드입니다.</div>
        </div>`;
      }
      html += `<div class="row" style="margin-top:8px">
        <button class="btn btn-red" id="withdraw-btn">🚩 철수</button>
        <span style="font-size:10px;color:var(--muted)">
          철수 시 상대방이 ${getWithdrawVP(mySeat===state.firstPlayer, state.hands[mySeat]?.length||0)}VP 획득
        </span>
      </div>`;
    }
    html += `</div>`;
  }

  // ── 로그 ──
  html += `<section class="card">
    <div style="font-size:11px;font-weight:700;color:var(--text2);margin-bottom:6px">📋 게임 로그</div>
    <div class="log-box">${state.logs.slice(0,60).map(l=>`<div>${esc2(l)}</div>`).join('')}</div>
  </section>`;

  app.innerHTML = html;

  // ── 이벤트 바인딩 ──
  document.querySelector('#start-btn')?.addEventListener('click', startGame);
  document.querySelector('#next-battle-btn')?.addEventListener('click', () => {
    if (room.host_id !== me.user_id) return;
    mutate(s => nextBattle(s));
  });
  document.querySelector('#withdraw-btn')?.addEventListener('click', withdraw);

  // 손패 선택
  document.querySelectorAll('[data-hand]').forEach(el => {
    el.addEventListener('click', () => {
      if (!isMyTurn || hasPending) return;
      const i = Number(el.dataset.hand);
      selectedHandIdx = selectedHandIdx === i ? null : i;
      render();
    });
  });

  // 앞면 배치
  document.querySelectorAll('.play-faceup-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (selectedHandIdx === null) return;
      playFaceup(selectedHandIdx, btn.dataset.th);
    });
  });

  // 뒷면 배치
  document.querySelectorAll('.play-facedown-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (selectedHandIdx === null) return;
      playFacedown(selectedHandIdx, btn.dataset.th);
    });
  });

  // 능력 처리 버튼들은 renderPendingAbilityUI 에서 별도 바인딩
  bindPendingAbilityButtons(state.pendingAbility, mySeat, oppSeat, state);
}

// ═══════════════════════════════════════════════════════
// 필드 카드 렌더
// ═══════════════════════════════════════════════════════
function renderFieldCard(entry, owner, th, idx, isCovered, isMine, state, mySeat) {
  const card = CARD_MAP[entry.id];
  const effStr = getEffectiveStr(entry, state.field, owner);
  const sym = entry.face && card.kind === 'instant' ? '<span class="ability-sym" style="color:var(--instant)">⚡</span>' :
              entry.face && card.kind === 'ongoing'  ? '<span class="ability-sym" style="color:var(--ongoing)">∞</span>' : '';
  if (!entry.face) {
    return `<div class="field-card face-down" data-th="${th}" data-owner="${owner}" data-idx="${idx}">
      <div class="fc-str">2</div>
      <div class="fc-name">?</div>
    </div>`;
  }
  return `<div class="field-card ${typeCls(card.type)}" data-th="${th}" data-owner="${owner}" data-idx="${idx}"
    title="${esc2(card.ability||'')}">
    ${sym}
    <div class="fc-str" style="color:${typeColor(card.type)}">${effStr}</div>
    <div class="fc-name">${esc2(card.kor)}</div>
    <div class="fc-type">${card.str !== effStr ? `(원래${card.str})` : ''}</div>
    ${isCovered ? '<div style="font-size:8px;color:var(--muted)">덮임</div>' : ''}
  </div>`;
}

// ═══════════════════════════════════════════════════════
// 능력 처리 UI
// ═══════════════════════════════════════════════════════
function renderPendingAbilityUI(pa, mySeat, oppSeat, s) {
  if (!pa) return '';
  const isMyAbility = pa.seat === mySeat;
  // disrupt step1: 상대가 선택
  const isDisruptStep1 = pa.tag === 'disrupt' && pa.step === 1;
  const mustAct = isMyAbility || isDisruptStep1;
  if (!mustAct && pa.tag !== 'disrupt') {
    return `<div class="notice">⚡ 상대방이 능력을 처리 중입니다…</div>`;
  }

  let inner = '';
  switch(pa.tag) {
    case 'reinforce': {
      if (!isMyAbility) return `<div class="notice">상대 증원 처리 중…</div>`;
      const topCard = pa.topCard ? CARD_MAP[pa.topCard] : null;
      const adjIdxs = getAdjacentIdxs(pa.theater, s.theaters);
      inner = `<h3>⚡ 증원</h3>
        <p>덱 맨 위 카드: ${topCard ? `<b>${topCard.kor}</b> (힘${topCard.str} · ${typeLabel(topCard.type)})` : '없음'}</p>
        <p>인접 전장에 뒷면으로 배치하시겠습니까?</p>
        <div class="row">
          ${adjIdxs.map(pos => {
            const t = s.theaters[pos];
            return `<button class="btn btn-${t} ability-btn" data-resolve='${JSON.stringify({place:true,th:t})}'>
              ${t==='air'?'✈':t==='land'?'🚀':'⛵'} ${t==='air'?'공기':t==='land'?'육지':'바다'}에 배치
            </button>`;
          }).join('')}
          <button class="btn btn-ghost ability-btn" data-resolve='${JSON.stringify({place:false})}'>패스</button>
        </div>`;
      break;
    }
    case 'maneuver':
    case 'ambush': {
      if (!isMyAbility) return `<div class="notice">상대 능력 처리 중…</div>`;
      const label = pa.tag === 'maneuver' ? '⚡ 기동 — 인접 전장 카드 뒤집기' : '⚡ 매복 — 모든 전장 카드 뒤집기';
      const validThs = pa.tag === 'maneuver'
        ? getAdjacentIdxs(pa.theater, s.theaters).map(i => s.theaters[i])
        : THEATER_ORDER;
      inner = `<h3>${label}</h3>
        <p>뒤집을 카드를 선택하세요. (덮인 카드는 불가)</p>
        <div class="modal-grid">
          ${renderSelectableFieldCards(validThs, s, 'flip-target')}
        </div>
        <button class="btn btn-ghost ability-btn" data-resolve='${JSON.stringify({skip:true})}' style="margin-top:8px">패스 (대상 없음)</button>`;
      break;
    }
    case 'transport': {
      if (!isMyAbility) return `<div class="notice">상대 이동 처리 중…</div>`;
      inner = `<h3>⚡ 이동 — 카드를 다른 전장으로</h3>
        <p>이동할 카드를 선택하세요.</p>
        <div class="modal-grid">
          ${renderSelectableFieldCards(THEATER_ORDER, s, 'transport-src')}
        </div>
        <button class="btn btn-ghost ability-btn" data-resolve='${JSON.stringify({skip:true})}' style="margin-top:8px">패스</button>`;
      break;
    }
    case 'redeploy': {
      if (!isMyAbility) return `<div class="notice">상대 재배치 처리 중…</div>`;
      inner = `<h3>⚡ 재배치 — 뒷면 카드 회수</h3>
        <p>회수할 뒷면 카드를 선택하세요. 회수하면 추가 차례를 얻습니다.</p>
        <div class="modal-grid">
          ${renderSelectableFacedownCards(s, pa.seat, 'redeploy-target')}
        </div>
        <button class="btn btn-ghost ability-btn" data-resolve='${JSON.stringify({skip:true})}' style="margin-top:8px">패스</button>`;
      break;
    }
    case 'disrupt': {
      const actSeat = pa.step === 1 ? oppSeat : mySeat;
      if (pa.step === 1 && mySeat !== oppSeat) {
        // 상대(상대=isDisruptStep1일 때 상대가 선택)
        // mySeat가 아닌 사람이 선택
      }
      if (pa.step === 1 && mySeat === pa.seat) {
        // 시전자 대기
        return `<div class="notice">⚡ 방해 — 상대방이 뒤집을 카드를 선택하는 중입니다…</div>`;
      }
      if (pa.step === 2 && mySeat !== pa.seat) {
        return `<div class="notice">⚡ 방해 2 — 시전자가 카드를 뒤집는 중입니다…</div>`;
      }
      const stepLabel = pa.step === 1
        ? `⚡ 방해 1 — 당신의 카드 1장을 뒤집으세요`
        : `⚡ 방해 2 — 카드 1장을 뒤집으세요`;
      inner = `<h3>${stepLabel}</h3>
        <div class="modal-grid">
          ${renderSelectableFieldCards(THEATER_ORDER, s, 'disrupt-target')}
        </div>
        <button class="btn btn-ghost ability-btn" data-resolve='${JSON.stringify({skip:true})}' style="margin-top:8px">패스</button>`;
      break;
    }
  }
  return `<div class="action-box" id="pending-ability-box">${inner}</div>`;
}

function getAdjacentIdxs(theater, theaters) {
  const idx = theaters.indexOf(theater);
  const adj = [];
  if (idx > 0) adj.push(idx - 1);
  if (idx < 2) adj.push(idx + 1);
  return adj;
}

function renderSelectableFieldCards(ths, s, cls) {
  let html = '';
  for (const th of ths) {
    for (const owner of [0, 1]) {
      const arr = s.field[th][owner] || [];
      for (let i = 0; i < arr.length; i++) {
        const entry = arr[i];
        const card = CARD_MAP[entry.id];
        const isCovered = i < arr.length - 1;
        const faceLabel = entry.face ? '앞' : '뒤';
        html += `<button class="btn btn-${th} ${cls}" style="font-size:10px;padding:6px 8px"
          data-th="${th}" data-owner="${owner}" data-idx="${i}" ${isCovered?'disabled':''}>
          P${owner+1} ${th==='air'?'✈':th==='land'?'🚀':'⛵'} [${entry.face?card.kor:'?'}] ${faceLabel}
          ${isCovered?'(덮임)':''}
        </button>`;
      }
    }
  }
  return html || '<span style="color:var(--muted);font-size:11px">선택 가능한 카드가 없습니다.</span>';
}

function renderSelectableFacedownCards(s, seat, cls) {
  let html = '';
  for (const th of THEATER_ORDER) {
    const arr = s.field[th][seat] || [];
    for (let i = 0; i < arr.length; i++) {
      const entry = arr[i];
      if (entry.face) continue;
      html += `<button class="btn btn-facedown ${cls}" style="font-size:10px;padding:6px 8px"
        data-th="${th}" data-owner="${seat}" data-idx="${i}">
        ${th==='air'?'✈':th==='land'?'🚀':'⛵'} 뒷면 카드
      </button>`;
    }
  }
  return html || '<span style="color:var(--muted);font-size:11px">뒷면 카드가 없습니다.</span>';
}

function bindPendingAbilityButtons(pa, mySeat, oppSeat, s) {
  if (!pa) return;

  // ability-btn (resolve 데이터 포함)
  document.querySelectorAll('.ability-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const decision = JSON.parse(btn.dataset.resolve);
      if (decision.skip) {
        mutate(ss => {
          delete ss.pendingAbility;
          checkBattleEnd(ss);
        });
        return;
      }
      resolveAbility(decision);
    });
  });

  // 뒤집기 대상 선택
  document.querySelectorAll('.flip-target').forEach(btn => {
    btn.addEventListener('click', () => {
      resolveAbility({ th: btn.dataset.th, owner: Number(btn.dataset.owner), idx: Number(btn.dataset.idx) });
    });
  });

  // 이동 소스 선택
  document.querySelectorAll('.transport-src').forEach(btn => {
    btn.addEventListener('click', () => {
      // 소스 선택 후 목적지 선택 UI
      const srcTh = btn.dataset.th, srcOwner = Number(btn.dataset.owner), srcIdx = Number(btn.dataset.idx);
      showTransportDstModal(srcTh, srcOwner, srcIdx, s);
    });
  });

  // 재배치 대상
  document.querySelectorAll('.redeploy-target').forEach(btn => {
    btn.addEventListener('click', () => {
      resolveAbility({ th: btn.dataset.th, owner: Number(btn.dataset.owner), idx: Number(btn.dataset.idx) });
    });
  });

  // 방해 대상
  document.querySelectorAll('.disrupt-target').forEach(btn => {
    btn.addEventListener('click', () => {
      resolveAbility({ th: btn.dataset.th, owner: Number(btn.dataset.owner), idx: Number(btn.dataset.idx) });
    });
  });
}

function showTransportDstModal(srcTh, srcOwner, srcIdx, s) {
  const modal = document.querySelector('#modal');
  const dstOptions = THEATER_ORDER.filter(t => t !== srcTh);
  modal.innerHTML = `<div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
      <h3>⚡ 이동 — 목적지 전장 선택</h3>
      <div class="modal-grid">
        ${dstOptions.map(t => `<button class="btn btn-${t} transport-dst-btn" data-dst="${t}">
          ${t==='air'?'✈ 공기':t==='land'?'🚀 육지':'⛵ 바다'}
        </button>`).join('')}
      </div>
      <button class="btn btn-ghost" id="modal-cancel" style="margin-top:10px">취소</button>
    </div>
  </div>`;
  modal.style.display = 'block';
  modal.querySelector('#modal-cancel').addEventListener('click', () => { modal.style.display='none'; modal.innerHTML=''; });
  modal.querySelectorAll('.transport-dst-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      modal.style.display='none'; modal.innerHTML='';
      resolveAbility({ srcTh, srcOwner, srcIdx, dstTh: btn.dataset.dst });
    });
  });
}

// ═══════════════════════════════════════════════════════
// 앱 부트
// ═══════════════════════════════════════════════════════
(async () => {
  try {
    me = await getMe();
    if (!me) return showFatal('로그인이 필요합니다.');
    ({ room, members } = await loadRoom());
    if (room.game !== 'airlandsea') return showFatal('에어 랜드 & 씨 방이 아닙니다. (game ≠ airlandsea)');
    mySeat = members.findIndex(m => m.user_id === me.user_id);
    if (mySeat < 0) return showFatal('이 방의 참가자가 아닙니다.');

    const row = await loadState();
    revision = row.revision;
    state = row.state;

    if (!state && room.host_id === me.user_id) {
      state = setupState();
      revision = await saveState(0, state);
    }
    render();

    startStatePoll(async row => {
      revision = row.revision;
      if (row.state) {
        state = row.state;
        selectedHandIdx = null;
        pendingAction = null;
        render();
      }
    }, { interval: 7000 });

  } catch(e) { showFatal(e.message); }
})();
</script>
</body>
</html>
