<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BoardMate Online · 포크노바</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script>
<style>:root{font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;color:#18202d;background:#f7f3df}*{box-sizing:border-box}body{margin:0}.bar{position:sticky;top:0;z-index:20;background:#111827;color:white;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.bar a{color:white;text-decoration:none;font-weight:900}.wrap{width:min(1500px,100%);margin:auto;padding:10px}.players{display:flex;gap:7px;overflow:auto;margin-bottom:8px}.player{min-width:135px;background:white;border:1px solid #d8dde5;border-radius:12px;padding:8px}.player.active{outline:3px solid #f6c945}.player b,.player small{display:block}.player small{color:#667085;margin-top:3px}.frame{width:100%;height:calc(100vh - 118px);min-height:720px;border:0;border-radius:16px;background:#111;box-shadow:0 8px 28px #0002}.note{font-size:11px;color:#667085;padding:5px 2px}</style></head><body>
<header class="bar"><span><a href="./index.html#/">← 홈</a> · <a href="./index.html#/multi">다인플</a></span><b id="title">⚡ 포크노바 온라인</b><span id="sync">연결 중…</span></header>
<main class="wrap"><div id="players" class="players"></div><div class="note">업로드한 Pocket Nova v2의 게임 엔진을 BoardMate 방 상태에 연결한 온라인 베타입니다. 게임 상태는 행동할 때마다 자동 저장됩니다.</div><iframe id="gameFrame" class="frame" title="포크노바"></iframe><div id="end"></div></main>
<script type="module">
import {configured,roomId,getMe,loadRoom,loadState,saveState,startStatePoll,submitMatch,ratingBadges,esc,showFatal,endPanel} from './multi-common.js';
if(!configured()||!roomId)showFatal('Supabase 설정 또는 room 주소가 없습니다.');
let me,room,members,badges={},mySeat=-1,revision=0,state=null,frame=null,saving=false,pending=null,submitted=false;
const sync=document.querySelector('#sync');
function parsePayload(payload){try{return JSON.parse(payload)}catch{return null}}
function sendState(){if(frame?.contentWindow&&state?.payload)frame.contentWindow.postMessage({type:'game_state',state:state.payload},'*')}
function drawPlayers(){const current=Number(state?.currentSeat??-1);document.querySelector('#players').innerHTML=members.map((m,i)=>`<div class="player ${i===current&&state?.phase!=='scoring'?'active':''}"><b>${esc(badges[m.user_id]?.text||'🥉')} ${esc(m.nickname)}${i===mySeat?' · 나':''}</b><small>${state?.phase==='scoring'?'게임 종료':i===current?'현재 차례':'대기'}</small></div>`).join('')}
async function flush(){if(saving||!pending)return;saving=true;const next=pending;pending=null;try{revision=await saveState(revision,next);state=next;sync.textContent='자동 저장됨';drawPlayers();if(state.phase==='scoring')showEnd()}catch(e){console.warn(e);sync.textContent='동기화 재시도';const row=await loadState();revision=row.revision;state=row.state;sendState();drawPlayers()}finally{saving=false;if(pending)flush()}}
function queuePayload(payload){const parsed=parsePayload(payload);if(!parsed)return;pending={kind:'pocketnova-v8',payload,currentSeat:Number(parsed.currentPlayerIndex||0),phase:String(parsed.phase||'playing'),turnNumber:Number(parsed.turnNumber||1)};flush()}
async function submitResult(orderIds){if(submitted||!Array.isArray(orderIds)||orderIds.length!==members.length)return;const order=orderIds.map(id=>{const m=/^p(\d+)$/.exec(String(id));return m?members[Number(m[1])-1]?.user_id:null}).filter(Boolean);if(order.length!==members.length)return;submitted=true;try{await submitMatch(order);sync.textContent='결과 반영 완료'}catch(e){if(!String(e.message).includes('already'))submitted=false}}
function showEnd(){if(!state||state.phase!=='scoring')return;const end=document.querySelector('#end');if(!end.innerHTML)end.innerHTML=endPanel('포크노바 종료','최종 결과를 확인한 뒤 홈이나 다인플 목록으로 돌아갈 수 있습니다.')}
window.addEventListener('message',e=>{if(e.source!==frame?.contentWindow)return;if(e.data?.type==='pocketnova_ready'){sendState();return}if(e.data?.type==='game_state'&&typeof e.data.state==='string'){queuePayload(e.data.state);return}if(e.data?.type==='game_result'){submitResult(e.data.order);return}});
(async()=>{try{me=await getMe();if(!me)return showFatal('로그인이 필요합니다.');({room,members}=await loadRoom());if(room.game!=='pocketnova')return showFatal('포크노바 방이 아닙니다.');mySeat=members.findIndex(m=>m.user_id===me.user_id);if(mySeat<0)return showFatal('이 방의 참가자가 아닙니다.');badges=await ratingBadges('pocketnova',members.map(m=>m.user_id));const row=await loadState();revision=row.revision;state=row.state;if(state&&state.kind!=='pocketnova-v8')return showFatal('이 방은 이전 포크노바 버전입니다. 새 방을 만들어 주세요.');drawPlayers();frame=document.querySelector('#gameFrame');const names=encodeURIComponent(JSON.stringify(members.map(m=>m.nickname)));frame.src=`./pocketnova/index.html?online=1&seat=${mySeat}&host=${room.host_id===me.user_id?'1':'0'}&names=${names}`;frame.addEventListener('load',sendState);showEnd();startStatePoll(async row=>{revision=row.revision;if(row.state){state=row.state;drawPlayers();sendState();showEnd()}},{interval:1700})}catch(e){showFatal(e.message)}})();
</script></body></html>
