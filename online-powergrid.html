<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>파워그리드 · BoardMate 온라인</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./powergrid/pg-styles.css?v=20">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
</head>
<body>
<div class="pg-app" id="app">불러오는 중…</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./powergrid/data/germany-map.js?v=20"></script>
<script src="./powergrid/engine.js?v=20"></script>
<script src="./powergrid/ui.js?v=20"></script>
<script type="module">
import {
  configured, roomId, getMe, loadRoom, loadState, saveState, startStatePoll,
  submitMatch, showFatal, endPanel, touchPresence
} from './multi-common.js';

const GAME='powergrid';
const app=document.querySelector('#app');
let me,room,members,mySeat,isHost,state=null,revision=0,stopPoll=null,submitted=false,saving=false,legacyState=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let setupPreviewMaps=[];
function destroySetupPreviews(){
  setupPreviewMaps.forEach(m=>{try{m.remove()}catch(_){}}); setupPreviewMaps=[];
}
function setupMapPreview(boardId){
  const G=PowerGrid.mapData(boardId);
  const legend=G.REGION_ORDER.map(rid=>{const r=G.REGIONS[rid];return `<span style="--region:${esc(r.color)}"><i></i>${esc(r.shortName||r.name)}</span>`}).join('');
  return `<div class="pg-map-choice-leaflet" data-pg-preview="${esc(boardId)}"><div class="pg-map-loading">지도 불러오는 중…</div></div><div class="pg-map-preview-legend">${legend}</div>`;
}
function mountSetupMapPreviews(){
  destroySetupPreviews();
  document.querySelectorAll('[data-pg-preview]').forEach(el=>{
    const boardId=el.dataset.pgPreview, G=PowerGrid.mapData(boardId);
    if(!window.L){el.innerHTML='<div class="pg-map-loading">지도 모듈을 불러오지 못했습니다.</div>';return;}
    el.innerHTML='';
    const hardBounds=G.GEO_BOUNDS ? L.latLngBounds(G.GEO_BOUNDS) : null;
    const map=L.map(el,{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,touchZoom:false,maxBounds:hardBounds||undefined,maxBoundsViscosity:1.0});
    setupPreviewMaps.push(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,noWrap:true}).addTo(map);
    const byId=G.CITY_BY_ID;
    const currentBoard=document.querySelector('#boardSelect')?.value||'germany';
    const chosen=new Set([...document.querySelectorAll('#regionSelector input:checked')].map(x=>x.value));
    const filterRegions=boardId===currentBoard && chosen.size>0;
    (G.EDGES||[]).forEach(e=>{const a=byId[e.a],b=byId[e.b];if(!a||!b||!Number.isFinite(a.lat)||!Number.isFinite(b.lat))return;const on=!filterRegions||(chosen.has(a.region)&&chosen.has(b.region));L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{color:on?'#d7b45a':'#64748b',weight:on?1.35:.8,opacity:on?.48:.12,dashArray:on?null:'3,4',interactive:false}).addTo(map)});
    G.CITIES.forEach(c=>{if(!Number.isFinite(c.lat)||!Number.isFinite(c.lng))return;const r=G.REGIONS[c.region],on=!filterRegions||chosen.has(c.region);L.circleMarker([c.lat,c.lng],{radius:on?3.5:2.6,weight:1,color:on?'#f8fafc':'#64748b',fillColor:on?(r?.color||'#94a3b8'):'#64748b',fillOpacity:on?.96:.20,opacity:on?.82:.20,interactive:false}).addTo(map)});
    const pts=G.CITIES.filter(c=>Number.isFinite(c.lat)&&Number.isFinite(c.lng)).map(c=>[c.lat,c.lng]);
    if(hardBounds){
      map.fitBounds(hardBounds,{padding:[8,8],animate:false});
      map.setMinZoom(map.getZoom());
    }else if(pts.length){
      map.fitBounds(pts,{padding:[10,10],animate:false});
      map.setMinZoom(map.getZoom());
    }else map.setView(G.GEO_CENTER||[0,0],G.GEO_ZOOM||4);
    setTimeout(()=>map.invalidateSize(false),0);
  });
}

function setupView(){
  destroySetupPreviews();
  const boardId=document.querySelector('#boardSelect')?.value || 'germany';
  const boardDef=PowerGrid.BOARD_DEFS[boardId] || PowerGrid.BOARD_DEFS.germany;
  const boardMap=PowerGrid.mapData(boardId);
  const wanted=PowerGrid.defaultRegions(members.length,boardId).length;
  const defaults=new Set(PowerGrid.defaultRegions(members.length,boardId));
  const mapCards=Object.values(PowerGrid.BOARD_DEFS).map(b=>`<button type="button" class="pg-map-choice${b.id===boardId?' selected':''}" data-board="${b.id}" aria-pressed="${b.id===boardId?'true':'false'}"><div class="pg-map-choice-preview ${b.id==='usa'?'landscape':'portrait'}">${setupMapPreview(b.id)}</div><div class="pg-map-choice-copy"><b>${esc(b.name)}</b><span>${esc((b.features||[])[0]||'맵을 선택합니다.')}</span></div></button>`).join('');
  const regionHtml=boardMap.REGION_ORDER.map(rid=>{
    const r=boardMap.REGIONS[rid];
    return `<label class="pg-region-option"><input type="checkbox" value="${rid}" ${defaults.has(rid)?'checked':''}><i style="background:${r.color}"></i><span>${esc(r.name)}</span></label>`;
  }).join('');
  app.innerHTML=`
    <div class="pg-topbar">
      <div class="pg-title">🔌 파워그리드<br><small>${esc(room.title||'BoardMate 온라인')} · ${members.length}인 · 다인플 전용</small></div>
      <a class="pg-btn small" href="./index.html#/room/${encodeURIComponent(roomId)}">← 방으로</a>
    </div>
    <div class="pg-card">
      <h3>파워그리드 게임 설정</h3>
      ${legacyState?'<div class="pg-setup-warning">이 방에 이전 형식의 Power Grid 상태가 남아 있습니다. 방장이 아래 설정으로 새 게임을 시작하면 현재 형식으로 교체합니다.</div>':''}
      <p>사용할 맵과 연결된 지역을 선택하세요. ${members.length}인 게임은 서로 이어진 지역 <b>${wanted}개</b>를 사용합니다.</p>
      <input type="hidden" id="boardSelect" value="${boardId}"><div class="pg-map-choice-title">🗺️ 시작 맵 선택</div><div class="pg-map-choice-grid">${mapCards}</div>
      ${isHost?`<div class="pg-region-selector" id="regionSelector">${regionHtml}</div>
      <div class="pg-setup-warning" id="regionStatus">지역 ${wanted}개를 선택하세요. 선택 지역들은 하나의 연결된 영역이어야 합니다.</div>
      <button class="pg-btn primary" id="start">${esc(boardDef.name)} 게임 시작</button>`:'<p>방장이 사용할 맵/지역을 선택하고 게임을 초기화하면 자동으로 시작됩니다.</p>'}
      <div class="pg-map-features"><b>🗺️ ${esc(boardDef.featureTitle||'맵 특징')}</b><ul>${(boardDef.features||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    </div>`;
  document.querySelectorAll('.pg-map-choice').forEach(btn=>btn.addEventListener('click',()=>{ const input=document.querySelector('#boardSelect'); if(input) input.value=btn.dataset.board; setupView(); }));
  document.querySelector('#start')?.addEventListener('click',startGame);
  document.querySelectorAll('#regionSelector input').forEach(el=>el.addEventListener('change',()=>{updateRegionStatus();mountSetupMapPreviews();}));
  updateRegionStatus();
  setTimeout(mountSetupMapPreviews,0);
}

function selectedRegions(){
  return [...document.querySelectorAll('#regionSelector input:checked')].map(el=>el.value);
}
function updateRegionStatus(){
  const box=document.querySelector('#regionStatus'); if(!box)return;
  const boardId=document.querySelector('#boardSelect')?.value || 'germany';
  const ids=selectedRegions(),wanted=PowerGrid.defaultRegions(members.length,boardId).length;
  let msg=`선택 ${ids.length}/${wanted}`;
  if(ids.length===wanted) msg+=PowerGrid.mapData(boardId).regionsConnected(ids)?' · ✅ 서로 연결됨':' · ❌ 서로 연결되지 않음';
  box.textContent=msg;
}
async function startGame(){
  if(saving)return;
  try{
    saving=true;
    const names=members.slice().sort((a,b)=>a.seat-b.seat).map(m=>m.nickname);
    const regionIds=selectedRegions();
    const boardId=document.querySelector('#boardSelect')?.value || 'germany';
    PowerGrid.validateRegionSelection(names.length,regionIds,boardId);
    const s=PowerGrid.newGame({numPlayers:names.length,seatNames:names,regionIds,boardId});
    const nr=await saveState(revision,s);
    revision=Number(nr); state=s; legacyState=false; draw();
  }catch(e){alert(e.message||e)}finally{saving=false}
}

function rankingSeats(){
  return state.order.slice().sort((a,b)=>{
    const pa=state.players[a],pb=state.players[b];
    const d=(pb._finalPowered||0)-(pa._finalPowered||0);
    return d||pb.money-pa.money;
  });
}
function rankingIds(){
  return rankingSeats().map(seat=>members.find(m=>Number(m.seat)===Number(seat))?.user_id).filter(Boolean);
}
async function maybeSubmit(){
  if(!state?.gameOver||state?.winner==null||!isHost||submitted)return;
  submitted=true;
  try{await submitMatch(rankingIds())}catch(e){console.warn('match submit',e);submitted=false}
}
async function action(a){
  if(saving||!state)return;
  const acting=PowerGrid.actingSeats(state);
  if(Number(a.seat)!==mySeat||acting.indexOf(mySeat)===-1)return alert('현재 내 차례가 아닙니다.');
  try{
    saving=true;
    const next=PowerGrid.applyAction(state,a),nr=await saveState(revision,next);
    revision=Number(nr);state=next;draw();await maybeSubmit();
  }catch(e){
    if(/revision|conflict|expected/i.test(String(e.message||e))){
      const row=await loadState(); if(row)await onRow(row);
      alert('다른 기기에서 먼저 상태가 갱신되어 최신 상태를 불러왔습니다.');
    }else alert(e.message||e);
  }finally{saving=false}
}
function draw(){
  if(!state)return setupView();
  const boardId=(state.map&&state.map.boardId)||'germany';
  const boardMap=PowerGrid.mapData(boardId);
  const boardName=(PowerGrid.BOARD_DEFS[boardId]||PowerGrid.BOARD_DEFS.germany).name;
  const regionNames=(state.map.regionIds||[]).map(r=>boardMap.REGIONS[r]?.shortName||r).join('·');
  const ranks=state.gameOver?rankingSeats():[];
  const myPlace=ranks.indexOf(mySeat)+1;
  PowerGridUI.render(app,{
    state,mySeat,allowAnySeat:false,
    subtitle:`BoardMate 공통 방 · Realtime · ${boardName}맵 (${regionNames})`,
    extraTopHtml:`<a class="pg-btn small" href="./index.html#/room/${encodeURIComponent(roomId)}">← 방</a>`,
    footerHtml:(state.gameOver&&state.winner!=null)?endPanel('파워그리드 최종 결과','최종 전력 공급 도시 수 → 보유 현금 순으로 순위를 확정합니다.',{
      outcome:myPlace===1?'win':'lose',
      headline:myPlace===1?'1위 · 승리!':`${myPlace}위`,
      details:[`내 공급 도시 ${state.players[mySeat]._finalPowered||0}`,`내 현금 ${state.players[mySeat].money} Elektro`],
      ranking:ranks.map((seat,n)=>({place:`${n+1}위`,name:state.players[seat].name,value:`⚡ ${state.players[seat]._finalPowered||0} · ${state.players[seat].money} Elektro`,me:seat===mySeat,winner:n===0}))
    }): '',
    onAction:action
  });
}
async function onRow(row){
  if(!row)return;
  revision=Number(row.revision||0);
  const incoming=row.state||null;
  if(incoming && incoming.kind!==PowerGrid.STATE_KIND){
    legacyState=true;state=null;setupView();return;
  }
  legacyState=false;state=incoming;draw();await maybeSubmit();
}
async function boot(){
  if(!configured()||!roomId)showFatal('BoardMate 다인플 방에서 파워그리드를 열어주세요.');
  me=await getMe(); if(!me)showFatal('로그인이 필요합니다.');
  ({room,members}=await loadRoom());
  if(room.game!==GAME)showFatal('파워그리드 방이 아닙니다.');
  const m=members.find(x=>x.user_id===me.user_id); if(!m)showFatal('이 방의 참가자가 아닙니다.');
  if(members.length<2||members.length>6)showFatal('파워그리드는 2~6인 다인플만 지원합니다.');
  mySeat=Number(m.seat);isHost=room.host_id===me.user_id;
  const row=await loadState(); if(row)await onRow(row); else setupView();
  stopPoll=startStatePoll(onRow,{interval:10000});
  setInterval(()=>void touchPresence(true),15000);
}
boot().catch(e=>{console.error(e);showFatal(e.message||'파워그리드를 열 수 없습니다.')});
window.addEventListener('beforeunload',()=>stopPoll?.());
</script>
</body>
</html>
