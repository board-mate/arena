<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>시크릿 히틀러 · BoardMate 온라인</title><link rel="stylesheet" href="./social/social-deduction.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script></head>
<body><main class="sd-shell" id="app">불러오는 중…</main>
<script type="module">
import {boot,getView,act,startPolling,fatal,esc,roleKo,policyKo,seatName,roomId,rpc,token,finalizeSeatWinners,socialEndScreen} from './social/social-common.js?v=8';
const GAME='secrethitler',app=document.querySelector('#app');let ctx,view,busy=false,stop=null;
const phaseKo={nomination:'수상 후보 지명',election:'정부 찬반 투표',legislative_president:'입법 회의 · 대통령',legislative_chancellor:'입법 회의 · 수상',veto_president:'거부권 결정',executive:'대통령 권한',over:'게임 종료'};
function top(){return `<div class="sd-topbar"><div class="sd-title">🗳️ 시크릿 히틀러<small>기본판 · 확장 없음 · ${esc(ctx.room.title||'BoardMate')} · ${ctx.members.length}인</small></div><div class="sd-actions"><a class="sd-btn ghost" href="./index.html#/room/${encodeURIComponent(roomId)}">← 방으로</a></div></div>`;}
function players(st){const dead=(st.dead||[]).map(Number);return `<div class="sd-player-list">${ctx.members.map(m=>{const s=Number(m.seat),p=Number(st.president)===s,c=Number(st.chancellor_candidate)===s||Number(st.current_chancellor)===s;return `<div class="sd-player ${p?'active':''} ${dead.includes(s)?'dead':''}"><span class="sd-seat">${s+1}</span><b>${esc(m.nickname)}</b>${p?'<span class="sd-pill">🎖️ 대통령</span>':''}${c?'<span class="sd-pill">📜 수상</span>':''}${dead.includes(s)?'<span class="sd-pill">처형됨</span>':''}</div>`}).join('')}</div>`;}
function roleCard(v){const m=v.me,evil=m.team==='fascist';return `<div class="sd-role-card ${evil?'evil':'good'}"><div class="sd-muted">나의 비밀 역할</div><div class="sd-role-name">${esc(roleKo(m.role))}</div><div class="sd-muted">당원: ${m.team==='fascist'?'파시스트':'자유당'}</div></div>${(m.known||[]).length?`<div class="sd-notice"><b>시작 시 확인한 정보</b>${m.known.map(k=>`<div>• ${esc(seatName(ctx.members,k.seat))}: ${esc(k.hint)}</div>`).join('')}</div>`:''}${intel(v)}`;}
function intel(v){const rows=v.me?.intel||[];if(!rows.length)return '';return `<div class="sd-notice"><b>내 비공개 기록</b>${rows.slice(-8).map(x=>{if(x.cards)return `<div>• ${esc(x.type)}: ${x.cards.map(policyKo).join(' / ')}</div>`;if(x.party)return `<div>• ${esc(x.type)} · ${esc(seatName(ctx.members,x.seat))}: ${x.party==='liberal'?'자유당':'파시스트'}</div>`;return `<div>• ${esc(x.type||'정보')}</div>`}).join('')}</div>`;}
function tracks(st){return `<div class="sd-counter-grid"><div><b>자유 정책</b><div class="sd-track">${Array.from({length:5},(_,i)=>`<span class="sd-dot ${i<Number(st.liberal_policies||0)?'on good':''}">${i+1}</span>`).join('')}</div></div><div><b>파시스트 정책</b><div class="sd-track">${Array.from({length:6},(_,i)=>`<span class="sd-dot ${i<Number(st.fascist_policies||0)?'on evil':''}">${i+1}</span>`).join('')}</div></div><div><b>선거 트래커</b><div class="sd-track">${Array.from({length:3},(_,i)=>`<span class="sd-dot ${i<Number(st.election_tracker||0)?'on warn':''}">${i+1}</span>`).join('')}</div></div></div>`;}
function lastVote(st){const rows=st.last_vote||[];if(!rows.length)return '';return `<div class="sd-notice"><b>직전 정부 투표 공개</b><div class="sd-pills">${rows.map(v=>`<span class="sd-role-pill">${esc(seatName(ctx.members,v.seat))}: ${v.yes?'Ja!':'Nein'}</span>`).join('')}</div></div>`;}
function selectPlayer(id,filter){return `<select class="sd-select" id="${id}"><option value="">선택</option>${ctx.members.filter(m=>filter(Number(m.seat))).map(m=>`<option value="${m.seat}">${Number(m.seat)+1}. ${esc(m.nickname)}</option>`).join('')}</select>`;}
function eligibleChancellors(st){const dead=(st.dead||[]).map(Number),alive=ctx.members.length-dead.length,p=Number(st.president),lastC=st.last_elected_chancellor==null?null:Number(st.last_elected_chancellor),lastP=st.last_elected_president==null?null:Number(st.last_elected_president);return s=>!dead.includes(s)&&s!==p&&s!==lastC&&!(alive>5&&s===lastP);}
function policyHand(v,who){const h=v.me?.hand||[];if(!h.length)return '<div class="sd-notice">정책 카드를 준비하는 중입니다.</div>';return `<div class="sd-policy-row">${h.map((p,i)=>`<div><div class="sd-policy ${p}">${esc(policyKo(p))}</div><button class="sd-btn ${who==='president'?'danger':'primary'}" data-policy-index="${i}" style="width:100%;margin-top:6px">${who==='president'?'이 정책 폐기':'이 정책 시행'}</button></div>`).join('')}</div>`;}
function hitlerTeam(role){return role==='liberal'?'liberal':'fascist';}
function hitlerWinnerSeats(v){const roles=v.me?.reveal_roles||{};return ctx.members.filter(x=>hitlerTeam(roles[String(x.seat)])===v.state.winner).map(x=>Number(x.seat));}
function control(v){const st=v.state,m=v.me,p=st.phase,dead=(st.dead||[]).map(Number);if(st.over){const mine=hitlerTeam(m.role)===st.winner;const roles=m.reveal_roles||{};const body=Object.keys(roles).length?`<div class="sd-player-list">${ctx.members.map(x=>{const r=roles[String(x.seat)],won=hitlerTeam(r)===st.winner;return `<div class="sd-player ${dead.includes(Number(x.seat))?'dead':''} ${won?'winner':'loser'}"><span class="sd-seat">${Number(x.seat)+1}</span><b>${esc(x.nickname)}${Number(x.seat)===ctx.mySeat?' · 나':''}</b><span class="sd-pill">${esc(roleKo(r))}</span><span class="sd-pill">${won?'🏆 승리':'패배'}</span></div>`}).join('')}</div>`:'';return socialEndScreen({win:mine,title:st.winner==='liberal'?'자유당 승리':'파시스트 승리',reason:st.reason||'',summary:`자유 정책 ${Number(st.liberal_policies||0)} · 파시스트 정책 ${Number(st.fascist_policies||0)}`,body});}
if(m.dead)return '<div class="sd-notice">처형되어 더 이상 투표하거나 공직을 맡을 수 없습니다. 게임 진행을 지켜볼 수 있습니다.</div>';
if(p==='nomination')return Number(st.president)===ctx.mySeat?`<div class="sd-control"><b>수상 후보를 지명하세요.</b>${selectPlayer('nominee',eligibleChancellors(st))}<button class="sd-btn primary" id="nominateBtn">수상 후보 지명</button></div>`:`<div class="sd-notice">${esc(seatName(ctx.members,st.president))} 대통령 후보가 수상 후보를 고르는 중입니다.</div>`;
if(p==='election')return m.election_voted?`<div class="sd-notice">투표 완료 · ${Number(st.vote_count||0)}/${ctx.members.length-dead.length}</div>`:`<div class="sd-control"><b>${esc(seatName(ctx.members,st.president))} 대통령 / ${esc(seatName(ctx.members,st.chancellor_candidate))} 수상 정부에 투표하세요.</b><div class="sd-actions"><button class="sd-btn good" id="yesBtn">Ja! 찬성</button><button class="sd-btn evil" id="noBtn">Nein 반대</button></div></div>`;
if(p==='legislative_president')return Number(st.president)===ctx.mySeat?`<div class="sd-control"><b>정책 3장 중 1장을 비밀리에 폐기하세요.</b>${policyHand(v,'president')}</div>`:'<div class="sd-notice">대통령이 정책 3장 중 1장을 폐기하는 중입니다.</div>';
if(p==='legislative_chancellor'){
 if(Number(st.current_chancellor)!==ctx.mySeat)return '<div class="sd-notice">수상이 전달받은 정책 2장 중 하나를 시행하는 중입니다.</div>';
 const veto=Number(st.fascist_policies)>=5&&!m.veto_rejected;return `<div class="sd-control"><b>정책 2장 중 1장을 시행하세요.</b>${policyHand(v,'chancellor')}${veto?'<button class="sd-btn ghost" id="vetoBtn">거부권 요청</button>':''}</div>`;
}
if(p==='veto_president')return Number(st.president)===ctx.mySeat?`<div class="sd-control"><b>수상이 모든 정책 폐기를 요청했습니다.</b><div class="sd-actions"><button class="sd-btn good" id="vetoAccept">거부권 동의</button><button class="sd-btn evil" id="vetoReject">거부권 거절</button></div></div>`:'<div class="sd-notice">대통령이 거부권 요청에 응답하는 중입니다.</div>';
if(p==='executive'){
 if(Number(st.president)!==ctx.mySeat)return `<div class="sd-notice">대통령이 권한 <b>${esc(powerKo(st.power))}</b>을 사용하는 중입니다.</div>`;
 const power=st.power;if(power==='investigate'){const inv=(st.investigated||[]).map(Number);return `<div class="sd-control"><b>당원 카드를 조사할 플레이어를 선택하세요.</b>${selectPlayer('execTarget',s=>s!==ctx.mySeat&&!dead.includes(s)&&!inv.includes(s))}<button class="sd-btn primary" id="execBtn">조사</button></div>`;}
 if(power==='special_election')return `<div class="sd-control"><b>다음 특별 선거의 대통령 후보를 선택하세요.</b>${selectPlayer('execTarget',s=>s!==ctx.mySeat&&!dead.includes(s))}<button class="sd-btn primary" id="execBtn">특별 선거 지명</button></div>`;
 if(power==='execute')return `<div class="sd-control"><b>처형할 플레이어를 선택하세요.</b>${selectPlayer('execTarget',s=>s!==ctx.mySeat&&!dead.includes(s))}<button class="sd-btn danger" id="execBtn">처형</button></div>`;
 if(power==='policy_peek')return `<div class="sd-control"><b>정책 덱 위 3장을 비밀리에 확인했습니다.</b><div class="sd-policy-row">${(m.hand||[]).map(p=>`<div class="sd-policy ${p}">${esc(policyKo(p))}</div>`).join('')}</div><button class="sd-btn primary" id="execBtn">확인 완료</button></div>`;
}
return '<div class="sd-muted">진행 상태를 확인하는 중입니다.</div>';}
function powerKo(p){return ({investigate:'당원 조사',special_election:'특별 선거',policy_peek:'정책 확인',execute:'처형'})[p]||p||'없음';}
function history(st){return `<div class="sd-history">${(st.history||[]).slice().reverse().map(h=>`<div class="sd-history-item">${esc(h.text||'')}${h.policy?` · <b>${esc(policyKo(h.policy))}</b>`:''}</div>`).join('')||'<div class="sd-muted">아직 기록이 없습니다.</div>'}</div>`;}
async function doAct(a){if(busy)return;busy=true;try{await act(a);draw(await getView());}catch(e){alert(e.message||e);}finally{busy=false;}}
function bind(v){document.querySelector('#nominateBtn')?.addEventListener('click',()=>{const el=document.querySelector('#nominee');if(!el?.value)return alert('수상 후보를 선택하세요.');const s=Number(el.value);if(Number.isInteger(s))doAct({type:'nominate',seat:s});});document.querySelector('#yesBtn')?.addEventListener('click',()=>doAct({type:'election_vote',yes:true}));document.querySelector('#noBtn')?.addEventListener('click',()=>doAct({type:'election_vote',yes:false}));
 document.querySelectorAll('[data-policy-index]').forEach(b=>b.onclick=()=>doAct({type:v.state.phase==='legislative_president'?'president_discard':'chancellor_policy',index:Number(b.dataset.policyIndex)}));document.querySelector('#vetoBtn')?.addEventListener('click',()=>doAct({type:'veto_request'}));document.querySelector('#vetoAccept')?.addEventListener('click',()=>doAct({type:'veto_decide',accept:true}));document.querySelector('#vetoReject')?.addEventListener('click',()=>doAct({type:'veto_decide',accept:false}));
 document.querySelector('#execBtn')?.addEventListener('click',()=>{const p=v.state.power;if(p==='policy_peek')return doAct({type:'executive'});const el=document.querySelector('#execTarget');if(!el?.value)return alert('대상을 선택하세요.');const s=Number(el.value);if(Number.isInteger(s))doAct({type:'executive',seat:s});});}
function setup(){app.innerHTML=top()+`<div class="sd-grid"><section class="sd-card sd-main"><h2>기본판 게임 준비</h2><p>확장판 요소 없이 공식 기본판의 자유당원·파시스트·히틀러, 선거, 입법, 대통령 권한, 거부권만 사용합니다.</p>${ctx.isHost?'<button class="sd-btn primary" id="initBtn">역할/정책 덱 섞고 시작</button>':'<div class="sd-notice">방장이 게임을 준비하는 중입니다.</div>'}</section><aside class="sd-card sd-side"><h3>참가자</h3>${players({dead:[],president:-1})}</aside></div>`;document.querySelector('#initBtn')?.addEventListener('click',async()=>{try{await rpc('boardmate_social_init',{p_token:token(),p_room_id:roomId,p_options:{}});draw(await getView());}catch(e){alert(e.message||e);}});}
async function draw(v){view=v;if(!v?.initialized)return setup();const st=v.state;if(st.over&&v.me?.reveal_roles&&ctx.isHost){app.innerHTML=top()+`<section class="sd-card sd-main"><h2>게임 종료</h2><div class="sd-notice"><b>결과를 저장하고 방을 종료하는 중입니다…</b></div></section>`;await finalizeSeatWinners(ctx,hitlerWinnerSeats(v));}app.innerHTML=top()+`<div class="sd-grid"><section class="sd-card sd-main"><h2>${esc(phaseKo[st.phase]||st.phase)}</h2>${tracks(st)}${lastVote(st)}<div class="sd-status-row"><span class="sd-pill">대통령 ${esc(seatName(ctx.members,st.president))}</span>${st.current_chancellor!=null?`<span class="sd-pill">수상 ${esc(seatName(ctx.members,st.current_chancellor))}</span>`:''}${st.power?`<span class="sd-pill">권한 ${esc(powerKo(st.power))}</span>`:''}</div>${control(v)}</section><aside class="sd-card sd-side"><h3>내 정보</h3>${roleCard(v)}</aside><section class="sd-card sd-main"><h3>참가자</h3>${players(st)}</section><aside class="sd-card sd-side"><h3>공개 진행 기록</h3>${history(st)}</aside></div><div class="sd-license">Secret Hitler was created by Mike Boxleiter, Tommy Maranges, and Mac Schubert and is licensed under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noreferrer">CC BY-NC-SA 4.0</a>. This BoardMate implementation is a non-commercial adaptation of the base game. <a href="https://www.secrethitler.com/" target="_blank" rel="noreferrer">Original game</a>.</div>`;bind(v);}
try{ctx=await boot(GAME);if(ctx.members.length<5||ctx.members.length>10)fatal('시크릿 히틀러는 5~10인입니다.');draw(await getView());stop=startPolling(v=>draw(v),{interval:900});window.addEventListener('beforeunload',()=>stop?.());}catch(e){console.error(e);fatal(e.message||'시크릿 히틀러를 열 수 없습니다.');}
</script></body></html>
