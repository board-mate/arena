<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BoardMate Online · 노터치 크라켄</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><style>
:root{font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;color:#f1faee;background:#0b1523}*{box-sizing:border-box}body{margin:0;background:#0b1523;color:#f1faee}button{font:inherit;cursor:pointer}.bar{position:sticky;top:0;z-index:20;background:#07101c;padding:10px 14px;display:flex;justify-content:space-between;gap:10px}.bar a{color:white;text-decoration:none;font-weight:900}.wrap{width:min(1080px,calc(100% - 20px));margin:16px auto}.card{background:#152238;border:1px solid #1f3557;border-radius:16px;padding:15px;margin-bottom:12px}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.player{border:2px solid #1f3557;border-radius:12px;padding:10px;background:#111c2d}.player.actor{border-color:#ffd166;box-shadow:0 0 14px #ffd16633}.player h3{margin:0 0 7px;font-size:15px}.cards{display:flex;gap:6px;flex-wrap:wrap}.hidden-card{width:48px;height:67px;border:1px solid #3e536e;background:#1d2d44;color:#fff;border-radius:6px;font-size:20px}.hidden-card.clickable:hover{border-color:#ffd166;transform:translateY(-3px)}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#243955;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}.secret{background:#0f1a2a;border:1px solid #2a6f97;border-radius:12px;padding:12px;line-height:1.6}.explorer{color:#48d6b3}.skeleton{color:#ff737c}.center{display:flex;gap:7px;flex-wrap:wrap}.revealed{min-width:70px;padding:8px;border-radius:9px;text-align:center;background:#26364e}.treasure{background:#6b4b17}.kraken{background:#641b20}.curse{background:#53165a}.setup{text-align:center;padding:20px}.setup .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:950}.primary{background:#00b4d8;color:#001219}.ghost{background:#33465f;color:white}.logs{max-height:170px;overflow:auto;background:#09111e;border-radius:10px;padding:9px;font-size:11px;color:#cbd5e1}.result{border-radius:13px;padding:15px;text-align:center;background:#17382f}.result.skel{background:#431c24}.note{font-size:11px;line-height:1.55;color:#aab8ca}@media(max-width:560px){.players{grid-template-columns:1fr}.hidden-card{width:44px;height:62px}}
</style></head><body><header class="bar"><span style="display:flex;gap:6px"><a href="./index.html#/">← 홈</a><a href="./index.html#/multi">다인플</a></span><b id="title">🐙 노터치 크라켄</b><span id="sync">연결 중…</span></header><main class="wrap"><div id="app">불러오는 중…</div></main><script type="module">
import {configured,roomId,getMe,loadRoom,loadState,saveState,startStatePoll,submitTeamMatch,ratingBadges,esc,showFatal} from './multi-common.js';
if(!configured()||!roomId)showFatal('Supabase 설정 또는 room 주소가 없습니다.');
const ROLE_CONFIG={3:{explorers:3,skeletons:2},4:{explorers:3,skeletons:2},5:{explorers:4,skeletons:2},6:{explorers:4,skeletons:2},7:{explorers:5,skeletons:3},8:{explorers:6,skeletons:3}};
const EXPLORE_CONFIG={3:{empty:11,treasure:3},4:{empty:15,treasure:4},5:{empty:19,treasure:5},6:{empty:23,treasure:6},7:{empty:27,treasure:7},8:{empty:31,treasure:8}};
let me,room,members,badges={},mySeat=-1,state=null,revision=0,saving=false,submitted=false;const clone=x=>JSON.parse(JSON.stringify(x));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function countComp(cards){const r={empty:0,treasure:0,curse:0,kraken:0};cards.forEach(c=>r[c.type]++);return r}
function setupState(){return{kind:'kraken-v5',setup:true,curseExp:false,over:false}}
function createGame(useCurse){const n=members.length,rc=ROLE_CONFIG[n],ec=EXPLORE_CONFIG[n],roles=[];for(let i=0;i<rc.explorers;i++)roles.push('탐험대');for(let i=0;i<rc.skeletons;i++)roles.push('스켈레톤');shuffle(roles);while(roles.length>n)roles.pop();const deck=[];for(let i=0;i<ec.empty;i++)deck.push({type:'empty',name:'빈 상자',icon:'📦'});deck.push({type:'kraken',name:'크라켄',icon:'🐙'});if(useCurse){let pool=[];for(let i=0;i<Math.max(0,ec.treasure-2);i++)pool.push('treasure');pool.push('curse','curse');shuffle(pool);const tp=['treasure','treasure','curse'];while(tp.length<n&&pool.length)tp.push(pool.pop());tp.forEach(x=>deck.push({type:x,name:x==='treasure'?'보물 상자':'선장의 저주',icon:x==='treasure'?'💎':'🏴‍☠️'}));}else for(let i=0;i<ec.treasure;i++)deck.push({type:'treasure',name:'보물 상자',icon:'💎'});shuffle(deck);const players=members.map((m,i)=>{const hand=deck.splice(0,5);return{user_id:m.user_id,role:roles[i],hand:shuffle(hand),knowledge:countComp(hand)}});return{kind:'kraken-v5',setup:false,curseExp:useCurse,round:1,actions:n,current:0,players,revealed:{empty:0,treasure:0,curse:0,kraken:0},history:[],targetTreasures:n,over:false,winner:null,reason:'',logs:[`탐험 시작 · ${members[0].nickname} 액션 마커`]}}
async function mutate(fn){if(saving||!state)return;saving=true;const next=clone(state);try{fn(next);const nr=await saveState(revision,next);revision=nr;state=next;render();document.querySelector('#sync').textContent='자동 저장됨';if(next.over)maybeSubmit()}catch(e){document.querySelector('#sync').textContent='재동기화 중';const row=await loadState();revision=row.revision;state=row.state;render()}finally{saving=false}}
function start(useCurse){if(room.host_id!==me.user_id||!state.setup)return;mutate(s=>{Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,createGame(useCurse))})}
function end(s,winner,reason){s.over=true;s.winner=winner;s.reason=reason;s.logs.unshift(reason)}
function nextRound(s){s.round++;s.actions=s.players.length;let rem=[];s.players.forEach(p=>{rem.push(...p.hand);p.hand=[]});shuffle(rem);const each=Math.floor(rem.length/s.players.length);s.players.forEach(p=>{p.hand=shuffle(rem.splice(0,each));p.knowledge=countComp(p.hand)});s.logs.unshift(`${s.round}라운드 시작 · 남은 카드를 다시 섞어 배분`) }
function reveal(target,idx){if(state.over||state.setup||state.current!==mySeat||target===mySeat)return;const card=state.players[target]?.hand[idx];if(!card)return;mutate(s=>{const c=s.players[target].hand.splice(idx,1)[0];s.players[target].knowledge=countComp(s.players[target].hand);s.history.push(c);s.revealed[c.type]++;s.actions--;s.logs.unshift(`${members[mySeat].nickname} → ${members[target].nickname}의 카드 공개: ${c.name}`);if(c.type==='kraken'){end(s,'skeletons','크라켄이 공개되어 스켈레톤 팀이 승리했습니다.');return}if(s.curseExp&&c.type==='curse'&&s.revealed.treasure===0){end(s,'skeletons','보물 상자가 하나도 공개되지 않은 상태에서 선장의 저주가 공개되었습니다.');return}if(s.revealed.treasure+s.revealed.curse>=s.targetTreasures){end(s,'explorers','필요한 보물을 모두 찾아 탐험대가 승리했습니다.');return}s.current=target;if(s.actions<=0){if(s.round>=4){end(s,'skeletons','4라운드가 끝날 때까지 보물을 모두 찾지 못했습니다.');return}nextRound(s)}})}
async function maybeSubmit(){if(submitted||room.host_id!==me.user_id||!state?.over||!state.winner)return;submitted=true;const winners=state.players.filter(p=>(state.winner==='explorers')===(p.role==='탐험대')).map(p=>p.user_id),losers=state.players.filter(p=>!winners.includes(p.user_id)).map(p=>p.user_id);try{await submitTeamMatch(winners,losers);document.querySelector('#sync').textContent='결과 반영 완료'}catch(e){if(!String(e.message).includes('already'))submitted=false}}
function render(){if(!state)return;document.querySelector('#title').textContent=`🐙 ${room.title}`;const app=document.querySelector('#app');if(state.setup){app.innerHTML=`<section class="card setup"><h2>노터치 크라켄 설정</h2><p>방장이 사용할 규칙을 고르면 즉시 시작합니다.</p>${room.host_id===me.user_id?`<div class="actions"><button class="btn primary" data-start="0">기본 게임 시작</button><button class="btn ghost" data-start="1">🏴‍☠️ 선장의 저주 포함</button></div>`:'<p>방장이 게임 규칙을 선택하는 중입니다.</p>'}<p class="note"></p></section>`;app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start==='1'));return}
const mep=state.players[mySeat],found=state.revealed.treasure+state.revealed.curse,actor=state.current===mySeat&&!state.over;app.innerHTML=`<section class="card"><div class="stats"><span class="pill">라운드 ${state.round}/4</span><span class="pill">남은 액션 ${state.actions}</span><span class="pill">보물 ${found}/${state.targetTreasures}</span><span class="pill">크라켄 ${state.revealed.kraken?'공개됨':'미발견'}</span></div><p style="text-align:center;font-weight:900">${state.over?'게임 종료':`현재 액션 마커: ${esc(members[state.current].nickname)}`}</p><div class="secret"><b>🔒 내 비밀 정보</b><div class="${mep.role==='탐험대'?'explorer':'skeleton'}">역할: <b>${mep.role}</b></div><small>현재 내 카드 구성 · 빈 상자 ${mep.knowledge.empty} / 보물 ${mep.knowledge.treasure}${state.curseExp?` / 저주 ${mep.knowledge.curse}`:''} / 크라켄 ${mep.knowledge.kraken}</small></div></section><section class="card"><div class="players">${state.players.map((p,i)=>`<div class="player ${i===state.current&&!state.over?'actor':''}"><h3>${esc(badges[p.user_id]?.text||'🥉 브론즈')} ${esc(members[i].nickname)}${i===mySeat?' · 나':''}</h3><div class="cards">${p.hand.map((_,j)=>`<button class="hidden-card ${actor&&i!==mySeat?'clickable':''}" data-target="${i}" data-card="${j}" ${!actor||i===mySeat?'disabled':''}>❓</button>`).join('')||'<small>카드 없음</small>'}</div></div>`).join('')}</div></section><section class="card"><h3>공개된 탐험 카드</h3><div class="center">${state.history.map(c=>`<div class="revealed ${c.type}">${c.icon}<br><small>${c.name}</small></div>`).join('')||'<span class="note">아직 공개된 카드가 없습니다.</span>'}</div></section>${state.over?`<section class="result ${state.winner==='skeletons'?'skel':''}"><h2>${state.winner==='explorers'?'🎉 탐험대 승리':'💀 스켈레톤 승리'}</h2><p>${esc(state.reason)}</p><div>${state.players.map((p,i)=>`${esc(members[i].nickname)} · ${p.role}`).join('<br>')}</div></section>`:''}<section class="card"><p class="note">액션 마커를 가진 플레이어는 자신의 카드가 아닌 다른 플레이어의 카드 1장을 공개합니다. 공개된 카드의 주인이 다음 액션 마커를 받습니다. 한 라운드에 플레이어 수만큼 액션을 진행하며, 라운드가 끝나면 남은 카드를 다시 섞어 균등 배분합니다. 크라켄 공개 또는 4라운드 종료는 스켈레톤 승리, 필요한 보물을 모두 찾으면 탐험대 승리입니다.</p><div class="logs">${state.logs.slice(0,50).map(x=>`<div>${esc(x)}</div>`).join('')}</div></section>`;app.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>reveal(Number(b.dataset.target),Number(b.dataset.card)));if(state.over)maybeSubmit()}
(async()=>{try{me=await getMe();if(!me)return showFatal('로그인이 필요합니다.');({room,members}=await loadRoom());if(room.game!=='kraken')return showFatal('노터치 크라켄 방이 아닙니다.');mySeat=members.findIndex(m=>m.user_id===me.user_id);if(mySeat<0)return showFatal('이 방의 참가자가 아닙니다.');badges=await ratingBadges('kraken',members.map(m=>m.user_id));const row=await loadState();revision=row.revision;state=row.state;if(!state&&room.host_id===me.user_id){state=setupState();revision=await saveState(0,state)}render();startStatePoll(async row=>{revision=row.revision;if(row.state){state=row.state;render()}},{interval:1000})}catch(e){showFatal(e.message)}})();
</script></body></html>
