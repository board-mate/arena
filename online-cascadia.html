<script type="module">
import {configured,roomId,getMe,loadRoom,loadState,saveState,startStatePoll,submitMatch,ratingBadges,showFatal} from './multi-common.js';
let initPromise=null,revision=0,room=null,members=[],me=null,badges={},callbacks=[],saveChain=Promise.resolve(),pending=0,submitted=false,pollStarted=false;
const clone=x=>JSON.parse(JSON.stringify(x));
async function init(){
  if(initPromise)return initPromise;
  initPromise=(async()=>{
    if(!configured()||!roomId)showFatal('Supabase 설정 또는 room 주소가 없습니다.');
    me=await getMe();if(!me)showFatal('로그인이 필요합니다.');
    ({room,members}=await loadRoom());if(room.game!=='cascadia')showFatal('캐스캐디아 방이 아닙니다.');
    const playerIndex=members.findIndex(m=>m.user_id===me.user_id);if(playerIndex<0)showFatal('이 방의 참가자가 아닙니다.');
    badges=await ratingBadges('cascadia',members.map(m=>m.user_id)).catch(()=>({}));
    const row=await loadState();revision=Number(row?.revision||0);
    if(row?.state && !(row.state.version===2 && Array.isArray(row.state.players) && row.state.players.every(p=>p&&p.board&&typeof p.board==='object'))) showFatal('이 방은 이전 캐스캐디아 저장 상태입니다. 새 버전은 새 방을 만들어 시작해 주세요.');
    const displayNames=members.map(m=>`${badges[m.user_id]?.text||'🥉'} ${m.nickname}`);
    const ctx={roomId,room,me,members,playerIndex,isHost:room.host_id===me.user_id,state:row?.state||null,displayNames};
    if(!pollStarted){pollStarted=true;startStatePoll(async r=>{revision=Math.max(revision,Number(r?.revision||0));if(r?.state&&pending===0)callbacks.forEach(cb=>{try{cb(clone(r.state));}catch(e){console.warn(e)}});},{interval:1100});}
    return ctx;
  })();return initPromise;
}
async function maybeSubmit(s){if(submitted||!s?.gameOver||!Array.isArray(s.finalOrder))return;const c=await init();if(!c.isHost)return;const order=s.finalOrder.map(i=>members[Number(i)]?.user_id).filter(Boolean);if(order.length!==members.length)return;submitted=true;try{await submitMatch(order);}catch(e){if(!String(e?.message||e).toLowerCase().includes('already')){submitted=false;console.warn('Cascadia match submit:',e)}}}
function save(snapshot){const snap=clone(snapshot);pending++;saveChain=saveChain.then(async()=>{try{const nr=await saveState(revision,snap);revision=Number(nr??revision+1);await maybeSubmit(snap);}catch(e){console.warn('Cascadia BoardMate save conflict:',e);try{const row=await loadState();revision=Number(row?.revision||revision);if(row?.state)callbacks.forEach(cb=>cb(clone(row.state)));}catch{}}finally{pending=Math.max(0,pending-1);}});return saveChain;}
window.BoardMateCascadiaBridge={init,save,subscribe(cb){callbacks.push(cb);return()=>{callbacks=callbacks.filter(x=>x!==cb);};}};
</script>

function randomRoomCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out=''; const a=new Uint32Array(6); crypto.getRandomValues(a);
  for(const n of a) out+=chars[n%chars.length];
  return out;
}
function loadPeerJS(){
  if(window.Peer)return Promise.resolve();
  if(net.scriptPromise)return net.scriptPromise;
  const urls=['https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js'];
  net.scriptPromise=new Promise((resolve,reject)=>{
    const tryLoad=i=>{
      if(i>=urls.length){net.scriptPromise=null;reject(new Error('PeerJS 로드 실패'));return;}
      const sc=document.createElement('script'); sc.src=urls[i]; sc.async=true;
      sc.onload=()=>window.Peer?resolve():tryLoad(i+1);
      sc.onerror=()=>{sc.remove();tryLoad(i+1)};
      document.head.appendChild(sc);
    };
    tryLoad(0);
  });
  return net.scriptPromise;
}
function cleanupNetwork(closePeer=true){
  if(closePeer){try{net.hostConn&&net.hostConn.close()}catch(e){}; try{net.clients.forEach(c=>c.close())}catch(e){}; try{net.peer&&net.peer.destroy()}catch(e){}}
  net.mode='local';net.role=null;net.peer=null;net.hostConn=null;net.clients=new Map();net.playerIndex=null;net.room=null;net.connected=false;net.lobby=null;net.suppressSync=false;net.status='';
}
function createOnlineRoom(){

function wireHostPeer(){
  net.peer.on('connection',conn=>{
    conn.on('data',msg=>handleHostMessage(conn,msg));
    conn.on('close',()=>{
      const idx=conn.playerIndex;
      if(idx!=null && net.lobby && !net.lobby.started){net.lobby.players[idx]=null;}
      net.clients.delete(conn.peer); broadcastLobby(); if(!state)renderOnlineLobby(); else renderGame();
    });
  });
}
function handleHostMessage(conn,msg){
  if(!msg||typeof msg!=='object')return;
  if(msg.type==='hello'){
    const requestedName=String(msg.name||'플레이어').slice(0,12);
    if(net.lobby?.started){
      const occupied=new Set([...net.clients.values()].map(c=>c.playerIndex));
      const slot=state?.players.findIndex((p,i)=>i>0&&p.name===requestedName&&!occupied.has(i))??-1;
      if(slot<0){conn.send({type:'reject',reason:'이미 시작된 게임입니다. 재접속하려면 기존 플레이어 이름을 정확히 입력하세요.'});return;}
      conn.playerIndex=slot; net.clients.set(conn.peer,conn);
      conn.send({type:'welcome',playerIndex:slot,room:net.room,lobby:net.lobby}); conn.send({type:'state',state}); renderGame(); return;
    }
    if(net.lobby.players.some(n=>n===requestedName)){conn.send({type:'reject',reason:'이미 사용 중인 이름입니다. 다른 이름으로 참가하세요.'});return;}
    const slot=net.lobby.players.findIndex((x,i)=>i>0&&!x);
    if(slot<0){conn.send({type:'reject',reason:'방이 가득 찼습니다.'});return;}
    conn.playerIndex=slot; net.clients.set(conn.peer,conn); net.lobby.players[slot]=requestedName;
    conn.send({type:'welcome',playerIndex:slot,room:net.room,lobby:net.lobby}); broadcastLobby(); renderOnlineLobby(); return;
  }
  if(msg.type==='state' && state && conn.playerIndex===state.current){
    const incoming=msg.state;
    if(!incoming||incoming.players?.length!==state.players.length)return;
    net.suppressSync=true; state=incoming; net.suppressSync=false; viewPlayer=net.playerIndex; broadcastState(); renderGame();
  }
}

function handleGuestMessage(msg){

function makeDeck(){
  const deck=[]; let id=1;
  // 25 keystone tiles: five per habitat, balanced across wildlife.
  HABS.forEach((h,hi)=>{
    for(let j=0;j<5;j++) deck.push({id:id++, habitats:[h], wildlife:[WILDS[(hi+j)%5]], keystone:true, rotation:0});
  });
  // 60 dual-habitat tiles: six for each of the ten habitat pairs.
  let pairNo=0;
  for(let a=0;a<HABS.length;a++) for(let b=a+1;b<HABS.length;b++){
    for(let j=0;j<6;j++){
      const cnt=(j%3===0)?3:2;
      const start=(pairNo*2+j)%5;
      const allowed=[]; for(let k=0;k<cnt;k++) allowed.push(WILDS[(start+k*2)%5]);
      deck.push({id:id++, habitats:[HABS[a],HABS[b]], wildlife:[...new Set(allowed)], keystone:false, rotation:Math.floor(Math.random()*6)});
    }
    pairNo++;
  }
  return shuffle(deck);
}

function makeWildlifeBag(){
  const bag=[]; WILDS.forEach(w=>{for(let i=0;i<20;i++)bag.push(w)}); return shuffle(bag);
}

const STARTERS = [
  [
    {habitats:['forest','river'],wildlife:['bear','salmon','fox']},
    {habitats:['mountain','wetland'],wildlife:['hawk','bear']},
    {habitats:['prairie'],wildlife:['elk','fox','hawk']}
  ],[
    {habitats:['mountain','forest'],wildlife:['bear','hawk']},
    {habitats:['wetland','river'],wildlife:['salmon','fox','hawk']},
    {habitats:['prairie','forest'],wildlife:['elk','fox']}
  ],[
    {habitats:['mountain','prairie'],wildlife:['elk','bear','fox']},
    {habitats:['river','forest'],wildlife:['salmon','hawk']},
    {habitats:['wetland'],wildlife:['salmon','fox','bear']}
  ],[
    {habitats:['mountain','river'],wildlife:['salmon','bear','hawk']},
    {habitats:['forest','wetland'],wildlife:['fox','bear']},
    {habitats:['prairie'],wildlife:['elk','hawk','fox']}
  ],[
    {habitats:['mountain'],wildlife:['hawk','bear']},
    {habitats:['forest','prairie'],wildlife:['elk','fox','bear']},
    {habitats:['wetland','river'],wildlife:['salmon','hawk','fox']}
  ]
];

function starterBoard(index){
  const tpl=STARTERS[index%STARTERS.length];
  const coords=[[0,0],[1,0],[0,1]];
  const board={};
  coords.forEach(([q,r],i)=>board[key(q,r)]={...clone(tpl[i]),id:`S${index}-${i}`,keystone:false,rotation:(index+i)%6,wildlifeToken:null,q,r,starter:true});
  return board;
}

function startNewGame(){

function initGame(names,scoreMode){
  const playerCount=names.length;
  const allDeck=makeDeck();
  const tileCount={2:43,3:63,4:83}[playerCount];
  const deck=allDeck.slice(0,tileCount);
  const bag=makeWildlifeBag();
  const starters=shuffle([0,1,2,3,4]);
  const market=Array.from({length:4},()=>({tile:deck.pop(),token:bag.pop()}));
  state={version:2,players:names.map((name,i)=>({name,nature:0,turns:0,board:starterBoard(starters[i])})),
    current:0,totalMoves:0,scoreMode,deck,bag,market,natureSupply:25,phase:'draft',pending:null,splitMode:false,splitTile:null,splitToken:null,replaceMode:false,tripleUsed:false,lastSnapshot:null,message:'선택지에서 타일+동물 한 쌍을 고르세요.',gameOver:false};
  resolveFourDuplicates(); viewPlayer=net.mode==='online'&&net.playerIndex!=null?net.playerIndex:0; replaceSelection.clear(); saveGame(); renderGame();
}

function saveGame(){
  if(!state)return;
  if(bmCtx){window.BoardMateCascadiaBridge?.save(state);return;}
  if(net.mode==='local') localStorage.setItem(SAVE_KEY,JSON.stringify(state));
  if(net.mode==='online'&&!net.suppressSync){
    if(net.role==='host') broadcastState();
    else if(net.role==='guest'&&net.hostConn?.open) net.hostConn.send({type:'state',state});
  }
}
function loadGame(){
  try{cleanupNetwork(true);state=JSON.parse(localStorage.getItem(SAVE_KEY)); if(!state||!state.players)throw new Error(); viewPlayer=state.current; replaceSelection.clear(); renderGame();}
  catch(e){localStorage.removeItem(SAVE_KEY); alert('저장 데이터를 불러오지 못했습니다.'); showSetup();}
}
function canAct(){return net.mode!=='online'||(net.connected&&net.playerIndex===state?.current)}
function requireTurn(){if(canAct())return true;flash('지금은 내 차례가 아닙니다.');return false;}

function snapshot(){ const s=clone(state); s.lastSnapshot=null; return s; }
function setLastSnapshot(){ state.lastSnapshot=snapshot(); }
function undoLast(){ if(!requireTurn())return; if(!state.lastSnapshot)return; const restore=state.lastSnapshot; state=restore; viewPlayer=state.current; replaceSelection.clear(); saveGame(); renderGame(); flash('최근 행동을 되돌렸습니다.'); }

function currentPlayer(){return state.players[state.current]}
function drawToken(){ return state.bag.length?state.bag.pop():null; }
function returnTokens(tokens){ state.bag.push(...tokens.filter(Boolean)); shuffle(state.bag); }
function drawTile(){ return state.deck.length?state.deck.pop():null; }
function countsMarket(){const c={};state.market.forEach(s=>{if(s.token)c[s.token]=(c[s.token]||0)+1});return c}
function duplicateInfo(){ const c=countsMarket(); const entries=Object.entries(c).sort((a,b)=>b[1]-a[1]); return entries[0]||[null,0]; }

function replaceMarketTokens(indices, costNature=false){
  if(!indices.length)return;
  if(costNature){ if(currentPlayer().nature<1){flash('솔방울이 없습니다.');return false;} currentPlayer().nature--; state.natureSupply++; }
  const removed=[];
  indices.forEach(i=>{removed.push(state.market[i].token); state.market[i].token=null;});
  indices.forEach(i=>state.market[i].token=drawToken());
  returnTokens(removed);
  resolveFourDuplicates();
  return true;
}
function resolveFourDuplicates(){
  let guard=0;
  while(guard++<20){
    const [w,n]=duplicateInfo(); if(n!==4||!w)break;
    const removed=state.market.map(s=>s.token); state.market.forEach(s=>s.token=null); state.market.forEach(s=>s.token=drawToken()); returnTokens(removed);
  }
}
function tripleReplace(){
  if(!requireTurn())return;
  if(state.phase!=='draft'||state.tripleUsed)return;
  const [w,n]=duplicateInfo(); if(n!==3)return;

function axialToPixel(q,r){return {x:R*SQ3*(q+r/2),y:R*1.5*r}}
function hexPoints(cx,cy,rr){const pts=[];for(let i=0;i<6;i++){const a=(-30+i*60)*Math.PI/180;pts.push(`${(cx+rr*Math.cos(a)).toFixed(2)},${(cy+rr*Math.sin(a)).toFixed(2)}`)}return pts.join(' ')}
function halfPointsRight(cx,cy,rr){ const p=[];[-90,-30,30,90].forEach(deg=>{const a=deg*Math.PI/180;p.push(`${(cx+rr*Math.cos(a)).toFixed(2)},${(cy+rr*Math.sin(a)).toFixed(2)}`)});return p.join(' ')}
function halfPointsLeft(cx,cy,rr){ const p=[];[90,150,210,270].forEach(deg=>{const a=deg*Math.PI/180;p.push(`${(cx+rr*Math.cos(a)).toFixed(2)},${(cy+rr*Math.sin(a)).toFixed(2)}`)});return p.join(' ')}
function gradientDef(){return ''}
function tileShapeSVG(tile,cx,cy,rr,id,board=true){
  const stroke=tile.starter?'#756646':'#ffffff';
  if(tile.habitats.length===1){return `<polygon points="${hexPoints(cx,cy,rr)}" fill="${HABITATS[tile.habitats[0]].color}" stroke="${stroke}" stroke-width="3"/>`;}
  const [a,b]=tile.habitats; const rot=(tile.rotation||0)*60;
  return `<g transform="rotate(${rot} ${cx} ${cy})"><polygon points="${halfPointsLeft(cx,cy,rr)}" fill="${HABITATS[a].color}"/><polygon points="${halfPointsRight(cx,cy,rr)}" fill="${HABITATS[b].color}"/></g><polygon points="${hexPoints(cx,cy,rr)}" fill="none" stroke="${stroke}" stroke-width="3"/>`;
}
function edgeTerrain(cell,edge){
  if(cell.habitats.length===1)return cell.habitats[0];
  const rel=(edge-(cell.rotation||0)+6)%6; return [5,0,1].includes(rel)?cell.habitats[1]:cell.habitats[0];
}

function renderBoard(){

  const points=[...cells.map(c=>axialToPixel(c.q,c.r)),...ghosts.map(c=>axialToPixel(c.q,c.r))];
  let minX=-150,maxX=150,minY=-150,maxY=150; if(points.length){minX=Math.min(...points.map(p=>p.x))-R*2;maxX=Math.max(...points.map(p=>p.x))+R*2;minY=Math.min(...points.map(p=>p.y))-R*2;maxY=Math.max(...points.map(p=>p.y))+R*2;}
  const width=Math.max(500,maxX-minX),height=Math.max(420,maxY-minY); svg.setAttribute('viewBox',`${minX} ${minY} ${width} ${height}`);
  const pendingWild=(viewPlayer===state.current&&state.phase==='placeWildlife'&&state.pending)?state.pending.token:null;
  let html='';
  cells.forEach(cell=>{
    const {x,y}=axialToPixel(cell.q,cell.r); const validWild=pendingWild&&!cell.wildlifeToken&&cell.wildlife.includes(pendingWild); const id=`cell-${viewPlayer}-${cell.q}-${cell.r}`;
    html+=`<g class="hex-cell" data-cell="${cell.q},${cell.r}">${tileShapeSVG(cell,x,y,R,id,true)}
      <text x="${x}" y="${y-10}" text-anchor="middle" font-size="10" font-weight="900" fill="#243329">${cell.habitats.map(h=>HABITATS[h].name[0]).join('·')}${cell.keystone?' ★':''}</text>
      <text x="${x}" y="${y+7}" text-anchor="middle" font-size="${cell.wildlifeToken?25:13}">${cell.wildlifeToken?WILDLIFE[cell.wildlifeToken].icon:cell.wildlife.map(w=>WILDLIFE[w].icon).join('')}</text>
      ${validWild?`<polygon data-wild="${cell.q},${cell.r}" class="wild-target" points="${hexPoints(x,y,R-3)}" fill="rgba(255,255,255,.01)"/>`:''}
    </g>`;
  });
  ghosts.forEach(g=>{
    const {x,y}=axialToPixel(g.q,g.r);
    if(state.pending?.tile){
      const preview=clone(state.pending.tile); preview.rotation=state.pending.rotation;
      html+=`<g class="preview-pos" data-place="${g.q},${g.r}"><g class="pending-preview">${tileShapeSVG(preview,x,y,R-3,`prev-${g.q}-${g.r}`,true)}<text x="${x}" y="${y-7}" text-anchor="middle" font-size="9" font-weight="900" fill="#243329">${preview.habitats.map(h=>HABITATS[h].name[0]).join('·')}${preview.keystone?' ★':''}</text><text x="${x}" y="${y+10}" text-anchor="middle" font-size="12">${preview.wildlife.map(w=>WILDLIFE[w].icon).join('')}</text></g><polygon class="preview-hit" points="${hexPoints(x,y,R-2)}"/></g>`;
    } else html+=`<polygon data-place="${g.q},${g.r}" class="ghost" points="${hexPoints(x,y,R-2)}"/>`;
  });
  svg.innerHTML=html;
  $$('[data-place]').forEach(el=>el.onclick=()=>{const [q,r]=el.dataset.place.split(',').map(Number);placeTile(q,r)});
  $$('[data-wild]').forEach(el=>el.onclick=()=>{const [q,r]=el.dataset.wild.split(',').map(Number);placeWildlife(q,r)});
  $('#boardOwner').textContent=`${player.name}의 생태계`;
  $('#viewOnly').classList.toggle('hidden',viewPlayer===state.current);
  $('#boardScoreMini').textContent=`타일 ${cells.length} · 동물 ${cells.filter(c=>c.wildlifeToken).length}`;
}

function renderHabScores(){
  const box=$('#habScores'); if(!box)return; const s=habitatScores(state.players[viewPlayer]);
  box.innerHTML=HABS.map(h=>`<span><i class="terrain-dot" style="background:${HABITATS[h].color}"></i>${HABITATS[h].name}</span><b>${s[h]}</b>`).join('');
}

function connectedComponentsByToken(player,wild){
  const coords=Object.values(player.board).filter(c=>c.wildlifeToken===wild); const set=new Set(coords.map(c=>key(c.q,c.r))); const seen=new Set(), comps=[];
  for(const c of coords){const k0=key(c.q,c.r);if(seen.has(k0))continue;const comp=[],stack=[c];seen.add(k0);while(stack.length){const x=stack.pop();comp.push(x);DIRS.forEach(([dq,dr])=>{const nk=key(x.q+dq,x.r+dr);if(set.has(nk)&&!seen.has(nk)){seen.add(nk);stack.push(player.board[nk])}})}comps.push(comp)}return comps;
}
function habitatScores(player){
  const out={};
  HABS.forEach(h=>{
    const relevant=Object.values(player.board).filter(c=>c.habitats.includes(h)); const seen=new Set(); let best=0;
    for(const c of relevant){const k0=key(c.q,c.r);if(seen.has(k0))continue;let n=0,stack=[c];seen.add(k0);while(stack.length){const x=stack.pop();n++;DIRS.forEach(([dq,dr],d)=>{const nb=player.board[key(x.q+dq,x.r+dr)];if(!nb||!nb.habitats.includes(h))return;if(edgeTerrain(x,d)!==h||edgeTerrain(nb,(d+3)%6)!==h)return;const nk=key(nb.q,nb.r);if(!seen.has(nk)){seen.add(nk);stack.push(nb)}})}best=Math.max(best,n)}
    out[h]=best>=2?best:0;
  }); return out;
}

function familyWildScores(player, intermediate=false){
  const scores={}; WILDS.forEach(w=>{scores[w]=connectedComponentsByToken(player,w).reduce((sum,c)=>{const n=c.length; if(intermediate)return sum+(n===1?0:n===2?5:n===3?8:12); return sum+(n===1?2:n===2?5:9);},0)});return scores;
}
function bearAScore(player){const pairs=connectedComponentsByToken(player,'bear').filter(c=>c.length===2).length;return [0,4,11,19,27][Math.min(4,pairs)]}
function salmonAScore(player){
  const table=[0,2,5,8,12,16,20,25]; let score=0;
  for(const comp of connectedComponentsByToken(player,'salmon')){let valid=true;for(const c of comp){let deg=0;DIRS.forEach(([dq,dr])=>{const nb=player.board[key(c.q+dq,c.r+dr)];if(nb&&nb.wildlifeToken==='salmon')deg++});if(deg>2){valid=false;break}}if(valid)score+=table[Math.min(7,comp.length)]}
  return score;
}
function hawkAScore(player){
  let n=0;for(const c of Object.values(player.board).filter(c=>c.wildlifeToken==='hawk')){const adj=DIRS.some(([dq,dr])=>{const nb=player.board[key(c.q+dq,c.r+dr)];return nb&&nb.wildlifeToken==='hawk'});if(!adj)n++}const table=[0,2,5,8,11,14,18,22,26];return table[Math.min(8,n)];
}
function foxAScore(player){
  let score=0;for(const c of Object.values(player.board).filter(c=>c.wildlifeToken==='fox')){const types=new Set();DIRS.forEach(([dq,dr])=>{const nb=player.board[key(c.q+dq,c.r+dr)];if(nb&&nb.wildlifeToken)types.add(nb.wildlifeToken)});score+=Math.min(5,types.size)}return score;
}
function elkAScore(player){
  const elk=Object.values(player.board).filter(c=>c.wildlifeToken==='elk'); if(!elk.length)return 0; const idx=new Map(elk.map((c,i)=>[key(c.q,c.r),i]));
  const candMap=new Map(); const vals=[0,2,5,9,13];
  elk.forEach((c,i)=>candMap.set((1<<i)>>>0,{mask:(1<<i)>>>0,score:2}));
  const axes=[[1,0],[0,1],[1,-1]];
  for(const c of elk){for(const [dq,dr] of axes){for(let len=2;len<=4;len++){let mask=0,ok=true;for(let k=0;k<len;k++){const j=idx.get(key(c.q+dq*k,c.r+dr*k));if(j==null){ok=false;break}mask=(mask|(1<<j))>>>0;}if(ok)candMap.set(mask,{mask,score:vals[len]});}}}
  const cands=[...candMap.values()]; const byBit=Array.from({length:elk.length},()=>[]);cands.forEach(c=>{for(let i=0;i<elk.length;i++)if(c.mask&(1<<i))byBit[i].push(c)});
  const memo=new Map(); const full=elk.length>=31?0:((1<<elk.length)-1)>>>0;
  function dp(mask){if(mask===0)return 0;if(memo.has(mask))return memo.get(mask);let p=0;while(p<elk.length && !(mask&(1<<p)))p++;let best=0;for(const c of byBit[p])if((c.mask&mask)===c.mask)best=Math.max(best,c.score+dp((mask^c.mask)>>>0));memo.set(mask,best);return best}
  return dp(full);
}
function wildlifeScores(player){
  if(state.scoreMode==='family')return familyWildScores(player,false);if(state.scoreMode==='intermediate')return familyWildScores(player,true);
  return {bear:bearAScore(player),elk:elkAScore(player),salmon:salmonAScore(player),hawk:hawkAScore(player),fox:foxAScore(player)};
}

function majorityBonuses(habsByPlayer){
  const bonus=state.players.map(()=>Object.fromEntries(HABS.map(h=>[h,0]))); const n=state.players.length;
  HABS.forEach(h=>{const vals=habsByPlayer.map(x=>x[h]);const max=Math.max(...vals);if(max<=0)return;const leaders=vals.map((v,i)=>v===max?i:-1).filter(i=>i>=0);
    if(n===2){if(leaders.length===2){leaders.forEach(i=>bonus[i][h]=1)}else bonus[leaders[0]][h]=2;return;}
    if(leaders.length===1){bonus[leaders[0]][h]=3;const lower=vals.filter(v=>v<max);const second=Math.max(...lower);const seconds=vals.map((v,i)=>v===second?i:-1).filter(i=>i>=0);if(second>0&&seconds.length===1)bonus[seconds[0]][h]=1;}
    else if(leaders.length===2)leaders.forEach(i=>bonus[i][h]=2);else leaders.forEach(i=>bonus[i][h]=1);
  });return bonus;
}
function computeScores(){
  const h=state.players.map(habitatScores); const b=majorityBonuses(h);
  return state.players.map((p,i)=>{const w=wildlifeScores(p);const wildTotal=Object.values(w).reduce((a,x)=>a+x,0);const habTotal=Object.values(h[i]).reduce((a,x)=>a+x,0);const bonusTotal=Object.values(b[i]).reduce((a,x)=>a+x,0);const total=wildTotal+habTotal+bonusTotal+p.nature;return {name:p.name,wild:w,wildTotal,hab:h[i],habTotal,bonus:b[i],bonusTotal,nature:p.nature,total}});
}
function showScores(){
  const scores=computeScores();const max=Math.max(...scores.map(s=>s.total));let winners=scores.filter(s=>s.total===max);if(winners.length>1){const pine=Math.max(...winners.map(s=>s.nature));winners=winners.filter(s=>s.nature===pine)}
  const winnerNames=winners.map(s=>s.name).join(', ');
  const header=state.players.map(p=>`<th>${esc(p.name)}</th>`).join('');
  const rows=[];
  WILDS.forEach(w=>rows.push(`<tr><td>${WILDLIFE[w].icon} ${WILDLIFE[w].name}</td>${scores.map(s=>`<td>${s.wild[w]}</td>`).join('')}</tr>`));
  rows.push(`<tr><td><b>동물 소계</b></td>${scores.map(s=>`<td><b>${s.wildTotal}</b></td>`).join('')}</tr>`);
  HABS.forEach(h=>rows.push(`<tr><td>${HABITATS[h].name} 연결 / 보너스</td>${scores.map(s=>`<td>${s.hab[h]} + ${s.bonus[h]}</td>`).join('')}</tr>`));
  rows.push(`<tr><td><b>서식지 소계</b></td>${scores.map(s=>`<td><b>${s.habTotal+s.bonusTotal}</b></td>`).join('')}</tr>`);
  rows.push(`<tr><td>남은 솔방울</td>${scores.map(s=>`<td>${s.nature}</td>`).join('')}</tr>`);
  rows.push(`<tr><td><b>최종 점수</b></td>${scores.map(s=>`<td class="${s.total===max?'winner':''}"><b>${s.total}</b></td>`).join('')}</tr>`);
  showModal(`<h2>최종 점수</h2><div class="notice good"><b>승자: ${esc(winnerNames)}</b><br>동점이면 남은 솔방울이 많은 플레이어가 승리하고, 그래도 같으면 공동 승리입니다.</div><div class="score-scroll" style="margin-top:12px"><table class="score-table"><thead><tr><th>항목</th>${header}</tr></thead><tbody>${rows.join('')}</tbody></table></div><div class="footer-note">서식지 연결은 타일의 맞닿는 면에서 같은 지형이 이어질 때만 연결로 계산합니다. 본 구현은 A/초심자/중급 동물 점수를 자동 계산합니다.</div>`,`<button class="secondary" id="closeScore">닫기</button><button class="primary" id="restartScore">새 게임</button>`);
  $('#closeScore').onclick=closeModal;$('#restartScore').textContent=bmCtx?'방으로 돌아가기':'새 게임';$('#restartScore').onclick=()=>{if(bmCtx){location.href=`./index.html#/room/${encodeURIComponent(bmCtx.roomId)}`;return;}closeModal();localStorage.removeItem(SAVE_KEY);cleanupNetwork(true);state=null;showSetup();};
}

function showRules(){
  showModal(`<h2>다인 플레이 규칙 요약</h2>
  <h3>준비</h3><p>2/3/4명은 각각 43/63/83개의 서식지 타일을 사용합니다. 공용 선택지에는 항상 서식지 타일 4개와 동물 토큰 4개를 한 쌍씩 놓습니다. 각 플레이어는 시작 서식지 1개(이 구현에서는 3개의 연결된 시작 헥스)를 받습니다.</p>
  <h3>차례</h3><ol><li>공용 선택지의 타일+동물 한 쌍을 가져옵니다.</li><li>새 타일은 기존 타일과 적어도 한 면이 닿게 놓습니다. 회전은 배치 전 자유롭게 할 수 있습니다.</li><li>동물은 비어 있고 해당 동물 표시가 있는 서식지에 놓습니다. 원하지 않거나 놓을 수 없으면 주머니로 반환할 수 있습니다.</li><li>선택지의 빈 타일/토큰을 같은 자리에서 보충합니다.</li></ol>
  <h3>과잉 공급과 솔방울</h3><p>동물 토큰 4개가 모두 같으면 전부 자동 교체합니다. 3개가 같으면 차례 플레이어가 그 3개를 한 번 교체할 수 있습니다. 솔방울 1개를 쓰면 (1) 서로 다른 열에서 타일 1개와 토큰 1개를 골라 가져오거나, (2) 원하는 수의 동물 토큰을 교체할 수 있습니다.</p>
  <h3>종료 및 점수</h3><p>각 플레이어는 정확히 20차례를 진행합니다. 동물 점수 + 지형별 가장 큰 연결 구역 + 지형 상위권 보너스 + 남은 솔방울(개당 1점)을 합산합니다. 2명은 각 지형 1위 2점(동률 각 1점), 3-4명은 1위 3점·2위 1점이며 동률 규칙도 자동 반영합니다.</p>
  <h3>온라인 플레이</h3><p>${bmCtx?'BoardMate 방에서는 Supabase 공유 상태에 행동마다 자동 저장되며, 브라우저를 닫았다가 같은 방으로 다시 들어와 이어할 수 있습니다.': '온라인 모드는 정적 호스팅에서도 동작하도록 WebRTC P2P를 사용합니다. 방장이 방 코드를 만들고, 참가자는 같은 페이지에서 코드를 입력합니다. 방장 브라우저가 게임 상태 동기화의 중심이므로 방장 탭이 닫히면 게임 연결이 종료됩니다.'}</p><h3>이 HTML의 지원 범위</h3><p>정식 첫 게임에 권장되는 A 점수카드 세트와 초심자/중급 변형의 동물 점수를 자동 계산합니다. B/C/D 카드의 다양한 도형 점수는 이 단일 HTML 버전에는 아직 포함하지 않았습니다.</p>`,`<button class="primary" id="closeRules">확인</button>`);$('#closeRules').onclick=closeModal;
}
function showModal(body,actions){document.getElementById('modalRoot').innerHTML=`<div class="modal-back"><div class="modal">${body}<div class="modal-actions">${actions||'<button class="primary" id="closeModal">닫기</button>'}</div></div></div>`;if($('#closeModal'))$('#closeModal').onclick=closeModal;}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function flash(msg){
  let el=document.getElementById('flashToast');if(!el){el=document.createElement('div');el.id='flashToast';el.style.cssText='position:fixed;z-index:200;left:50%;top:68px;transform:translateX(-50%);background:#26352c;color:white;padding:9px 14px;border-radius:999px;font:700 12px system-ui;box-shadow:0 8px 25px rgba(0,0,0,.24);';document.body.appendChild(el)}el.textContent=msg;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',2300);
}

document.addEventListener('keydown',e=>{if(!state)return;if(e.key.toLowerCase()==='r'&&state.phase==='placeTile'){rotatePending(1);e.preventDefault()}if(e.key==='Escape'&&document.querySelector('.modal-back'))closeModal();});
if(new URLSearchParams(location.search).get('room')) startBoardMateMode().catch(e=>{console.error(e);document.getElementById('app').innerHTML=`<main class="screen"><section class="setup-card" style="max-width:720px;margin:8vh auto"><h2>게임을 열 수 없습니다.</h2><div class="online-note">${esc(e.message||String(e))}</div><div class="setup-actions"><button class="secondary" onclick="location.href='./index.html#/multi'">다인플 목록</button></div></section></main>`;}); else showSetup();
})();
