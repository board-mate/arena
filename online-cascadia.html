function initialState(){const n=members.length,all=makeFullHabitatDeck(),need=n*20+3,deck=all.slice(0,need),animalBag=makeAnimalBag(),market=[];for(let i=0;i<4;i++)market.push({tile:deck.pop(),animal:animalBag.pop()});const s={kind:'cascadia-v7-beginner',current:0,turnNo:1,phase:'choose',deck,animalBag,market,ecos:members.map((_,i)=>starter(i)),pinecones:Array(n).fill(0),turns:Array(n).fill(0),pending:null,over:false,scores:null,finalOrder:null,logs:[`게임 시작 · 공식 초심자 동물 점수 카드 · ${members[0].nickname} 선`]};normalizeFour(s);return s}
function countThree(s){const vals=s.market.map(x=>x?.animal),counts={};vals.forEach(v=>counts[v]=(counts[v]||0)+1);return Object.entries(counts).find(([,n])=>n===3)?.[0]||null}
function validHabitatSpots(eco){const out=new Set();for(const k of Object.keys(eco))for(const n of neighbors(k))if(!eco[n])out.add(n);return [...out]}
function validAnimalSpots(eco,animal){return Object.keys(eco).filter(k=>{const t=eco[k];return !t.animal&&t.animals.includes(animal)})}

function choosePair(hIdx,aIdx,usePine=false){if(state.over||state.current!==mySeat||state.phase!=='choose')return;if(hIdx<0||aIdx<0||!state.market[hIdx]?.tile||!state.market[aIdx]?.animal)return;if(hIdx!==aIdx&&!usePine)return;if(hIdx!==aIdx&&state.pinecones[mySeat]<1)return;mutate(s=>{if(hIdx!==aIdx)s.pinecones[mySeat]--;const tile=s.market[hIdx].tile,animal=s.market[aIdx].animal;s.market[hIdx].tile=null;s.market[aIdx].animal=null;s.pending={tile,animal};s.phase='placeHabitat';s.logs.unshift(`${members[mySeat].nickname}: ${hIdx===aIdx?'선택지 1쌍':'솔방울로 조합 분리'} 선택`)})}

function render(){if(!state)return;document.querySelector('#title').textContent=`🌲 ${room.title}`;if(viewSeat>=members.length)viewSeat=mySeat;const app=document.querySelector('#app'),myTurn=state.current===mySeat&&!state.over,eco=state.ecos[viewSeat],score=state.over?state.scores[viewSeat]:rawScore(eco,state.pinecones[viewSeat]),three=countThree(state);app.innerHTML=`<section class="card"><div class="players">${members.map((m,i)=>`<div class="player ${i===state.current&&!state.over?'active':''}"><b>${esc(badges[m.user_id]?.text||'🥉')} ${esc(m.nickname)}${i===mySeat?' · 나':''}</b><small>${state.turns[i]}/20턴 · 솔방울 ${state.pinecones[i]}${state.over?` · ${state.scores[i].total}점`:''}</small></div>`).join('')}</div><div class="status">턴 ${state.turnNo} · ${state.over?'게임 종료':`${esc(members[state.current].nickname)} 차례 · ${state.phase==='choose'?'선택지 고르기':state.phase==='placeHabitat'?'서식지 타일 배치':'동물 토큰 배치'}`}</div></section><div class="main"><section><section class="card"><h3 style="margin-top:0">선택지 4쌍</h3><div class="market">${state.market.map((p,i)=>`<div class="pair"><button class="hab-card" style="${habitatStyle(p.tile)}" data-hab="${i}" ${!myTurn||state.phase!=='choose'?'disabled':''}>${p.tile.habitats.map(x=>H.find(h=>h.id===x).name).join(' / ')}${p.tile.special?' · 🌲':''}<small>${p.tile.animals.map(x=>A.find(a=>a.id===x).icon).join('')} 배치 가능</small></button><button class="animal-token ${rerollSet.has(i)?'pick':''}" data-animal="${i}" ${!myTurn||state.phase!=='choose'?'disabled':''}>${A.find(a=>a.id===p.animal)?.icon||'?'}</button><button class="btn primary" data-pair="${i}" ${!myTurn||state.phase!=='choose'?'disabled':''}>이 쌍 선택</button></div>`).join('')}</div>${myTurn&&state.phase==='choose'?`<div class="pine-actions"><button class="btn gold" id="splitBtn" ${state.pinecones[mySeat]<1?'disabled':''}>🌲 조합 분리 ${splitMode?'취소':'사용'}</button>${three?`<button class="btn" id="rerollThree">과잉 공급 3개 교체 (${A.find(a=>a.id===three).name})</button>`:''}<button class="btn" id="pineReroll" ${state.pinecones[mySeat]<1||!rerollSet.size?'disabled':''}>🌲 선택 동물 ${rerollSet.size}개 교체</button></div>${splitMode?`<div class="pending"><b>솔방울 1개 사용 · 서식지와 동물을 따로 선택</b><p>서식지 ${splitHab+1}번 / 동물 ${splitAni+1}번</p><button class="btn primary" id="confirmSplit">이 조합 가져오기</button></div>`:''}`:''}${myTurn&&state.phase==='placeHabitat'?`<div class="pending"><b>서식지 타일 방향</b><p>두 지형 타일은 회전 방향에 따라 연결되는 면이 달라집니다.</p><button class="btn" id="rotateHab">↻ 60° 회전 (${pendingRot*60}°)</button></div>`:''}</section><div class="view-tabs">${members.map((m,i)=>`<button data-view="${i}" class="${i===viewSeat?'active':''}">${esc(m.nickname)}</button>`).join('')}</div><section class="card"><div class="legend">${H.map(h=>`<span style="background:${h.color};color:white">${h.name}</span>`).join('')}</div><div class="eco-wrap"><div id="eco" class="eco"></div></div>${myTurn&&state.phase==='placeAnimal'?`<div class="pending"><b>${A.find(a=>a.id===state.pending.animal).icon} 동물 토큰 배치</b><p>해당 동물 그림이 있고 비어 있는 서식지 타일을 누르세요. 놓지 않으려면 주머니로 돌려놓을 수 있습니다.</p><button class="btn" id="discardAnimal">동물 토큰 돌려놓기</button></div>`:''}${state.over?`<div class="final"><b>최종 순위</b><br>${state.finalOrder.map((i,n)=>`${n+1}위 ${esc(members[i].nickname)} · ${state.scores[i].total}점`).join('<br>')}</div>`:''}</section></section><aside><section class="card"><h3 style="margin-top:0">${esc(members[viewSeat].nickname)} 점수</h3><div class="score"><span>동물 (초심자 카드)</span><b>${score.animalTotal}</b><span>가장 큰 광역 지형</span><b>${score.habitatTotal}</b><span>광역 지형 상위권</span><b>${score.bonus||0}</b><span>남은 솔방울</span><b>${score.pine}</b><span>합계</span><b>${score.total}</b></div><p class="note">공식 초심자 변형을 사용합니다. 같은 종류 동물 무리는 1마리 2점, 2마리 5점, 3마리 이상 9점입니다. 각 지형은 가장 큰 연결 영역만 계산합니다.</p></section><section class="card"><h3 style="margin-top:0">차례 규칙</h3><p class="note">서식지 타일+동물 토큰 4쌍 중 하나를 가져옵니다. 서식지는 기존 생태계와 한 면 이상 붙여 놓고, 동물은 해당 동물 그림이 있는 빈 타일에 놓습니다. 솔방울은 조합을 분리하거나 동물 토큰을 교체할 때 쓸 수 있습니다.</p></section><section class="card"><h3 style="margin-top:0">로그</h3><div class="logs">${state.logs.slice(0,50).map(x=>`<div>${esc(x)}</div>`).join('')}</div></section></aside></div>`;
 const board=app.querySelector('#eco');for(const k of Object.keys(eco)){const t=eco[k],d=document.createElement('div'),p=pos(k,eco);d.className='hex';d.style.cssText=`left:${p.x}px;top:${p.y}px;${habitatStyle(t)}`;d.innerHTML=hexHtml(t);if(viewSeat===mySeat&&myTurn&&state.phase==='placeAnimal'&&validAnimalSpots(eco,state.pending.animal).includes(k))d.onclick=()=>placeAnimal(k);board.appendChild(d)}if(viewSeat===mySeat&&myTurn&&state.phase==='placeHabitat')for(const k of validHabitatSpots(eco)){const d=document.createElement('div'),p=pos(k,eco);d.className='hex empty';d.style.cssText=`left:${p.x}px;top:${p.y}px`;d.textContent='＋';d.onclick=()=>placeHabitat(k);board.appendChild(d)}
 app.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{viewSeat=Number(b.dataset.view);render()});app.querySelectorAll('[data-pair]').forEach(b=>b.onclick=()=>choosePair(Number(b.dataset.pair),Number(b.dataset.pair),false));app.querySelectorAll('[data-hab]').forEach(b=>b.onclick=()=>{if(splitMode){splitHab=Number(b.dataset.hab);render()}});app.querySelectorAll('[data-animal]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.animal);if(splitMode){splitAni=i;render();return}if(rerollSet.has(i))rerollSet.delete(i);else rerollSet.add(i);render()});app.querySelector('#splitBtn')?.addEventListener('click',()=>{splitMode=!splitMode;render()});app.querySelector('#confirmSplit')?.addEventListener('click',()=>choosePair(splitHab,splitAni,true));app.querySelector('#rerollThree')?.addEventListener('click',rerollThree);app.querySelector('#pineReroll')?.addEventListener('click',rerollWithPine);app.querySelector('#discardAnimal')?.addEventListener('click',discardAnimal);app.querySelector('#rotateHab')?.addEventListener('click',()=>{pendingRot=(pendingRot+1)%6;render()});if(state.over){app.insertAdjacentHTML('beforeend',endPanel('캐스캐디아 종료','최종 점수와 순위가 반영되었습니다.'));maybeSubmit()}}
(async()=>{try{me=await getMe();if(!me)return showFatal('로그인이 필요합니다.');({room,members}=await loadRoom());if(room.game!=='cascadia')return showFatal('캐스캐디아 방이 아닙니다.');if(members.length<2||members.length>4)return showFatal('캐스캐디아는 2~4명이 필요합니다.');mySeat=members.findIndex(m=>m.user_id===me.user_id);if(mySeat<0)return showFatal('이 방의 참가자가 아닙니다.');viewSeat=mySeat;badges=await ratingBadges('cascadia',members.map(m=>m.user_id));const row=await loadState();revision=row.revision;state=row.state;if(!state&&room.host_id===me.user_id){state=initialState();revision=await saveState(0,state)}render();startStatePoll(async row=>{revision=row.revision;if(row.state){state=row.state;render()}},{interval:room.play_mode==='turn'?4000:1200})}catch(e){showFatal(e.message)}})();
</script></body></html>
