 ]},

  ['water','물대포','water',['water'],10,['up','back'],20],['shell','껍질에숨기','water',['water'],0,['back'],0,'reduce20'],['wave','물의파동','water',['water','water'],20,['up','left','right'],20],['shellatk','셸어택','water',['water','water','water'],30,['up','front','back'],0,'reduce20'],['bubble','버블광선','water',['water','water','water'],30,['up','front','back'],0,'energy-1'],['anger','하이드로앤거','water',['water','water','water','water'],40,['up','front','back'],0,'lastHp40+60'],['mud','머드숏','fight',['fight','colorless','colorless','colorless'],30,['up','left','right'],30]
 ]},
 pikachu:{name:'피카츄',type:'lightning',weak:'fight',faces:[['강철','격투'],['物','비행'],['번개','악'],['강철','격투'],['번개','번개'],['물','비행']],attacks:[

 ]},
 eevee:{name:'이브이',type:'colorless',weak:'fight',faces:[['불꽃','비행'],['풀','초'],['물','악'],['불꽃','비행'],['무색','무색'],['풀','초']],attacks:[
  ['tail','꼬리치기','colorless',['flying'],10,['up','left','right'],10],['tackle','몸통박치기','colorless',['flying','flying'],10,['up','front','left','right'],20],['rush','돌진','colorless',['flying','flying'],30,['up','front'],'self20',20],['bounce','바운스','colorless',['flying','flying','flying'],0,['up'],70],['dash','전력대시','colorless',['colorless','colorless','colorless','colorless','colorless'],40,['up','front','back'],40],['charm','애교부리기','psychic',['psychic'],20,['up','front','left','right'],0,'energy-2'],['bite','물어뜯기','dark',['dark','colorless','colorless'],10,['up','left','right'],20]
 ]},
 mew:{name:'뮤',type:'psychic',weak:'dark',faces:[['불꽃','초'],['물','격투'],['풀','악'],['불꽃','초'],['초','초'],['물','격투']],attacks:[
  ['psy','염동력','psychic',['psychic'],10,['up','left','right'],20],['beam','사이코광선','psychic',['psychic','psychic'],20,['up','down'],30],['barrier','배리어','psychic',['psychic','psychic'],0,['up','front'],0,'reduce50'],['skip','메모리 스킵','psychic',['psychic','psychic'],20,['up','left','right'],0,'forbid'],['shot','사이코숏','psychic',['psychic','psychic','psychic'],30,['up','down','front','back'],20],['kinetic','사이코키네시스','psychic',['psychic','psychic','psychic'],20,['up','front','back'],0,'mostEnergy10'],['reflection','리플렉션','psychic',['psychic','psychic','psychic','psychic'],0,['up','left','right'],0,'reflect']

};
// The 2026 starter dice faces are displayed in Korean above; the one accidental non-Korean
// label is normalized below so it cannot break energy matching.
STARTERS.pikachu.faces[1][0]='물';
const allStarter=Object.entries(STARTERS).map(([id,x])=>({id,...x}));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const faceToLabel=f=>DIR_KO[f]||f;
let me=null,room=null,members=[],mySeat=null,isHost=false,full=null,view=null,revision=0,saveBusy=false,subscribed=false,setupChoice=null,readyLocal=false,log=[],pollTimer=null,matchSubmitted=false;
const token=()=>localStorage.getItem('boardmate:member_session')||sessionStorage.getItem('boardmate:member_session')||'';
async function setupRpc(name,args={}){const sb=window.supabase?.createClient?.(window.BOARDMATE_CONFIG.supabaseUrl,window.BOARDMATE_CONFIG.supabaseAnonKey);if(!sb)throw new Error('Supabase 설정이 필요합니다.');const {data,error}=await sb.rpc(name,args);if(error)throw error;return data;}
const addLog=t=>{log=[t,...log].slice(0,80);const el=document.querySelector('#log');if(el)el.innerHTML=log.map(x=>`<div>• ${esc(x)}</div>`).join('');};
function attackSpec(a){return{effect:typeof a?.[6]==='string'?a[6]:null,charBonus:typeof a?.[6]==='number'?a[6]:(typeof a?.[7]==='number'?a[7]:0)};}
function energyCount(results){const c={};for(const pair of results||[]){for(const e of pair)c[e]=(c[e]||0)+1;}return c;}
function canPay(cost,count){const need={};cost.forEach(e=>need[e]=(need[e]||0)+1);let wild=count.colorless||0,def=0;for(const [e,n] of Object.entries(need)){const have=count[e]||0;def+=Math.max(0,n-have);}return def<=wild;}
function rollEnergy(pokemon,count){const faces=STARTERS[pokemon].faces;return Array.from({length:count},()=>faces[Math.floor(Math.random()*faces.length)].map(x=>ENERGY_LABEL_TO_KEY[x]||x));}
function rollDir(){return DIRS[Math.floor(Math.random()*DIRS.length)];}
function hpBar(hp){return `<div class="hpbar"><i style="width:${Math.max(0,Math.min(100,hp/MAX_HP*100))}%"></i></div>`;}
function buildShell(){document.querySelector('#app').innerHTML=`<div class="top"><div class="brand"><h1>🎲 프라코로</h1><p>BoardMate 공통 방 · 2인 온라인 · 주사위 포켓몬 배틀</p></div><div class="toolbar"><span class="badge" id="net">연결 확인 중…</span><a class="btn" href="./index.html#/room/${encodeURIComponent(room.id)}">← 방으로</a></div></div><section class="panel" id="main"></section><section class="panel"><div class="toolbar"><b>전투 로그</b><span class="small">공개된 전투 결과만 기록합니다.</span></div><div class="log" id="log"></div></section><section class="panel footer-note">프라코로는 BANDAI SPIRITS의 Pokémon 관련 공식 게임을 참고한 비공식 커뮤니티용 디지털 구현입니다. 본 BoardMate 버전은 2026 스타터 세트의 기본 전투 흐름을 중심으로 구현한 β 기능이며, 확장 세트와 커스텀 칩 편집은 포함하지 않습니다.</section>`;}
function renderSetup(){const mine=setupChoice||{pokemon:'pikachu',attacks:[]},ready=full?.setupReady||{};document.querySelector('#main').innerHTML=`<div class="toolbar"><div><h2 style="margin:.2em 0">게임 준비</h2><div class="turn-note">포켓몬 1마리 + 해당 포켓몬의 기술 카드 7장 중 4장을 선택하세요.</div></div><span class="badge">내 자리 ${mySeat+1}</span></div><div class="setup-grid"><section class="player-card"><h2>내 포켓몬</h2><div class="pokemon-grid">${allStarter.map(x=>`<button class="pkm ${mine.pokemon===x.id?'selected':''}" data-pkm="${x.id}"><b>${x.name}</b><div class="type">${TYPES[x.type]} · 약점 ${TYPES[x.weak]}</div></button>`).join('')}</div><h3>기술 카드 4장 선택</h3><div class="attacks">${STARTERS[mine.pokemon].attacks.map(a=>`<button class="attack ${mine.attacks.includes(a[0])?'selected':''}" data-atk="${a[0]}"><strong>${a[1]}</strong><small>${TYPES[a[2]]} · ${a[3].map(e=>TYPES[e]).join(' ')} · 기본 ${a[4]}점${a[5].length?' · 캐라코로 '+a[5].map(faceToLabel).join('/'):' '}</small></button>`).join('')}</div><div class="toolbar" style="margin-top:10px"><span class="badge">선택 ${mine.attacks.length}/4</span><button class="btn primary" id="readyBtn" ${mine.attacks.length!==4||readyLocal?'disabled':''}>${readyLocal?'준비 완료':'준비 완료'}</button></div></section><section class="player-card"><h2>상대 준비 상태</h2><div class="result"><div>상대: ${esc(members.find(m=>Number(m.seat)!==mySeat)?.nickname||'상대')}</div><div style="margin-top:8px">${ready[1-mySeat]?'✅ 준비 완료':'⏳ 준비 중'}</div><div style="margin-top:8px;color:var(--muted)">두 사람의 준비가 끝나면 포켓몬과 기술 구성이 공개되고 선공을 정합니다.</div></div></section></div>`;document.querySelectorAll('[data-pkm]').forEach(b=>b.onclick=()=>{setupChoice={pokemon:b.dataset.pkm,attacks:[]};readyLocal=false;renderSetup();});document.querySelectorAll('[data-atk]').forEach(b=>b.onclick=()=>{const id=b.dataset.atk;if(!setupChoice)return;readyLocal=false;setupChoice.attacks=setupChoice.attacks.includes(id)?setupChoice.attacks.filter(x=>x!==id):(setupChoice.attacks.length<4?[...setupChoice.attacks,id]:setupChoice.attacks);renderSetup();});document.querySelector('#readyBtn')?.addEventListener('click',async()=>{try{if(setupChoice.attacks.length!==4)throw new Error('기술 카드 4장을 선택하세요.');await setupRpc('boardmate_plakoro_set_setup',{p_token:token(),p_room_id:room.id,p_pokemon:setupChoice.pokemon,p_attacks:setupChoice.attacks,p_ready:true});readyLocal=true;full=full||{};full.setupReady={...(full.setupReady||{}),[mySeat]:true};await sendRoomBroadcast('plakoro_setup_ready',{seat:mySeat});renderSetup();if(isHost)await maybeStartFromSetup();}catch(e){alert(e.message||e);}});}
async function maybeStartFromSetup(){if(!isHost||full?.players)return;const status=await setupRpc('boardmate_plakoro_get_setup_status',{p_token:token(),p_room_id:room.id});if(!status||status.length<2||!status.every(x=>x.ready))return;const pair=await setupRpc('boardmate_plakoro_get_setup_pair',{p_token:token(),p_room_id:room.id});if(!pair||pair.length<2)return;const sorted=pair.slice().sort((a,b)=>Number(a.seat)-Number(b.seat)),first=Math.floor(Math.random()*2);const players=sorted.map(x=>({seat:Number(x.seat),name:members.find(m=>Number(m.seat)===Number(x.seat))?.nickname||`플레이어 ${Number(x.seat)+1}`,pokemon:x.payload.pokemon,weak:STARTERS[x.payload.pokemon].weak,hp:MAX_HP}));full={version:VERSION,gameId:GAME,players,current:first,selectedAttack:{},lastAttack:[null,null],turn:0,phase:'battle',setupReady:{0:true,1:true},attacks:[sorted[0].payload.attacks.map(id=>STARTERS[sorted[0].payload.pokemon].attacks.find(a=>a[0]===id)).filter(Boolean),sorted[1].payload.attacks.map(id=>STARTERS[sorted[1].payload.pokemon].attacks.find(a=>a[0]===id)).filter(Boolean)],statuses:[{energyPenalty:0,energyBonus:0,reduction:0,forbid:null},{energyPenalty:0,energyBonus:0,reduction:0,forbid:null}],pendingChoice:null,lastResult:null};await persist('setup-complete');}
async function persist(reason){if(!isHost||!full||saveBusy)return;saveBusy=true;try{const nr=await saveState(revision,full);revision=Number(nr);view=structuredClone(full);document.querySelector('#net').textContent='BoardMate Realtime · 연결됨';renderBattle();if(full.gameOver&&!matchSubmitted){matchSubmitted=true;const order=[full.winner===0?0:1,full.winner===0?1:0].map(i=>members[i]?.user_id).filter(Boolean);if(order.length===members.length)try{await submitMatch(order);}catch(e){matchSubmitted=false;console.warn(e);}}}catch(e){console.warn(e);document.querySelector('#net').textContent='저장 실패 · 재시도';}finally{saveBusy=false;}}
function selectedAttackForSeat(seat){const id=full?.selectedAttack?.[seat];return full?.attacks?.[seat]?.find(a=>a[0]===id)||null;}
function applyEffect(state,seat,attack,dir,energyPairs){const opp=1-seat,p=state.players[seat],st=state.statuses[seat],ost=state.statuses[opp],spec=attackSpec(attack);let bonus=attack[5].includes(dir)?spec.charBonus:0,msg=[];switch(spec.effect){case'heal40':p.hp=Math.min(MAX_HP,p.hp+40);msg.push('자신 HP 40 회복');break;case'self30':p.hp-=30;msg.push('자신에게 30 데미지');break;case'self20':p.hp-=20;msg.push('자신에게 20 데미지');break;case'reduce20':st.reduction=20;msg.push('다음 상대 턴 받는 피해 -20');break;case'reduce50':st.reduction=50;msg.push('다음 상대 턴 받는 피해 -50');break;case'reduce10':ost.reduction=10;msg.push('다음 상대 턴 받는 피해 -10');break;case'energy-1':ost.energyPenalty=Math.max(0,ost.energyPenalty+1);msg.push('상대 다음 턴 에네코로 -1');break;case'energy-1-then+1':ost.energyPenalty=Math.max(0,ost.energyPenalty+1);st.energyBonus+=1;msg.push('상대 다음 턴 -1 / 다음 내 턴 +1');break;case'energy+2':st.energyBonus+=2;msg.push('다음 내 턴 에네코로 +2');break;case'energy-2':ost.energyPenalty=Math.max(0,ost.energyPenalty+2);msg.push('상대 다음 턴 에네코로 -2');break;case'count-fire*10':{const n=energyPairs.flat().filter(e=>e==='fire').length;bonus+=n*10;msg.push(`불꽃 에너지 ${n}개로 추가 +${n*10}`);break;}case'lastHp40+60':if(p.hp<=40){bonus+=60;msg.push('잔여 HP 40 이하 추가 +60');}break;case'mostEnergy10':{const c=energyCount(energyPairs),types=Object.entries(c).filter(([k])=>k!=='colorless').sort((a,b)=>b[1]-a[1]);if(types[0]){bonus+=types[0][1]*10;msg.push(`${TYPES[types[0][0]]} 최다 ${types[0][1]}개 · +${types[0][1]*10}`);}break;}case'reflect':{const last=state.lastAttack[opp];if(last){bonus=last.damageBase||0;if(attack[5].includes(dir))bonus*=2;msg.push(`마지막 기술 ${last.name}의 기본 피해 반사${attack[5].includes(dir)?' ×2':''}`);}break;}case'extra-rush':msg.push('특수 성공: 같은 기술을 한 번 더 시도할 수 있습니다.');break;}return{bonus,msg,effect:spec.effect};}
async function hostAction(seat,action,payload={}){if(!isHost||!full||full.gameOver)return;if(action==='CHOOSE_FORBID'){const pc=full.pendingChoice;if(!pc||pc.type!=='forbid'||pc.by!==seat)return;const id=String(payload.id||'');if(!full.attacks[pc.target]?.some(a=>a[0]===id))return;full.statuses[pc.target].forbid=id;full.pendingChoice=null;full.current=pc.target;full.turn++;await persist('forbid-choice');return;}if(seat!==full.current)return;if(action==='SELECT_ATTACK'){const a=full.attacks[seat]?.find(x=>x[0]===payload.id);if(!a)return;if(full.lastAttack[seat]===a[0]||full.statuses[seat].forbid===a[0])return;full.selectedAttack[seat]=a[0];await persist('select');return;}if(action==='ROLL'){const a=selectedAttackForSeat(seat);if(!a)return;const spec=attackSpec(a),st=full.statuses[seat],other=1-seat;const diceN=Math.max(1,Math.min(5,(full.turn===0?2:3)+st.energyBonus-st.energyPenalty));st.energyBonus=0;st.energyPenalty=0;const pairs=rollEnergy(full.players[seat].pokemon,diceN),energy=energyCount(pairs),charDir=rollDir(),success=canPay(a[3],energy);let damage=0,msg=[];if(success){damage=a[4];const eff=applyEffect(full,seat,a,charDir,pairs);damage+=eff.bonus;msg.push(...eff.msg);if(full.players[other].weak===a[2]){damage+=20;msg.push('약점 +20');}const reduction=full.statuses[other].reduction||0;if(reduction){damage=Math.max(0,damage-reduction);msg.push(`상대 피해 감소 -${reduction}`);full.statuses[other].reduction=0;}full.players[other].hp-=damage;}const last={name:a[1],damageBase:a[4],damage,success,dir:charDir,energy:pairs.flat(),turn:full.turn};full.lastResult={seat,attack:a[0],name:a[1],success,damage,charDir,energy:pairs.flat(),msg,at:new Date().toISOString()};full.selectedAttack[seat]=null;if(full.players[0].hp<=0&&full.players[1].hp<=0){full.gameOver=true;full.winner=other;msg.push('동시에 0 HP가 되어 공격한 플레이어가 패배합니다.');}else if(full.players[other].hp<=0){full.gameOver=true;full.winner=seat;msg.push(`${full.players[seat].name} 승리`);}else if(success&&spec.effect==='forbid'){full.pendingChoice={type:'forbid',by:seat,target:other,options:full.attacks[other].map(x=>x[0])};}else{const extraTurn=success&&spec.effect==='extra-rush'&&a[5].includes(charDir);full.lastAttack[seat]=extraTurn?null:a[0];full.current=extraTurn?seat:other;full.turn+=extraTurn?0:1;}addLog(`${full.players[seat].name}의 ${a[1]}: ${success?'성공':'실패'} · ${damage} 피해 · 캐라코로 ${faceToLabel(charDir)} · ${msg.join(', ')}`);await persist('roll');return;}}
function renderBattle(){if(!full){renderSetup();return;}view=full;const myTurn=full.current===mySeat&&!full.gameOver,pc=full.pendingChoice,myChoice=pc&&pc.type==='forbid'&&pc.by===mySeat;document.querySelector('#main').innerHTML=`<div class="battle-head"><div class="fighter"><div class="name">${esc(full.players[0].name)}${mySeat===0?' · 나':''}</div><div class="hp">${Math.max(0,full.players[0].hp)}</div>${hpBar(full.players[0].hp)}<div class="small">${STARTERS[full.players[0].pokemon].name} · 약점 ${TYPES[full.players[0].weak]}</div></div><div class="versus">VS<br><span class="turn-note">${full.gameOver?'게임 종료':myChoice?'봉인할 기술을 선택':myTurn?'내 차례':`${esc(full.players[full.current].name)} 차례`}</span></div><div class="fighter"><div class="name">${esc(full.players[1].name)}${mySeat===1?' · 나':''}</div><div class="hp">${Math.max(0,full.players[1].hp)}</div>${hpBar(full.players[1].hp)}<div class="small">${STARTERS[full.players[1].pokemon].name} · 약점 ${TYPES[full.players[1].weak]}</div></div></div>
 <div class="panel"><div class="toolbar"><div><b>1. 기술 선택</b><div class="turn-note">이전 턴에 쓴 기술은 연속 사용하지 않습니다.${full.statuses[mySeat].forbid?` · ${esc(full.attacks[mySeat].find(a=>a[0]===full.statuses[mySeat].forbid)?.[1]||'기술')} 봉인됨`:''}</div></div><span class="badge">턴 ${full.turn+1}</span></div><div class="cards-row">${full.attacks[mySeat].map(a=>`<button class="battle-card ${full.selectedAttack?.[mySeat]===a[0]?'active':''}" data-battle-atk="${a[0]}" ${!myTurn||full.lastAttack[mySeat]===a[0]||full.statuses[mySeat].forbid===a[0]||myChoice?'disabled':''}><b>${esc(a[1])}</b><div class="small">${TYPES[a[2]]} · ${a[3].map(e=>TYPES[e]).join(' ')} · 기본 ${a[4]}</div><div class="small">캐라코로: ${a[5].map(faceToLabel).join(', ')}</div></button>`).join('')}</div><div class="toolbar"><button class="btn primary" id="rollBtn" ${!myTurn||!full.selectedAttack?.[mySeat]||myChoice?'disabled':''}>2. 캐라코로 + 에네코로 굴리기</button><span class="turn-note">첫 선공 턴 에네코로 2개 · 이후 3개</span></div></div>
 ${myChoice?`<div class="result"><b>상대가 사용할 수 없게 만들 기술을 선택하세요.</b><div class="choice-grid">${full.attacks[pc.target].map(a=>`<button class="btn danger" data-forbid="${a[0]}">${esc(a[1])}</button>`).join('')}</div></div>`:''}
 ${full.lastResult?`<div class="result"><b>${esc(full.players[full.lastResult.seat].name)} · ${esc(full.lastResult.name)}</b><br>${full.lastResult.success?'✅ 성공':'❌ 실패'} · ${full.lastResult.damage} 피해 · 캐라코로 ${faceToLabel(full.lastResult.charDir)}<br>에너지: ${full.lastResult.energy.map(e=>TYPES[e]).join(' · ')}${full.lastResult.msg?.length?`<br>${full.lastResult.msg.map(esc).join(' · ')}`:''}</div>`:''}
 ${full.gameOver?`<div class="result"><div style="font-size:24px;font-weight:900;color:var(--gold)">${full.winner===mySeat?'🎉 승리!':'💥 패배'}</div><a class="btn" href="./index.html#/room/${encodeURIComponent(room.id)}">방으로 돌아가기</a></div>`:''}`;document.querySelectorAll('[data-battle-atk]').forEach(b=>b.onclick=()=>{const id=b.dataset.battleAtk;if(isHost)void hostAction(mySeat,'SELECT_ATTACK',{id});else void sendRoomBroadcast('plakoro_action',{seat:mySeat,action:'SELECT_ATTACK',payload:{id}});});document.querySelector('#rollBtn')?.addEventListener('click',()=>{if(isHost)void hostAction(mySeat,'ROLL');else void sendRoomBroadcast('plakoro_action',{seat:mySeat,action:'ROLL'});});document.querySelectorAll('[data-forbid]').forEach(b=>b.onclick=()=>{const id=b.dataset.forbid;if(isHost)void hostAction(mySeat,'CHOOSE_FORBID',{id});else void sendRoomBroadcast('plakoro_action',{seat:mySeat,action:'CHOOSE_FORBID',payload:{id}});});document.querySelector('#net').textContent='BoardMate Realtime · 연결됨';}
async function sync(){try{const r=await loadState();revision=Number(r?.revision||0);if(!r?.state){const status=await setupRpc('boardmate_plakoro_get_setup_status',{p_token:token(),p_room_id:room.id}).catch(()=>[]),readyMap=Object.fromEntries((status||[]).map(x=>[Number(x.seat),Boolean(x.ready)]));full={setupReady:readyMap};renderSetup();if(readyMap[mySeat]){const meSetup=await setupRpc('boardmate_plakoro_get_setup_self',{p_token:token(),p_room_id:room.id}).catch(()=>null);if(meSetup?.payload){setupChoice={pokemon:meSetup.payload.pokemon,attacks:meSetup.payload.attacks||[]};readyLocal=Boolean(meSetup.ready);renderSetup();}}if(isHost&&readyMap[0]&&readyMap[1])await maybeStartFromSetup();return;}full=r.state;renderBattle();if(isHost&&full.phase==='setup'&&full.setupReady?.[0]&&full.setupReady?.[1])await maybeStartFromSetup();}catch(e){console.warn('plakoro sync',e);document.querySelector('#net').textContent='동기화 오류 · 재시도';}}
async function boot(){if(!configured()||!roomId)throw new Error('BoardMate 다인플 방에서 프라코로를 열어주세요.');me=await getMe();if(!me)throw new Error('로그인이 필요합니다.');({room,members}=await loadRoom());if(room.game!==GAME)throw new Error('프라코로 방이 아닙니다.');if(members.length!==2)throw new Error('프라코로는 온라인 2인 플레이입니다.');const found=members.find(m=>m.user_id===me.user_id);if(!found)throw new Error('이 방의 참가자가 아닙니다.');mySeat=Number(found.seat);isHost=room.host_id===me.user_id;buildShell();if(!subscribed){subscribed=true;await subscribeRoomBroadcast('plakoro_setup_ready',msg=>{if(msg?.seat!==undefined){full=full||{setupReady:{}};full.setupReady={...(full.setupReady||{}),[Number(msg.seat)]:true};renderSetup();if(isHost)void maybeStartFromSetup();}});await subscribeRoomBroadcast('plakoro_action',msg=>{if(msg?.seat===undefined||!isHost)return;void hostAction(Number(msg.seat),msg.action,msg.payload||{});});await subscribeRoomBroadcast('state_changed',msg=>{if(Number(msg?.revision||0)>revision)void sync();});}await sync();pollTimer=setInterval(()=>void sync(),10000);setInterval(()=>void touchPresence(true),15000);}boot().catch(e=>{console.error(e);showFatal(e.message||'프라코로를 열 수 없습니다.');});
})();
