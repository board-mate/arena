async function rpc(name,args={}){
  if(!configured()) throw new Error('Supabase 설정이 필요합니다.');
  const sb=window.supabase?.createClient?.(window.BOARDMATE_CONFIG.supabaseUrl,window.BOARDMATE_CONFIG.supabaseAnonKey);
  if(!sb) throw new Error('Supabase 설정이 필요합니다.');
  const {data,error}=await sb.rpc(name,args);
  if(error) throw error;
  return data;
}
function addLog(msg){
  if(!full)return;
  full.logs=Array.isArray(full.logs)?full.logs:[];
  full.logs=[msg,...full.logs].slice(0,40);
  const el=document.querySelector('#log'); if(el)el.innerHTML=full.logs.map(x=>`<div>• ${esc(x)}</div>`).join('');

async function persist(reason){
  if(!isHost||!full||saveBusy)return;
  saveBusy=true;
  try{
    full.lastSyncReason=reason;
    const nr=await saveState(revision,full); revision=Number(nr); renderBattle();

        const order=[winnerSeat,winnerSeat===0?1:0].map(seat=>members.find(m=>Number(m.seat)===seat)?.user_id).filter(Boolean);
        if(order.length===2){try{await submitMatch(order);}catch(e){matchSubmitted=false;console.warn('rating submit',e);}}
      }

function flattenEnergy(results){return (results||[]).flatMap(e=>Array.isArray(e)?e:[e]).filter(Boolean);}
function energyCounts(results){const c={};for(const e of flattenEnergy(results))c[e]=(c[e]||0)+1;return c;}
function canPay(cost,results){const energies=flattenEnergy(results);for(const [reqType,reqN] of cost){if(reqType==='colorless'){if(energies.length<reqN)return false;}else{const count=energies.filter(t=>t===reqType||t==='colorless').length;if(count<reqN)return false;}}return true;}
function rollEnergy(seat,n){const sets=full.energyFaces[seat]||[];return Array.from({length:n},(_,i)=>{const die=sets[i%3]||Array(6).fill('colorless');const face=die[Math.floor(Math.random()*6)];return Array.isArray(face)?face.slice():face;});}
function rollDir(){return DIR_POOL[Math.floor(Math.random()*DIR_POOL.length)];}
function extraForAttack(state,seat,w,dir,energy){
  const opp=seat===0?1:0,p=state.players[seat],op=state.players[opp],st=state.statuses[seat],ost=state.statuses[opp];let bonus=0,msg=[];
  if(Array.isArray(w.faces)&&w.faces.includes(dir))bonus+=Number(w.bonus||0);
  if(w.lowHpBonus&&['up','front','back'].includes(dir)&&p.hp<=40){bonus+=Number(w.lowHpBonus);msg.push(`HP 40 이하 추가 +${w.lowHpBonus}`);}
  if(w.fireCount&&['up','left','right'].includes(dir)){const n=flattenEnergy(energy).filter(x=>x==='fire').length;bonus+=n*10;msg.push(`불꽃 에너지 ${n}개 · +${n*10}`);}
  if(w.mostType&&['up','front','back'].includes(dir)){const c=energyCounts(state.lastEnergy?.[opp]||[]),top=Math.max(0,...Object.values(c));bonus+=top*10;msg.push(`상대 최다 에너지 ${top}개 · +${top*10}`);}
  if(w.heal&&Array.isArray(w.faces)&&w.faces.includes(dir)){p.hp=Math.min(MAX_HP,p.hp+Number(w.heal));msg.push(`자신 HP ${w.heal} 회복`);}
  if(w.selfDamageOn&&w.selfDamageOn.includes(dir)){p.hp=Math.max(0,p.hp-Number(w.selfDamage||0));msg.push(`자신도 ${w.selfDamage} 데미지`);}
  if(w.oppMinus&&Array.isArray(w.faces)&&w.faces.includes(dir)){ost.energyPenalty=(ost.energyPenalty||0)+Number(w.oppMinus);msg.push(`상대 다음 턴 에너지 -${w.oppMinus}`);}
  if(w.selfBonus&&Array.isArray(w.faces)&&w.faces.includes(dir)){st.energyBonus=(st.energyBonus||0)+Number(w.selfBonus);msg.push(`내 다음 턴 에너지 +${w.selfBonus}`);}
  if(w.selfMinus&&w.selfMinusOn?.includes(dir)){st.energyPenalty=(st.energyPenalty||0)+Number(w.selfMinus);msg.push(`내 다음 턴 에너지 -${w.selfMinus}`);}
  if(w.block&&Array.isArray(w.faces)&&w.faces.includes(dir)){const cand=state.attacks[opp]||[];if(cand.length){const idx=Math.floor(Math.random()*cand.length);ost.blocked=cand[idx].id;msg.push(`상대 기술 봉인: ${cand[idx].name}`);}}
  if(w.shield&&Array.isArray(w.faces)&&w.faces.includes(dir)){st.shield=(st.shield||0)+Number(w.shield);if(w.bonusShield&&['up','front'].includes(dir))st.shield+=Number(w.bonusShield);msg.push(`다음 턴 받는 데미지 -${st.shield}`);}
  if(w.id.endsWith('-barrier')&&['up','front'].includes(dir)){/* handled above via shield/bonusShield */}
  if(w.branch){const dmg=dir==='up'?70:(dir==='front'||dir==='back'?40:20);bonus+=dmg-Number(w.dmg||0);msg.push(`마구뛰기 ${dmg} 피해`);}
  if(w.reflect){let dmg=Number(state.lastDamage?.[opp]||0);if(['up','left','right'].includes(dir))dmg*=2;bonus+=dmg-Number(w.dmg||0);msg.push(`마지막 기술 피해 ${dmg} 반사`);}
  return {bonus,msg};
}

async function hostAction(seat,action,payload={}){
  if(!isHost||!full||full.gameOver)return;
  if(action==='CHOOSE_FORBID'){
    const pc=full.pendingChoice;if(!pc||pc.type!=='forbid'||pc.by!==seat)return;const id=String(payload.id||'');if(!(full.attacks[pc.target]||[]).some(x=>x.id===id))return;
    full.statuses[pc.target].blocked=id;full.pendingChoice=null;full.current=pc.target;full.turn++;await persist('forbid-choice');return;
  }
  if(action==='ROLL'){
    if(seat!==full.current)return;const id=String(payload.id||'');const w=(full.attacks[seat]||[]).find(x=>x.id===id);if(!w||blockedBy(full,seat,w)||full.lastAttack[seat]===w.id||full.pendingChoice)return;
    localSelectedAttack=null;const st=full.statuses[seat],opp=seat===0?1:0;let n=3+(st.energyBonus||0)-(st.energyPenalty||0);if(full.turn===0&&seat===0)n-=1;n=Math.max(1,Math.min(5,n));st.energyBonus=0;st.energyPenalty=0;
    const energy=rollEnergy(seat,n),dir=rollDir();full.lastEnergy[seat]=energy;const success=canPay(w.cost,energy);let damage=0,msg=[];
    if(success){
      if(w.branch){const raw=dir==='up'?70:(dir==='front'||dir==='back'?40:20);damage=raw;msg.push(`마구뛰기 ${raw} 피해`);}
      else if(w.reflect){damage=Number(full.lastDamage?.[opp]||0);if(['up','left','right'].includes(dir))damage*=2;msg.push('캐릭터코로 효과 무시 · 마지막 피해 반사');}
      else if(w.id.endsWith('-barrier')){damage=0;}
      else damage=Number(w.dmg)||0;
      if(!w.branch&&!w.reflect&&!w.id.endsWith('-barrier')){const ex=extraForAttack(full,seat,w,dir,energy);damage+=ex.bonus;msg.push(...ex.msg);}else if(w.id.endsWith('-barrier')){const shield=20+(['up','front'].includes(dir)?30:0);st.shield=(st.shield||0)+shield;msg.push(`다음 턴 받는 데미지 -${shield}`);}
      if(w.id.endsWith('-volttackle')){full.players[seat].hp=Math.max(0,full.players[seat].hp-30);msg.push('자신도 30 데미지');}
      if(w.type===full.players[opp].weak&&!w.noWeak&&damage>0){damage+=20;msg.push('약점 +20');}
      const shield=full.statuses[opp].shield||0;if(shield&&damage>0){damage=Math.max(0,damage-shield);msg.push(`피해 감소 -${shield}`);full.statuses[opp].shield=0;}
      full.players[opp].hp=Math.max(0,full.players[opp].hp-damage);
    }else msg.push('에너지 조건 불충족 · 턴 종료');
    full.lastDamage[seat]=damage;full.lastResult={seat,attackId:w.id,name:w.name,success,damage,charDir:dir,energy,msg,turn:full.turn,at:new Date().toISOString()};full.lastAttack[seat]=w.id;st.blocked=null;
    if(full.players[0].hp<=0&&full.players[1].hp<=0){full.gameOver=true;full.winner=opp;msg.push('동시에 0 HP → 공격한 플레이어가 패배합니다.');}
    else if(full.players[opp].hp<=0){full.gameOver=true;full.winner=seat;}
    else if(w.block&&success&&full.statuses[opp].blocked){full.pendingChoice=null;full.current=opp;full.turn++;}
    else{full.current=opp;full.turn++;}
    addLog(`${full.players[seat].name} · ${w.name} · ${success?'성공':'실패'} · ${damage} 피해 · ${faceLabel(dir)}${msg.length?' · '+msg.join(' · '):''}`);
    await persist('roll');
  }
}

        <button class="battle-card ${localSelectedAttack===w.id?'active':''}" data-atk="${w.id}"
          ${!myTurn||blockedBy(full,mySeat,w)||full.lastAttack[mySeat]===w.id||myChoice?'disabled':''}>
          <b>${esc(w.name)}</b><div class="attack-faces">${(w.faces?.length?w.faces:[]).map(f=>`<span class="face-chip mini" data-face="${f}">${faceLabel(f)}</span>`).join('')||'<span class="face-chip mini">모든 방향 판정</span>'}</div><div class="small">${esc(TYPE[w.type]||w.type)} · ${w.cost.map(([t,n])=>`${TYPE[t]||t}×${n}`).join(' ')} · 기본 ${w.dmg}</div>
          <div class="small">${esc(w.effect)}</div>
        </button>`).join('')}</div>
      <div class="toolbar" style="margin-top:6px"><button class="btn primary" id="rollBtn" title="캐릭터코로 1개 + 에너지코로 2~3개 굴리기" ${!myTurn||!localSelectedAttack||myChoice?'disabled':''}>🎲 캐릭터코로 + 에너지코로 굴리기</button>
        <span class="turn-note">P1 첫 턴 에네코로 2개 · 이후 3개</span></div>
      <div id="resultDice" class="dice-row"></div>
    </div>
    ${myChoice?`<div class="result"><b>상대가 사용할 수 없게 할 기술을 선택하세요.</b><div class="choice-grid">${(full.attacks[oppSeat]||[]).map(w=>`<button class="btn danger" data-forbid="${w.id}">${esc(w.name)}</button>`).join('')}</div></div>`:''}
    ${full.lastResult?`<div class="result ${full.lastResult.success?'ok':'bad'}"><b>${esc(full.players[full.lastResult.seat].name)} · ${esc(full.lastResult.name)}</b><br>${full.lastResult.success?'✅ 성공':'❌ 실패'} · ${full.lastResult.damage} 피해 · 캐릭터코로 ${esc(faceLabel(full.lastResult.charDir))}<br>에너지: ${(full.lastResult.energy||[]).map(e=>TYPE[e]||e).join(' · ')}${full.lastResult.msg?.length?`<br>${full.lastResult.msg.map(x=>esc(x)).join(' · ')}`:''}</div>`:''}
    ${full.gameOver?`<div class="result"><div style="font-size:24px;font-weight:900;color:var(--gold)">${full.winner===mySeat?'🎉 승리!':'💥 패배'}</div><div class="toolbar" style="margin-top:8px"><a class="btn" href="./index.html#/room/${encodeURIComponent(room.id)}">방으로 돌아가기</a></div></div>`:''}`;
  document.querySelectorAll('[data-atk]').forEach(b=>b.onclick=()=>{
    if(!myTurn)return;
    localSelectedAttack=b.dataset.atk; renderBattle();
  });
  document.querySelector('#rollBtn')?.addEventListener('click',()=>{
    if(!localSelectedAttack||!myTurn)return; void sendPrivateAction('ROLL',{id:localSelectedAttack});
  });
  document.querySelectorAll('[data-forbid]').forEach(b=>b.onclick=()=>void sendPrivateAction('CHOOSE_FORBID',{id:b.dataset.forbid}));
  document.querySelector('#net').textContent='BoardMate Realtime · 연결됨';
  if(full.lastResult)playDiceAnimation(full.lastResult);
  if(full.lastResult?.attackId===localSelectedAttack)localSelectedAttack=null;
}

async function sync(){
  try{
    const r=await loadState(); revision=Number(r?.revision||0);
    if(r?.state?.players)full=r.state;
    else{
      const status=await rpc('boardmate_plakoro_get_setup_status_v2',{p_token:token(),p_room_id:room.id}).catch(()=>[]);
      full={setupReady:Object.fromEntries((status||[]).map(x=>[Number(x.seat),Boolean(x.ready)]))};
      if(!setupHydrated){
        const own=await rpc('boardmate_plakoro_get_setup_self_v2',{p_token:token(),p_room_id:room.id}).catch(()=>[]);
        const row=Array.isArray(own)?own[0]:own;
        if(row?.payload){
          const pid=String(row.payload.pokemon||'bulbasaur');
          const pk=STARTERS[pid]||STARTERS.bulbasaur;
          const rawAttacks=Array.isArray(row.payload.attacks)?row.payload.attacks:[];
          const attacks=rawAttacks.map(id=>{
            if(pk.waza.some(w=>w.id===id)) return id;
            const m=String(id).match(/^\w+-(\d+)$/);
            return m?pk.waza[Number(m[1])]?.id:null;
          }).filter(Boolean).slice(0,4);
          setupChoice={pokemon:pk.id,attacks,energyConfig:facesToEnergyConfig(row.payload.energyFaces,pk)};
          readyLocal=Boolean(row.ready);
        }
        setupHydrated=true;
      }
    }
    if(full?.players)renderBattle();else renderSetup();
    if(isHost){
      await drainSeat(0);await drainSeat(1);
      try{await maybeStart();}
      catch(startErr){
        console.warn('plakoro setup start',startErr);
        const n=document.querySelector('#net');
        if(n){n.textContent='게임 준비 시작 실패 · '+String(startErr?.message||startErr).slice(0,36);n.title=String(startErr?.message||startErr);}
      }
    }
  }catch(e){
    console.warn('plakoro sync',e);
    const n=document.querySelector('#net');
    if(n){
      const msg=String(e?.message||e||'');
      n.textContent=(msg.includes('boardmate_plakoro_setups')||msg.includes('does not exist')||msg.includes('schema cache'))
        ?'준비 DB 누락 · V5 SQL 필요'
        :'동기화 오류 · '+(msg?msg.slice(0,42):'재시도');
      n.title=msg;
    }
  }
}

async function boot(){
  if(!configured()||!roomId)throw new Error('BoardMate 다인플 방에서 프라코로 포켓몬을 열어주세요.');
  me=await getMe(); if(!me)throw new Error('로그인이 필요합니다.');
  ({room,members}=await loadRoom());
  if(room.game!==GAME)throw new Error('프라코로 포켓몬 방이 아닙니다.');
  if(Number(members.length)!==2)throw new Error('프라코로 포켓몬은 온라인 2인 플레이입니다.');
  const found=members.find(m=>m.user_id===me.user_id); if(!found)throw new Error('이 방의 참가자가 아닙니다.');
  mySeat=Number(found.seat); isHost=room.host_id===me.user_id;
  document.querySelector('#app').innerHTML=`
    <div class="top"><div class="brand"><h1>🎲 프라코로 포켓몬</h1><p>BoardMate 공통 방 · 2인 PvP · 제공 HTML 기반</p></div>
      <div class="toolbar"><span class="badge" id="net">연결 확인 중…</span><a class="btn" href="./index.html#/room/${encodeURIComponent(room.id)}">← 방으로</a></div></div>
    <section class="panel" id="main"></section>
    <section class="panel"><div class="toolbar"><b>전투 로그</b><span class="small">공개된 전투 결과만 기록합니다.</span></div><div class="log" id="log"></div></section>
    <section class="panel footer-note">이 페이지는 업로드된 프라코로 포켓몬 HTML을 BoardMate 2인 PvP에 연결한 버전입니다. 게임 상태의 최종 판정은 방장 브라우저에서 수행하며, 액션 원문은 전용 RPC 저장 후 Realtime 신호로 전달합니다.</section>`;
  if(!subscribed){
    subscribed=true;
    await subscribeRoomBroadcast('plakoro_setup_ready',msg=>{
      if(msg?.seat!==undefined){full=full||{setupReady:{}};full.setupReady={...(full.setupReady||{}),[Number(msg.seat)]:true};renderSetup();if(isHost)void maybeStart();}
    });
    await subscribeRoomBroadcast('plakoro_action_ready',msg=>{if(isHost&&msg?.seat!==undefined)void drainSeat(Number(msg.seat));});
    await subscribeRoomBroadcast('state_changed',msg=>{if(Number(msg?.revision||0)>revision)void sync();});
  }
  await sync();
  statePollTimer=setInterval(()=>void sync(),10000);
  actionPollTimer=setInterval(()=>{if(isHost){void drainSeat(0);void drainSeat(1);}},1500);
  setInterval(()=>void touchPresence(true),15000);
}
boot().catch(e=>{console.error(e);showFatal(e.message||'프라코로 포켓몬을 열 수 없습니다.');});
})();
</script>
