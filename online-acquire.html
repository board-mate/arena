<style>
:root{font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;color:#111827;background:#f4df19}*{box-sizing:border-box}body{margin:0;background-image:radial-gradient(#d1be13 13%,transparent 14%);background-size:22px 22px}button,input{font:inherit}.bar{position:sticky;top:0;z-index:20;background:#090f1b;color:white;border-bottom:4px solid #000;padding:9px 14px;display:flex;justify-content:space-between;gap:10px}.bar a{color:white;text-decoration:none;font-weight:900}.wrap{width:min(1450px,calc(100% - 18px));margin:12px auto 50px}.card{background:#fff;border:3px solid #000;border-radius:16px;box-shadow:0 6px 0 #000;padding:12px;margin-bottom:10px}.players{display:flex;gap:6px;overflow:auto}.player{min-width:150px;border:2px solid #cbd5e1;border-radius:11px;padding:7px;background:#f8fafc}.player.active{outline:4px solid #f59e0b}.player b,.player small{display:block}.player small{font-size:10px;color:#64748b}.main{display:grid;grid-template-columns:minmax(700px,1.4fr) minmax(340px,.65fr);gap:10px}.boardbox{overflow:auto;background:#fff8d5;border:2px dashed #eab308;border-radius:12px;padding:7px}.board{display:grid;grid-template-columns:28px repeat(12,44px);gap:3px;min-width:595px}.coord{display:grid;place-items:center;font-size:10px;font-weight:900;color:#64748b}.cell{width:44px;height:44px;border:2px solid #64748b;border-radius:6px;background:#eef2f7;position:relative;display:grid;place-items:center;font-weight:950}.cell .k{position:absolute;right:2px;bottom:1px;font-size:7px;opacity:.65}.cell.standalone{background:white;color:#111827}.cell.handcell{outline:3px dashed #16a34a;cursor:pointer}.cell.blocked{outline:3px dashed #ef4444}.chain{font-size:17px}.hand{display:flex;gap:7px;flex-wrap:wrap}.tile{border:2px solid #111827;background:#1f2937;color:white;border-radius:10px;padding:10px 12px;font-weight:950}.tile.legal{border-color:#10b981}.tile.bad{opacity:.5}.tile small{display:block;font-size:9px;color:#fde047}.market{display:grid;gap:6px}.market-row{display:grid;grid-template-columns:1.2fr .6fr .7fr .55fr auto;gap:5px;align-items:center;border:1px solid #d8dee7;border-radius:9px;padding:7px;font-size:11px}.dot{width:11px;height:11px;border-radius:3px;border:1px solid #111827;display:inline-block}.buy{border:2px solid #000;border-radius:7px;background:#111827;color:white;font-weight:900;padding:5px}.btn{border:2px solid #000;border-radius:9px;padding:8px 10px;font-weight:950;cursor:pointer}.green{background:#34d399}.yellow{background:#fde047}.red{background:#fb7185}.dark{background:#1f2937;color:#fff}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pending{border:2px solid #7c3aed;background:#f3e8ff;border-radius:12px;padding:10px;margin-top:9px}.choice{border:2px solid #111827;border-radius:9px;padding:8px;background:white;font-weight:900;margin:3px}.logs{height:170px;overflow:auto;background:#0b1220;color:#cbd5e1;border-radius:10px;padding:8px;font-size:10px}.logs div{margin-bottom:4px}.portfolio{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.port{border:1px solid #cbd5e1;border-radius:8px;padding:6px;text-align:center;font-size:9px}.port b{display:block;font-size:15px}.status{font-size:11px;color:#64748b}.final{background:#fff3ba;border:2px solid #d9a400;border-radius:11px;padding:10px;margin-top:8px}@media(max-width:1000px){.main{grid-template-columns:1fr}.board{grid-template-columns:26px repeat(12,40px)}.cell{width:40px;height:40px}}
</style></head><body><header class="bar"><span style="display:flex;gap:6px"><a href="./index.html#/">← 홈</a><a href="./index.html#/multi">다인플</a></span><b id="title">🏙️ 어콰이어</b><span id="sync">연결 중…</span></header><main class="wrap"><div id="app" class="card">불러오는 중…</div></main>
<script type="module">
import {configured,roomId,getMe,loadRoom,loadState,saveState,startStatePoll,submitMatch,ratingBadges,esc,showFatal,endPanel} from './multi-common.js';
if(!configured()||!roomId)showFatal('Supabase 설정 또는 room 주소가 없습니다.');
const COLS='ABCDEFGHIJKL'.split(''),ROWS=9,HAND=6,START=6000,BANK=25;
const CHAINS=[{id:'sackson',name:'Sackson',ko:'색슨',tier:0,color:'#f59e0b',letter:'S'},{id:'tower',name:'Tower',ko:'타워',tier:0,color:'#60a5fa',letter:'T'},{id:'american',name:'American',ko:'아메리칸',tier:1,color:'#ef4444',letter:'A'},{id:'festival',name:'Festival',ko:'페스티벌',tier:1,color:'#a855f7',letter:'F'},{id:'worldwide',name:'Worldwide',ko:'월드와이드',tier:1,color:'#22c55e',letter:'W'},{id:'continental',name:'Continental',ko:'콘티넨탈',tier:2,color:'#06b6d4',letter:'C'},{id:'imperial',name:'Imperial',ko:'임페리얼',tier:2,color:'#ec4899',letter:'I'}],C=Object.fromEntries(CHAINS.map(x=>[x.id,x]));
let me,room,members,badges={},mySeat=-1,state=null,revision=0,saving=false,submitted=false;
const clone=x=>JSON.parse(JSON.stringify(x));const money=n=>'$'+Math.round(n).toLocaleString('en-US');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function allTiles(){const a=[];for(let r=0;r<ROWS;r++)for(let c=0;c<12;c++)a.push(COLS[c]+(r+1));return a}function parse(k){return{c:COLS.indexOf(k[0]),r:+k.slice(1)-1}}function neighbors(k){const{r,c}=parse(k),a=[];if(r>0)a.push(COLS[c]+r);if(r<8)a.push(COLS[c]+(r+2));if(c>0)a.push(COLS[c-1]+(r+1));if(c<11)a.push(COLS[c+1]+(r+1));return a}
function initialState(){const pool=shuffle(allTiles()),board={},players=members.map(m=>({id:m.user_id,name:m.nickname,cash:START,shares:Object.fromEntries(CHAINS.map(c=>[c.id,0])),hand:[],startTile:null}));players.forEach(p=>{const k=pool.pop();p.startTile=k;board[k]={type:'standalone'}});for(let n=0;n<HAND;n++)players.forEach(p=>p.hand.push(pool.pop()));players.forEach(p=>p.hand.sort());const order=players.map((_,i)=>i).sort((a,b)=>{const A=parse(players[a].startTile),B=parse(players[b].startTile);return A.c-B.c||A.r-B.r});return{kind:'acquire',board,pool,players,chains:Object.fromEntries(CHAINS.map(c=>[c.id,{active:false,stock:BANK}])),current:order[0],turnNo:1,phase:'place',buyCount:0,pending:null,over:false,finalOrder:null,logs:[`게임 시작 · ${players[order[0]].name}부터`],settings:{safeSize:11,endSize:41}}}
function size(s,id){return Object.values(s.board).filter(v=>v?.type==='chain'&&v.chain===id).length}function active(s,id){return !!s.chains[id].active}function safe(s,id){return size(s,id)>=11}function priceAt(id,z){let b=z<=2?200:z===3?300:z===4?400:z===5?500:z<=10?600:z<=20?700:z<=30?800:z<=40?900:1000;return b+C[id].tier*100}function price(s,id){return priceAt(id,size(s,id))}function inactive(s){return CHAINS.filter(c=>!active(s,c.id))}function activeChains(s){return CHAINS.filter(c=>active(s,c.id))}
function standaloneComponent(s,start){if(s.board[start]?.type!=='standalone')return[];const seen=new Set([start]),q=[start];while(q.length){const x=q.shift();for(const n of neighbors(x))if(!seen.has(n)&&s.board[n]?.type==='standalone'){seen.add(n);q.push(n)}}return[...seen]}function adjacentChains(s,k){const set=new Set;for(const n of neighbors(k)){const v=s.board[n];if(v?.type==='chain')set.add(v.chain)}return[...set]}function adjacentStandalones(s,k){const set=new Set;for(const n of neighbors(k))if(s.board[n]?.type==='standalone')standaloneComponent(s,n).forEach(x=>set.add(x));return[...set]}
function legal(s,k){if(s.board[k])return false;const adj=adjacentChains(s,k);if(adj.filter(id=>safe(s,id)).length>=2)return false;const comp=adjacentStandalones(s,k);if(adj.length===0&&comp.length>0&&inactive(s).length===0)return false;return true}function permanentlyBlocked(s,k){return !s.board[k]&&adjacentChains(s,k).filter(id=>safe(s,id)).length>=2}function legalHand(s,seat){return s.players[seat].hand.filter(k=>legal(s,k))}
function log(s,msg){s.logs.unshift(msg);s.logs=s.logs.slice(0,120)}function round100(n){return Math.ceil(n/100)*100}
function payBonus(s,id,px){const holders=s.players.map((p,i)=>({i,n:p.shares[id]})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);if(!holders.length)return;const first=px*10,second=px*5,top=holders[0].n,topIds=holders.filter(x=>x.n===top).map(x=>x.i);if(topIds.length>1){const each=round100((first+second)/topIds.length);topIds.forEach(i=>s.players[i].cash+=each);log(s,`${C[id].name} 최대주주 동률 보너스 각 ${money(each)}`);return}s.players[topIds[0]].cash+=first;const rest=holders.filter(x=>x.n<top);if(!rest.length){s.players[topIds[0]].cash+=second;return}const sec=rest[0].n,secIds=rest.filter(x=>x.n===sec).map(x=>x.i),each=round100(second/secIds.length);secIds.forEach(i=>s.players[i].cash+=each)}
function canEnd(s){const ac=activeChains(s);return ac.length>0&&(ac.every(c=>safe(s,c.id))||ac.some(c=>size(s,c.id)>=41))}
function finishMerge(s,p){for(const dead of p.dead){for(const [k,v] of Object.entries(s.board))if(v?.type==='chain'&&v.chain===dead.id)s.board[k]={type:'chain',chain:p.survivor};s.chains[dead.id].active=false}for(const k of p.component)s.board[k]={type:'chain',chain:p.survivor};s.board[p.tileKey]={type:'chain',chain:p.survivor};s.chains[p.survivor].active=true;s.pending=null;s.phase='buy';s.buyCount=0;log(s,`${C[p.survivor].name} 존속 · 합병 완료`)}
function prepareMerge(s,tileKey,trigger,survivor,adj,component){const dead=adj.filter(id=>id!==survivor).map(id=>({id,price:price(s,id)}));dead.forEach(d=>payBonus(s,d.id,d.price));const queue=[];dead.forEach(d=>s.players.forEach((p,seat)=>{if(p.shares[d.id]>0)queue.push({seat,dead:d.id,price:d.price})}));const p={type:'merger',tileKey,triggerSeat:trigger,survivor,dead,component,queue,qIndex:0};s.phase='resolve';s.pending=p;if(queue.length===0)finishMerge(s,p)}
function placeTile(s,seat,k){if(s.current!==seat||s.phase!=='place'||!s.players[seat].hand.includes(k)||!legal(s,k))throw Error('놓을 수 없는 타일입니다.');s.players[seat].hand=s.players[seat].hand.filter(x=>x!==k);const adj=adjacentChains(s,k),comp=adjacentStandalones(s,k);log(s,`${s.players[seat].name}: ${k} 배치`);if(adj.length===0){if(!comp.length){s.board[k]={type:'standalone'};s.phase='buy';s.buyCount=0;return}const avail=inactive(s);s.phase='resolve';s.pending={type:'founder',tileKey:k,triggerSeat:seat,component:comp,choices:avail.map(c=>c.id)};return}if(adj.length===1){const id=adj[0];s.board[k]={type:'chain',chain:id};comp.forEach(x=>s.board[x]={type:'chain',chain:id});s.chains[id].active=true;s.phase='buy';s.buyCount=0;return}const sizes=Object.fromEntries(adj.map(id=>[id,size(s,id)])),mx=Math.max(...Object.values(sizes)),ties=adj.filter(id=>sizes[id]===mx);if(ties.length>1){s.phase='resolve';s.pending={type:'survivor',tileKey:k,triggerSeat:seat,component:comp,adj,ties};return}prepareMerge(s,k,seat,ties[0],adj,comp)}
function chooseFounder(s,seat,id){const p=s.pending;if(p?.type!=='founder'||p.triggerSeat!==seat||!p.choices.includes(id))throw Error('선택할 수 없습니다.');[p.tileKey,...p.component].forEach(k=>s.board[k]={type:'chain',chain:id});s.chains[id].active=true;if(s.chains[id].stock>0){s.players[seat].shares[id]++;s.chains[id].stock--;log(s,`${s.players[seat].name}: ${C[id].name} 설립 + 설립자 1주`)}s.pending=null;s.phase='buy';s.buyCount=0}
function chooseSurvivor(s,seat,id){const p=s.pending;if(p?.type!=='survivor'||p.triggerSeat!==seat||!p.ties.includes(id))throw Error('선택할 수 없습니다.');prepareMerge(s,p.tileKey,seat,id,p.adj,p.component)}
function mergerDecision(s,seat,sell,trade){const p=s.pending,q=p?.queue?.[p.qIndex];if(p?.type!=='merger'||!q||q.seat!==seat)throw Error('합병 결정 차례가 아닙니다.');const pl=s.players[seat],owned=pl.shares[q.dead],used=sell+trade*2;if(sell<0||trade<0||used>owned||trade>s.chains[p.survivor].stock)throw Error('수량이 올바르지 않습니다.');pl.shares[q.dead]-=used;pl.cash+=sell*q.price;s.chains[q.dead].stock+=used;pl.shares[p.survivor]+=trade;s.chains[p.survivor].stock-=trade;log(s,`${pl.name}: ${C[q.dead].name} ${sell}주 매각 · ${trade}회 2:1 교환 · ${owned-used}주 보유`);p.qIndex++;if(p.qIndex>=p.queue.length)finishMerge(s,p)}
function buyShare(s,seat,id){if(s.current!==seat||s.phase!=='buy'||s.buyCount>=3||!active(s,id))throw Error('매수할 수 없습니다.');const px=price(s,id),p=s.players[seat];if(p.cash<px||s.chains[id].stock<=0)throw Error('현금 또는 은행 주식이 부족합니다.');p.cash-=px;p.shares[id]++;s.chains[id].stock--;s.buyCount++;log(s,`${p.name}: ${C[id].name} 1주 매수`)}
function ensureNextHand(s){const p=s.players[s.current];let tries=0;while(!legalHand(s,s.current).length&&s.pool.length&&tries<2){log(s,`${p.name}: 배치 가능한 손패가 없어 전체 교체`);p.hand=[];while(p.hand.length<HAND&&s.pool.length)p.hand.push(s.pool.pop());p.hand.sort();tries++}if(!legalHand(s,s.current).length){s.phase='buy';s.buyCount=0;log(s,`${p.name}: 배치 가능한 타일 없음 · 주식 구매 단계`)}}
function endTurn(s,seat){if(s.current!==seat||s.phase!=='buy')throw Error('턴을 끝낼 수 없습니다.');const p=s.players[seat],blocked=p.hand.filter(k=>permanentlyBlocked(s,k));if(blocked.length){p.hand=p.hand.filter(k=>!blocked.includes(k));log(s,`${p.name}: 영구 배치 불가 ${blocked.length}장 폐기`)}while(p.hand.length<HAND&&s.pool.length)p.hand.push(s.pool.pop());p.hand.sort();s.current=(s.current+1)%s.players.length;s.turnNo++;s.phase='place';s.buyCount=0;ensureNextHand(s)}
function discardBlocked(s,seat,k){if(s.current!==seat||s.phase!=='place'||!s.players[seat].hand.includes(k)||!permanentlyBlocked(s,k))throw Error('교체할 수 없습니다.');s.players[seat].hand=s.players[seat].hand.filter(x=>x!==k);if(s.pool.length)s.players[seat].hand.push(s.pool.pop());s.players[seat].hand.sort();log(s,`${s.players[seat].name}: ${k} 영구 배치 불가 타일 교체`)}
function endGame(s){if(s.phase!=='buy'||!canEnd(s))throw Error('종료 조건이 아닙니다.');activeChains(s).forEach(c=>payBonus(s,c.id,price(s,c.id)));for(const p of s.players)for(const c of activeChains(s)){const n=p.shares[c.id];if(n){p.cash+=n*price(s,c.id);p.shares[c.id]=0;s.chains[c.id].stock+=n}}s.over=true;s.phase='done';s.finalOrder=s.players.map((_,i)=>i).sort((a,b)=>s.players[b].cash-s.players[a].cash||a-b);log(s,'게임 종료 · 최종 자산 정산 완료')}
async function mutate(fn){if(saving||!state)return;saving=true;const next=clone(state);try{fn(next);const nr=await saveState(revision,next);revision=nr;state=next;render();document.querySelector('#sync').textContent='동기화됨';if(next.over)maybeSubmit()}catch(e){console.warn(e);document.querySelector('#sync').textContent='다시 동기화 중';const row=await loadState();revision=row.revision;state=row.state;render()}finally{saving=false}}
async function maybeSubmit(){if(submitted||room.host_id!==me.user_id||!state?.over||!state.finalOrder)return;submitted=true;try{await submitMatch(state.finalOrder.map(i=>members[i].user_id));document.querySelector('#sync').textContent='결과 반영 완료'}catch(e){if(!String(e.message).includes('already'))submitted=false}}
function myPendingSeat(){const p=state.pending;if(p?.type==='merger')return p.queue[p.qIndex]?.seat??null;if(p?.type==='founder'||p?.type==='survivor')return p.triggerSeat;return null}
function renderPending(){const p=state.pending;if(!p)return'';if(p.type==='founder')return `<div class="pending"><b>호텔 체인 설립</b><p>${esc(members[p.triggerSeat].nickname)}가 설립할 체인을 고릅니다.</p>${p.choices.map(id=>`<button class="choice" data-founder="${id}" ${p.triggerSeat===mySeat?'':'disabled'}><span class="dot" style="background:${C[id].color}"></span> ${C[id].name}</button>`).join('')}</div>`;if(p.type==='survivor')return `<div class="pending"><b>합병 · 존속 체인 동률</b><p>${esc(members[p.triggerSeat].nickname)}가 존속할 체인을 고릅니다.</p>${p.ties.map(id=>`<button class="choice" data-survivor="${id}" ${p.triggerSeat===mySeat?'':'disabled'}>${C[id].name} · ${size(state,id)}칸</button>`).join('')}</div>`;const q=p.queue[p.qIndex];if(!q)return'';const pl=state.players[q.seat],owned=pl.shares[q.dead],maxTrade=Math.min(Math.floor(owned/2),state.chains[p.survivor].stock);return `<div class="pending"><b>합병 주식 처리 · ${C[q.dead].name} → ${C[p.survivor].name}</b><p>${esc(pl.name)}의 결정 차례 · ${owned}주 보유 · 매각가 ${money(q.price)}</p>${q.seat===mySeat?`<label>매각 <input id="sellN" type="number" min="0" max="${owned}" value="0" style="width:70px"></label> <label>2:1 교환 횟수 <input id="tradeN" type="number" min="0" max="${maxTrade}" value="0" style="width:70px"></label><button class="btn green" id="mergerOk">처리</button>`:'다른 플레이어의 결정을 기다리는 중입니다.'}</div>`}
function render(){if(!state)return;document.querySelector('#title').textContent=`🏙️ ${room.title}`;const app=document.querySelector('#app'),p=state.players[mySeat],canPlace=state.current===mySeat&&state.phase==='place'&&!state.over,handSet=new Set(p.hand);app.innerHTML=`<div class="players">${state.players.map((x,i)=>`<div class="player ${i===state.current&&!state.over?'active':''}"><b>${esc(badges[members[i]?.user_id]?.text||'🥉')} ${esc(x.name)}${i===mySeat?' · 나':''}</b><small>${money(x.cash)} · 손패 ${x.hand.length}장</small></div>`).join('')}</div><div class="status" style="margin-top:7px">턴 ${state.turnNo} · ${state.over?'게임 종료':state.phase==='resolve'?`합병/설립 처리 · ${esc(members[myPendingSeat()]?.nickname||'')}`:`${esc(state.players[state.current].name)} · ${state.phase==='place'?'타일 배치':'주식 구매'}`}</div><div class="main" style="margin-top:10px"><section><div class="boardbox"><div id="board" class="board"></div></div><div class="card" style="margin-top:10px;box-shadow:none"><b>내 손패</b><div class="hand" style="margin-top:8px">${p.hand.map(k=>`<button class="tile ${legal(state,k)?'legal':'bad'}" data-tile="${k}" ${canPlace&&legal(state,k)?'':'disabled'}>${k}${permanentlyBlocked(state,k)?'<small>🔒 교체 가능</small>':''}</button>${canPlace&&permanentlyBlocked(state,k)?`<button class="btn red" data-discard="${k}">교체</button>`:''}`).join('')}</div>${renderPending()}${state.phase==='buy'&&state.current===mySeat&&!state.over?`<div class="actions"><button class="btn green" id="endTurn">턴 종료 (${state.buyCount}/3주 매수)</button>${canEnd(state)?'<button class="btn red" id="endGame">게임 종료 선언</button>':''}</div>`:''}${state.over?`<div class="final"><b>최종 순위</b><br>${state.finalOrder.map((i,n)=>`${n+1}위 ${esc(state.players[i].name)} · ${money(state.players[i].cash)}`).join('<br>')}</div>`:''}</div></section><aside><div class="card" style="box-shadow:none"><b>호텔 체인 주식시장</b><div class="market" style="margin-top:8px">${CHAINS.map(c=>{const a=active(state,c.id),px=a?price(state,c.id):0;return `<div class="market-row"><span><i class="dot" style="background:${c.color}"></i> ${c.name}</span><b>${a?size(state,c.id)+(safe(state,c.id)?' 🔒':''):'—'}</b><span>${a?money(px):'—'}</span><span>은행 ${state.chains[c.id].stock}</span><button class="buy" data-buy="${c.id}" ${state.current===mySeat&&state.phase==='buy'&&a&&state.buyCount<3&&p.cash>=px&&state.chains[c.id].stock>0?'':'disabled'}>+1주</button></div>`}).join('')}</div></div><div class="card" style="box-shadow:none"><b>내 포트폴리오</b><div class="portfolio" style="margin-top:7px">${CHAINS.map(c=>`<div class="port" style="border-color:${c.color}">${c.name}<b>${p.shares[c.id]}</b>${active(state,c.id)?money(p.shares[c.id]*price(state,c.id)):'비활성'}</div>`).join('')}</div></div><div class="card" style="box-shadow:none"><b>게임 로그</b><div class="logs" style="margin-top:7px">${state.logs.map(x=>`<div>${esc(x)}</div>`).join('')}</div></div></aside></div>`;const b=app.querySelector('#board');b.innerHTML='<div class="coord"></div>'+COLS.map(x=>`<div class="coord">${x}</div>`).join('');for(let r=0;r<ROWS;r++){b.insertAdjacentHTML('beforeend',`<div class="coord">${r+1}</div>`);for(let c=0;c<12;c++){const k=COLS[c]+(r+1),v=state.board[k],d=document.createElement('div');d.className='cell';if(!v){if(canPlace&&handSet.has(k)){d.classList.add(legal(state,k)?'handcell':'blocked');if(legal(state,k))d.onclick=()=>mutate(s=>placeTile(s,mySeat,k))}d.innerHTML=`<span class="k">${k}</span>`}else if(v.type==='standalone'){d.classList.add('standalone');d.innerHTML=`●<span class="k">${k}</span>`}else{const ch=C[v.chain];d.style.background=ch.color;d.innerHTML=`<span class="chain">${ch.letter}</span><span class="k">${k}</span>`}b.appendChild(d)}}app.querySelectorAll('[data-tile]').forEach(x=>x.onclick=()=>mutate(s=>placeTile(s,mySeat,x.dataset.tile)));if(state.over)app.insertAdjacentHTML('beforeend',endPanel('게임이 끝났습니다.','결과가 저장되었습니다. 홈이나 다인플 목록으로 이동할 수 있습니다.'));app.querySelectorAll('[data-discard]').forEach(x=>x.onclick=()=>mutate(s=>discardBlocked(s,mySeat,x.dataset.discard)));app.querySelectorAll('[data-buy]').forEach(x=>x.onclick=()=>mutate(s=>buyShare(s,mySeat,x.dataset.buy)));app.querySelector('#endTurn')?.addEventListener('click',()=>mutate(s=>endTurn(s,mySeat)));app.querySelector('#endGame')?.addEventListener('click',()=>{if(confirm('게임을 종료하고 최종 정산할까요?'))mutate(endGame)});app.querySelectorAll('[data-founder]').forEach(x=>x.onclick=()=>mutate(s=>chooseFounder(s,mySeat,x.dataset.founder)));app.querySelectorAll('[data-survivor]').forEach(x=>x.onclick=()=>mutate(s=>chooseSurvivor(s,mySeat,x.dataset.survivor)));app.querySelector('#mergerOk')?.addEventListener('click',()=>{const sell=Number(app.querySelector('#sellN').value||0),trade=Number(app.querySelector('#tradeN').value||0);mutate(s=>mergerDecision(s,mySeat,sell,trade))});if(state.over)maybeSubmit()}
(async()=>{try{me=await getMe();if(!me)return showFatal('로그인이 필요합니다.');({room,members}=await loadRoom());if(room.game!=='acquire')return showFatal('어콰이어 방이 아닙니다.');mySeat=members.findIndex(m=>m.user_id===me.user_id);if(mySeat<0)return showFatal('이 방의 참가자가 아닙니다.');badges=await ratingBadges('acquire',members.map(m=>m.user_id));const row=await loadState();revision=row.revision;state=row.state;if(!state&&room.host_id===me.user_id){state=initialState();revision=await saveState(0,state)}render();startStatePoll(async row=>{revision=row.revision;if(row.state){state=row.state;render()}},{interval:room.play_mode==='turn'?4000:1200});}catch(e){showFatal(e.message)}})();
</script></body></html>
